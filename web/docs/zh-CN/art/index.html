  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/art/index","language":"zh-CN","title":"美术设计稿","summary":"蛹桌面端的十张实机界面设计稿与舵机终端端的六张设计稿，按真实界面、功能结构、控件状态和尺寸约束组织，可在网页中直接拖动、缩放查看。","updated_at":"2026-10-25","read_when":[],"source_docs":[],"tab":"界面","group":"美术","group_path":["美术"],"url":"/docs/zh-CN/art/","headings":[{"id":"section-1","level":1,"text":"美术设计稿"},{"id":"section-2","level":2,"text":"00 整体总览"},{"id":"section-3","level":2,"text":"01 基础规范"},{"id":"section-4","level":2,"text":"02 图标系统"},{"id":"section-5","level":2,"text":"03 外壳与侧栏"},{"id":"section-6","level":2,"text":"04 会话时间线"},{"id":"section-7","level":2,"text":"05 过程与工具"},{"id":"section-8","level":2,"text":"06 计划与问询"},{"id":"section-9","level":2,"text":"07 输入区"},{"id":"section-10","level":2,"text":"08 设置与弹窗"},{"id":"section-11","level":2,"text":"09 交互状态与动效"},{"id":"section-12","level":2,"text":"舵机 00 整体总览"},{"id":"section-13","level":2,"text":"舵机 01 基础规范"},{"id":"section-14","level":2,"text":"舵机 02 布局与底栏"},{"id":"section-15","level":2,"text":"舵机 03 会话时间线"},{"id":"section-16","level":2,"text":"舵机 04 工具与计划"},{"id":"section-17","level":2,"text":"舵机 05 输入与弹层"},{"id":"section-18","level":2,"text":"维护方式"}],"prev_slug":"zh-CN/surfaces/desktop-ui","next_slug":"zh-CN/capabilities/index","markdown":"# 美术设计稿\n\n这一组图以蛹（本地 AI 工作台）为主线，同时覆盖舵机（手工本地操作入口）。代码与真实渲染是事实来源，SVG 用于改稿、重构对照和实现验收；图与代码冲突时先核对实机，不用示意图替代当前实现。\n\n- 打开[设计稿统一画廊](/docs/art/)，可浏览全部 16 张稿。源文件位于 `docs/wunder美术设计稿`，分为 `蛹/` 与 `舵机/`。\n- 画廊支持鼠标左键或触屏单指拖动平移，以及适宽、适窗、100%、缩放、前后翻页；方向键移动，`+/-` 缩放，`0` 重置，Esc 关闭。\n- 本页内嵌的大图也支持拖动。普通滚轮继续滚动文档，Ctrl/Command + 滚轮缩放图片；无 JavaScript 时可打开原始 SVG。\n- 每张图按“真实界面 → 功能结构 → 状态表现 → 尺寸与行为约束”组织。控件交互态与任务生命周期分开呈现，不把建议项画成实机状态。\n- 蛹的帮助手册另外内嵌位图预览，避免引入 SVG 渲染链；舵机稿不进入蛹内嵌手册。\n\n## 00 整体总览\n\n整窗基线为 1462×866 逻辑像素，侧栏 240、阅读列 1000、输入带 154。按窗口导航、会话阅读、执行过程、输入操作和系统反馈分区，并区分新线程空态与“已有完成回合、当前输入空闲”。\n\n![整体总览设计稿](/docs/art/00-整体总览.svg)\n\n*00 整体总览 · 真实窗口、功能分区、状态辨析*\n\n## 01 基础规范\n\n中性色、强调色、语义色、字阶、间距、圆角和窗口布局基线。颜色与尺寸 token 对应 `frontend-slint/ui/design_tokens.slint`，稿面说明与产品 UI 使用独立尺度。\n\n![基础规范设计稿](/docs/art/01-基础规范.svg)\n\n*01 基础规范 · 色彩、文字、间距、圆角与窗口度量*\n\n## 02 图标系统\n\n30 个直接取自生产资产的高频图标，按窗口导航、会话操作、输入动作和状态内容分类。保留 Font Awesome 实心、仓库线性 SVG 与代码绘制状态符的差异，不再宣称统一线性重绘。\n\n![图标系统设计稿](/docs/art/02-图标系统.svg)\n\n*02 图标系统 · 真实资产、尺寸、着色与状态*\n\n## 03 外壳与侧栏\n\n标题栏、侧栏、工作区/线程行、工作目录和分隔柄。线程悬停动作真实顺序为重命名、轨迹、归档；行交互态、多选与任务生命周期分别展示。\n\n![外壳与侧栏设计稿](/docs/art/03-外壳与侧栏.svg)\n\n*03 外壳与侧栏 · 窗口、导航、行状态与生命周期*\n\n## 04 会话时间线\n\n用一个完整回合说明用户输入、工作过程、助手正文和回合页脚的垂直关系，另置 Markdown、状态胶囊、空态、加载、错误与滚动跟随规则。\n\n![会话时间线设计稿](/docs/art/04-会话时间线.svg)\n\n*04 会话时间线 · 完整回合、内容块、状态与滚动*\n\n## 05 过程与工具\n\n过程条、工具行、展开输出、工具组、子智能体和补丁差异卡。工具运行、完成、失败与展开/折叠分开，状态符使用真实 12px 节点与 26px 行节奏。\n\n![过程与工具设计稿](/docs/art/05-过程与工具.svg)\n\n*05 过程与工具 · 执行状态、视图状态与详情*\n\n## 06 计划与问询\n\n计划胶囊、说明与步骤、目标横幅和问询面板。展开计划卡不额外套计数标题；目标按钮为编辑、暂停/恢复、清除；问询答案由 Composer 发送。\n\n![计划与问询设计稿](/docs/art/06-计划与问询.svg)\n\n*06 计划与问询 · 计划步骤、目标、选项与无偏好*\n\n## 07 输入区\n\n编辑卡 972×100、动作行 30 高，附件、分支和队列按内容增加高度。发送与停止按草稿、附件、问询答案、busy、generating 和 stopping 组合判断，另示录音、转写、队列与模型菜单。\n\n![输入区设计稿](/docs/art/07-输入区.svg)\n\n*07 输入区 · 编辑卡、动作行、发送/停止与弹层*\n\n## 08 设置与弹窗\n\n真实 1080×720 设置壳、44px 头部、260px 导航与 60px 导航项。常规页使用发送键、语言、四张主题预览卡和字号控制；控制件、校验、Confirm/Modal/Info/Toast 分组展示。\n\n![设置与弹窗设计稿](/docs/art/08-设置与弹窗.svg)\n\n*08 设置与弹窗 · 真实设置、控制件、校验与反馈*\n\n## 09 交互状态与动效\n\n以真实 `Action`、`FormField`、`ThemeCheck` 和系统 `Switch` 绘制状态矩阵，不用虚构的按下色、通用加载态或焦点环补齐表格；另置动效、键盘、无障碍、响应式和性能约束。\n\n![交互状态与动效设计稿](/docs/art/09-交互状态与动效.svg)\n\n*09 交互状态与动效 · 真实控件、键位、反馈与降级*\n\n## 舵机 00 整体总览\n\n终端启动实帧与五段布局栈：转写区、弹层带、欢迎横幅带、活动行和输入区。启动信息位于转写区，欢迎像素画直接来自当前生成数据，不再使用占位标志。\n\n![舵机整体总览设计稿](/docs/art/servo/00-整体总览.svg)\n\n*舵机 00 · 启动实帧、欢迎像素画与布局契约*\n\n## 舵机 01 基础规范\n\n命名色、字重修饰、Rgb 面板、NO_COLOR、显示列宽与终端能力。普通弹层与居中选择分别使用对应选中色，运行呼吸点按局部实现单独说明。\n\n![舵机基础规范设计稿](/docs/art/servo/01-基础规范.svg)\n\n*舵机 01 · 语义色、真彩色、降级与宽度*\n\n## 舵机 02 布局与底栏\n\n五段布局约束、运行帧、活动行与底栏收缩。外层输入区固定 5 行，内部可被云错误、警告和间隙占行，草稿最低可剩 1 行并内部滚动。\n\n![舵机布局与底栏设计稿](/docs/art/servo/02-布局与底栏.svg)\n\n*舵机 02 · 布局栈、活动行、输入预算与收缩*\n\n## 舵机 03 会话时间线\n\n条目样式、Markdown、流式规则、代码与差异、Ctrl+T 全展开、选区与搜索。过程信息以 DIM 为主，正文与需要行动的提示分层。\n\n![舵机会话时间线设计稿](/docs/art/servo/03-会话时间线.svg)\n\n*舵机 03 · 条目、差异、全展开与选区*\n\n## 舵机 04 工具与计划\n\n工具行、补丁、计划卡、轨迹页签与状态符号。计划包含“已更新计划 · 完成 n/m”标题，折叠最多显示 3 步，按进行中、待执行、已完成排序。\n\n![舵机工具与计划设计稿](/docs/art/servo/04-工具与计划.svg)\n\n*舵机 04 · 工具、计划标题、轨迹与状态符*\n\n## 舵机 05 输入与弹层\n\n输入区、输入上方弹层带、居中选择与整屏任务中心。恢复线程、审批和问询使用居中选择；快捷键/警告使用信息面板；不同容器不混用位置和选中样式。\n\n![舵机输入与弹层设计稿](/docs/art/servo/05-输入与弹层.svg)\n\n*舵机 05 · 输入、弹层、居中选择与任务中心*\n\n## 维护方式\n\n改完 SVG 后在本仓库根目录运行一次：\n\n```bash\npython scripts/sync_art.py\n```\n\n它会依次完成三件事：\n\n1. 把蛹稿 SVG 渲染成 1200px PNG，写到 `frontend-slint/assets/help/art`（蛹内嵌用）。\n2. 用这些 PNG 重建蛹的中英手册 JSON。\n3. 重建文档站，把 SVG 发布到 `web/docs/art`（蛹）与 `web/docs/art/servo`（舵机），并复制统一画廊及 `art-viewer` 资产；发布版自动把应用图标内嵌为 data URI。\n\nWeb 端重建站点后即生效；蛹需要重新编译桌面程序，预览图通过 `include_bytes!` 编进二进制。\n\n蛹新增或删除分页时，需要同步 `scripts/render_art_previews.py` 的 `SHEETS`、`scripts/build_help_manual.py` 的 `ART_TOPICS`、统一画廊 `docs/wunder美术设计稿/index.html` 中的稿件数据，以及本页章节。不要手改 `frontend-slint/assets/help/art` 里的 PNG。\n\n舵机新增或删除分页时，同步统一画廊稿件数据、本页章节与 `docs/wunder美术设计稿/舵机/README.md` 即可，不涉及蛹内嵌资产。\n\n查看器共享实现位于 `docs/wunder美术设计稿/assets/art-viewer.js` 和 `art-viewer.css`；文档站只在美术页加载它们，动态导航时会清理旧实例。所有分页还应通过 XML、内部引用和 Edge 原始宽度渲染检查。\n","source_path":"使用说明书/zh-CN/art/index.md"}</script>
