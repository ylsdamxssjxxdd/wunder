  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/forms/admin-ui","language":"zh-CN","title":"管理端界面","summary":"管理端界面：4 组 19 项的治理与调试后台。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"形态","group":"管理端","group_path":["管理端"],"url":"/docs/zh-CN/forms/admin-ui/","headings":[{"id":"section-1","level":1,"text":"管理端界面"},{"id":"section-2","level":2,"text":"界面"}],"prev_slug":"zh-CN/forms/android-usage","next_slug":"zh-CN/forms/admin-deploy","markdown":"# 管理端界面\n\n服务端自带的治理与调试后台，只有管理员能进；日常对话在桌面版或云端版里做。它跟着服务端一起启动，没有单独的安装包与构建步骤。\n\n## 界面\n\n<figure class=\"docs-preview-hero\">\n  <img src=\"/docs/images/wunder-bridge.png\" alt=\"wunder 管理端界面：治理后台\">\n  <figcaption><strong>管理端<\/strong>：信息密集、适合扫读的治理与调试后台。<\/figcaption>\n<\/figure>\n\n顶层导航 **4 组 19 项**：\n\n- **系统（7）**：内部状态、系统设置、系统消息、单位管理、用户管理、线程管理、在线更新\n- **智能体（5）**：模型配置、预设智能体、形象管理、工具管理、系统提示词\n- **调试（5）**：调试面板、吞吐量测试、性能测试、能力评估、多模调试\n- **文档（2）**：使用说明书、接口\n\n表格、日志与监控面板都做了分页、筛选或限量，不会一次铺出大量数据；调试面板右侧是线程轨迹视图。\n","source_path":"使用说明书/zh-CN/forms/admin-ui.md"}</script>
