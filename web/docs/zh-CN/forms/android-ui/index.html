  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/forms/android-ui","language":"zh-CN","title":"安卓版界面","summary":"安卓版界面：单列手机工作台、设置页与权限管理。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"形态","group":"安卓版","group_path":["安卓版"],"url":"/docs/zh-CN/forms/android-ui/","headings":[{"id":"section-1","level":1,"text":"安卓版界面"},{"id":"section-2","level":2,"text":"界面"}],"prev_slug":"zh-CN/forms/cli-usage","next_slug":"zh-CN/forms/android-deploy","markdown":"# 安卓版界面\n\n桌面版的 Android 形态：装在自己手机上，同进程直调同一套引擎，数据保存在手机上，不依赖服务端，也不需要连电脑。\n\n## 界面\n\n<div class=\"docs-preview-grid\">\n  <figure>\n    <div class=\"docs-preview-pair\">\n      <img src=\"/docs/images/wunder-cocoon.png\" alt=\"wunder 安卓版界面：手机端对话\">\n      <img src=\"/docs/images/wunder-cocoon-settings.png\" alt=\"wunder 安卓版界面：设置与权限管理\">\n    <\/div>\n    <figcaption><strong>安卓版<\/strong>：桌面版的手机形态，左为对话，右为设置与权限管理。<\/figcaption>\n  <\/figure>\n<\/div>\n\n- **单列排布**：顶部是会话抽屉与模型入口，中间是时间线，底部是输入区与加号面板，复用桌面版的同一套界面组件。\n- **设置页**：模型、外观、归档、本地运行环境、权限管理、在线更新与帮助。\n- **权限管理**：集中展示通知、麦克风、悬浮窗、无障碍服务、电池优化与安装应用的状态，点按即跳到对应的系统设置，返回后自动刷新。\n- 屏幕窄，复杂能力按需展开，与桌面版保持同一套交互习惯。\n","source_path":"使用说明书/zh-CN/forms/android-ui.md"}</script>
