  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/forms/admin-runtime","language":"zh-CN","title":"管理端运行环境","summary":"管理端没有独立进程：静态页面由服务端托管、同端口提供 API 与 MCP 入口，以及它的浏览器与账号前提。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"形态","group":"管理端","group_path":["管理端"],"url":"/docs/zh-CN/forms/admin-runtime/","headings":[{"id":"section-1","level":1,"text":"管理端运行环境"},{"id":"section-2","level":2,"text":"组成"},{"id":"section-3","level":2,"text":"前提"},{"id":"section-4","level":2,"text":"运行特征"},{"id":"section-5","level":2,"text":"故障定位"}],"prev_slug":"zh-CN/forms/admin-deploy","next_slug":"zh-CN/forms/admin-usage","markdown":"# 管理端运行环境\n\n管理端不是一个可以单独启动的程序：它是一组随服务端下发的静态页面（原生 HTML 加 JS 模块），运行环境就是服务端本身。\n\n## 组成\n\n| 部分 | 位置 | 说明 |\n| --- | --- | --- |\n| 页面 | 服务端静态目录 | 入口 `http://<host>:18000/`，无构建步骤，改完直接生效 |\n| 接口 | 同端口 `/wunder/*` | 页面调用的治理与调试接口 |\n| MCP 服务端 | 同端口 | 供外部工具接入 |\n| 外部工作流入口 | 同端口 | 供外部流程触发 |\n\n没有独立进程、没有独立端口、没有数据库，读写都走服务端已有存储。\n\n## 前提\n\n- 一次可用的服务端部署，见[云端版运行环境](/docs/zh-CN/forms/cloud-runtime/)。\n- 浏览器为近年版本的 Chrome、Edge、Firefox 或 Safari；页面大量使用表格、日志与监控面板，窄屏可读但效率低。\n- 账号为管理员，或单位负责人（只能管本单位的单位与用户）。首次登录后立即改默认口令。\n\n## 运行特征\n\n- 数据密集：表格、日志和监控面板都做了分页、筛选或限量，不会一次铺出全量数据。\n- 高风险操作默认需要确认边界，前端确认不能替代后端鉴权。\n- 没有目标编辑器，也没有用户侧的对话入口；目标操作在云端版、桌面版、命令行里做。\n\n## 故障定位\n\n页面打不开先看服务端是否在 18000 上监听；能打开但接口报错，看服务端日志里的鉴权与路由记录——页面本身没有缓存层，也不会掩盖接口错误。\n","source_path":"使用说明书/zh-CN/forms/admin-runtime.md"}</script>
