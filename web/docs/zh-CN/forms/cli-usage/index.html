  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/forms/cli-usage","language":"zh-CN","title":"命令行使用","summary":"命令行使用：子命令、斜杠命令与键位，以及命令行独有与缺失的能力。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"形态","group":"命令行","group_path":["命令行"],"url":"/docs/zh-CN/forms/cli-usage/","headings":[{"id":"section-1","level":1,"text":"命令行使用"},{"id":"section-2","level":2,"text":"使用"},{"id":"section-3","level":3,"text":"子命令"},{"id":"section-4","level":3,"text":"斜杠命令"},{"id":"section-5","level":3,"text":"键位"},{"id":"section-6","level":2,"text":"独有与缺失"}],"prev_slug":"zh-CN/forms/cli-runtime","next_slug":"zh-CN/forms/android-ui","markdown":"# 命令行使用\n\n## 使用\n\n第一次会话：\n\n```bash\nwunder-cli\n> 帮我写一个 Hello World 的 Python 脚本\n```\n\n看到模型思考 → 工具批次 → 结果 → 回复就说明跑通。\n\n### 子命令\n\n| 子命令 | 别名 | 作用 |\n| --- | --- | --- |\n| `exec` | `e` | 非交互执行一次智能体任务；`--json` 走 JSONL 事件流 |\n| `resume` | — | 恢复历史会话 |\n| `trajectory` | — | 查看、搜索与导出线程轨迹；支持 JSON 与双向游标 |\n| `tool` | — | 直接运行内置 / MCP / 技能工具 |\n| `mcp` | — | 管理本地 MCP 服务器 |\n| `skills` | — | 管理当前用户本地技能 |\n| `config` | — | 查看与修改运行配置 |\n| `stress-thread` | — | 生成本地合成线程做渲染压测 |\n| `doctor` | — | 诊断本地运行环境 |\n| `cloud` | — | 管理本地云端连接与设备互通 |\n| `completion` | — | 生成 Shell 补全脚本 |\n\n### 斜杠命令\n\n`/help`（`/h`）、`/status`、`/resume`（`/r`）、`/trajectory`（`/trace`）、`/new`、`/clear`（`/cls`）、`/model`（`/model add` 登记新端点）、`/permissions`（`/perm`）、`/plan`、`/goal`、`/edit`、`/init`、`/attach`、`/diff`、`/review`、`/skills`、`/rename`、`/compact`、`/mcp`、`/config`（`/config edit` 编辑配置）、`/exit`、`/quit`（`/q`）。\n\n没有 `cloud`、`cron`、`channel`、`memory`、`knowledge` 斜杠命令：`cloud` 是子命令形式，后四者在命令行上没有管理界面。\n\n### 键位\n\n| 键 | 作用 |\n| --- | --- |\n| `/` | 打开命令面板 |\n| `!` | 直接执行 shell |\n| `Tab` | 补全 |\n| `@` / `#` / `$` | 文件 / 技能 / 工具提及 |\n| `Ctrl+V` | 粘贴图片；也可把图片或文件拖进来 |\n| `Alt+,` / `Alt+.` | 降低 / 提高推理强度 |\n| `Ctrl+R` / `Ctrl+S` | 搜索输入历史 |\n| `Ctrl+G` | 外部编辑器 |\n| `Ctrl+O` | 复制最后回复 |\n| `Ctrl+T` | 完整转录 |\n| `Ctrl+C` | 退出 |\n| `Esc` | 中断当前轮次；空闲时清空草稿 |\n| `F4` | 切换鼠标模式（应用接管 ↔ 交回终端选择） |\n| `←` | 任务中心 |\n| `?` | 快捷键面板 |\n\n## 独有与缺失\n\n- **只有命令行能做**：`exec --json` 事件流脚本契约、`cloud` 子命令全套、`doctor` 环境诊断、`stress-thread` 压测、`completion` 补全，以及不经智能体主循环直接跑 `tool` / `mcp` / `skills`。\n- **命令行没有**：定时任务被显式关闭（能看旧任务，但不再排新任务）；渠道、知识库、长期记忆与形象没有管理界面；无语音输入、无截图采集、无托盘与全局热键；宿主本身就是终端，所以没有交互式终端面板。\n","source_path":"使用说明书/zh-CN/forms/cli-usage.md"}</script>
