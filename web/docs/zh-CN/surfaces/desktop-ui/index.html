  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/surfaces/desktop-ui","language":"zh-CN","title":"蛹界面","summary":"蛹（desktop）是本地 AI 工作台，个人用户的默认入口。主窗只有对话、设置两页，设置内 12 个分类，其余能力以面板和对话框呈现。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"界面","group":"前端与桌面","group_path":["前端与桌面"],"url":"/docs/zh-CN/surfaces/desktop-ui/","headings":[{"id":"section-1","level":1,"text":"蛹界面"},{"id":"section-2","level":2,"text":"启动与运行"},{"id":"section-3","level":2,"text":"主窗：只有两页"},{"id":"section-4","level":3,"text":"对话页"},{"id":"section-5","level":3,"text":"设置页"},{"id":"section-6","level":2,"text":"面板与对话框"},{"id":"section-7","level":2,"text":"蛹独有能力"},{"id":"section-8","level":2,"text":"这些能力当前用不了"},{"id":"section-9","level":2,"text":"一键重置工作状态"},{"id":"section-10","level":2,"text":"蛹和蜂巢的差异"},{"id":"section-11","level":2,"text":"常见问题"},{"id":"section-12","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/surfaces/web-admin","next_slug":"zh-CN/capabilities/index","markdown":"# 蛹界面\n\n蛹是 wunder 的**本地 AI 工作台**，也是个人用户的默认入口。它整台跑在你自己的电脑上：没有单独的后端端口，也不需要网络中转，界面直接调用本地引擎。\n\n## 启动与运行\n\n打开桌面应用就能用，不用指定端口，也没有必需参数。\n\n- 数据根目录：`~/.wunder`，可用环境变量 `WUNDER_HOME` 改到别处\n- 工作区：`~/.wunder/workspace`\n- 桌面设置：`<temp>/config/desktop.settings.json`\n- 另有一个独立的兼容端口（默认 18123），只给少数老客户端用，日常使用不涉及\n\n## 主窗：只有两页\n\n主窗只有**对话页**和**设置页**两个可切换页面，其余能力都以面板和对话框的形式挂在两页之内。\n\n### 对话页\n\n左右两栏：\n\n- **左栏**：任务与线程树、工作目录、设置入口\n  - 工作目录里能同时看到本地工作树和**云端工作区**\n  - 一个智能体可以同时拥有**多个独立任务线程**，工作区也可以有**多个**：本地目录、云端工作区，以及通过设备互通访问的远程设备工作区\n- **右栏**：顶栏（工作区 / 线程名）+ 时间线 + 输入区\n  - 没选中线程时显示欢迎页\n  - 输入区里有模型切换、审批模式、思考等级、附件、语音输入按钮（可用时）、截图按钮（可用时）、发送 / 停止\n  - 每轮回复下方的「工作过程」把中间思考、工具批次和中间打印折叠起来\n\n### 设置页\n\n共 **12 个分类**：\n\n| 分类 | 说明 |\n| --- | --- |\n| 通用 | 界面语言、外观、启动行为 |\n| 账户 | 用户名、邮箱、密码、头像 |\n| 模型 | 添加 / 编辑 LLM、TTS、图像、视频模型；TTS 只能配不能播 |\n| 工具 | 打开工具对话框，按内置 / MCP / 技能 / 知识库分组管理 |\n| 智能体 | 系统提示词、默认审批模式、默认技能集 |\n| 形象 | 形象包选择、浮窗大小；仅 Windows 有桌面浮窗 |\n| 定时 | 定时任务入口 |\n| 记忆 | 长期记忆管理、命中记录 |\n| 渠道 | 渠道绑定与状态 |\n| 提示词包 | 站内可用的提示词包与语言默认 |\n| 归档 | 归档线程列表 |\n| 帮助 | 内嵌文档、版本号 |\n\n分类导航条支持搜索过滤，搜不到时显示空态，而不是一片空白。\n\n## 面板与对话框\n\n下面这些是蛹里的独立区域，不是单独的页面：\n\n- **侧栏 / 时间线 / 输入区**：对话页的三个组件\n- **终端视图**：交互式命令会话，可以像在终端里一样敲命令\n- **工具管理对话框**：按内置 / MCP / 技能 / 知识库分组\n- **形象对话框**：形象包列表和预览\n- **工作区对话框**：切换或新建工作区\n- **工作目录**：文件树 + 工具栏 + 用量条 + 云端工作区\n- **线程轨迹**：整条线程的执行台账（取代了旧的日志对话框）\n- **子智能体详情**\n- **渠道页**：用户面渠道管理\n- **定时页**：用户面定时任务\n- **活动卡 / 专家数据 / 补丁差异卡**\n- **截图遮罩**：全屏截图后回填到输入区\n- **托盘与系统通知**：后台运行、完成提醒\n- **远端命令审批弹窗**：互通命令的高危确认，有醒目边框、风险等级和来源信息，还有「不允许记忆」提示\n\n## 蛹独有能力\n\n这些是别的界面没有的：\n\n| 能力 | 是什么 |\n| --- | --- |\n| **交互式终端** | 可以直接在里面跑命令；蜂巢、舰桥、舵机都没有 |\n| **截图采集** | 全屏截图后回填输入区 |\n| **托盘与系统通知** | 后台运行、任务完成时提醒 |\n| **全局热键** | 用系统快捷键唤起 |\n| **语音输入** | 用麦克风说话转成文字 |\n| **本地文件与桌面控制** | 直接读写本机文件、操作桌面，需要视觉能力 |\n\n## 这些能力当前用不了\n\n- **设置页的「设备互通」分类没接线**：入口在代码里做了，但没有真正渲染出来，当前打不开。蛹能用的互通只有两处——侧栏「工作目录」里的云端工作区，和远端命令审批弹窗。\n- **语音输出（TTS）没有实现**：设置里能配 TTS 模型，但没有播放；语音部分只有输入。想听语音输出请用蜂巢。\n- **早期的桌面壳已停止维护**：用 Electron / Tauri 做的那套前端壳不再维护，功能也不再更新。这不影响蛹底层的引擎，对话等能力照常运行。\n\n## 一键重置工作状态\n\n会话卡在运行中、子智能体状态不一致、界面显示和实际对不上时，用「设置 → 通用 → 重置工作状态」。\n\n它会：停止运行中的会话、清空排队任务、清理会话锁和状态。\n\n它保留：技能、知识库、长期记忆、用户配置、工作区文件、会话历史。\n\n所以它是**清理工作状态**，不是「恢复出厂」。\n\n## 蛹和蜂巢的差异\n\n| 项 | 蛹 | 蜂巢 |\n| --- | --- | --- |\n| 运行方式 | 装在自己电脑上的桌面应用 | 浏览器访问云端 |\n| 数据存放 | 本地（`~/.wunder`） | 舰体存储 |\n| 交互式终端 | ✅ 有 | ❌ 无 |\n| 语音输入 / 输出 | 输入 ✅，输出 ❌ | 双向 ✅ |\n| 托盘 / 系统通知 / 全局热键 / 截图 | ✅ | ❌ |\n| 设备互通设置面板 | 分类未开放；仅云端工作区 + 审批弹窗 | ✅ 设备分类 + 互通视图 |\n| 一个智能体 | 多个线程、多个工作区 | 一样 |\n\n## 常见问题\n\n**数据存放位置**：工作区在 `~/.wunder/workspace`，会话和工具日志在本地数据库，配置在 `<temp>/config/desktop.settings.json`；`WUNDER_HOME` 可以把根目录改到别处。\n\n**本地模式能联网**：「本地优先」说的是数据留在本机，不影响访问远程模型或网页。\n\n**可迁移到别的电脑**：把 `~/.wunder` 整个复制过去（含工作区、数据库和设置）即可。首次启动时它会扫描工作树，把之前排队、等待、运行中、正在取消的任务状态恢复回来。\n\n**运行中可新建线程**：一个智能体可以同时拥有多个独立任务线程，锁和实时状态按线程隔离；会话队列开启时新消息进入排队，而不是被判「用户忙」。\n\n## 延伸阅读\n\n- [快速开始](/docs/zh-CN/start/quickstart/)\n- [蛹入门](/docs/zh-CN/start/desktop/)\n- [界面概览与能力矩阵](/docs/zh-CN/surfaces/index/)\n- [蜂巢界面](/docs/zh-CN/surfaces/frontend/)\n- [首次运行排查](/docs/zh-CN/start/troubleshooting-first-run/)\n","source_path":"使用说明书/zh-CN/surfaces/desktop-ui.md"}</script>
