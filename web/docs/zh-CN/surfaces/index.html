  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/surfaces/index","language":"zh-CN","title":"界面概览","summary":"用户在蜂窝（本地 AI 工作台）或蜂巢（云端 AI 工作台）里工作，管理员用舰桥治理。","updated_at":"2026-10-09","read_when":[],"source_docs":[],"tab":"界面","group":"概览","group_path":["概览"],"url":"/docs/zh-CN/surfaces/","headings":[{"id":"section-1","level":1,"text":"界面概览"},{"id":"section-2","level":2,"text":"两个工作台"},{"id":"section-3","level":2,"text":"舰桥：治理后台"},{"id":"section-4","level":2,"text":"界面入口"},{"id":"section-5","level":2,"text":"工作台的左右两栏"},{"id":"section-6","level":2,"text":"按场景选择"},{"id":"section-7","level":3,"text":"个人用户"},{"id":"section-8","level":3,"text":"团队成员"},{"id":"section-9","level":3,"text":"管理员"},{"id":"section-10","level":2,"text":"常见误区"},{"id":"section-11","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/integration/mcp-endpoint","next_slug":"zh-CN/surfaces/frontend","markdown":"# 界面概览\n\nwunder 的界面分两类：**工作台**（用户使用）和**舰桥**（管理员治理）。\n\n## 两个工作台\n\n用户通过两个工作台使用 wunder，按场景选择：\n\n| 工作台 | 形态 | 定位 | 适合 |\n|------|------|------|------|\n| **蜂窝（desktop）** | 桌面应用 | 本地 AI 工作台 | 个人用户，本地运行，可直接访问本机文件与桌面，开箱即用 |\n| **蜂巢（web）** | 网页端 | 云端 AI 工作台 | 团队成员，浏览器访问，多人共用，由舰体统一管理 |\n\n两个工作台覆盖同一套界面与能力：对话、工作目录、智能体设置、工具与设置。蜂窝在蜂巢基础上额外提供本地文件访问、本地运行时和一键重置。个人用户默认用蜂窝；团队部署舰体后，成员通过浏览器访问蜂巢。\n\n## 舰桥：治理后台\n\n舰桥面向管理员，是舰体（用户与智能体管理平台）的管理界面，负责系统配置、用户管理、渠道监控，与用户的日常使用界面相互独立。\n\n## 界面入口\n\n<div class=\"docs-card-grid docs-card-grid-compact\">\n  <a class=\"docs-card\" href=\"/docs/zh-CN/surfaces/frontend/\"><strong>蜂巢界面<\/strong><span>两栏布局、聊天、工作目录、设置。<\/span><\/a>\n  <a class=\"docs-card\" href=\"/docs/zh-CN/surfaces/desktop-ui/\"><strong>蜂窝界面<\/strong><span>蜂窝特有的本地能力与重置。<\/span><\/a>\n  <a class=\"docs-card\" href=\"/docs/zh-CN/surfaces/web-admin/\"><strong>舰桥界面<\/strong><span>用户管理、系统配置、渠道监控。<\/span><\/a>\n<\/div>\n\n## 工作台的左右两栏\n\n蜂窝和蜂巢都采用左右两栏布局：\n\n```\n┌──────────────┬─────────────────────────────┐\n│ 左栏         │ 右栏                        │\n│ 新任务/搜索   │ 聊天：顶栏 + 时间线 + 输入区  │\n│ 工作区线程树  │ 未选中线程时显示欢迎页        │\n│ 工作目录      │                             │\n│ 设置          │                             │\n└──────────────┴─────────────────────────────┘\n```\n\n左栏固定 240px，自上而下是：新任务、搜索、工作区与线程树、**工作目录**（文件树 + 工具栏 + 用量条）、底部设置入口。右栏自适应，展示欢迎页或当前线程的聊天页；文件预览、在线编辑等以浮层弹出，不改变两栏结构。\n\n每个用户只有一个智能体实例和一个固定的工作区，所以左栏只有这一条工作区与线程树，没有多智能体的列表、新建或切换入口，也没有更换目录的入口。\n\n## 按场景选择\n\n### 个人用户\n\n装[蜂窝](/docs/zh-CN/start/desktop/)，在本地 AI 工作台里工作。\n\n### 团队成员\n\n部署舰体后，用浏览器访问[蜂巢](/docs/zh-CN/surfaces/frontend/)（云端 AI 工作台）。\n\n### 管理员\n\n主要使用：\n- [舰桥](/docs/zh-CN/surfaces/web-admin/)（做治理，用户与智能体管理平台的管理界面）\n- 蜂巢（做日常工作）\n\n## 常见误区\n\n- **舰桥能聊天？** 不行。舰桥是治理后台，不做日常对话。\n- **蜂窝能多人共用吗？** 蜂窝是本地 AI 工作台，专注本地单人场景；需要团队协作请部署舰体，成员用蜂巢。\n- **蜂巢和舰桥共用一套界面？** 不行。职责不同，界面分开。\n\n## 延伸阅读\n\n- [蜂巢界面](/docs/zh-CN/surfaces/frontend/)\n- [蜂窝安装](/docs/zh-CN/start/desktop/)\n- [核心概览](/docs/zh-CN/concepts/)\n","source_path":"使用说明书/zh-CN/surfaces/index.md"}</script>
