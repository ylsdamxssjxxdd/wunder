  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/surfaces/index","language":"zh-CN","title":"界面概览","summary":"四个形态对应四个界面：蛹（本地 AI 工作台）、蜂巢（云端 AI 工作台）、舵机（终端界面）、舰桥（治理后台）。按形态查界面能力。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"界面","group":"概览","group_path":["概览"],"url":"/docs/zh-CN/surfaces/","headings":[{"id":"section-1","level":1,"text":"界面概览"},{"id":"section-2","level":2,"text":"四个界面各自是什么"},{"id":"section-3","level":2,"text":"每个界面的主区域"},{"id":"section-4","level":2,"text":"能力矩阵"},{"id":"section-5","level":2,"text":"按场景选择"},{"id":"section-6","level":2,"text":"常见误区"},{"id":"section-7","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/tools/extensibility","next_slug":"zh-CN/surfaces/frontend","markdown":"# 界面概览\n\nwunder 的界面按形态分四类：**蛹**（本地 AI 工作台）、**蜂巢**（云端 AI 工作台）、**舵机**（终端界面）、**舰桥**（管理员治理后台）。四者共用同一套引擎，但进入方式、能做的事和呈现方式都不一样。\n\n## 四个界面各自是什么\n\n| 界面 | 谁用 | 是什么 | 怎么打开 |\n| --- | --- | --- | --- |\n| **蛹** | 个人用户 | 本地 AI 工作台 | 装好桌面应用直接打开，不占端口 |\n| **蜂巢** | 团队成员 | 云端 AI 工作台 | 浏览器访问部署好的地址 |\n| **舵机** | 终端与自动化用户 | 本机手动操作入口 | 在终端里启动 |\n| **舰桥** | 管理员 | 治理与调试后台 | 浏览器访问舰体地址 |\n\n## 每个界面的主区域\n\n**蛹** 主窗**只有两页**：对话页和设置页。其余能力都收在面板和对话框里——侧栏、输入区、时间线、终端视图、工具管理对话框、形象对话框、工作区对话框、工作目录、线程轨迹、子智能体详情、渠道页、定时页、设置分栏、活动卡、专家数据、补丁差异卡、截图遮罩、托盘与系统通知。设置页导航共 **12 个分类**：通用、账户、模型、工具、智能体、形象、定时、记忆、渠道、提示词包、归档、帮助。**没有「设备互通」分类**。\n\n**蜂巢** 是浏览器里的单页应用，主区是 messenger：左栏 + 时间线 + 输入区，聊天和工作目录连在一起。设置以分类形式存在，包含工具、记忆、渠道、定时、设备、归档等。\n\n**舵机** 在终端里运行：上方对话区、下方输入区，用斜杠命令操作。\n\n**舰桥** 是治理与调试后台，界面密集、适合扫读。顶层导航 **4 组 19 项**：\n\n- 系统（4）：内部状态、系统设置、单位管理、用户管理\n- 智能体（6）：模型配置、线程管理、预设智能体、形象管理、工具管理、系统提示词\n- 调试（6）：吞吐量、性能、能力评估、多模调试、调试面板、LSP\n- 文档（2）：使用说明书、接口\n\n工具管理把内置工具、MCP、知识库、技能、工具可见范围归在同一组。调试面板右侧原来的日志区，现在改成了**线程轨迹视图**。\n\n## 能力矩阵\n\n四个界面的能力对比，细节见各形态专页。\n\n| 能力 | 蛹 | 蜂巢 | 舰桥 | 舵机 |\n| --- | --- | --- | --- | --- |\n| 线程列表 + 时间线 | ✅ | ✅ | ✅（线程管理） | ✅ |\n| 归档 | ✅ 设置内分类 | ✅ | 未证实 | ✅ 命令恢复 |\n| 工具 / MCP / 技能面板 | ✅ 工具对话框 | ✅ 设置工具分类（内置 / MCP / 技能 / 知识库） | ✅ 工具管理组 | ✅ 对应子命令 |\n| 知识库 | ✅ | ✅ | ✅ | ❌ 未实现 |\n| 长期记忆 | ✅ 设置 + 专家数据卡 | ✅ | ❌ 未实现 | ❌ 未实现 |\n| 定时任务 | ✅ | ✅ | ⚠️ 仅「预设智能体」模板 | ❌ 已关闭 |\n| 渠道绑定 | ✅ | ✅ | ⚠️ 仅「预设智能体」模板 | ❌ 未实现 |\n| 形象系统 | ✅ 含桌面浮窗 | ✅ | ✅ | ❌ 未实现 |\n| 工作区文件 | ✅ | ✅ | ✅ | ⚠️ 仅命令行文件操作与文件引用 |\n| 交互式终端 | ✅ | ❌ 未实现 | ❌ 未实现 | 不适用（本身就在终端里） |\n| 设备互通 | ⚠️ 侧栏云端工作区 + 审批弹窗；设置分类未开放 | ✅ 设置设备分类 + 互通视图 | ❌ 未实现（仅后端接口） | ✅ 对应子命令 |\n| 语音输入 / TTS | 输入 ✅ / 输出 ❌ | 双向 ✅ | ❌ | 无语音识别（仅粘贴 / 拖拽贴图） |\n| 截图采集 | ✅ | ❌ | ❌ | ❌ |\n| 托盘 / 系统通知 / 全局热键 | ✅ | ❌ | ❌ | ❌ |\n\n## 按场景选择\n\n- **个人日常使用**：装[蛹](/docs/zh-CN/start/desktop/)。本地文件、桌面控制、终端、截图、语音输入和托盘都在。\n- **团队协作**：部署舰体后，成员用浏览器打开[蜂巢](/docs/zh-CN/surfaces/frontend/)。\n- **终端与自动化**：用[舵机](/docs/zh-CN/start/cli/)，支持 JSON 输出和云端子命令。\n- **管理员治理**：用[舰桥](/docs/zh-CN/surfaces/web-admin/)。\n\n## 常见误区\n\n- **舰桥不做聊天**：它是治理与调试后台，普通用户登录后不会看到。\n- **蜂巢与舰桥不是同一套界面**：蜂巢面向使用者，舰桥面向管理员，路由和视觉规范都不同。\n- **蛹没有「设备互通」设置面板**：设置页 12 个分类里不含互通；蛹能用的互通只有两处——侧栏「工作目录」里的云端工作区，以及远端命令的审批弹窗。设置页里那套互通入口做了但没接上，当前打不开。\n- **蛹不能播放语音（TTS）**：语音输入可以用，设置里也能配 TTS 模型，但没有播放。想听语音输出请用蜂巢。\n- **舵机不能建定时任务**：定时功能在舵机里被显式关闭；渠道、知识库、长期记忆和形象也没有管理界面。\n- **舰桥没有用户级定时任务、渠道管理、长期记忆和互通面板**：定时和渠道只作为「预设智能体」里的模板存在；长期记忆和互通面板没有落地。\n\n## 延伸阅读\n\n- [蛹界面](/docs/zh-CN/surfaces/desktop-ui/)\n- [蜂巢界面](/docs/zh-CN/surfaces/frontend/)\n- [舰桥界面](/docs/zh-CN/surfaces/web-admin/)\n- [舵机使用](/docs/zh-CN/start/cli/)\n- [核心概览](/docs/zh-CN/concepts/)\n","source_path":"使用说明书/zh-CN/surfaces/index.md"}</script>
