  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/surfaces/frontend","language":"zh-CN","title":"蜂巢界面","summary":"蜂巢是云端 AI 工作台，随舰体提供、浏览器访问。设置内含工具、记忆、渠道、定时、设备、归档；支持双向语音（含 TTS），没有交互式终端。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"界面","group":"前端与桌面","group_path":["前端与桌面"],"url":"/docs/zh-CN/surfaces/frontend/","headings":[{"id":"section-1","level":1,"text":"蜂巢界面"},{"id":"section-2","level":2,"text":"打开与登录"},{"id":"section-3","level":2,"text":"主区"},{"id":"section-4","level":2,"text":"实时更新与连接"},{"id":"section-5","level":2,"text":"长对话的渲染"},{"id":"section-6","level":2,"text":"设置分类"},{"id":"section-7","level":2,"text":"与蛹的差异"},{"id":"section-8","level":2,"text":"输入区要点"},{"id":"section-9","level":2,"text":"时间线与状态"},{"id":"section-10","level":2,"text":"斜杠命令"},{"id":"section-11","level":2,"text":"保护机制"},{"id":"section-12","level":2,"text":"常见问题"},{"id":"section-13","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/surfaces/index","next_slug":"zh-CN/surfaces/web-admin","markdown":"# 蜂巢界面\n\n蜂巢是 wunder 的**云端 AI 工作台**：部署好舰体之后，成员用浏览器打开就能用。它本身没有独立进程，页面跟着舰体一起提供。\n\n## 打开与登录\n\n用浏览器访问舰体地址，未登录会跳到登录页，也可以直接注册。登录后默认进入你的智能体对话页。\n\n- **对话**：主工作区，见「主区」一节\n- **嵌入式对话**：可以把对话嵌到别的页面里使用\n- **外部工作流落地页**：通过链接进入的外部流程页面\n- **设置**：进入后仍停在对话页，右侧切到对应的设置分类\n- **线程轨迹**：查看整条线程的执行记录\n- **管理后台**：管理员登录后另有用户、智能体、系统等管理页\n\n## 主区\n\n蜂巢的主区是一个三栏的对话工作区：\n\n- **左栏**：新任务、搜索、工作区与线程树、工作目录、设置入口\n- **右栏**：聊天顶栏 + 时间线 + 输入区\n- **浮层**：文件预览、在线编辑、形象浮层\n\n一个智能体可以同时拥有多个独立任务线程；工作区可以有多份：你自己的云端工作区，以及通过设备互通访问的远程设备工作区。\n\n## 实时更新与连接\n\n对话的实时状态走一条长连接：新消息、执行进度、审批提示都靠它推过来。断线重连后，会通过普通请求把状态补齐，不需要重开页面。\n\n如果网络或代理把这条长连接拦了，实时状态就不更新，刷新页面通常能恢复。\n\n## 长对话的渲染\n\n时间线不会把整条线程一次性铺出来，而是按窗口加载、滚到哪加载哪，长线程打开时不至于卡住；解析和渲染也放到后台线程里做，不占用主线程。\n\n超大数据量线程的渲染优化方案目前只是一版重写，业务实现还没完全落地，超长线程仍可能卡顿。\n\n## 设置分类\n\n蜂巢的设置以分类挂在对话页里，和蛹共用同一套后端能力。包含：\n\n- **通用 / 账户 / 模型 / 智能体 / 形象 / 提示词包 / 帮助**（和蛹一样）\n- **工具**：分内置 / MCP / 技能 / 知识库四个标签页\n- **记忆**：长期记忆管理\n- **渠道**：渠道绑定与状态\n- **定时**：定时任务\n- **设备**：设备互通管理入口\n- **归档**：归档线程\n\n## 与蛹的差异\n\n| 项 | 蜂巢 | 蛹 |\n| --- | --- | --- |\n| 运行方式 | 浏览器访问云端 | 装在自己电脑上的桌面应用 |\n| 数据存放 | 舰体存储 | 本地 |\n| 交互式终端 | ❌ 无 | ✅ 有 |\n| 语音输入 / 输出 | 双向 ✅ | 输入 ✅，输出 ❌ |\n| 设备互通 | ✅ 设置设备分类 + 互通视图 | ⚠️ 仅云端工作区 + 审批弹窗；设置分类未开放 |\n| 托盘 / 系统通知 / 全局热键 / 截图 | ❌ | ✅ |\n| 附件上传上限 | 临时附件 200 MB，持久附件 10 MB | 本地文件直接引用 |\n\n## 输入区要点\n\n- **消息输入**：自然语言，也可以输入斜杠命令\n- **附件**：本地选择或拖拽\n- **发送 / 停止**：没在运行时发送，运行中变成停止\n- **模型切换**：直接在输入区切换，不用跳设置页\n- **审批模式**：建议 / 自动编辑 / 完全自动（默认完全自动）\n- **思考等级**：底部脑图标，灰色表示跟随模型，空 / 半满 / 全满分别表示无思考 / 中等 / 最高\n- **工作线程面板**：和工作目录共用同一个外层面板；标题右侧常驻状态图标和活动数量；筛选按钮在没有活动后仍保留，可以随时退出筛选；筛选期间仍能拖拽排序\n\n## 时间线与状态\n\n- 每轮回复下方的「工作过程」把中间思考、工具批次、中间打印折叠起来\n- 状态：🔄 运行中 / ⏳ 等待（需要你输入或审批）/ ✅ 已完成\n- 上下文占用和耗时对应发起该工具的那次模型请求；同一次请求里并行跑的工具共享同一组数字，不逐条相加\n- 很快的调用可能显示 `0ms`；失败和取消也会记录耗时\n\n## 斜杠命令\n\n在消息输入框里输入：\n\n- `/new` 新建线程\n- `/stop` 停止当前执行\n- `/compact` 主动压缩对话\n- `/help` 打开帮助文档\n- `/goal` 目标管理\n\n`/compact` 也算一次用户轮次；压缩后的摘要直接显示在命令后面的回复气泡里，切换线程或刷新页面后仍在。\n\n## 保护机制\n\n- **附件处理中**：发送按钮会被禁用，等处理完再发\n- **后台运行**：切换、新建、刷新或短暂离线，都不会取消正在跑的工作线程；重新连上后从已保存的事件恢复状态和待审批项\n- **空线程复用**：新建线程会优先复用当前智能体还没用过的空线程；已经发过消息、正在运行或由子智能体派生的线程不会被复用\n- **删除同步**：管理员删掉线程后，你这边会在列表刷新或切换时清理掉条目和缓存；点到失效条目会有提示并回到输入页\n\n## 常见问题\n\n**蜂巢与舰桥是两套界面**：蜂巢面向使用者，舰桥面向管理员，两套界面分开。\n\n**蜂巢支持多人共用**：蜂巢本身就是团队 / 多用户场景，成员用舰体账号登录。个人单机推荐蛹。\n\n**蜂巢没有终端**：需要 shell 时用蛹或舵机。\n\n**语音输出（TTS）可用**：蜂巢支持双向语音（含 TTS）；蛹只有输入，没有播放。\n\n**设备互通用法**：蜂巢是完整入口，设置在「设备」分类里，命令审批在时间线里内联弹出。\n\n## 延伸阅读\n\n- [界面概览](/docs/zh-CN/surfaces/index/)\n- [蛹界面](/docs/zh-CN/surfaces/desktop-ui/)\n- [舰桥界面](/docs/zh-CN/surfaces/web-admin/)\n- [舰体部署](/docs/zh-CN/start/server/)\n- [故障排查](/docs/zh-CN/help/troubleshooting/)\n","source_path":"使用说明书/zh-CN/surfaces/frontend.md"}</script>
