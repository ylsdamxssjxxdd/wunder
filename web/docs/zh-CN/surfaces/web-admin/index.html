  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/surfaces/web-admin","language":"zh-CN","title":"舰桥界面","summary":"舰桥是舰体的治理与调试后台。顶层导航 4 组 19 项：系统 4、智能体 6、调试 6、文档 2。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"界面","group":"前端与桌面","group_path":["前端与桌面"],"url":"/docs/zh-CN/surfaces/web-admin/","headings":[{"id":"section-1","level":1,"text":"舰桥界面"},{"id":"section-2","level":2,"text":"顶层导航"},{"id":"section-3","level":2,"text":"舰桥没有的东西"},{"id":"section-4","level":2,"text":"使用注意"},{"id":"section-5","level":2,"text":"访问方式"},{"id":"section-6","level":2,"text":"常见问题"},{"id":"section-7","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/surfaces/frontend","next_slug":"zh-CN/surfaces/desktop-ui","markdown":"# 舰桥界面\n\n舰桥是**舰体（用户与智能体管理平台）**自带的治理与调试后台。普通用户登录后看不到它，只有管理员能进。\n\n它跟着舰体一起启动，没有单独的构建步骤，端口和舰体一致（默认 18000）。蜂巢和它是**两套界面**：蜂巢面向使用者，舰桥面向管理员。\n\n## 顶层导航\n\n舰桥共 4 组、19 项。\n\n**系统（4）**\n\n- 内部状态：进程健康、锁与队列、运行时指标\n- 系统设置：运行中热更新配置\n- 单位管理：组织树，最深 4 级\n- 用户管理：账号、配额、在线状态（分蜂巢 / 蜂窝 / 舵机）\n\n**智能体（6）**\n\n- 模型配置：LLM / TTS / 图像 / 视频模型\n- 线程管理：跨用户的线程列表、状态、目标态（**只读展示**，没有目标编辑器）\n- 预设智能体：智能体模板，可以声明哪些字段允许用户自定义；用户级定时任务和渠道在这里作为模板存在，不是独立导航项\n- 形象管理\n- 工具管理：把内置工具、MCP、知识库、技能、工具可见范围归在同一组\n- 系统提示词：提示词模板\n\n**调试（6）**\n\n- 吞吐量测试：预设输入 1024 到 1 MiB、输出 1024 到 8192，最大并发 1024\n- 性能测试：用固定的测试用户和独立数据根，命令超时 5 秒\n- 能力评估：跑能力基准并打分\n- 多模调试：图像 / 视频 / 转写 / 语音合成直连测试\n- 调试面板：线程列表 + 线程详情；**右侧的日志区现在是线程轨迹视图**\n- LSP：语言服务\n\n**文档（2）**\n\n- 使用说明书：站内嵌整个说明书\n- 接口：API 文档入口\n\n## 舰桥没有的东西\n\n- **用户级定时任务面板**：没有独立入口，定时只在「预设智能体」里作为模板存在\n- **用户级渠道管理**：同上，渠道只在预设模板里\n- **长期记忆面板**：没有实现\n- **互通治理面板**：互通的舰队 / 通道 / 命令 / 审计 / 策略治理目前只有后端接口，没有界面；说「舰桥能管互通」是不对的\n- **目标（goal）编辑**：线程管理只读展示，没有目标编辑器；目标入口在用户端——蜂巢的时间线、蜂窝的输入区、舵机的 `/goal` 命令\n\n## 使用注意\n\n舰桥的操作默认是**高风险**的：\n\n- 关键动作都有明确的状态、错误反馈和确认边界；前端的确认不能替代后端的权限校验\n- 表格、日志和监控面板都做了分页 / 筛选 / 限量，不会一次性铺出大量数据\n- 界面密集、适合扫读\n\n## 访问方式\n\n- 地址：`http://<host>:18000/`（默认端口，可在配置里改）\n- 鉴权：管理员用 API Key 或登录凭证进入；单位负责人只能管理本单位的单位和用户账号\n- 首次登录后请立即修改默认密码\n\n## 常见问题\n\n**舰桥不做聊天**：它是治理与调试后台，日常对话去蜂巢或蜂窝。\n\n**舰桥与蜂巢是两套界面**：蜂巢是用户面，舰桥是管理员面，两套界面分开。\n\n**状态里有互通、记忆条目但面板为空的原因**：这些是残留的死条目，面板从未落地；互通治理目前只有后端接口。\n\n**日志区已改为线程轨迹视图**：调试面板右侧原来的日志区，现在重构为线程轨迹视图，旧的日志输出只作为兜底保留。\n\n**吞吐量测试、性能测试与线程压测的区别**：吞吐量测试和性能测试是舰桥的运维面板；面向渲染的线程压测属于用户面，三端的入口默认都是 1000×1000。\n\n## 延伸阅读\n\n- [舰体部署](/docs/zh-CN/start/server/)\n- [界面概览](/docs/zh-CN/surfaces/index/)\n- [认证与安全](/docs/zh-CN/ops/auth-and-security/)\n- [配置说明](/docs/zh-CN/reference/config/)\n- [舰桥面板索引](/docs/zh-CN/reference/admin-panels/)\n","source_path":"使用说明书/zh-CN/surfaces/web-admin.md"}</script>
