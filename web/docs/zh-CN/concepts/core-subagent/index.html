  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-subagent","language":"zh-CN","title":"子智能体","summary":"子智能体核心在单一线程内派生子任务，交给独立执行体完成并回传结果；协作形态只有子智能体一种，蜂群编排已从引擎与协议层移除。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"核心","group":"9 个核心","group_path":["9 个核心"],"url":"/docs/zh-CN/concepts/core-subagent/","headings":[{"id":"section-1","level":1,"text":"子智能体"},{"id":"section-2","level":2,"text":"怎么运作"},{"id":"section-3","level":2,"text":"边界与当前限制"}],"prev_slug":"zh-CN/concepts/core-context-compression","next_slug":"zh-CN/concepts/core-scheduled-tasks","markdown":"# 子智能体\n\n子智能体核心在单一线程内派生子任务：父线程把一项子任务交给独立执行体，它跑完把结果回传给父线程。\n\n## 怎么运作\n\n`子智能体控制` 提供 11 种动作：\n\n| 动作 | 动作 | 动作 |\n| --- | --- | --- |\n| `spawn` | `batch_spawn` | `wait` |\n| `interrupt` | `close` | `resume` |\n| `report` | `send` | `status` |\n| `list` | `history` | |\n\n父子轮次引用编码为 `user_round` + `model_round`，子执行体的轮次挂在这对父轮引用下。子会话的用户消息隐藏，并以 auto-wake 唤醒。\n\n## 边界与当前限制\n\n- 协作形态**只有子智能体**。蜂群编排（蜂群工具、蜂房、编排态、team run、蜂群包）已从引擎与协议层移除，不是待实现，也不是被开关隐藏。\n- TUI 提示、前端 i18n 标签与兼容垫片仍有蜂群残留，空目录待清理。这些残留不代表能力存在。\n","source_path":"使用说明书/zh-CN/concepts/core-subagent.md"}</script>
