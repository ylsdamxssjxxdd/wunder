  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/companion","language":"zh-CN","title":"形象系统","summary":"ZIP 形象包与精灵表规格、帧与各形态的呈现、缩放位置范围、用户与管理员的权限划分。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/companion/","headings":[{"id":"section-1","level":1,"text":"形象系统"},{"id":"section-2","level":2,"text":"形象包"},{"id":"section-3","level":2,"text":"精灵表规格"},{"id":"section-4","level":2,"text":"各形态的呈现"},{"id":"section-5","level":2,"text":"缩放与位置"},{"id":"section-6","level":2,"text":"权限"},{"id":"section-7","level":2,"text":"限制"}],"prev_slug":"zh-CN/concepts/goal-mode","next_slug":"zh-CN/concepts/boundary-handling","markdown":"# 形象系统\n\n一个形象包是一个 ZIP，里面放形象清单与精灵表；运行时按会话状态选对应动画行播放。形象不参与执行，也不影响调度，删掉形象不改变任何功能。\n\n## 形象包\n\n包内恰好两样东西：一份清单，一张精灵表图片。\n\n- 清单是一份 JSON，写明形象 id、显示名、描述，以及精灵表文件的位置。\n- 精灵表的路径由清单指定。\n- 大小上限：整个 ZIP 不超过 24 MB，精灵表单文件不超过 18 MB。\n- 导入时做压缩包内的路径穿越防护。\n\n形象文件放在固定的形象目录里；蛹、舵机这类内嵌运行的形态把这个目录固定到各自的数据目录。当前没有内置任何形象包，列表为空属于正常。\n\n## 精灵表规格\n\n- 每帧固定 **192 × 208** 像素，同一状态的帧在同一行横向排；**一个状态占一行**。\n- 行号就是状态（行 0–8）：\n\n| 行 | 状态 | 行 | 状态 |\n| --- | --- | --- | --- |\n| 0 | 待机 idle | 5 | 失败 failed |\n| 1 | 向右跑 running-right | 6 | 等待 waiting |\n| 2 | 向左跑 running-left | 7 | 运行 running |\n| 3 | 挥手 waving | 8 | 检阅 review |\n| 4 | 跳跃 jumping | | |\n\n- 会话运行状态映射到动画行：运行中 → running（第 7 行）、完成 → jumping（第 4 行）、等待 → waiting（第 6 行）、出错 → failed（第 5 行），其余回落到 idle（第 0 行）。点击形象播放一次 waving 动画。\n- 形象包可以少声明帧数：越界的行或帧被边界检查降级处理，不会崩。\n\n## 各形态的呈现\n\n| 形态 | 呈现 |\n| --- | --- |\n| 蛹（Windows） | 原生浮窗：每只宠物一个独立窗口，拖拽与帧时钟走独立消息线程，不占界面线程 |\n| 蛹（Linux） | 没有等价浮窗，桌面宠物只有 Windows 有 |\n| 蜂巢 | 页面内浮层，跟着聊天状态 |\n| 舰桥 | 形象管理面板：上传、编辑、删除、导出全局形象 |\n| 舵机 | 没有形象界面，只把形象目录指到本地数据目录 |\n\n## 缩放与位置\n\n| 项 | 范围 |\n| --- | --- |\n| 存储 / 菜单缩放 | 0.5–1.6（预设 0.5 / 0.8 / 1.0 / 1.2 / 1.4 / 1.6） |\n| 渲染缩放 | 0.5–1.8 |\n| 位置 | 按屏幕工作区夹紧并保持边距，拖拽结果会保存 |\n\n蛹把位置、每只形象的显示 / 缩放覆盖、全局消息提示开关存到本地文件；蜂巢存在浏览器本地，清理浏览器数据会重置位置与偏好。\n\n## 权限\n\n- 用户侧只能查看：看全局形象列表、看某一只的详情、取它的精灵表、导出它的包。\n- 增删改在管理员侧（列表、导入、改删、精灵表、导出包），导入请求体上限与 ZIP 上限一致，都是 24 MB。\n- 蜂巢里的\"私有形象\"只在当前浏览器本地生效，不上传服务端；全局形象由管理员经舰桥上传后，所有用户可见。舰桥是唯一的上传入口。\n\n## 限制\n\n- 形象不是另一种智能体，只是某个智能体的视觉外壳，一个智能体绑一只形象。\n- 用户不能在蜂巢里把形象传到服务器；服务端形象由管理员经舰桥管理，私有导入只在本地浏览器。\n- Linux 蛹没有桌面浮窗，浮窗是 Windows 上的实现，没有 Linux 等价物。\n- 形象动画不影响任务执行：运行状态驱动动画，反过来不成立。\n- 系统不内置形象包，需要管理员上传。\n","source_path":"使用说明书/zh-CN/concepts/companion.md"}</script>
