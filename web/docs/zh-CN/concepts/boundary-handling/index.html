  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/boundary-handling","language":"zh-CN","title":"边界处理","summary":"上下文超限、网络中断、工具失败、任务排队：系统在这些边界情况下保持稳定，而不是直接崩溃。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/boundary-handling/","headings":[{"id":"section-1","level":1,"text":"边界处理"},{"id":"section-2","level":2,"text":"三条处理原则"},{"id":"section-3","level":2,"text":"上下文超限：分级压缩"},{"id":"section-4","level":2,"text":"网络断开：自动重连 + 事件补发"},{"id":"section-5","level":2,"text":"工具失败：分类型处理"},{"id":"section-6","level":2,"text":"工具输出过大：三层收口"},{"id":"section-7","level":2,"text":"多个请求一起来：排队 + 优先级"},{"id":"section-8","level":2,"text":"你能做的"},{"id":"section-9","level":2,"text":"容易搞错的地方"},{"id":"section-10","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/concepts/companion","next_slug":"zh-CN/help/index","markdown":"# 边界处理\n\n长对话、网络抖动、工具报错、并发请求都属于边界情况。wunder 在这些情况下的目标是稳住，而不是整段崩掉。\n\n## 三条处理原则\n\n- **控扩散**：一个环节出错，不把其它环节带崩。\n- **能恢复**：系统留有恢复链路。\n- **可复盘**：同类问题能归类、复现、验证。\n\n## 上下文超限：分级压缩\n\n对话越来越长、工具结果越堆越多，总 Token 可能超过模型上限。系统按四级渐进压缩：\n\n| 级别 | 做法 | 损失 |\n| --- | --- | --- |\n| 1 级 | 移除工具的中间结果 | 很低 |\n| 2 级 | 把历史对话做摘要 | 中等 |\n| 3 级 | 移除较早的对话 | 较高 |\n| 4 级 | 紧急降级 | 很高 |\n\n**系统提示词不参与压缩，始终冻结**，所以压缩不会改掉智能体的行为设定。\n\n## 网络断开：自动重连 + 事件补发\n\n连接可能因网络抖动断掉。断线后界面先给出提示，再按指数退避自动重连（1 秒 → 2 秒 → 4 秒 → 8 秒 → 16 秒，最长 32 秒）。断开期间没推送到的事件会被缓存，重连成功后补发；补发也失败，再提示手动刷新。\n\n## 工具失败：分类型处理\n\n| 失败类型 | 处理 |\n| --- | --- |\n| 参数写错 | 让智能体自己改参数、重试 |\n| 权限被拒 | 停下来等你审批 |\n| 临时错误（文件被占、网络抖动） | 自动重试 |\n| 系统错误 | 有限重试 + 降级 |\n\n## 工具输出过大：三层收口\n\n| 层级 | 作用 |\n| --- | --- |\n| 执行层预算 | 限制单次输出大小 |\n| 结果裁剪 | 超限时保留头部和尾部 |\n| 入模检查 | 进模型前再精简一次 |\n\n被裁剪的结果会明确告诉智能体\"这里被裁了\"。\n\n## 多个请求一起来：排队 + 优先级\n\n同一会话在忙时，新请求不会被打回，而是排进队列，等空闲后依次执行。优先级从高到低：管理员 > 高优先级 > 普通 > 低优先级。\n\n## 你能做的\n\n- **长对话**：留意上下文占用，必要时用 `/compact` 主动压缩；一个话题谈完就开新会话。\n- **网络抖动**：界面显示\"连接断开\"时等它自动重连，别反复刷页面；重连失败再按提示手动刷新。\n- **工具失败**：看失败提示找原因，按提示调整（比如给出正确的文件路径）；反复失败就找管理员看系统日志。\n- **系统异常**：长时间无响应先尝试取消或重置；状态明显不对用\"重置工作状态\"；反复出现找管理员排障。\n\n## 容易搞错的地方\n\n- 智能体回答了，不代表一切正常。\n- 重试有适用范围，不同错误类型走不同处理。\n- 长对话和复杂任务里经常出现边界情况。\n\n## 延伸阅读\n\n- [稳定性](/docs/zh-CN/concepts/core-stability/) —— 稳定性设计原则\n- [上下文压缩](/docs/zh-CN/concepts/core-context-compression/) —— 压缩详细机制\n- [故障排查](/docs/zh-CN/help/troubleshooting/) —— 具体问题解决\n","source_path":"使用说明书/zh-CN/concepts/boundary-handling.md"}</script>
