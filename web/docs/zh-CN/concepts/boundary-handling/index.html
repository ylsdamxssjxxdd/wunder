  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/boundary-handling","language":"zh-CN","title":"边界处理","summary":"上下文超限的分级压缩、断线重连与事件补发、工具失败的分类处理与并发请求排队。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/boundary-handling/","headings":[{"id":"section-1","level":1,"text":"边界处理"},{"id":"section-2","level":2,"text":"上下文超限"},{"id":"section-3","level":2,"text":"断线与重连"},{"id":"section-4","level":2,"text":"工具失败"},{"id":"section-5","level":2,"text":"工具输出过大"},{"id":"section-6","level":2,"text":"队列与优先级"},{"id":"section-7","level":2,"text":"限制"}],"prev_slug":"zh-CN/concepts/companion","next_slug":"zh-CN/capabilities/stream-events","markdown":"# 边界处理\n\n每类故障都有独立的处理路径：一个环节出错不牵连其它环节，处理后保留恢复链路，同类问题可以归类、复现、验证。\n\n## 上下文超限\n\n对话变长、工具结果堆积，总 Token 会逼近模型上限。压缩按四级渐进：\n\n| 级别 | 做法 | 损失 |\n| --- | --- | --- |\n| 1 级 | 移除工具的中间结果 | 很低 |\n| 2 级 | 把历史对话做摘要 | 中等 |\n| 3 级 | 移除较早的对话 | 较高 |\n| 4 级 | 紧急降级 | 很高 |\n\n系统提示词不参与压缩，始终冻结，所以压缩不会改动智能体的行为设定。\n\n长对话需要留意上下文占用，必要时用 `/compact` 主动压缩；一个话题谈完就开新会话。\n\n## 断线与重连\n\n网络抖动导致连接断开后，界面先给出提示，再按指数退避自动重连（1 秒 → 2 秒 → 4 秒 → 8 秒 → 16 秒，最长 32 秒）。断开期间没推送到的事件会被缓存，重连成功后补发；补发失败才提示手动刷新。\n\n界面显示\"连接断开\"时等它自动重连，不要反复刷页面。\n\n## 工具失败\n\n| 失败类型 | 处理 |\n| --- | --- |\n| 参数写错 | 让智能体自己改参数、重试 |\n| 权限被拒 | 停下来等待审批 |\n| 临时错误（文件被占、网络抖动） | 自动重试 |\n| 系统错误 | 有限重试 + 降级 |\n\n失败提示会给出原因，按提示调整（例如给出正确的文件路径）；反复失败时由管理员查系统日志。\n\n## 工具输出过大\n\n三层收口：\n\n| 层级 | 作用 |\n| --- | --- |\n| 执行层预算 | 限制单次输出大小 |\n| 结果裁剪 | 超限时保留头部和尾部 |\n| 入模检查 | 进模型前再精简一次 |\n\n被裁剪的结果会明确告诉智能体\"这里被裁了\"，智能体据此换策略。\n\n## 队列与优先级\n\n同一会话在忙时，新请求不会被打回，而是排进队列，空闲后依次执行。优先级从高到低：管理员 > 高优先级 > 普通 > 低优先级。\n\n## 限制\n\n- 智能体回答了，不代表一切正常；要看它是否长期稳定、是否在故障发生时能报错。\n- 重试只对部分错误类型有效。\n- 长对话和复杂任务里边界情况出现得频繁。\n- 长时间无响应先尝试取消或重置；状态明显不对使用\"重置工作状态\"；反复出现找管理员排障。\n","source_path":"使用说明书/zh-CN/concepts/boundary-handling.md"}</script>
