  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/streaming","language":"zh-CN","title":"流式执行","summary":"执行过程实时到达界面的路径：先落库再推送、按游标续传、前端只消费有界视图。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/streaming/","headings":[{"id":"section-1","level":1,"text":"流式执行"},{"id":"section-2","level":2,"text":"先落库，再通知"},{"id":"section-3","level":2,"text":"只有 WebSocket"},{"id":"section-4","level":2,"text":"事件分四类"},{"id":"section-5","level":2,"text":"断线与补水"},{"id":"section-6","level":2,"text":"有界是默认设定"},{"id":"section-7","level":2,"text":"怎么判断"},{"id":"section-8","level":2,"text":"容易搞错的地方"},{"id":"section-9","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/concepts/sessions-and-rounds","next_slug":"zh-CN/concepts/presence-and-runtime","markdown":"# 流式执行\n\n流式解决的不是\"字要一个个冒出来\"，而是三件事：**过程实时可见、看到的就是落库的、断线能接上**。\n\n## 先落库，再通知\n\n引擎发一个事件，会先同步写进会话记录（每个会话一条串行通道、单事务），事务成功后才发布变更游标、唤醒订阅者。由此有三条保证：\n\n- **提交顺序 = 变更顺序**：每条会话一个通道，写入在短事务里完成；失败的提交**不会**发布游标。\n- **幂等不吵**：重放的受理、状态没变、重复反馈都不产生变更，也不通知。\n- **唤醒只是加速**：进程内的唤醒通道不保证正确，服务端续传始终保留轮询兜底（250 毫秒起、指数退避到 4 秒），多实例靠轮询收敛。\n\n所以\"界面显示的文本\"和\"刷新后读到的文本\"同源，不存在\"流里有、库里没有\"的中间态。\n\n## 只有 WebSocket\n\n| 通道 | 用途 |\n| --- | --- |\n| `/wunder/chat/ws` | 聊天会话主通道：提交、续传、旁观、取消、审批 |\n| `/wunder/ws` | 通用请求面（提交一次执行并流式接收） |\n| `/wunder/interlink/remote_ws` | 浏览器旁观远端设备的单条会话，纯转发不落库 |\n| `/wunder/user_world/ws`、`/wunder/desktop/lan/ws` | 站内会话与局域网协同 |\n\n蜂窝默认形态**不经过本机 HTTP / WebSocket**：同进程原生事件通道（有界，容量 128 条）直接投递；丢订阅或关窗口不会取消已在服务端受理的轮次。\n\n⚠️ **聊天没有 SSE 兜底**。服务端确有 SSE，但只用于对外集成面和模型代理调用，不是聊天的降级通道。\n\n## 事件分四类\n\n| 类别 | 是否进时间线 | 用法 |\n| --- | --- | --- |\n| 条目事件（工具调用、模型调用、可见回复、审批、子智能体消息、压缩、轮次终态） | 是 | 按稳定的条目 id 覆盖更新 |\n| 传输增量（助手正文尾块、命令输出增量） | 否 | 只补字：助手正文走尾块，命令输出走增量 |\n| 状态与回执（会话状态、结束、错误、会话关闭、排队） | 部分（排队是持久记录） | 判断生命周期，不渲染成条目 |\n| 唤醒与补水（视图变更、需要重取视图、需要快照、流溢出、慢客户端、建议重连） | 否 | 客户端据此续传或整体重拉 |\n\n统计类（上下文占用、Token 用量、轮次用量、模型用量、额度）只用于面板刷新，不进时间线。\n\n## 断线与补水\n\n客户端保存**持久游标**（变更序号），重连时带上：\n\n| 情况 | 服务端信号 | 客户端该做 |\n| --- | --- | --- |\n| 落后但不多 | 从游标续发变更行 | 就地增量应用 |\n| 落后超过窗口 | 流溢出 + 建议重连 | 先收信号再断开该订阅，按游标重连 |\n| 持久窗口已被裁剪 | 需要快照 | 放弃续传，拉一次原子快照 |\n| 展示视图落后 | 需要重取视图 / 视图变更 | 重取分页视图，不逐条拼接 |\n\n补水接口是成套的：会话变更列表、原子快照、事件分页、单条目正文。\n\n## 有界是默认设定\n\n| 参数 | 值 |\n| --- | --- |\n| 每连接写队列 | 256（满即判慢客户端） |\n| 慢客户端水位 | 2（队列深度超过即告警 / 降级） |\n| 续传每页 | 200 |\n| 事件读取上限 | 200 |\n| 心跳 | 15 秒 |\n| 单条消息 | 512 KiB（超出即拒收；远端旁观 256 KiB） |\n| 聊天页 / 轨迹页 | 12（上限 20）/ 80（上限 100），响应预算 128 KB / 192 KB |\n| 正文分块 | 8 KB |\n\n前端消费的是**视图**：聊天一页只装 12 个用户轮次，每个轮次除最终回复外的中间内容折叠成\"工作过程\"，展开时才拉该轮条目。轨迹才是逐条目视图（每行子智能体卡片上限 8 个）。\n\n## 怎么判断\n\n- **一轮是否结束**：看轮次终态（带状态、停止原因、可选错误与恢复动作），不要靠\"好像不动了\"。等待审批或等待补充信息时，会话仍在生命周期内。\n- **看到重复气泡**：多半是客户端没按条目 id 覆盖更新、而是又追加了一条。用\"轮次 id + 模型轮次\"定位同一项。\n- **丢字**：检查是不是把增量当成了唯一来源。增量只负责连续展示，正文真相在条目里；重连后走补水接口。\n- **刷新后内容变长**：正常。刷新读的是落库正文，可能比流式尾块更完整。\n\n## 容易搞错的地方\n\n- 流式和落库不是两条路：发事件时同步落库，游标在事务之后才发布。\n- 断线不等于执行中断：执行在服务端继续，客户端按游标重连接上即可。\n- SSE 不是聊天的降级方案，聊天只有 WebSocket。\n- 多拉几次拿不到全量历史：视图有意有界，全量搬运正是设计上要避免的。\n- \"看到字在出\"不等于\"循环转了很多轮\"：文本增量与模型轮次是两种粒度，一轮内可能有成千上万个增量。\n\n## 延伸阅读\n\n- [会话状态说明](/docs/zh-CN/reference/stream-events/) —— 事件与字段清单\n- [聊天 WebSocket](/docs/zh-CN/reference/chat-ws/) —— 协议与信封\n- [会话与轮次](/docs/zh-CN/concepts/sessions-and-rounds/) —— 条目与轮次粒度\n- [实时性](/docs/zh-CN/concepts/core-realtime/) —— 设计原则\n- [系统架构](/docs/zh-CN/concepts/architecture/) —— 视图与真相的分层\n","source_path":"使用说明书/zh-CN/concepts/streaming.md"}</script>
