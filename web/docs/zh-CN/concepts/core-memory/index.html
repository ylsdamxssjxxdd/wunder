  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-memory","language":"zh-CN","title":"记忆","summary":"长期资料在线程创建时注入一次，之后保持冻结。它的两层结构，以及使用上的注意点。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"核心","group":"9 个核心","group_path":["9 个核心"],"url":"/docs/zh-CN/concepts/core-memory/","headings":[{"id":"section-1","level":2,"text":"记忆解决什么问题"},{"id":"section-2","level":2,"text":"记忆的两层"},{"id":"section-3","level":2,"text":"它对谁有什么用"},{"id":"section-4","level":2,"text":"记忆长什么样"},{"id":"section-5","level":2,"text":"和它相关的几条规则"},{"id":"section-6","level":2,"text":"实际使用中的注意点"},{"id":"section-7","level":2,"text":"几处需要澄清"},{"id":"section-8","level":2,"text":"相关页面"}],"prev_slug":"zh-CN/concepts/core-channels","next_slug":"zh-CN/concepts/core-multithreading","markdown":"## 记忆解决什么问题\n\n智能体需要\"记住\"长期资料——用户是谁、偏爱什么、组织有什么制度、项目有什么背景。这些资料如果每次都临时拼凑，智能体的表现就会忽好忽坏。\n\nwunder 的做法是：在线程创建时注入一次，之后保持冻结，不会每轮对话都动态改写。\n\n这样设计的结果：线程运行期间认知边界稳定，不会越聊越\"漂移\"；系统提示词稳定，利于缓存加速；能明确回答\"这条线程是基于什么背景启动的\"。\n\n## 记忆的两层\n\n第一层是线程初始化注入。线程创建时，系统把关键长期资料写进系统提示词，成为线程的认知底座。\n\n第二层是运行期补充检索。执行中如果需要更多资料，系统通过 recall 动态检索补充，而不是改写系统提示词。\n\n## 它对谁有什么用\n\n对普通用户：个人偏好会被记住，新对话自动生效；智能体不会聊着聊着\"忘记\"用户是谁；工作区、知识库里的长期资料能被智能体用上。\n\n对管理员：记忆注入规则可控，能避免敏感信息外泄；同一类对话基于相同背景启动，结果更可预测；能追溯线程的初始化背景。\n\n## 记忆长什么样\n\n记忆采用结构化碎片，而不是一大段自由文本：命中更快（智能体能快速找到需要的信息）、替换只影响单个碎片、过期信息可标记失效、片段之间的版本关系可追溯。\n\n## 和它相关的几条规则\n\n系统提示词一旦确定就保持冻结，后续对话不会动态修改，这是为了线程行为稳定。长期记忆只在线程创建时注入一次；运行中即使触发 recall，结果也只是补充参考，不会改写系统提示词。\n\n工作区、知识库、记忆都能提供资料，但职责不同：\n\n| 来源 | 特点 | 用途 |\n| --- | --- | --- |\n| 工作区 | 当前任务现场 | 存放正在处理的文件 |\n| 知识库 | 长期文档来源 | 检索制度、资料、参考文档 |\n| 记忆 | 结构化沉淀 | 记住用户是谁、偏好、历史决策 |\n\n## 实际使用中的注意点\n\n记忆更新的时机取决于线程：新线程创建时自动应用最新记忆，已存在的线程不受影响，保持创建时的那一份。所以你更新了个人偏好，需要开新对话才会生效。\n\n记忆和上下文压缩分工不同：压缩治理的是对话历史这类近场信息，记忆提供的是长期背景这类远场信息。压缩不触及系统提示词里的记忆。\n\n记忆也不是越多越好。注入过多会挤占对话上下文空间、引入无关信息干扰判断、增加 token 消耗。系统因此有选择与限制机制，不会无限制注入。\n\n## 几处需要澄清\n\n记忆不会每轮自动更新，它只在初始化注入，运行期不改。recall 是动态补充，不会改写底座。工作区文件也不等于记忆——工作区是当前任务现场，记忆是长期沉淀。\n\n## 相关页面\n\n- [长期记忆详情](/docs/zh-CN/concepts/memory/)\n- [提示词与技能](/docs/zh-CN/concepts/prompt-and-skills/) —— 系统提示词如何组织\n- [上下文压缩](/docs/zh-CN/concepts/core-context-compression/) —— 近场历史的治理\n","source_path":"使用说明书/zh-CN/concepts/core-memory.md"}</script>
