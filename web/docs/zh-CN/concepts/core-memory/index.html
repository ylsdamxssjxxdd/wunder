  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-memory","language":"zh-CN","title":"记忆","summary":"长期资料在线程创建时注入一次并冻结的两层结构，结构化碎片的组织方式，以及与工作区、知识库的来源分工。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"核心能力","group_path":["核心能力"],"url":"/docs/zh-CN/concepts/core-memory/","headings":[{"id":"section-1","level":2,"text":"两层结构"},{"id":"section-2","level":2,"text":"结构"},{"id":"section-3","level":2,"text":"冻结规则"},{"id":"section-4","level":2,"text":"来源分工"},{"id":"section-5","level":2,"text":"更新时机"},{"id":"section-6","level":2,"text":"限制"},{"id":"section-7","level":2,"text":"易混淆点"}],"prev_slug":"zh-CN/concepts/core-channels","next_slug":"zh-CN/concepts/core-multithreading","markdown":"智能体需要长期资料——用户是谁、偏爱什么、组织有什么制度、项目有什么背景。这类资料在线程创建时注入一次，之后保持冻结，不会每轮对话动态改写。\n\n由此有三条结果：线程运行期间认知边界稳定，不会越聊越漂移；系统提示词稳定，利于缓存加速；能明确回答这条线程是基于什么背景启动的。用户侧看到的是个人偏好在新对话自动生效、工作区与知识库里的长期资料能被用上；管理侧看到的是注入规则可控、敏感信息不外泄、同类对话基于相同背景启动、线程初始化背景可追溯。\n\n## 两层结构\n\n第一层是线程初始化注入。线程创建时，系统把关键长期资料写进系统提示词，成为线程的认知底座。\n\n第二层是运行期补充检索。执行中如果需要更多资料，系统通过 recall 动态检索补充，而不是改写系统提示词。\n\n## 结构\n\n记忆采用结构化碎片，而不是一大段自由文本：命中更快（智能体能快速找到需要的信息）、替换只影响单个碎片、过期信息可标记失效、片段之间的版本关系可追溯。\n\n## 冻结规则\n\n系统提示词一旦确定就保持冻结，后续对话不会动态修改，这是为了线程行为稳定。长期记忆只在线程创建时注入一次；运行中即使触发 recall，结果也只是补充参考，不会改写系统提示词。\n\n## 来源分工\n\n工作区、知识库、记忆都能提供资料，但职责不同：\n\n| 来源 | 特点 | 用途 |\n| --- | --- | --- |\n| 工作区 | 当前任务现场 | 存放正在处理的文件 |\n| 知识库 | 长期文档来源 | 检索制度、资料、参考文档 |\n| 记忆 | 结构化沉淀 | 记住用户是谁、偏好、历史决策 |\n\n## 更新时机\n\n记忆更新何时生效取决于线程：新线程创建时自动应用最新记忆，已存在的线程不受影响，保持创建时的那一份。更新了个人偏好之后，需要开新对话才会生效。\n\n## 限制\n\n记忆和上下文压缩分工不同：压缩治理的是对话历史这类近场信息，记忆提供的是长期背景这类远场信息。压缩不触及系统提示词里的记忆。\n\n记忆也不是越多越好。注入过多会挤占对话上下文空间、引入无关信息干扰判断、增加 token 消耗。系统因此有选择与限制机制，不会无限制注入。\n\n## 易混淆点\n\n记忆不会每轮自动更新，它只在初始化注入，运行期不改。recall 是动态补充，不会改写底座。工作区文件也不等于记忆——工作区是当前任务现场，记忆是长期沉淀。\n","source_path":"使用说明书/zh-CN/concepts/core-memory.md"}</script>
