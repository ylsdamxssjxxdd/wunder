  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/tools","language":"zh-CN","title":"工具体系","summary":"工具从注册、被选中、分发到结果落地的完整链路，以及并行度、超时、预算和裁剪口径。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/tools/","headings":[{"id":"section-1","level":1,"text":"工具体系"},{"id":"section-2","level":2,"text":"一次工具调用的链路"},{"id":"section-3","level":2,"text":"工具为什么\"看不见\""},{"id":"section-4","level":2,"text":"命名与动态注册"},{"id":"section-5","level":2,"text":"并行、超时与预算"},{"id":"section-6","level":2,"text":"结果的两条裁剪通道"},{"id":"section-7","level":2,"text":"MCP 接入"},{"id":"section-8","level":2,"text":"协议随 provider 变"},{"id":"section-9","level":2,"text":"已移除 / 已合并"},{"id":"section-10","level":2,"text":"容易搞错的地方"},{"id":"section-11","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/concepts/presence-and-runtime","next_slug":"zh-CN/concepts/prompt-and-skills","markdown":"# 工具体系\n\n分层概念、默认集与命名口径见 [工具（核心概念）](/docs/zh-CN/concepts/core-tools/)，逐个工具的用法见 [工具总览](/docs/zh-CN/tools/)。\n\n## 一次工具调用的链路\n\n```\n模型输出\n  → 解析并清洗工具调用（修参数、还原被字符串化的原始值）\n  → 编排：策略与审批、钩子、超时、预算、是否可并行\n  → 分发：别名 → 技能 → MCP → 知识库 → 内置\n  → 统一的结果结构\n  → 进模型前裁剪\n  → 会话记录落库 + 事件推送（展示通道另算）\n```\n\n两个容易写错的点：\n\n- \"前置 → 执行 → 后置 → 结果\"的四阶段只是描述模型，**钩子默认关闭**，它不是执行主链。\n- 业务失败的识别不在分发层报错，而是作为正常路径返回。\"工具返回了但业务没成\"是正常的，模型会读到失败原因。\n\n## 工具为什么\"看不见\"\n\n| 卡在哪 | 判据 |\n| --- | --- |\n| 没被注册 | 名字不在规范名 / 别名表里，也没有对应的 MCP / 技能 / 知识库 |\n| 被临时下架 | `网页搜索`、`ptc`：代码还在，但一律不可见 |\n| 不在能力选择层 | 管理员没给这个智能体选中该能力 |\n| 被形态过滤 | 桌面模式隐藏目标管理动作、\"会话线程控制\"\"会话让出\" |\n| 被能力门槛过滤 | 没有视觉能力时过滤读图与桌面类；多模态四件套要配对应模型；网页抓取 / 浏览器要先启用配置 |\n| 名字被短路 | 别名与技能名同名时，前面的路由先命中 |\n\n## 命名与动态注册\n\n- MCP 工具以\"服务器 @ 工具\"命名；开启打包的服务器会折叠成单个工具，用列清单 / 取详情 / 调用三个动作操作。\n- 工具名跨服务器重名时追加服务端名段，同服务器内重名再加运行时后缀。\n- 技能名本身可直接调用；知识库**按库名逐个注册**，没有单一的\"知识库\"工具。\n- 用户给工具起的别名会进入别名表，分发时**最优先按别名路由**。\n\n## 并行、超时与预算\n\n| 项 | 值 |\n| --- | --- |\n| 并行度上限 | 4 |\n| 并行判定 | 一批工具调用能否并行在编排层判定 |\n| 锁语义 | 可并行工具取读锁、独占工具取写锁 |\n| 工具默认超时 | 120 秒（下限 1 秒） |\n| 工具调用预算 | 每轮 10000 |\n| 记忆召回预算 | 每轮 2000 |\n\n并行白名单之外的工具串行执行，这是刻意的：写类和执行类要独占。\n\n## 结果的两条裁剪通道\n\n| 通道 | 行为 | 影响 |\n| --- | --- | --- |\n| 展示 | 预览 2400 字符、16 行，超出加省略号 | 只影响客户端渲染；原始消息与复制内容完整保留 |\n| 模型输入 | 按预算截断头尾；旧的可复现观测交给微压缩处理 | 决定模型下一步看到什么 |\n\n进模型的预算：头尾各 10000 字符；数组最多 128 项（头 48 + 尾 16）；分页型结果 500 项（头 180 + 尾 60）。裁剪会带\"已截断\"标记，模型能看到\"被裁了\"。\n\n微压缩的口径：保留最近 5 组，旧观测收成 768 字节预览，且至少省下 256 token 才动手。\n\n## MCP 接入\n\n- 外部 MCP 客户端要配：名称、端点、传输方式、请求头、鉴权、允许的工具、是否打包、工具规格等。\n- 舰体内置 MCP 服务端点 `/wunder/mcp`（streamable-http），暴露 `wunder@excute` 与 `doc2md` 两个工具；对应能力关闭时返回 501。\n- 独立的 Python FastMCP 服务自带配置与工具集，不属于本引擎。\n\n## 协议随 provider 变\n\n工具调用协议按 provider 决定：\n\n| 情况 | 模式 |\n| --- | --- |\n| 模型显式配置了工具调用模式 | 按配置 |\n| provider 是 openai | 文本协议工具调用 |\n| 其余 provider | 原生函数调用 |\n| 无法识别的值 | 兜底到 tag / xml 文本协议 |\n\n文本协议的 lark 语法目前只为\"文本编辑\"的补丁形态准备；参数修复与嵌套还原在核心库完成。Win7 没有单独的工具协议分支；已证实的差异只在互通侧——老 Win7 节点不声明\"执行命令\"能力。\n\n## 已移除 / 已合并\n\n| 状态 | 项 |\n| --- | --- |\n| 已移除 | 用户世界工具、渠道工具、`a2a_*` 工具、`final_response`、`a2ui` 工具、LSP 查询 / 节点调用工具、独立的\"休眠等待\"工具 |\n| 已合并 | `apply_patch` 并入 **`文本编辑`**（同一工具三形态：替换 / 补丁 / 子命令） |\n| 语义变更 | `会话让出` 取代旧的\"休眠等待\" |\n| 临时下架 | `网页搜索`、`ptc`（保留代码，不可见） |\n\n## 容易搞错的地方\n\n- 四阶段模型不是执行主链，钩子默认关闭。\n- 结果被截了不等于模型看不到：展示通道与模型输入通道是分开的。\n- 工具多不等于聪明：名字多、描述含糊会提高选错率，默认集刻意收敛。\n- 工具报错不等于调用失败：业务失败会作为正常结果返回给模型，附原因和下一步提示。\n- 不是所有工具都能并行：只有并行白名单内的读类可以，写与执行独占。\n- Win7 没有工具协议回退这条分支。\n\n## 延伸阅读\n\n- [工具（核心概念）](/docs/zh-CN/concepts/core-tools/) —— 四层模型与默认集\n- [工具总览](/docs/zh-CN/tools/) —— 逐个工具的参数说明\n- [上下文压缩](/docs/zh-CN/concepts/core-context-compression/) —— 微压缩与历史压缩\n- [实时性](/docs/zh-CN/concepts/core-realtime/) —— 工具事件怎么推给客户端\n- [稳定性](/docs/zh-CN/concepts/core-stability/) —— 超时、预算与熔断\n- [配置参考](/docs/zh-CN/reference/config/) —— MCP 与工具开关配置项\n","source_path":"使用说明书/zh-CN/concepts/tools.md"}</script>
