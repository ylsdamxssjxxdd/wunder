  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/quota-and-token-usage","language":"zh-CN","title":"额度与 Token 用量","summary":"每次模型请求消耗 1 额度，每天发放 1000；Token 用量只用于观测，不参与扣减。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/quota-and-token-usage/","headings":[{"id":"section-1","level":1,"text":"额度与 Token 用量"},{"id":"section-2","level":2,"text":"查看和调整"},{"id":"section-3","level":2,"text":"Token 只用于观测"}],"prev_slug":"zh-CN/concepts/memory","next_slug":"zh-CN/concepts/goal-mode","markdown":"# 额度与 Token 用量\n\n额度用来限制模型请求次数。普通用户每天统一拿到 **1000 额度**，与单位、等级无关。\n\n- 没用完可以累计；当天首次使用或调整账户时入账一次，**不补发**之前没用到的天数。\n- 每次真正请求模型扣 **1 额度**，包括工具循环里的下一次模型调用、压缩摘要、失败重试。\n- 流式分片、单独执行工具、历史回放**不扣**额度。\n- 请求即使失败也消耗额度；额度不足时不会发出新的模型请求。\n- 管理员和未注册的虚拟用户不受额度限制。\n\n## 查看和调整\n\n用户侧在\"我的概况\"看当前额度和每日发放。管理员在\"用户管理 → 设置\"里可以直接设置额度余额，也可以发放 / 扣除：\n\n- 直接设置的数值，是当天发放结转之后的最终余额。\n- 发放增加\"累计获得\"，扣除计入\"累计使用\"；余额不足会拒绝操作。\n\n账户上有这几项数字：当前可用额度、累计发放、累计使用及管理员扣除、每日发放额度、最近发放日期。\n\n多个会话共享同一个用户额度账户，并发请求不能透支。用户等级继续积累经验，但不再奖励额度。首次升级时，旧的 Token 余额账户会初始化为 1000 额度，**不按历史 Token 数换算**；之后重启也不会重置余额。\n\n## Token 只用于观测\n\nToken 用量继续用来观察模型的输入、输出、思考以及上下文大小，**不参与额度扣减**。短请求和长请求都扣 1 额度。\n\n能看到的 Token 指标包括：\n\n- 上下文占用：最近一次实际观测到的上下文大小。\n- 一次用户请求内的累计模型 Token 消耗。\n- 模型用量事件，以及每次真实模型请求的次数、是否扣款、当轮累计额度消耗和账户快照。\n\n会话里的\"模型请求次数\"和\"额度消耗\"是两个不同指标：普通用户一次可计费的模型请求通常各加 1；管理员等免额度场景仍会增加模型请求次数，但额度消耗为 0。账户快照只表示当时的余额，不代表本次扣了多少。旧的额度记录只用于读历史。\n\n[多用户管理](/docs/zh-CN/concepts/core-multi-user-management/) · [舰桥面板指南](/docs/zh-CN/reference/admin-panels/)\n","source_path":"使用说明书/zh-CN/concepts/quota-and-token-usage.md"}</script>
