  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/quota-and-token-usage","language":"zh-CN","title":"额度与 Token 用量","summary":"每次模型请求消耗 1 额度，每日发放 1000；Token 用量用于运行观测。","updated_at":"2026-09-23","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/quota-and-token-usage/","headings":[{"id":"section-1","level":1,"text":"额度与 Token 用量"},{"id":"section-2","level":2,"text":"查看和调整"},{"id":"section-3","level":2,"text":"Token 统计"}],"prev_slug":"zh-CN/concepts/memory","next_slug":"zh-CN/concepts/goal-mode","markdown":"# 额度与 Token 用量\n\n额度用于限制模型请求次数。普通用户每天统一获得 **1000 额度**，与单位、等级无关。未用完可累计；当天首次使用或调整账户时入账一次，不补发未使用日期。\n\n每次实际请求模型扣 **1 额度**，包括工具循环中的下一次模型调用、压缩摘要和失败重试。流式分片、单独执行工具及历史回放不扣额度。发出的请求即使失败也消耗额度；不足时不会发送新模型请求。管理员和未注册的虚拟用户沿用免额度限制。\n\n## 查看和调整\n\n用户侧“我的概况”显示当前额度和每日发放。管理员在“用户管理 → 设置”中可直接设置额度余额，或发放 / 扣除额度。直接设置的数值是当天发放结转后的最终余额；发放增加累计获得，扣除计入累计使用，余额不足会拒绝操作。\n\n| 字段 | 含义 |\n| --- | --- |\n| `quota_balance` | 当前可用额度 |\n| `quota_granted_total` | 累计发放 |\n| `quota_used_total` | 累计使用及管理员扣除 |\n| `daily_quota_grant` | 每日发放额度 |\n| `last_quota_grant_date` | 最近发放日期 |\n\n多个线程共享同一个用户额度账户，并发请求不能透支。用户等级继续积累经验，但不再奖励额度。首次升级时旧 Token 余额账户初始化为 1000 额度，不按历史 Token 数换算；之后重启不重置余额。\n\n## Token 统计\n\nToken 用量继续用于观察模型输入、输出、思考以及上下文大小，**不参与额度扣减**。短请求和长请求均扣 1 额度。\n\n- `context_occupancy_tokens`：最近一次实际观测的上下文占用。\n- `request_consumed_tokens` / `round_usage.total_tokens`：一次用户请求内的累计模型 Token 消耗。\n- `token_usage` / `model_usage`：模型用量事件。\n- `quota_usage`：额度账户快照事件。\n\n[多用户管理](/docs/zh-CN/concepts/core-multi-user-management/) · [管理端面板指南](/docs/zh-CN/reference/admin-panels/)\n","source_path":"使用说明书/zh-CN/concepts/quota-and-token-usage.md"}</script>
