  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-compatibility","language":"zh-CN","title":"兼容性","summary":"蛹与舵机在 Windows 7 32 位与 Ubuntu 18.04 上的离线构建链、软件渲染与终端适配。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"核心能力","group_path":["核心能力"],"url":"/docs/zh-CN/concepts/core-compatibility/","headings":[{"id":"section-1","level":1,"text":"兼容性"},{"id":"section-2","level":2,"text":"系统支持"},{"id":"section-3","level":2,"text":"运行环境约束"},{"id":"section-4","level":2,"text":"限制"}],"prev_slug":"zh-CN/concepts/core-goal","next_slug":"zh-CN/concepts/core-context-compression","markdown":"# 兼容性\n\n## 系统支持\n\n| 系统 | 做法 |\n| --- | --- |\n| Windows 7 32 位 | 专用 `i686-win7-windows-gnu` Tier 3 目标 + build-std 离线工具链 |\n| Ubuntu 18.04 x64 / arm64 | 离线构建链与 sysroot |\n\n## 运行环境约束\n\n- **界面不依赖 GPU**：Slint 走软件渲染。\n- **构建不依赖联网**：Windows 7 32 位与 Ubuntu 18.04 两条链都是离线工具链，Ubuntu 侧另配 sysroot。\n- **命令会话适配旧终端**：命令会话用 winpty 承载，输出按 GBK 解码。\n- **启动检查**：启动时做恢复扫描与自检。\n\n两条链离线可用，界面不依赖 GPU，命令会话适配旧终端——Windows 7 32 位与 Ubuntu 18.04（x64 / arm64）上可以直接安装运行蛹与舵机。\n\n## 限制\n\n- 构建脚本仍残留 Tauri 死链——指向已不存在的目录，属工程缺口，不代表能力。\n- win7 互通节点不声明 `tool.exec`，旧设备的能力面因此收窄。\n","source_path":"使用说明书/zh-CN/concepts/core-compatibility.md"}</script>
