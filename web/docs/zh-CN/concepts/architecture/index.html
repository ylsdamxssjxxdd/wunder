  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/architecture","language":"zh-CN","title":"系统架构","summary":"wunder 的整体结构：用户在蜂巢里工作，蜂巢背后是同一套引擎与数据地基。","updated_at":"2026-10-09","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/architecture/","headings":[{"id":"section-1","level":1,"text":"系统架构"},{"id":"section-2","level":2,"text":"三层架构"},{"id":"section-3","level":3,"text":"第一层：界面层"},{"id":"section-4","level":3,"text":"第二层：调度与能力层"},{"id":"section-5","level":3,"text":"第三层：数据与存储层"},{"id":"section-6","level":2,"text":"部署形态"},{"id":"section-7","level":3,"text":"蜂窝（wunder-desktop）"},{"id":"section-8","level":3,"text":"舰体（wunder-server）"},{"id":"section-9","level":3,"text":"舵机（wunder-cli）"},{"id":"section-10","level":2,"text":"关键设计原则"},{"id":"section-11","level":3,"text":"统一引擎"},{"id":"section-12","level":3,"text":"线程为重"},{"id":"section-13","level":3,"text":"安全边界"},{"id":"section-14","level":2,"text":"层级关系图"},{"id":"section-15","level":2,"text":"常见架构问题"},{"id":"section-16","level":3,"text":"为什么蜂窝和蜂巢看起来一样？"},{"id":"section-17","level":3,"text":"舰桥为什么是独立的？"},{"id":"section-18","level":3,"text":"舰体形态和蜂窝形态可以共存吗？"},{"id":"section-19","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/reference/admin-panels","next_slug":"zh-CN/concepts/workspaces","markdown":"# 系统架构\n\n理解 wunder 的架构，不需要记很多术语。核心思路很简单：**用户在蜂巢里工作，蜂巢背后是同一套引擎与数据地基**。\n\n## 三层架构\n\nwunder 从上到下可以理解为三层：\n\n```\n┌───────────────────────────────────────┐\n│            用户看到的界面             │\n│    工作台（蜂窝 / 蜂巢） / 舰桥 / 渠道│\n├───────────────────────────────────────┤\n│            系统的大脑                 │\n│   调度 · 对话 · 工具 · 记忆 · 子智能体│\n├───────────────────────────────────────┤\n│            数据的地基                 │\n│    数据库 · 文件存储 · 向量知识库     │\n└───────────────────────────────────────┘\n```\n\n### 第一层：界面层\n\n用户直接接触的部分。所有用户在**蜂巢**里工作：\n\n- **蜂巢**：云端 AI 工作台（web，随舰体提供），覆盖对话、文件、智能体、工具与设置\n  - **蜂窝**：个人本地使用，功能最完整，可访问本机文件与桌面\n  - **蜂巢（web）**：云端 AI 工作台，浏览器访问，适合团队共用、由舰体（server）统一管理\n- **舰桥**：管理员配置系统、管理用户的后台，独立于蜂巢\n- **外部渠道**：通过飞书、企业微信等第三方平台接入，共享同一套核心能力\n\n蜂窝和蜂巢共用同一套工作台界面，能力一致；区别只在于运行位置，以及蜂窝额外的本地能力。\n\n### 第二层：调度与能力层\n\n这是系统的大脑，负责：\n\n- **调度执行**：接收请求，安排智能体执行任务\n- **对话管理**：维护会话历史，管理线程状态\n- **工具调用**：让智能体能读写文件、搜索网页、执行命令等\n- **子智能体**：需要并行推进时，由主智能体临时派生工作单元\n- **记忆管理**：长期资料的存储和检索\n\n### 第三层：数据与存储层\n\n这是数据的地基，所有数据都在这一层落盘：\n\n- **数据库**：存储用户、会话、配置等核心业务数据\n- **文件存储**：存放用户文件和智能体产物（工作区）\n- **向量知识库**：用于知识库检索功能\n\n## 部署形态\n\n四个形态背后是同一套引擎，差异只在运行位置和治理范围：\n\n### 蜂窝（`wunder-desktop`）\n\n**本地 AI 工作台**，面向个人用户，也是默认形态。本地安装，开箱即用；数据存在本地，可以访问本机文件和桌面，不需要搭建服务器。\n\n### 舰体（`wunder-server`）\n\n**用户与智能体管理平台**，面向团队和组织。支持多用户同时使用，集中管理用户、权限和资源，可接入外部渠道，适合生产环境部署。部署后提供蜂巢（web，云端 AI 工作台），成员用浏览器访问。\n\n### 舵机（`wunder-cli`）\n\n**手工本地操作入口**，面向开发者和自动化场景。在终端中使用，适合手工操作、脚本化操作和开发调试。\n\n## 关键设计原则\n\n### 统一引擎\n\n不管用户用哪种形态，背后的调度逻辑、工具体系、事件系统都是同一套。这意味着：\n- 在蜂窝里能做的事，在蜂巢同样能做\n- 从飞书发消息给智能体，和直接在蜂巢对话，体验一致\n- 管理员修改的设置，对所有入口统一生效\n\n### 线程为重\n\nwunder 以持续运行的线程为中心，而非\"一问一答\"的模式。每条线程维护着自己的对话历史、执行状态和上下文。这让智能体可以：\n- 处理需要多步骤完成的复杂任务\n- 在对话中途使用工具、等待审批后继续\n- 保持长时间的上下文连续性\n\n### 安全边界\n\n从架构层面就内置了安全考虑：\n- 不同用户的数据严格隔离\n- 工具执行受权限控制\n- 敏感操作需要审批\n- 资源使用有配额限制\n\n## 层级关系图\n\nwunder 的组织层级从上到下是：\n\n```\n心舰（系统）\n  └── 用户\n        └── 智能体\n              └── 线程（对话）\n                    └── 轮次（每一步交互）\n```\n\n每一层都有明确的职责边界：\n- **系统**管理全局配置和资源\n- **用户**拥有独立的文件空间和设置\n- **智能体**有独立的角色配置和工具集\n- **线程**承载一次完整的对话或任务\n- **轮次**记录每一次交互\n\n## 常见架构问题\n\n### 为什么蜂窝和蜂巢看起来一样？\n\n因为它们复用了同一套前端界面代码。区别在于蜂窝额外提供了本地文件访问、本地运行时等本地能力。\n\n### 舰桥为什么是独立的？\n\n舰桥面向的是系统管理员，负责的是全局配置、用户管理、渠道管理等治理工作。它和普通用户的使用场景完全不同，所以独立设计。\n\n### 舰体形态和蜂窝形态可以共存吗？\n\n可以。用户可以在本地用蜂窝做个人工作，同时组织里的舰体为团队提供服务。两者互不干扰。\n\n## 延伸阅读\n\n- [核心概览](/docs/zh-CN/concepts/) —— 11 个核心设计原则\n- [部署指南](/docs/zh-CN/ops/deployment/) —— 如何选择和部署运行形态\n- [功能速查](/docs/zh-CN/reference/api-index/) —— 系统功能一览\n","source_path":"使用说明书/zh-CN/concepts/architecture.md"}</script>
