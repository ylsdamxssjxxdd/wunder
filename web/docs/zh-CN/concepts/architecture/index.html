  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/architecture","language":"zh-CN","title":"系统架构","summary":"四个形态共用一份核心与引擎，消息在会话内的固定链路、存储选型、有界视图、对外接口与运行默认值。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/architecture/","headings":[{"id":"section-1","level":1,"text":"系统架构"},{"id":"section-2","level":2,"text":"形态与交付"},{"id":"section-3","level":2,"text":"消息链路"},{"id":"section-4","level":2,"text":"数据与存储"},{"id":"section-5","level":2,"text":"有界视图"},{"id":"section-6","level":2,"text":"对外接口"},{"id":"section-7","level":2,"text":"运行默认值"},{"id":"section-8","level":2,"text":"限制"}],"prev_slug":"zh-CN/capabilities/interlink","next_slug":"zh-CN/concepts/core-agent-loop","markdown":"# 系统架构\n\n蛹、蜂巢、舵机、舰体四个形态共用同一份核心与引擎，差别只在接入层。执行发生在会话内部，界面读到的是分页且带字节预算的展示视图。\n\n## 形态与交付\n\n| 形态 | 怎么交付 | 界面 |\n| --- | --- | --- |\n| 蛹 | 桌面应用，引擎随应用装进本地进程，默认同进程直接调用、不起本机 HTTP | 原生界面，编译进应用 |\n| 蜂巢 | 一套网页应用，构建产物由独立 web 服务只读下发，**不由舰体自己托管** | 单页应用 |\n| 舵机 | 命令行程序；终端条件不满足时退化为一次性执行，不进全屏交互界面 | 终端界面 |\n| 舰体 | 服务端进程，挂载舰桥与少量静态目录 | 舰桥（无构建步骤） |\n\n## 消息链路\n\n从发消息到最终回复落库，顺序固定：\n\n| 步骤 | 做什么 |\n| --- | --- |\n| 接入 | 聊天主通道接住这次请求，可提交、续传、旁观、取消、审批 |\n| 受理 | 会话运行时决定立即执行还是排队——这是\"分配还是排队\"的唯一判断点 |\n| 记下用户轮次 | 幂等地分配一个用户轮次；这是会话记录的**唯一写入口** |\n| 准备请求 | 组装上下文、可见工具、系统提示词，并判定是否冻结 |\n| 主循环 | 每调用一次模型，模型轮次自增一次 |\n| 执行工具 | 先过策略与审批、钩子、超时、预算，再分发到具体工具 |\n| 最终回复 | 同一模型轮次的多次刷新更新的是同一个可见输出项，不会追加重复气泡 |\n| 实时推送 | 发事件时**同步写入持久层**，写完才通知订阅者 |\n\n三个容易定位错的地方：\n\n- 界面用来查询\"这条会话现在什么状态\"的状态登记，和真正跑执行的会话运行时，是两回事。\n- 进程内的唤醒信号只负责加速；多实例之间靠轮询收敛，不靠它保证正确。\n- 工具\"前置 → 执行 → 后置 → 结果\"的四阶段只是描述模型，钩子默认关闭，不是执行主链。\n\n## 数据与存储\n\n- 存储按用途拆分：线程日志、会话、工作区、记忆片段等各成一组，引擎只依赖这套接口，不关心底层用哪种数据库。\n- 选型：不配置就是 SQLite；配置成 PostgreSQL 则走 PostgreSQL。\n- **没有版本表，也没有迁移脚本目录**。建表是幂等的 `CREATE TABLE IF NOT EXISTS`，加列靠启动时的列探测，所以不存在\"按版本号迁移\"这回事。\n- 各类记录（会话、轮次尾巴、工作区、媒体附件、记忆片段、知识向量、用户与配额、渠道绑定、互通影子）集中定义。\n\n## 有界视图\n\n界面看到的是**有界展示视图**，不是能一直翻到底的完整历史，也不是执行的完整快照。\n\n| 视图 | 每页 | 上限 | 响应预算 |\n| --- | --- | --- | --- |\n| 聊天页（每用户轮次一行） | 12 | 20 | 128 KB |\n| 线程轨迹页（逐条目） | 80 | 100 | 192 KB |\n| 正文分块 | 8 KB/块 | — | 按需取块 |\n\n配套机制：写入时顺手生成投影表并截断预览；投影没就绪时退回源表的有界窗口；后台重建占空比不超过 1%；变更推送每次取 200 条。负责\"统计历史占用、给上下文压缩算预算\"的那套东西不管翻页。\n\n## 对外接口\n\n| 面 | 事实 |\n| --- | --- |\n| HTTP | 路由前缀统一 `/wunder/*`，错误返回格式只有一种来源 |\n| WebSocket | 六个通道：聊天、core 请求面、网关、互通隧道、互通远端旁观、世界 / LAN |\n| 网关 | **不是 HTTP 网关**，而是接入注册表 + 定向 RPC + 在线状态广播；唯一传输层是 `/wunder/gateway/ws` |\n| 渠道 | 适配器注册制；入站有界队列，出站持久发件箱 + 退避重发 |\n| 互通 | 本地节点只出不入；一条隧道承载三个平面；能力分 L0–L3，默认设备能力集不含 L3 |\n| MCP | 舰体内置服务端点 `/wunder/mcp`（streamable-http）；外部 MCP 客户端在配置里登记 |\n\n## 运行默认值\n\n| 项 | 默认 |\n| --- | --- |\n| 舰体监听 | `0.0.0.0:8000`，可用环境变量或配置覆盖 |\n| 活跃会话上限 | 300（管理员不受限） |\n| 会话锁 | 超时 120 秒，心跳 5 秒 |\n| 模型 / 工具超时 | 各 120 秒 |\n| 模型轮次上限 | 非管理员 1000 |\n\n## 限制\n\n- **\"蜂巢页面是舰体托管的\"** —— 不是。舰体只挂舰桥和少量静态目录，蜂巢的构建产物由独立 web 服务下发。\n- **\"前端要多拉几次才能拿全历史\"** —— 前端本来就不该拿全历史；它消费分页视图，正文按需取块。\n- **\"蛹是通过本机 HTTP 调自己的后端\"** —— 默认是同进程原生调用；独立兼容桥只留给既有客户端。\n- **\"蜂群编排还在架构里\"** —— 引擎与调度面已无此模块，只剩空目录，会话写权限恒为可写。\n","source_path":"使用说明书/zh-CN/concepts/architecture.md"}</script>
