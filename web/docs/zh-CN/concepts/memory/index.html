  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/memory","language":"zh-CN","title":"长期记忆","summary":"结构化记忆碎片的注入与冻结规则、可容纳的内容、初始化注入与运行期检索的区别，以及它与知识库的差异。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/memory/","headings":[{"id":"section-1","level":1,"text":"长期记忆"},{"id":"section-2","level":2,"text":"核心规则"},{"id":"section-3","level":2,"text":"结构"},{"id":"section-4","level":2,"text":"记忆内容"},{"id":"section-5","level":2,"text":"初始化注入 vs 运行期检索"},{"id":"section-6","level":2,"text":"管理记忆"},{"id":"section-7","level":2,"text":"记忆和知识库不是一回事"},{"id":"section-8","level":2,"text":"限制"}],"prev_slug":"zh-CN/concepts/prompt-and-skills","next_slug":"zh-CN/concepts/quota-and-token-usage","markdown":"# 长期记忆\n\n记忆按**稳定优先于灵活**设计：创建会话时注入一次，运行中保持冻结，需要时通过 recall 补充资料。\n\n## 核心规则\n\n1. **创建会话时注入一次**：长期记忆在对话开始时一次性写进系统提示词。\n2. **运行中保持冻结**：后续对话不改系统提示词。\n3. **需要时补充检索**：运行中通过 recall 补资料，但不改写底座。\n\n不每轮更新的原因是：每轮重写系统提示词会让智能体行为不稳定（越聊越漂移）、缓存命中率下降（变慢）、问题难追（说不清它当时是基于什么背景）。\n\n## 结构\n\n记忆是**结构化碎片**，不是一大段自由文本：命中更快、替换只改一条、过期信息可标记失效、片段之间的版本关系可追溯。\n\n## 记忆内容\n\n- **你是谁**：偏好和习惯、工作背景、历史决策。\n- **组织知识**：团队制度和规范、项目背景、领域专业知识。\n- **个性化**：按你的偏好调整回答风格，参考你的历史上下文。\n\n## 初始化注入 vs 运行期检索\n\n| | 初始化注入 | 运行期检索（recall） |\n| --- | --- | --- |\n| 时机 | 创建会话时 | 对话进行中 |\n| 方式 | 写进系统提示词 | 作为工具结果补充 |\n| 影响 | 成为会话的认知底座 | 不改写底座 |\n| 生效范围 | 整个会话生命周期 | 当前轮次 |\n\n## 管理记忆\n\n- **查看**：在智能体设置里看当前记忆。\n- **添加**：对智能体说「记住这个偏好」，或在设置里手动加。\n- **删除**：删掉过时或不需要的碎片。\n- **更新**：加一条新碎片替换旧的。\n\n生效时机：**新对话**立刻用最新记忆，**已有对话**不受影响、仍用创建时的记忆。更新完记忆要开新对话才生效。\n\n## 记忆和知识库不是一回事\n\n| | 记忆 | 知识库 |\n| --- | --- | --- |\n| 内容 | 结构化的个人 / 组织事实 | 文档、资料、制度 |\n| 用的时候 | 初始化时注入 | 运行中检索 |\n| 更新频率 | 相对稳定 | 可以频繁更新 |\n| 适合放 | 偏好、背景、决策记录 | 参考资料、技术文档 |\n\n## 限制\n\n- 记忆不会每轮更新，只在初始化时注入一次。\n- recall 的结果不会写回系统提示词，它只是临时补充。\n- 记忆不是越多越好：太多会挤占上下文，可能干扰判断。\n","source_path":"使用说明书/zh-CN/concepts/memory.md"}</script>
