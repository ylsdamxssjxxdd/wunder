  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/goal-mode","language":"zh-CN","title":"目标态","summary":"目标态是按模型轮次预算驱动的会话级持久目标：设定一次，智能体就自动接着做，直到完成、受阻或预算用尽。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/goal-mode/","headings":[{"id":"section-1","level":1,"text":"目标态"},{"id":"section-2","level":2,"text":"它是什么"},{"id":"section-3","level":2,"text":"什么时候用"},{"id":"section-4","level":2,"text":"四种相位"},{"id":"section-5","level":2,"text":"两条容易误解的边界"},{"id":"section-6","level":2,"text":"激活状态不落库"},{"id":"section-7","level":2,"text":"模型怎么操作目标"},{"id":"section-8","level":2,"text":"在哪里用"},{"id":"section-9","level":2,"text":"几个常被误读的点"},{"id":"section-10","level":2,"text":"相关页"}],"prev_slug":"zh-CN/concepts/quota-and-token-usage","next_slug":"zh-CN/concepts/companion","markdown":"# 目标态\n\n## 它是什么\n\n目标态把一个**目标**挂在**会话**上，再配一个只在本进程内生效的驱动器。会话一空闲，驱动器就自动提交下一轮延续（goal round），每轮消耗 1 次模型轮次预算；接着做还是停下来，由预算、相位和「是否受阻」决定。\n\n目标里有这些信息：\n\n| 信息 | 含义 |\n| --- | --- |\n| 目标描述 | 要做什么，上限 4000 字符 |\n| 相位 | 活跃 / 挂起 / 受阻 / 已完成，四选一 |\n| 延续轮次预算 | 自动延续最多跑多少轮，创建时缺省 256 |\n| 已启动轮次 | 只增不减 |\n| 版本号 | 每次变更递增；更新必须带上目标标识和它当前的确切版本号，对不上会被拒绝 |\n| 受阻原因 | 受阻时给出机器码和一段人话说明 |\n\n## 什么时候用\n\n| 场景 | 建议 |\n| --- | --- |\n| 长任务、有明确完成条件、需要模型自主多轮推进 | 用目标态 |\n| 一轮问答就能解决 | 直接发消息 |\n| 需要你频繁介入决策 | 直接对话，必要时配问询面板 |\n| 只想让当前这一轮做深一点 | 普通轮次就够，模型轮次本身没有「一步一答」的硬限制 |\n\n## 四种相位\n\n| 相位 | 含义 | 怎么进入 | 怎么离开 |\n| --- | --- | --- | --- |\n| 活跃 | 可继续 | 创建目标，或恢复 | 挂起 / 受阻 / 完成 |\n| 挂起 | 停着，人可随时恢复 | 主动暂停，或延续轮次被中断后自动落到这里 | 恢复 |\n| 受阻 | 停止自动延续 | 同一个阻塞条件连续至少 3 轮后由模型报告；或驱动器入队失败 | 恢复（需先解决阻塞条件） |\n| 已完成 | 达成 | 模型或人标为完成，且只在真正达成时 | 用新目标重新开启 |\n\n是否发起下一轮只看一条门：**相位是活跃、进程内处于激活状态、且已启动轮次没到预算**——三条同时满足才继续。人的消息始终优先，延续轮次不跟人抢会话。\n\n## 两条容易误解的边界\n\n- 预算单位是**模型轮次**，不是 Token。系统不统计目标烧了多少 Token，也没有「预算耗尽进入某种受限状态」这种设计。\n- 轮次之间**没有冷却**。会话一空闲，驱动器立刻评估要不要发下一轮。\n- **「受阻」不等于「任务难」**：困难、不确定、还有活没干完都不算受阻理由，必须报出一个跨轮持续存在的具体阻塞条件。\n\n## 激活状态不落库\n\n「是否处于激活」是进程内的标志，**不落库**。进程重启、会话恢复或分叉之后，即使相位仍是「活跃」，驱动器也不会自动接着跑——需要一次显式的恢复动作重新激活。判断「目标为什么不动了」，看它是不是没被激活。\n\n## 模型怎么操作目标\n\n模型侧通过三个内置动作操作目标：\n\n| 动作 | 作用 |\n| --- | --- |\n| 读取目标 | 读出当前目标及其版本号；更新前必须先取权威值 |\n| 创建目标 | 从人的直接请求里推断并创建，目标描述必填，预算可选 |\n| 更新目标 | 编辑 / 暂停 / 恢复 / 完成 / 报告受阻；需要目标标识加当前版本号，且受阻在没满最低轮次数前会被拒绝 |\n\n权限看这一轮是不是人直接发起的：编辑 / 暂停 / 恢复只允许在人的轮次里做；完成和报告受阻额外允许在**本目标的自动延续轮次**里做。\n\n蛹桌面端**不把这套动作开放给用户选择**（它们属于桌面隐藏的内置能力），始终由运行时注入；蜂巢与舵机同样复用这套注入。\n\n## 在哪里用\n\n| 入口 | 位置 |\n| --- | --- |\n| 接口 | `/wunder/chat/sessions/{id}/goal`（用户面，需归属校验） |\n| 斜杠命令 | `/goal [<目标>|clear|edit <目标>|pause|resume]` |\n| 蜂巢 | 消息区的目标条 |\n| 蛹 | 输入框上方的目标横幅，支持行内编辑 |\n| 舵机 | `/goal` 命令 |\n| 舰桥 | **没有目标界面**（治理面不提供目标操作） |\n\n## 几个常被误读的点\n\n- 目标不会按 Token 限额停下来，只看轮次预算、相位、激活三件事。\n- 重启服务后活跃目标不会自动继续，需要一次恢复动作重新激活。\n- 模型不能随意把目标标成受阻：同一阻塞条件至少要跨 3 个延续轮次。\n- 目标不是「一个叫 goal 的工具」，而是读取 / 创建 / 更新三个动作；旧的单一工具和旧的注入标记都已不存在。\n- 舰桥没有目标面板，在蜂巢 / 蛹 / 舵机里操作。\n- 清除目标不会撤销已经做出的工作：已落库的消息、工具结果和文件改动都保留。\n\n## 相关页\n\n- [模型轮次与会话轮次](/docs/zh-CN/concepts/sessions-and-rounds/) — 预算消耗的最小单位\n- [智能体循环](/docs/zh-CN/concepts/core-agent-loop/) — 延续轮次如何进入执行主循环\n- [形象系统](/docs/zh-CN/concepts/companion/) — 运行状态在形象上的呈现\n","source_path":"使用说明书/zh-CN/concepts/goal-mode.md"}</script>
