  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-tools","language":"zh-CN","title":"工具","summary":"智能体做事的能力来自四层结构——执行体工具、可调用知识与脚本的技能、管理员选择的能力、用户自己接入的工具；四层不是一回事，「能选」不等于「能调」。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/core-tools/","headings":[{"id":"section-1","level":2,"text":"四层模型"},{"id":"section-2","level":2,"text":"名字：规范名 + 别名"},{"id":"section-3","level":2,"text":"动态注册：模型能看到的工具不止内置清单"},{"id":"section-4","level":2,"text":"默认集与形态差异"},{"id":"section-5","level":2,"text":"结果的裁剪有两条通道"},{"id":"section-6","level":2,"text":"审批分档"},{"id":"section-7","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/concepts/core-agent-loop","next_slug":"zh-CN/concepts/tools","markdown":"做事的能力统称「工具」，但**工具、技能、能力、用户工具是四层不同的东西**，混用是配置出问题最常见的原因。\n\n## 四层模型\n\n| 层 | 是什么 | 谁在用 | 怎么判定 |\n| --- | --- | --- | --- |\n| **工具** | 执行体：一次调用会读文件、跑命令、发请求 | 模型直接调用，引擎分发执行 | 在工具目录里登记并有分发分支 |\n| **技能** | 知识与脚本包：一个目录，含 `SKILL.md` 正文与入口脚本 | 模型可按技能名直接调用，也可用 `技能调用` 读取正文 | 登记在技能目录 |\n| **能力** | 治理面的选择单元：管理员给智能体挑「能用哪些」的统一描述符 | 管理侧配置，不进执行链 | 来源分内置、MCP、技能、知识库、用户 MCP、用户技能、用户知识库、共享 |\n| **用户工具** | 用户自己接入的扩展，分 MCP、技能、知识库三种 | 按用户挂载，别名进路由表 | 登记在用户工具目录 |\n\n能力被选中不等于执行体存在；执行体存在不等于模型能看见。\n\n## 名字：规范名 + 别名\n\n模型看到的工具名大多是**中文规范名**，另有英文别名，调用前会做一次归一。\n\n| 规范名 | 常见别名 | 规范名 | 常见别名 |\n| --- | --- | --- | --- |\n| `执行命令` | `execute_command` | `读取文件` | `read_file` |\n| `命令会话` | `command_session`、`write_command_stdin` | `写入文件` | `write_file` |\n| `ptc` | `programmatic_tool_call` | `文本编辑` | `edit`、`patch`、`apply_patch`、`应用补丁` |\n| `列出文件` | `list_files` | `搜索内容` | `search_content` |\n| `glob` | — | `技能调用` | `skill_call`、`skill_get` |\n| `计划面板` | `update_plan` | `问询面板` | `question_panel`、`ask_panel` |\n| `定时任务` | `schedule_task` | `记忆管理` | `memory_manager`、`memory_manage` |\n| `子智能体控制` | `subagent_control` | `网页抓取` | `web_fetch` |\n\n在配置、日志、文档里写工具时，按「规范名 + 别名」两栏写，只写一个容易对不上。\n\n## 动态注册：模型能看到的工具不止内置清单\n\n进入模型工具列表的名字由四类动态注册构成：\n\n| 来源 | 模型侧名字 | 说明 |\n| --- | --- | --- |\n| MCP 服务器 | `server@tool` | 逐工具注册；重名时展示名追加服务端名或哈希后缀 |\n| 打包 MCP | `server@__mcp_pack__` | 标记为打包的服务器折叠成单个工具，动作为列出/获取/调用 |\n| 技能 | 技能名本身 | 技能名可直接被调用；`技能调用` 负责读取正文并替换技能根路径占位符 |\n| 知识库 | 知识库名 | 按库逐个注册，取代旧的单一知识工具 |\n| 用户工具别名 | 别名 | 分发时最优先按别名路由，命中即走用户工具 |\n\n分发顺序是：别名 → 技能 → MCP → 知识库 → 内置工具，前面命中会短路后面的。\n\n## 默认集与形态差异\n\n默认工具集、桌面隐藏集与桌面额外集都有统一登记，不要在文档或配置里另记一份。\n\n| 集合 | 内容 |\n| --- | --- |\n| 默认内置（13 个） | `定时任务`、`记忆管理`、`执行命令`、`命令会话`、`ptc`、`列出文件`、`glob`、`搜索内容`、`读取文件`、`网页抓取`、`技能调用`、`写入文件`、`文本编辑` |\n| 默认技能 | `技能创建器` |\n| 桌面隐藏（不可选也不默认启用） | `get_goal`、`create_goal`、`update_goal`（由运行时按会话自动注入）、`会话线程控制`、`会话让出` |\n| 桌面额外默认 | `读图工具`、`桌面监视器`、`桌面控制器`、`子智能体控制` |\n\n`网页搜索` 与 `ptc` 是**临时下架，不是已删除**：代码保留、分发仍然认，只是在可用性判定处一律返回不可用，对模型与用户都不可见。恢复时删掉下架名单里的对应条目即可。\n\n可见性还有几道真实门槛：\n\n| 门槛 | 影响 |\n| --- | --- |\n| 模型没有视觉能力 | 过滤 `读图工具` 与桌面类工具 |\n| 对应模型或服务未配置 | 语音生成、声转文、图像生成、视频生成逐个不可用 |\n| 配置未启用 | `网页抓取`、`网页搜索`、17 个浏览器原生工具、桌面类工具 |\n| 形态 | 桌面模式过滤隐藏集 |\n\n浏览器不是单一工具：启用后会注册 17 个 `browser_*` 原生工具，聚合展示名「浏览器」只是文档口径。\n\n## 结果的裁剪有两条通道\n\n**展示裁剪与模型输入裁剪是两套东西，互不影响**。\n\n| 通道 | 口径 | 影响谁 |\n| --- | --- | --- |\n| 展示通道 | 预览最多 2400 字符 / 16 行，超出加省略号 | 只影响客户端展示；原始结果仍完整保留、可复制 |\n| 模型输入通道 | 按预算裁剪，并压缩可复现的旧观测 | 影响模型下一步看到什么 |\n\n界面上看到「…」不代表模型看到的也是被截断的那份；反过来，模型上下文被压缩成预览时，界面仍可能显示完整内容。判断上下文压力要看压缩页与用量页，不看界面折叠。\n\n## 审批分档\n\n审批按工具的风险类别归档，类别有四种：只读、写文件、跑命令或脚本、控制宿主能力。\n\n- 待批请求按来源分聊天连接与渠道两类登记。\n- 同一会话内「批准一次、短时免批」的缓存是 600 秒。\n- 执行策略有三态：放行、审计、强制；强制模式下高危动作必须有人类批准。\n- 前端确认不能替代后端鉴权。\n\n## 延伸阅读\n\n- [工具体系](/docs/zh-CN/concepts/tools/) —— 分发链路、裁剪常量与协议差异\n- [工具总览](/docs/zh-CN/tools/) —— 逐个工具的参数与用法\n- [上下文压缩](/docs/zh-CN/concepts/core-context-compression/) —— 模型输入通道怎么省 token\n- [提示词与技能](/docs/zh-CN/concepts/prompt-and-skills/) —— `SKILL.md` 与技能注入\n- [多用户与能力管理](/docs/zh-CN/concepts/core-multi-user-management/) —— 管理员怎么选能力\n- [配置参考](/docs/zh-CN/reference/config/) —— 工具与能力相关配置项\n","source_path":"使用说明书/zh-CN/concepts/core-tools.md"}</script>
