  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/prompt-and-skills","language":"zh-CN","title":"提示词与技能","summary":"系统提示词决定智能体的\"人格\"，技能是它在某类任务里的具体做法。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/prompt-and-skills/","headings":[{"id":"section-1","level":1,"text":"提示词与技能"},{"id":"section-2","level":2,"text":"系统提示词"},{"id":"section-3","level":2,"text":"技能"},{"id":"section-4","level":2,"text":"提示词模板包"},{"id":"section-5","level":2,"text":"一条容易踩的规则"},{"id":"section-6","level":2,"text":"提示词、技能、记忆各管一段"},{"id":"section-7","level":2,"text":"模板、技能与模型的组合"},{"id":"section-8","level":2,"text":"容易搞错的地方"},{"id":"section-9","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/concepts/tools","next_slug":"zh-CN/concepts/memory","markdown":"# 提示词与技能\n\n智能体的行为由两样东西决定：**系统提示词**（它是谁、怎么想、守什么原则）和**技能**（它在某类任务里的具体做法）。\n\n## 系统提示词\n\n系统提示词是智能体的工作手册，讲清：角色定位（你是谁）、工程原则（怎么想）、工具协议（怎么用工具）、技能协议（怎么调技能）、记忆上下文（记住什么）。\n\n**系统提示词在会话创建时确定，之后保持冻结**，所以同一会话里智能体行为一致。\n\n## 技能\n\n技能是面向智能体的操作手册，包含完整方法说明、执行脚本、示例和资源、约束和边界。智能体需要时会主动读取完整的技能文档。\n\n技能把某类任务的方法封装起来，不用每次从零摸索；同类任务走同一套方法，结果更一致。\n\n技能分三层：\n\n| 层级 | 说明 | 能否改 |\n| --- | --- | --- |\n| 内置 | 系统自带 | 只读 |\n| 自定义 | 用户或管理员创建 | 可编辑 |\n| 外部 | 从外部引入 | 看来源 |\n\n## 提示词模板包\n\nwunder 支持多套提示词模板包：中文模板包（默认中文风格）、英文模板包（默认英文风格）、自定义模板包（按需定制）。\n\n切换方式：在智能体设置里找到\"提示词模板\"，选一个，保存。\n\n**生效规则**：新对话用新模板，已有对话不变。改了模板后当前对话没变化，开新对话才用新模板。\n\n自定义模板：基于一个内置模板复制，改各分段内容（角色、原则、附加说明等），保存后即可使用。\n\n## 一条容易踩的规则\n\n技能文档里的资源路径用**占位符**写，而不是写死具体路径。因为技能在不同运行形态下的实际存放位置不同，系统会在使用时把它替换成正确路径。\n\n## 提示词、技能、记忆各管一段\n\n| | 职责 |\n| --- | --- |\n| 提示词 | 定义长期稳定的行为边界 |\n| 技能 | 定义某类任务的附加执行协议 |\n| 记忆 | 定义会话初始化时的长期事实 |\n\n三者配合，但职责不混用。\n\n## 模板、技能与模型的组合\n\n模板的取舍：角色明确、原则简洁（约束不宜过多）、前后不矛盾，按实际效果调整。\n\n技能管理在\"工具\"页：看已安装技能、按需启停、为特定工作场景创建专属技能、分享给团队。\n\n不同的提示词模板 + 技能 + 模型组合出不同风格的智能体：编程助手、文案写手、数据分析师、翻译专家……\n\n## 容易搞错的地方\n\n- 改模板不会立刻影响当前对话，只影响新对话。\n- 技能不只是说明文档，它是智能体能主动读取的运行资源。\n- 记忆不会每轮重写提示词，只在初始化注入一次。\n\n## 延伸阅读\n\n- [提示词与个性化](/docs/zh-CN/reference/prompt-templates/) —— 模板操作指南\n- [记忆（核心）](/docs/zh-CN/concepts/core-memory/) —— 记忆的设计原则\n- [工具体系](/docs/zh-CN/concepts/tools/) —— 工具和技能的关系\n","source_path":"使用说明书/zh-CN/concepts/prompt-and-skills.md"}</script>
