  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/presence-and-runtime","language":"zh-CN","title":"运行时与在线状态","summary":"会话的六种运行时状态、界面徽标与指示器、会话卡住时的判断依据，以及状态不一致的处理顺序。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/presence-and-runtime/","headings":[{"id":"section-1","level":1,"text":"运行时与在线状态"},{"id":"section-2","level":2,"text":"会话状态"},{"id":"section-3","level":2,"text":"界面呈现"},{"id":"section-4","level":2,"text":"排障判断"},{"id":"section-5","level":2,"text":"状态不一致的处理"},{"id":"section-6","level":2,"text":"限制"}],"prev_slug":"zh-CN/concepts/streaming","next_slug":"zh-CN/concepts/prompt-and-skills","markdown":"# 运行时与在线状态\n\n会话除历史记录外还维护一组运行时状态，取值包括正在执行、等待审批、等待用户输入、正在中断、空闲、未加载；界面再从中派生一组汇总快照。\n\n## 会话状态\n\n**一是会话此刻在做什么**：\n\n| 状态 | 含义 |\n| --- | --- |\n| 正在执行 | 正在跑 |\n| 等待审批 | 停在某个需要你点头的动作上 |\n| 等待用户输入 | 智能体在等你补充信息 |\n| 正在中断 | 正在被打断 |\n| 空闲 | 没事做，等你的下一条消息 |\n| 未加载 | 还没被加载进内存 |\n\n**二是给界面直接用的汇总快照**：是否正在持续输出、是否在等待、是否已加载、是否活跃、是否已经有终态。\n\n## 界面呈现\n\n- **会话列表**：状态徽标直接来自运行时状态——绿点=活跃会话，旋转图标=正在执行，等待图标=等待审批或输入。\n- **会话详情**：状态指示器显示当前在哪个阶段、能不能发新消息、有没有待处理的审批。\n\n## 排障判断\n\n运行时状态是排障的起点：\n\n| 想知道 | 看什么 |\n| --- | --- |\n| 是否还在执行 | 是否正在持续输出 |\n| 是否在等待 | 是否处于等待态 |\n| 是否已结束 | 是否已有终态 |\n| 还能不能继续观察 | 是否已加载、是否活跃 |\n\n笼统的\"运行中 / 没运行\"区分不出\"在持续输出\"和\"在等审批\"，也体现不出会话有没有加载、有没有终态。要看完整的一组快照字段。\n\n## 状态不一致的处理\n\n界面显示和实际对不上时：\n\n1. 等几秒，看是否自动恢复。\n2. 刷新页面或重启应用。\n3. 用\"重置工作状态\"。\n\n## 限制\n\n- 等待审批是**暂停**，不是结束——它仍在会话生命周期内。\n- 状态不只详情页要看，列表、事件页也要显示。\n- 事件流负责时间线，运行时快照负责\"此刻\"，两者不是同一层。\n","source_path":"使用说明书/zh-CN/concepts/presence-and-runtime.md"}</script>
