  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-goal","language":"zh-CN","title":"目标","summary":"目标核心让智能体进入目标态并持续完成一项任务：三个工具驱动、四种相位、默认 256 轮上限，连续 3 轮无进展自动受阻。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"核心","group":"9 个核心","group_path":["9 个核心"],"url":"/docs/zh-CN/concepts/core-goal/","headings":[{"id":"section-1","level":1,"text":"目标"},{"id":"section-2","level":2,"text":"怎么运作"},{"id":"section-3","level":2,"text":"关键数字"},{"id":"section-4","level":2,"text":"从哪里用"},{"id":"section-5","level":2,"text":"边界与当前限制"}],"prev_slug":"zh-CN/concepts/index","next_slug":"zh-CN/concepts/core-compatibility","markdown":"# 目标\n\n目标核心让智能体进入目标态并持续完成一项任务。把目标挂在会话上，智能体按目标自己接着做，直到完成、受阻或轮次预算用尽。\n\n## 怎么运作\n\n目标由三个工具驱动：\n\n| 工具 | 作用 |\n| --- | --- |\n| `get_goal` | 读出当前目标及其版本号 |\n| `create_goal` | 创建目标 |\n| `update_goal` | 编辑、暂停、恢复、完成、报告受阻 |\n\n目标的相位只有四种：`active`（活跃）、`paused`（挂起）、`blocked`（受阻）、`complete`（已完成）。\n\n更新走 CAS-on-revision：更新必须带上目标当前的版本号，对不上就被拒绝。已启动轮次只增不减。\n\n## 关键数字\n\n| 项 | 值 |\n| --- | --- |\n| 默认目标轮上限 | 256 |\n| 连续无进展自动受阻 | 3 轮 |\n| 相位取值 | active / paused / blocked / complete |\n\n## 从哪里用\n\n| 入口 | 位置 |\n| --- | --- |\n| 接口 | `/wunder/chat/sessions/{id}/goal` |\n| 斜杠命令 | `/goal` |\n\n## 边界与当前限制\n\n- 没有 token 预算，轮次之间也没有冷却。目标停下来只看轮次预算、相位与是否激活这三件事。\n- armed 状态**不持久**：进程重启或会话 resume 之后，即使相位仍是 `active`，也需要显式 `update_goal action=resume` 重新 arm。判断「目标为什么不动了」，先看它有没有被 arm。\n- 桌面端不开放目标选择，运行时按会话注入。\n- 舰桥没有 goal 界面，目标操作在蜂巢 / 蜂窝 / 舵机里做。\n","source_path":"使用说明书/zh-CN/concepts/core-goal.md"}</script>
