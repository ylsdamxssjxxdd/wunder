  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-goal","language":"zh-CN","title":"目标","summary":"目标态的驱动工具、四种相位、默认 256 轮上限与 CAS-on-revision 更新规则。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"核心能力","group_path":["核心能力"],"url":"/docs/zh-CN/concepts/core-goal/","headings":[{"id":"section-1","level":1,"text":"目标"},{"id":"section-2","level":2,"text":"驱动工具"},{"id":"section-3","level":2,"text":"相位"},{"id":"section-4","level":2,"text":"默认值"},{"id":"section-5","level":2,"text":"入口"},{"id":"section-6","level":2,"text":"限制"}],"prev_slug":"zh-CN/capabilities/api-index","next_slug":"zh-CN/concepts/core-compatibility","markdown":"# 目标\n\n目标挂在会话上之后，智能体按它持续工作，直到完成、受阻或用完轮次预算。\n\n## 驱动工具\n\n| 工具 | 作用 |\n| --- | --- |\n| `goal` | 通过 `action=get|create|edit|pause|resume|complete|blocked` 读取、创建、编辑、暂停、恢复、完成或报告受阻 |\n\n## 相位\n\n四种取值：`active`（活跃）、`paused`（挂起）、`blocked`（受阻）、`complete`（已完成）。\n\n更新走 CAS-on-revision：更新必须带上目标当前的版本号，对不上就被拒绝。已启动轮次只增不减。\n\n## 默认值\n\n| 项 | 值 |\n| --- | --- |\n| 目标轮上限 | 256 |\n| 连续无进展自动受阻 | 3 轮 |\n\n## 入口\n\n| 入口 | 位置 |\n| --- | --- |\n| 接口 | `/wunder/chat/sessions/{id}/goal` |\n| 斜杠命令 | `/goal` |\n\n## 限制\n\n- 目标没有 token 预算，轮次之间也没有冷却。是否停下只看轮次预算、相位与是否 armed。\n- armed 状态**不持久**：进程重启或会话 resume 之后，即使相位仍是 `active`，也需要显式 `goal action=resume` 重新 arm。目标不动了先查它有没有被 arm。\n- 桌面端不开放目标选择，运行时按会话注入。\n- 舰桥没有 goal 界面，目标操作在蜂巢、蛹、舵机里做。\n","source_path":"使用说明书/zh-CN/concepts/core-goal.md"}</script>
