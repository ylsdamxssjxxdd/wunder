  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-context-compression","language":"zh-CN","title":"上下文压缩","summary":"上下文窗口超限触发的四级压缩策略、保护范围与底线、压缩记录，以及先做本地精简的省流路径。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"核心能力","group_path":["核心能力"],"url":"/docs/zh-CN/concepts/core-context-compression/","headings":[{"id":"section-1","level":2,"text":"触发条件"},{"id":"section-2","level":2,"text":"分级"},{"id":"section-3","level":2,"text":"保护范围"},{"id":"section-4","level":2,"text":"压缩记录"},{"id":"section-5","level":2,"text":"本地精简"},{"id":"section-6","level":2,"text":"限制"}],"prev_slug":"zh-CN/concepts/core-compatibility","next_slug":"zh-CN/concepts/core-subagent","markdown":"单条对话能携带的历史长度由模型的上下文窗口决定。对话变长后，历史与工具结果的总和可能超出上限，压缩在不中断对话的前提下精简历史，让对话继续跑下去。\n\n压缩不是删除。删除是直接砍掉内容，不管重要不重要；压缩是重新组织内容，保留关键事实、精简冗余部分。\n\n## 触发条件\n\n这些情况容易触发压缩：长时间持续对话（几十轮以上）、工具返回了大量内容（读大文件、搜索结果很多）、复杂的多步骤任务。\n\n少触发压缩的做法：一个话题做完就开新线程，而不是一直续着老线程；提问尽量精简，避免大段重复粘贴；也可以用 `/compact` 命令主动触发，在合适的时机整理对话。\n\n## 分级\n\n渐进式策略从温和到激进，只在必要时升级：\n\n| 级别 | 策略 | 损失程度 |\n| --- | --- | --- |\n| 1 级 | 移除工具中间结果 | 很低，工具结果可以重新获取 |\n| 2 级 | 对历史消息做摘要 | 中等，保留语义、损失细节 |\n| 3 级 | 移除较早的对话轮次 | 较高，只保留最近的内容 |\n| 4 级 | 只保留核心设定和当前请求 | 很高，紧急降级 |\n\n## 保护范围\n\n没有压缩，长对话最终只有三种结局：直接报错、被粗暴截断、或要你手动控制对话长度。压缩做成系统能力后，对话长度不需要手动管理。\n\n压缩优先保护三件事：对话的连续性，不让对话因为太长而中断；真正需要的事实，优先保留当前任务用得上的信息；可追溯性，每次压缩都有记录，管理员能查看压缩了什么、保留了什么。\n\n有两条底线。一，压缩只能精简和重组已有内容，不会凭空编造。二，线程的核心设定（系统提示词）在创建时就冻结，压缩只作用于对话历史和工具结果，智能体不会因为压缩而\"忘记自己是谁\"。\n\n## 压缩记录\n\n每次压缩都会留下记录，包含用了什么策略、压缩前后的上下文大小、以及大致的信息损失评估。管理员据此判断压缩是否影响了任务质量。\n\n## 本地精简\n\n自动压缩触发时，系统从较早的文件读取、搜索和列表结果开始缩短。最近 5 组工具结果、失败信息、媒体和需要继续分页的结果会被保留。旧结果缩短后仍带定位信息、头尾预览和省略提示，必要时智能体可以重新读取。\n\n如果本地精简已经腾出足够空间，就不再额外调用模型生成摘要；不够时再走摘要流程。手动压缩和溢出修复则直接生成摘要。摘要默认最多输出 2048 token，如果模型本身配置了更小的输出上限，以更小的为准。\n\n管理员可以在进度记录里看到本地精简的估算节省量。这个估算只用于诊断，实际 token 消耗以模型供应商的报告为准。\n\n## 限制\n\n压缩之后系统会优先保留当前任务需要的信息。极端情况下（很长的对话叠加大量工具结果），智能体对早期细节可能记得不够准，开一个新的对话线程即可。\n","source_path":"使用说明书/zh-CN/concepts/core-context-compression.md"}</script>
