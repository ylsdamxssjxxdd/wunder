  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/sessions-and-rounds","language":"zh-CN","title":"会话与轮次","summary":"对话的编号方式：线程、用户轮次、模型轮次、时间线条目，以及权威的计数口径。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"参考","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/sessions-and-rounds/","headings":[{"id":"section-1","level":1,"text":"会话与轮次"},{"id":"section-2","level":2,"text":"层级"},{"id":"section-3","level":2,"text":"计数口径"},{"id":"section-4","level":2,"text":"幂等与排队"},{"id":"section-5","level":2,"text":"时间线里有哪些条目"},{"id":"section-6","level":2,"text":"界面读到的组织方式"},{"id":"section-7","level":2,"text":"怎么用"},{"id":"section-8","level":2,"text":"容易搞错的地方"},{"id":"section-9","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/concepts/workspaces","next_slug":"zh-CN/concepts/streaming","markdown":"# 会话与轮次\n\n这套编号**把\"用户问了几次\"和\"智能体走了几步\"分开**。统计、回放、排队、Token 归集都要用到这个坐标系。\n\n## 层级\n\n```\n智能体（agent）\n└── 任务线程（= 会话 session，一个智能体可同时有多条）\n     └── 用户轮次（每次受理递增）\n          └── 模型轮次（每次模型调用递增）\n               └── 条目（可见回复、工具调用、审批、子智能体消息…）\n```\n\n| 概念 | 是什么 | 由谁决定 |\n| --- | --- | --- |\n| **线程 / 会话** | 一段连续执行与对话的主体，同一个会话 id 贯穿调度、锁与状态 | 新建线程即新会话；子智能体是独立会话，靠父会话 id 回溯 |\n| **用户轮次** | 一次被受理的人类输入 | 受理时在会话里递增；唯一约束保证\"每轮一个根\" |\n| **模型轮次** | 引擎主循环的**一次模型调用**，可包含一批工具调用 | 主循环每采样一次自增一次 |\n| **条目** | 时间线上可渲染的最小记录 | 落库时按稳定的条目 id 覆盖更新 |\n\n这四层就是坐标：\n\n| 坐标 | 含义 |\n| --- | --- |\n| 用户轮次 | 属于哪一用户轮次 |\n| 模型轮次 | 属于该轮内的第几次模型调用（还没进采样时为空） |\n| 轮次 id | 该用户轮次的持久 id，条目标识的前缀 |\n| 是否目标轮次 | 本轮由目标驱动器发起而非人直接发消息，用于避免重复发起需要人类权限的目标操作 |\n\n## 计数口径\n\n- **一个模型轮次 = 一次模型调用**，不是\"一次动作\"。工具调用属于同一个模型轮次内的批次，**不单独计模型轮次**。\n- **一个模型轮次恰好一个可见输出项**：同一模型轮次多次刷新只会更新这一项，不会追加重复气泡。\n- **时间线里的工具批次条目 ≠ 独立模型轮次**。每个工具调用是一个独立条目（按调用 id 合并\"进行中 → 完成 / 失败\"），所以\"步骤数\"通常大于\"模型轮次数\"。\n- **续跑轮次不消耗用户轮次**：带根轮次引用的延续（如目标驱动器接管）复用同一用户轮次，只增加该轮内的模型轮次。\n- 用户轮次只在**真正新建**时才对外发布变更；重放的受理是幂等空操作，不产生新轮次，也不通知订阅者。\n\n## 幂等与排队\n\n| 机制 | 口径 |\n| --- | --- |\n| 提交幂等 | 客户端消息 id 相同即复用既有轮次，重试网络不会多出一轮 |\n| 同会话串行 | 会话锁按会话隔离，超时 120 秒、心跳 5 秒；异常退出由超时释放 |\n| 排队 | 队列开关默认开启；运行中再发的消息进队列，按序执行 |\n| 关掉排队的后果 | 运行中再发消息会被判\"用户忙\"且不排队（舰体启动会告警），不要当成性能优化关掉它 |\n| 后台投递 | 定时消息走强制入队路径，避免与人工消息抢锁时丢失 |\n\n## 时间线里有哪些条目\n\n会话记录只收\"有时间线信息量\"的事件：\n\n| 条目类型 | 状态流转 |\n| --- | --- |\n| 工具调用 | 进行中 → 完成 / 失败（同一调用 id 合并） |\n| 模型调用 | 按模型轮次编号 |\n| 可见回复 | 即该模型轮次的输出项 |\n| 审批 | 等待 → 已决定 |\n| 子智能体消息 | 用生产者给的消息 id 作持久标识，重放不会变新条目 |\n| 排队台账 | 挂起 → 运行（同条目覆盖更新），界面自行跳过 |\n\n**不入账**：传输增量、心跳、进度、上下文占用、工作区更新、模型用量、流式重试，以及生命周期回执（结束、状态、模型响应等——失败详情由轮次终态携带）。这些能在流里看见，但不该变成时间线里的空条目。\n\n## 界面读到的组织方式\n\n- 聊天页**一个用户轮次一行**（默认页 12、上限 20），最终回复之外的一切中间内容折叠成\"**工作过程**\"。\n- 工作过程默认收起，首次展开才按需拉取该用户轮次的持久条目，不是把整条历史搬进前端。\n- 逐条目全景在\"**线程轨迹**\"视图（默认页 80、上限 100），长正文按 8 KB 分块取。\n- 目录列表读的是轮次尾巴（最高用户轮次、该轮状态、最近活动摘要、补水游标），一页会话一次批量查询。\n\n## 怎么用\n\n- **开新会话的场景**：换话题；需要应用新的智能体设定、提示词模板或长期记忆（已有会话的提示词已冻结）；上下文已经很长、开始丢早期细节。\n- **续用的场景**：同一任务还没完、需要引用前面的产出。续用不会重算底座，只增加轮次。\n- **定位某一步**：报坐标用\"用户轮次 + 模型轮次\"，或直接给条目 id；工具批次只给条目序号，别把它说成\"第几轮\"。\n\n## 容易搞错的地方\n\n- **\"一轮 = 一次问答\"** —— 一个用户轮次可以包含很多模型轮次，每个模型轮次还能带一批工具调用。\n- **\"步骤数 = 轮次数\"** —— 不相等，步骤（条目）通常更多。\n- **\"会话和线程是两个东西\"** —— 在本系统里是同一个：会话是对话与记录的载体，线程是它的执行主体。\n- **\"重复提交会重复计费轮次\"** —— 带同一客户端消息 id 的重试是幂等的。\n- **\"子智能体的输入会出现在父会话\"** —— 子会话的起始用户消息默认隐藏，且跳过自动记忆提取，避免污染用户记忆。\n- **\"Token 统计 = 供应商账单\"** —— 会话记录的是上下文占用（只采信模型侧回报的观测值），不是计费口径。\n\n## 延伸阅读\n\n- [智能体循环](/docs/zh-CN/concepts/core-agent-loop/) —— 模型轮次如何推进与终止\n- [流式执行](/docs/zh-CN/concepts/streaming/) —— 条目与增量的关系\n- [上下文压缩](/docs/zh-CN/concepts/core-context-compression/) —— 历史如何被精简\n- [长期记忆](/docs/zh-CN/concepts/memory/) —— 记忆按作用域隔离\n- [会话状态说明](/docs/zh-CN/reference/stream-events/) —— 事件与状态字段\n","source_path":"使用说明书/zh-CN/concepts/sessions-and-rounds.md"}</script>
