  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-agent-loop","language":"zh-CN","title":"智能体循环","summary":"主循环的模型轮次口径、轮次与工具调用预算、熔断与超时护栏，以及线程的系统提示词冻结语义。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/core-agent-loop/","headings":[{"id":"section-1","level":2,"text":"主循环"},{"id":"section-2","level":2,"text":"护栏"},{"id":"section-3","level":2,"text":"终态"},{"id":"section-4","level":2,"text":"线程"},{"id":"section-5","level":2,"text":"干预"},{"id":"section-6","level":2,"text":"易混淆点"}],"prev_slug":"zh-CN/concepts/architecture","next_slug":"zh-CN/concepts/core-tools","markdown":"引擎反复调用模型推进任务，每次模型调用可以带一批工具执行，直到产出可交付结果或命中一道刹车。目标只说一次，中间步骤不需要逐步指挥。\n\n## 主循环\n\n每个模型轮次做三件事：检查是否该让位、是否超出轮次上限，必要时先压缩上下文；调用模型，拿到一段文本或一批工具调用；有工具调用就并行或独占跑完，把结果作为观察写回历史，再进入下一轮。没有工具调用或命中刹车时，这一轮落地，循环退出。\n\n粒度口径与[会话与轮次](/docs/zh-CN/concepts/sessions-and-rounds/)一致：\n\n- 一个模型轮次就是引擎的一次模型调用。\n- 一个轮次里可以有好几个工具调用，工具调用不单独计轮次。\n- 界面上每次轮次对应一条可见输出；工具批次在时间线里是独立条目，但不算独立轮次。\n\n## 护栏\n\n- **模型轮次上限**：非管理员账户默认最多 1000 轮，用满即停。\n- **单轮工具调用预算**：一轮里最多 10000 次工具调用；记忆召回 2000 次，库查询类 2000 次（必要时可放宽到 10000 次），超出后这类调用会被拒绝。\n- **重复失败熔断**：同一个失败指纹反复出现就停——非重试类错误 5 次、参数或协议错误 2 次、\"成功但没进展\"4 次；停下后会把失败原因转述给你。\n- **上下文超限自愈**：最多 8 次恢复尝试，每次先做一次修复性压缩再重试。\n- **空输出保护**：自动重试 1 次（关掉推理强度重新采样），仍然为空就报错停止。\n- **超时**：模型与工具各默认 120 秒，另有空闲看门狗；超时按失败计入熔断。\n- **会话锁**：同一线程串行执行，锁的 TTL 120 秒、心跳 5 秒；占用方异常退出后由 TTL 释放。\n- **活跃会话上限**：非管理员受 300 条约束，超出排队或提示稍后再试。\n- **工具并行度**：最多 4 个；只读工具并行、独占工具串行。\n\n审批与风险分层独立于循环：写/执行类调用会挂起等你决定，批准结果按工具类别缓存 600 秒，同类操作不再反复追问。\n\n## 终态\n\n每一轮循环最终必须落到一个结果，界面状态据此判断：\n\n- **正常完成**：给出可交付的回复。\n- **被拒绝**：请求没被受理（忙、配额不足、请求非法）。\n- **已取消**：你主动停止。\n- **失败**：执行过程出错（工具护栏、无进展守卫、模型错误）。\n\n等待输入或等待审批时，线程不算终态，它仍在生命周期内。\n\n## 线程\n\n- 一个智能体可以同时拥有多个独立任务线程；调度、锁与实时状态都按线程隔离，不同线程互不阻塞。\n- 线程一旦确定系统提示词就冻结，长期记忆只在初始化时注入一次，之后不再改写。这让长任务行为稳定，也让模型侧的缓存可以复用。\n- 子智能体是主智能体临时创建的工作单元，跑自己的循环，结果回传给父线程，任务结束就回收。协作形态只有这一种。\n\n## 干预\n\n- 弹出审批就批准或拒绝，线程随即继续。\n- 问询面板提问时，线程转入等待人工输入；补一条指令后，新的用户轮次带上新上下文。\n- 看到\"正在执行工具\"或多个工具条目连续出现，说明循环在推进。重复发同一句话不会加速，只会多排一个用户轮次。\n- 长时间没有输出而状态仍是运行中，用停止收掉线程，再重述目标。\n- 话题切换、上下文已经很长，或需要一份干净的提示词底座时开新线程：改了智能体设定或记忆之后，只有新线程才生效。\n\n## 易混淆点\n\n- 每调用一次工具就算一轮，这个说法不对——工具批次属于同一个模型轮次。\n- 循环不会无限重试，重复失败、无进展的成功、超限与空输出都有熔断。\n- 界面不动不等于循环停了：等待审批、等待输入、排队中都仍在生命周期内。\n- 流式输出只是展示方式，循环的真相在线程台账里，见[流式执行](/docs/zh-CN/concepts/streaming/)。\n- 子智能体不共享父线程上下文，它是独立线程、独立循环，只通过回传与信箱交互。\n","source_path":"使用说明书/zh-CN/concepts/core-agent-loop.md"}</script>
