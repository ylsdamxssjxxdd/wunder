  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-agent-loop","language":"zh-CN","title":"智能体循环","summary":"你只说一次目标，剩下的步骤引擎替你跑：循环按模型轮次推进，到终态或刹车为止。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/concepts/core-agent-loop/","headings":[{"id":"section-1","level":2,"text":"循环怎么运转"},{"id":"section-2","level":2,"text":"什么时候会自己停下来"},{"id":"section-3","level":2,"text":"每一轮的归宿"},{"id":"section-4","level":2,"text":"线程才是执行的单位"},{"id":"section-5","level":2,"text":"该等、该插手、该换新线程"},{"id":"section-6","level":2,"text":"几处需要澄清"},{"id":"section-7","level":2,"text":"相关页面"}],"prev_slug":"zh-CN/concepts/architecture","next_slug":"zh-CN/concepts/core-tools","markdown":"你只说一次目标，中间步骤不需要人指挥。这不是\"一问一答\"：引擎反复调用模型，每次调用可以带一批工具执行，直到得出可交付的结果，或撞上一个明确的刹车。\n\n## 循环怎么运转\n\n任务从受理开始，引擎进入主循环。每个模型轮次做三件事：先检查该不该让位、有没有超出轮次上限，必要时先把上下文压一压；然后调用模型，拿到一段文本或一批工具调用；如果有工具调用，就并行或独占地把它们跑完，把结果作为观察写回历史，再进入下一轮；如果没有工具调用，或者命中了刹车，这一轮就落地，退出循环。\n\n粒度口径与[会话与轮次](/docs/zh-CN/concepts/sessions-and-rounds/)一致：\n\n- 一个模型轮次就是引擎的一次模型调用。\n- 一个轮次里可以有好几个工具调用，工具调用不单独计轮次。\n- 界面上每次轮次对应一条可见输出；工具批次在时间线里是独立条目，但不算独立轮次。\n\n## 什么时候会自己停下来\n\n循环不会无限跑，几道护栏会把它刹住：\n\n- **模型轮次上限**：非管理员账户默认最多 1000 轮，用满即停。\n- **单轮工具调用预算**：一轮里最多 10000 次工具调用；记忆召回 2000 次，库查询类 2000 次（必要时可放宽到 10000 次），超出后这类调用会被拒绝。\n- **重复失败熔断**：同一个失败指纹反复出现就停——非重试类错误 5 次、参数或协议错误 2 次、\"成功但没进展\"4 次；停下后会把失败原因转述给你。\n- **上下文超限自愈**：最多 8 次恢复尝试，每次先做一次修复性压缩再重试。\n- **空输出保护**：自动重试 1 次（关掉推理强度重新采样），仍然为空就报错停止。\n- **超时**：模型与工具各默认 120 秒，另有空闲看门狗；超时按失败计入熔断。\n- **会话锁**：同一线程串行执行，锁的 TTL 120 秒、心跳 5 秒；占用方异常退出后由 TTL 释放。\n- **活跃会话上限**：非管理员受 300 条约束，超出排队或提示稍后再试。\n- **工具并行度**：最多 4 个；只读工具并行、独占工具串行。\n\n审批与风险分层独立于循环：写/执行类调用会挂起等你决定，批准结果按工具类别缓存 600 秒，同类操作不再反复追问。\n\n## 每一轮的归宿\n\n每一轮循环最终必须落到一个结果，界面状态据此判断：\n\n- **正常完成**：给出可交付的回复。\n- **被拒绝**：请求没被受理（忙、配额不足、请求非法）。\n- **已取消**：你主动停止。\n- **失败**：执行过程出错（工具护栏、无进展守卫、模型错误）。\n\n等待你输入或等待审批时，线程不算终态，它仍在生命周期内。\n\n## 线程才是执行的单位\n\n- 一个智能体可以同时拥有多个独立任务线程；调度、锁与实时状态都按线程隔离，不同线程互不阻塞。\n- 线程一旦确定系统提示词就冻结，长期记忆只在初始化时注入一次，之后不再改写。这让长任务行为稳定，也让模型侧的缓存可以复用。\n- 子智能体是主智能体临时创建的工作单元，跑自己的循环，结果回传给父线程，任务结束就回收。协作形态只有这一种。\n\n## 该等、该插手、该换新线程\n\n该等的：看到\"正在执行工具\"或多个工具条目连续出现，说明循环在正常推进。重复发同一句话不会加速，只会多排一个用户轮次。\n\n该插手的：\n\n- 弹出审批，就决定批准还是拒绝。\n- 问询面板提问时，线程转入等待人工输入。\n- 方向不对，直接补一条指令，新的用户轮次会带上新上下文。\n- 长时间没有输出、状态却仍是运行中，就用停止把它收掉，再重述目标。\n\n该开新线程的：话题切换、上下文已经很长，或需要一份干净的提示词底座（改了智能体设定或记忆后，只有新线程才生效）。\n\n## 几处需要澄清\n\n- 每调用一次工具就算一轮，这个说法不对——工具批次属于同一个模型轮次。\n- 循环不会无限重试，重复失败、无进展的成功、超限与空输出都有熔断。\n- 界面不动不等于循环停了：等待审批、等待输入、排队中都仍在生命周期内。\n- 流式输出只是展示方式，循环的真相在线程台账里，见[流式执行](/docs/zh-CN/concepts/streaming/)。\n- 子智能体不共享父线程上下文，它是独立线程、独立循环，只通过回传与信箱交互。\n\n## 相关页面\n\n- [会话与轮次](/docs/zh-CN/concepts/sessions-and-rounds/) —— 编号与时间线条目\n- [上下文压缩](/docs/zh-CN/concepts/core-context-compression/) —— 循环里的第二步\n- [稳定性](/docs/zh-CN/concepts/core-stability/) —— 失败与恢复设计\n- [边界处理](/docs/zh-CN/concepts/boundary-handling/) —— 截断、超时与拒绝\n- [会话状态说明](/docs/zh-CN/capabilities/stream-events/) —— 状态与事件字段\n","source_path":"使用说明书/zh-CN/concepts/core-agent-loop.md"}</script>
