  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-scheduled-tasks","language":"zh-CN","title":"定时任务","summary":"智能体在指定时间自动执行：at 定点、every 固定间隔、cron 表达式三种排程，配租约、退避与自动禁用，进程重启不丢任务。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"核心","group":"9 个核心","group_path":["9 个核心"],"url":"/docs/zh-CN/concepts/core-scheduled-tasks/","headings":[{"id":"section-1","level":2,"text":"三种排程"},{"id":"section-2","level":2,"text":"结果投递到哪里"},{"id":"section-3","level":2,"text":"执行保障"},{"id":"section-4","level":2,"text":"总开关"},{"id":"section-5","level":2,"text":"从哪里建、各形态支持情况"},{"id":"section-6","level":2,"text":"相关页"}],"prev_slug":"zh-CN/concepts/core-subagent","next_slug":"zh-CN/concepts/core-channels","markdown":"定时任务让智能体在指定时间自动执行，适合定时汇报、巡检、提醒这类动作。\n\n它是**引擎级调度**：任务定义持久化在存储里，后台循环按到期时间领取执行，与你当前正看着哪个会话无关。每次执行都有记录（`/wunder/cron/runs`），能回答「跑了没有、成功还是失败、下次什么时候跑」；失败有退避与自动禁用；进程重启任务定义也不会丢。\n\n它与会话内等待不同：会话让出只影响当前线程，定时任务创建的是未来的新执行。\n\n## 三种排程\n\n| 类型 | 语义 | 输入 | 边界 |\n| --- | --- | --- | --- |\n| `at` | 一次性定点 | RFC3339 时间戳 | 最远 365 天内；执行完即自动禁用（失败则带原因禁用） |\n| `every` | 固定间隔 | `every_ms`（可选起始时间） | 1,000 ms ≤ 间隔 ≤ 86,400,000 ms（24 小时） |\n| `cron` | 表达式周期 | 5–7 字段表达式 + 可选时区 | 字段只允许数字与 `* / - , ?`；时区用具名时区解析，缺省用本地时区 |\n\n在工具和快捷输入里也能用自然语言，系统会折算成上面的类型：`every 5 minutes` 折算成固定间隔，`daily at 9am`、`weekdays at 6pm` 折算成对应的 cron 表达式；识别不了时会提示可用的格式。\n\n内容上限：任务名不超过 128 字符，触发消息不超过 16,384 字符。\n\n## 结果投递到哪里\n\n| 取值 | 行为 |\n| --- | --- |\n| `main`（缺省） | 结果投递到绑定的当前会话，续写同一段对话 |\n| `isolated` | 每次执行新建独立线程会话，并保留父会话溯源 |\n\n需要留痕、不想打扰主对话的周期性任务选 `isolated`；希望结果直接接在现有上下文后面的选 `main`。\n\n## 执行保障\n\n多实例部署时靠**租约**防止重复执行：领取任务时写入运行者标识、运行令牌与租约到期时间，运行期间持续心跳续租；进程崩溃后租约过期，任务可被其他实例重新领取。\n\n默认调度参数：\n\n| 参数 | 默认值 |\n| --- | --- |\n| 并发执行上限 | 1 |\n| 轮询间隔 | 1000 ms |\n| 空闲最长休眠 | 5000 ms |\n| 租约有效期 / 心跳 | 300 秒 / 60 秒 |\n| 连续失败自动禁用阈值 | 5 |\n\n失败后按连续失败次数逐级退避：**30 秒 → 60 秒 → 5 分钟 → 15 分钟 → 1 小时**，之后停在最后一档。达到失败上限后任务自动禁用并写明原因；重新启用会清零失败计数。\n\n## 总开关\n\n关掉总开关后，**新增、修改、启用、手动运行四类写操作全部被拒绝**（返回明确提示）；查询状态、列表、单条详情、运行记录、删除、禁用仍然可用，方便查看与清理存量任务。\n\n## 从哪里建、各形态支持情况\n\n| 面 | 情况 |\n| --- | --- |\n| 接口 | `/wunder/cron/*` 共 11 个端点（状态/列表/运行记录/新增/修改/删除/启用/禁用/详情/运行/动作），属**用户面**，按用户归属隔离 |\n| 工具 | 内置工具 `定时任务`（别名 `schedule_task`），与接口同一处理器，模型可以自建任务 |\n| 蜂巢 | 设置里的定时任务分类页 |\n| 蛹 | 定时任务页，另有原生入口，同进程调用同一处理器 |\n| 舵机 | **没有定时任务**：本地引擎启动时显式关闭调度器，也没有相关斜杠命令 |\n| 舰桥 | 没有用户级任务管理页，只在「预设智能体」里作为模板配置存在 |\n\n需要定时执行时，在蜂巢、蛹或舰体侧配置。\n\n## 相关页\n\n- [定时任务工具](/docs/zh-CN/tools/schedule-task/) — 工具参数与用法\n- [稳定性与边界](/docs/zh-CN/concepts/core-stability/) — 退避与有界设计的全局视角\n- [智能体循环](/docs/zh-CN/concepts/core-agent-loop/) — 任务触发后如何进入执行链\n","source_path":"使用说明书/zh-CN/concepts/core-scheduled-tasks.md"}</script>
