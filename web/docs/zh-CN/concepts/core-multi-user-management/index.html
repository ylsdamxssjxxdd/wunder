  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/concepts/core-multi-user-management","language":"zh-CN","title":"多用户管理","summary":"舰体形态下的用户、单位与权限边界：不透明令牌、按形态分列的在线状态、单位树、等级与额度、worker card 与数据隔离。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"核心能力","group_path":["核心能力"],"url":"/docs/zh-CN/concepts/core-multi-user-management/","headings":[{"id":"section-1","level":2,"text":"身份校验"},{"id":"section-2","level":2,"text":"令牌"},{"id":"section-3","level":2,"text":"在线状态"},{"id":"section-4","level":2,"text":"单位树"},{"id":"section-5","level":2,"text":"等级与额度"},{"id":"section-6","level":2,"text":"worker card 与线程"},{"id":"section-7","level":2,"text":"数据隔离"},{"id":"section-8","level":2,"text":"易混淆点"}],"prev_slug":"zh-CN/concepts/core-multithreading","next_slug":"zh-CN/capabilities/interlink","markdown":"多用户治理是舰体（server）形态的基础能力；蛹与舵机是本地单机形态，不涉及账号体系。面板上的具体操作见参考章。\n\n## 身份校验\n\n- **管理门**：管理路径（如 `/wunder/admin/*`）在服务端要求 API key 或 Bearer，且账户必须是管理员；单位负责人则在指定路径上单独放行。\n- **用户归属**：面向用户的请求先由 Bearer 解析出用户，再校验归属，确保只能碰自己的会话、工具和任务。\n- **实时通道**：WebSocket 连接在握手时携带令牌，六条实时通道各自鉴权。\n\n## 令牌\n\n| 凭据 | 形态 | 默认有效期 |\n| --- | --- | --- |\n| Access token | 以 `wund_` 开头的随机串，按值查库校验 | 7 天 |\n| Refresh token | 以 `wundr_` 开头的随机串 | 30 天 |\n| 外部登录一次性码 | 以 `wundc_` 开头，内存态 | 短时效 |\n\n令牌不是自包含的 JWT，不含声明、不能离线解析；校验靠查库，吊销即时生效。\n\n几条关键语义：\n\n- **刷新是 OAuth 式族轮换**：一次刷新发新的 access 加新的 refresh，同属一个轮换族；拿着已经吊销的令牌再来刷新，会被判定为令牌被盗，整个族（包括在用的 access）立即吊销。\n- **会话来源决定谁能续期**：登录读取 `x-wunder-session-scope` 头，只有蛹、舵机这类本地来源有可续期的刷新链，浏览器会话不走这条路。\n- **同一来源重复登录会挤号**：同一用户在同一来源再次登录，旧会话会收到被顶替的通知并被断开。排查\"另一端的连接为什么掉了\"，看是不是同来源重登。\n- 口令用 Argon2 哈希存储，明文不落库。\n\n## 在线状态\n\n在线状态按客户端类型分别记录，蜂巢（web）、蛹（desktop）、舵机（cli）三路独立，约 90 秒没有心跳就算离线，清扫周期 30 秒（下限 10 秒）。因此用户列表里在线拆成了 web、desktop、cli 三列——\"在线\"不再是一个是非值，谁在哪种形态上在线，看对应的列。管理出口在 `/wunder/admin/gateway/presence`。\n\n## 单位树\n\n启动时如果单位表是空的，会按一份单位模板自动播种。单位树最深 4 级。\n\n负责人身份只在 `/wunder/admin/org_units` 和 `/wunder/admin/user_accounts` 两条路径上放行；其数据范围等于自己担任负责人的单位及其后代单位，越出范围即权限拒绝。前端的确认只是体验，负责人边界最终由服务端兜底判定。\n\n## 等级与额度\n\n**等级**偏娱乐与成长：XP 等于会话运行秒数取整，等级上限 200（`MAX_USER_LEVEL`），升到下一级所需 XP 按 `240 + 28L + 0.9L²` 递增。等级不会解锁任何资源，只反映使用时长。\n\n**额度**偏治理：每个用户持有一个整数 Credits 账户，含余额、累计发放、累计消耗和每日发放（默认每日 1000）。它是发放与扣减的抽象额度，不是 token 数——每次向模型服务发一次请求就扣 1 Credit，与 token 计量相互独立。余额不足时，新一轮请求会被配额拒绝并返回剩余额度快照；管理员账户豁免扣减，但仍记录请求数。\n\n## worker card 与线程\n\n| 概念 | 是什么 |\n| --- | --- |\n| worker card（`.worker-card.json`） | 智能体可移植的定义文档，包含基本信息（标识、名称、描述、图标）、提示词、能力、交互、运行设置，以及预设发布状态 |\n| 线程 / 会话 | 智能体被调用后的连续执行单元，一个智能体可以同时拥有多个独立任务线程 |\n\n会话按 agent id 绑定智能体，各任务线程彼此独立。预设智能体发布后，可以控制它对哪些单位可见，也可以决定绑定用户能改哪些字段。预设卡片的磁盘目录（`user_agents.worker_cards_root`）默认是空字符串——不显式配置就没有从磁盘加载的预设卡，这项能力不是出厂自带的。审批模式有 suggest、auto_edit、full_auto 三种，默认 full_auto。\n\n## 数据隔离\n\n会话、任务、工作区、工具、渠道绑定等一律按用户归属隔离，用户面逐处理器校验归属。云端文件和执行边界由沙箱承担：读写与执行类操作在每个用户各自的容器里跑，只挂该用户自己的目录，路径校验不再负责租户隔离。配额、等级、在线状态是账户级；模型配置和预设智能体是单位级或全局级。\n\n## 易混淆点\n\n- 令牌不是自包含的 JWT，不能离线解析——它是不透明随机串，校验靠查库，吊销即时生效。\n- refresh 丢了不能拿旧的再刷，旧 refresh 重放会触发整族吊销，正确做法是重新登录。\n- Credits 不是 token 预算，它是整数请求额度，每次模型请求扣 1，token 用量另行计量。\n- 负责人不能管所有管理页，只在单位和用户账户两条路径放行，且范围限于后代单位。\n- worker card 不是任务线程，它是智能体的定义文档，线程是执行单元，两者不同层。\n- 系统不自带一批预设智能体卡，磁盘预设目录缺省为空，未配置即没有。\n","source_path":"使用说明书/zh-CN/concepts/core-multi-user-management.md"}</script>
