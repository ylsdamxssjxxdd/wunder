  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/start/docs-directory","language":"zh-CN","title":"常用说明目录","summary":"仓库文档生态导航：总体设计、设计文档、技术说明书、API 文档、使用说明书、性能标准与评分、功能迭代与经验教训的分工与读法。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"开始","group":"导航与排障","group_path":["导航与排障"],"url":"/docs/zh-CN/start/docs-directory/","headings":[{"id":"section-1","level":1,"text":"常用说明目录"},{"id":"section-2","level":2,"text":"文档分类"},{"id":"section-3","level":2,"text":"使用说明书（本站）"},{"id":"section-4","level":3,"text":"开始"},{"id":"section-5","level":3,"text":"界面"},{"id":"section-6","level":3,"text":"其它分区"},{"id":"section-7","level":2,"text":"设计文档（docs/设计文档/）"},{"id":"section-8","level":2,"text":"技术说明书（docs/技术说明书/）"},{"id":"section-9","level":2,"text":"API 文档（docs/API文档.md）"},{"id":"section-10","level":2,"text":"性能标准与评分（docs/）"},{"id":"section-11","level":2,"text":"功能迭代与经验教训"},{"id":"section-12","level":2,"text":"项目 SOP"},{"id":"section-13","level":2,"text":"阅读路径"}],"prev_slug":"zh-CN/start/hubs","next_slug":"zh-CN/start/troubleshooting-first-run","markdown":"# 常用说明目录\n\nwunder 的文档分七类，各解决一类问题。写文档时不串味：**设计文档讲边界与理由**，**技术说明书讲工程执行**（改动落点、运行方式、排障入口），**API 文档讲接口契约**，**使用说明书讲用户与管理员操作**，**性能标准与评分讲口径与量化**，**功能迭代讲变更流水**，**经验教训讲复发性问题**。\n\n## 文档分类\n\n| 类别 | 位置 | 面向 | 什么时候查 |\n| --- | --- | --- | --- |\n| **总体设计** | `docs/总体设计.md`、`docs/wunder系统简介.md` | 所有读者 | 想一句话了解产品定位与形态分工 |\n| **设计文档** | `docs/设计文档/`（01–13 + 上下文压缩 / 实时同步 / 工具 / 记忆系统 / 目标态系统等专题） | 架构评审、方案取舍 | 想知道**为什么这样设计**、边界在哪 |\n| **技术说明书** | `docs/技术说明书/`（01–13 章 + README） | 工程执行者 | 想知道**改动落点、运行方式、排障入口** |\n| **API 文档** | `docs/API文档.md` | 接口消费者 | 具体 HTTP / WebSocket 端点契约 |\n| **使用说明书** | `docs/使用说明书/zh-CN/`、`docs/使用说明书/en/` | 用户与管理员 | 具体操作的界面地图与步骤 |\n| **性能标准与评分** | `docs/性能标准.md`、`docs/性能评分体系.md`、`docs/性能基线/` | 运维与基准测试者 | 前后对比、达标判断、形态独立评分 |\n| **功能迭代 / 经验教训** | `docs/功能迭代.md`、`docs/经验教训.md` | 项目维护者 | 每轮变更流水；反复出现的坑 |\n\n## 使用说明书（本站）\n\n`docs/使用说明书/site.json` 控制导航，中英双站。**中文站是权威版本，英文站跟随**。\n\n### 开始\n\n| 页面 | 内容 |\n| --- | --- |\n| [快速开始](/docs/zh-CN/start/quickstart/) | 4 步跑通第一个任务 |\n| [蛹入门](/docs/zh-CN/start/desktop/) | 个人用户下载即用 |\n| [舰体部署](/docs/zh-CN/start/server/) | 多人共用、统一管理 |\n| [舵机使用](/docs/zh-CN/start/cli/) | 终端驱动、自动化 |\n| [首次运行排查](/docs/zh-CN/start/troubleshooting-first-run/) | 装 / 启 / 访 三类失败按形态定位 |\n| [说明书总览](/docs/zh-CN/start/hubs/) | 导航首页 |\n| [常用说明目录](/docs/zh-CN/start/docs-directory/) | 本页 |\n\n### 界面\n\n| 页面 | 内容 |\n| --- | --- |\n| [界面概览](/docs/zh-CN/surfaces/index/) | 四形态分工 + 能力矩阵 |\n| [蛹界面](/docs/zh-CN/surfaces/desktop-ui/) | 主窗两页 + 设置 12 分类 |\n| [蜂巢界面](/docs/zh-CN/surfaces/frontend/) | 浏览器里的单页应用 |\n| [舰桥界面](/docs/zh-CN/surfaces/web-admin/) | 管理员治理后台 |\n\n### 其它分区\n\n- 工具 → `/docs/zh-CN/tools/`\n- 能力 → `/docs/zh-CN/capabilities/`\n- 帮助 → `/docs/zh-CN/help/`\n\n## 设计文档（`docs/设计文档/`）\n\n**写设计理由，不写具体怎么改。** 编号 01–13 是主干：\n\n| 编号 | 主题 |\n| --- | --- |\n| 01 | 系统总体设计 |\n| 02 | 智能体核心设计 |\n| 03 | 实时投影系统设计 |\n| 05 | 工具、技能与 MCP 系统设计 |\n| 06 | 记忆、知识与工作区系统设计 |\n| 07 | 接入、网关与渠道系统设计 |\n| 08 | 数据存储与状态模型设计 |\n| 09 | 用户侧前端设计 |\n| 10 | 管理员侧与运营后台设计 |\n| 11 | Desktop-CLI 本地形态设计 |\n| 12 | 安全-权限与隔离设计 |\n| 13 | 可观测性-测试与验收设计 |\n\n专题子页：上下文压缩设计、实时同步设计、工具设计、记忆系统设计、目标态系统设计、应用补丁工具重构方案；另有蜂巢大数据量线程日志渲染优化方案（位于 `docs/` 根目录，方案已重写、业务实现待执行）。\n\n## 技术说明书（`docs/技术说明书/`）\n\n**写改动落点、运行方式、排障入口，不写边界与理由。** 章节 01–13：\n\n| 编号 | 主题 |\n| --- | --- |\n| 01 | 系统总览与术语 |\n| 02 | 仓库结构与模块职责 |\n| 03 | 运行时与执行链路 |\n| 04 | 实时投影与通信链路 |\n| 05 | 工具、技能、MCP 与外部能力 |\n| 06 | 数据存储、工作区与配置 |\n| 07 | 接口、网关与渠道接入 |\n| 08 | 部署、启动与运行模式 |\n| 09 | 开发、扩展与变更流程 |\n| 10 | 运维、排障与验收 |\n| 11 | 工具结果裁剪与观测链路 |\n| 12 | 形象系统 |\n| 13 | 目标态系统 |\n\n附加：吞吐测试 Docker 验收。\n\n## API 文档（`docs/API文档.md`）\n\n单文件，接口消费者视角。所有 HTTP 端点走 `/wunder/*` 前缀（**不是 `/api/*`**）；错误响应会写回 `x-trace-id` 与 `x-error-code` 响应头。WebSocket 通道包括 `chat/ws`、`ws`、`gateway/ws`、`interlink/ws`、`interlink/remote_ws`、`user_world/ws`、`desktop/lan/ws`（事件名分散在各处，没有集中枚举）。\n\n## 性能标准与评分（`docs/`）\n\n| 文档 | 内容 |\n| --- | --- |\n| `docs/性能标准.md` | 同环境同入口前后对比 + 标准入口表 |\n| `docs/性能评分体系.md` | 三形态**独立 0–100 加权、不可跨形态相加** |\n| `docs/性能基线/` | 历史基线快照；最新例如 `2026-10-13-server-capacity.md`、`2026-10-13-thread-view-v3.md` |\n\n**口径**：性能不是形容词。任何列表、日志、面板都要能说出分页 / 限量 / 有界语义；性能评审用固定用户 `performance_admin`、工作根 `.wunder_perf`、命令超时 5s。\n\n## 功能迭代与经验教训\n\n- `docs/功能迭代.md`：每轮变更写入指定分类区块。类型分：新增 / 变更 / 修复 / 性能 / 文档 / 重构 / 安全 / 工程 / 测试 / 移除 / 弃用。\n- `docs/经验教训.md`：**反复出现的问题，解决后必须写一条**，避免下次再犯同样错误。\n\n## 项目 SOP\n\n`docs/SOP.md`：6 步流程（worktree → quality-gate → peer review → merge-gate → PR → 合并清理）；Biome `pnpm check`、`pnpm lint`；文件 200 行告警 / 350 行硬上限。\n\n## 阅读路径\n\n**新用户**：使用说明书 → 快速开始 → 蛹入门；出错回首次运行排查。\n**开发者入门**：技术说明书 01–03 → 02 仓库结构与模块 → 03 运行时与执行链路；再读设计文档 01–02 补上「为什么」。\n**加接口**：技术说明书 07 → API 文档 → 设计文档 07。\n**性能问题**：性能标准 → 性能评分体系 → 性能基线；具体分页常量看技术说明书 03–04。\n**运维与验收**：技术说明书 10 → `docs/SOP.md`；`docs/功能迭代.md` 看历史决策；`docs/经验教训.md` 避免重复踩坑。\n","source_path":"使用说明书/zh-CN/start/docs-directory.md"}</script>
