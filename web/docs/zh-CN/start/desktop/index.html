  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/start/desktop","language":"zh-CN","title":"蜂窝（desktop）入门","summary":"wunder 的默认使用方式。下载安装即可使用，不需要先搭服务器。","updated_at":"2026-04-10","read_when":["要先把 wunder 用起来","更关心桌面工作台，而非先搭整套服务"],"source_docs":["docs/API文档.md","frontend/src/components/messenger/DesktopRuntimeSettingsPanel.vue","frontend/src/components/messenger/MessengerSettingsPanel.vue"],"tab":"开始","group":"入门","group_path":["入门"],"url":"/docs/zh-CN/start/desktop/","headings":[{"id":"section-1","level":1,"text":"蜂窝（desktop）入门"},{"id":"section-2","level":2,"text":"适用场景"},{"id":"section-3","level":2,"text":"界面结构"},{"id":"section-4","level":2,"text":"5 步上手"},{"id":"section-5","level":3,"text":"1. 下载安装"},{"id":"section-6","level":3,"text":"2. 首次启动"},{"id":"section-7","level":3,"text":"3. 配置模型"},{"id":"section-8","level":3,"text":"4. 完善账号资料"},{"id":"section-9","level":3,"text":"5. 发起第一次对话"},{"id":"section-10","level":2,"text":"两个常见交互约束"},{"id":"section-11","level":3,"text":"运行中不能新建线程"},{"id":"section-12","level":3,"text":"子智能体运行时的提示"},{"id":"section-13","level":2,"text":"重置工作状态"},{"id":"section-14","level":2,"text":"本地模式额外能力"},{"id":"section-15","level":2,"text":"查阅帮助手册"},{"id":"section-16","level":2,"text":"下一步"}],"prev_slug":"zh-CN/start/quickstart","next_slug":"zh-CN/start/server","markdown":"# 蜂窝（desktop）入门\n\n蜂窝（desktop）是 wunder 的桌面版，也是默认使用方式：一个**本地 AI 工作台**。下载安装即可使用，不需要先部署舰体（server），打开就能把目标交给智能体。\n\n## 适用场景\n\n| 场景 | 选蜂窝 |\n|------|-----------|\n| 想直接开始用，不想先部署服务 | ✅ |\n| 需要操作本地文件、窗口、浏览器 | ✅ |\n| 更习惯图形界面 | ✅ |\n| 后面可能接远端，但现在先跑起来 | ✅ |\n| 需要多用户治理和管理员后台 | ❌ 选舰体（server） |\n\n## 界面结构\n\n蜂窝是左右两栏布局：\n\n- 左栏（固定 240px）：新任务、搜索、工作区与线程树、工作目录（文件树 + 工具栏 + 用量条）、底部设置\n- 右栏：欢迎页或聊天页（顶栏 + 时间线 + 输入区）\n\n文件预览、在线编辑等以浮层弹出，不改变两栏结构。每个用户只有一个智能体实例和一个固定的工作目录。\n\n## 5 步上手\n\n### 1. 下载安装\n\n从 Releases 下载对应系统的安装包，安装后启动。\n\n### 2. 首次启动\n\n启动后先显示轻量启动页，再准备本地工作目录、配置和会话。窗口出现不代表会话已就绪；进入工作台后即可操作。首次启动或设备较慢时，准备时间可能更长。如果启动页提示失败，可点击重试或重新加载。\n\n### 3. 配置模型\n\n进入「系统设置」→「模型配置」，填入：\n\n- API Key\n- 接口地址\n- 模型名称\n\n保存前建议先点「测试连接」确认能用。\n\n### 4. 完善账号资料\n\n首次登录后建议：\n\n- 去「我的概况 → 编辑资料」修改用户名或邮箱\n- 如果是长期使用，顺便设置新的登录密码\n\n### 5. 发起第一次对话\n\n回到聊天页，输入：\n\n```\n帮我列出当前工作目录的文件\n```\n\n你会看到模型开始执行 → 工具逐步工作 → 最终回复落到聊天区。\n\n## 两个常见交互约束\n\n### 运行中不能新建线程\n\n当前智能体还在运行时，「新建线程」按钮会被禁用。这是正常保护，等它完成或先停止当前会话再新建。\n\n### 子智能体运行时的提示\n\n任务里派生了子智能体时，聊天区会提示当前仍在工作的子运行，方便判断任务是否真的结束。\n\n## 重置工作状态\n\n会话、子智能体或工作区状态混乱时，用「系统设置」里的「一键重置工作状态」。\n\n它会清理运行中的状态，但不会删除技能、知识库等长期资产。\n\n## 本地模式额外能力\n\n蜂窝本地模式下，聊天区还会看到：\n\n- 🎤 麦克风按钮（语音输入）\n- 📷 截图按钮（截屏分析）\n\n是否可用取决于当前机器权限。\n\n## 查阅帮助手册\n\n左栏底部「设置」→ 帮助，可以直接在应用内查阅文档。\n\n## 下一步\n\n- 想理解界面分区：[蜂巢界面](/docs/zh-CN/surfaces/frontend/)\n- 想理解本地模式边界：[蜂窝本地模式](/docs/zh-CN/ops/desktop-local-mode/)\n- 想了解任务拆分：[子智能体控制](/docs/zh-CN/tools/subagent-control/)\n- 遇到问题：[故障排查](/docs/zh-CN/help/troubleshooting/)\n","source_path":"使用说明书/zh-CN/start/desktop.md"}</script>
