  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/start/desktop","language":"zh-CN","title":"蜂窝（desktop）入门","summary":"wunder 的默认使用方式：本地 AI 工作台。下载安装即可使用，不需要先部署舰体；同进程原生调用引擎，不占端口，不走 HTTP/WebSocket 中转。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"开始","group":"入门","group_path":["入门"],"url":"/docs/zh-CN/start/desktop/","headings":[{"id":"section-1","level":1,"text":"蜂窝（desktop）入门"},{"id":"section-2","level":2,"text":"什么时候选蜂窝"},{"id":"section-3","level":2,"text":"装与启动"},{"id":"section-4","level":2,"text":"本地数据"},{"id":"section-5","level":2,"text":"界面结构（主窗只有两页）"},{"id":"section-6","level":3,"text":"对话页"},{"id":"section-7","level":3,"text":"设置页"},{"id":"section-8","level":2,"text":"5 步上手"},{"id":"section-9","level":3,"text":"1. 下载安装"},{"id":"section-10","level":3,"text":"2. 首次启动"},{"id":"section-11","level":3,"text":"3. 配置模型"},{"id":"section-12","level":3,"text":"4. 完善账号资料"},{"id":"section-13","level":3,"text":"5. 发起第一次对话"},{"id":"section-14","level":2,"text":"蜂窝独有能力（其他界面没有）"},{"id":"section-15","level":2,"text":"关于设备互通"},{"id":"section-16","level":2,"text":"一键重置工作状态"},{"id":"section-17","level":2,"text":"两个交互约束"},{"id":"section-18","level":2,"text":"常见问题"},{"id":"section-19","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/start/quickstart","next_slug":"zh-CN/start/server","markdown":"# 蜂窝（desktop）入门\n\n蜂窝（desktop）是 wunder 的桌面版，也是**默认使用方式**：一个**本地 AI 工作台**。下载安装即可使用，不需要先部署舰体（server）。它同进程原生调用引擎，没有独立端口，也不走 HTTP/WebSocket 中转。\n\n## 什么时候选蜂窝\n\n| 场景 | 选蜂窝 |\n| --- | --- |\n| 想直接开始用，不想先部署服务 | ✅ |\n| 需要操作本地文件、窗口、浏览器 | ✅ |\n| 更习惯图形界面 | ✅ |\n| 需要交互式终端与截图采集 | ✅ |\n| 需要托盘、系统通知与全局热键 | ✅ |\n| 后面可能接远端，但现在先跑起来 | ✅ |\n| 需要多用户治理与管理员后台 | ❌ 选舰体（server） |\n| 需要在浏览器里访问 | ❌ 选蜂巢（web，随舰体） |\n\n## 装与启动\n\n- **可执行文件**：`wunder-frontend-slint`\n- **开发启动**：Windows 下用项目自带的 `run.bat`\n- **平台**：主要面向 32 位 Win7 与 Ubuntu 18.04；现代 Windows / Linux 均可运行\n- **无端口、无必需参数**：启动后直接同进程调用引擎\n- 另有一个兼容用的 bridge 端口（默认 18123），只服务既有兼容客户端，日常使用不走这条路\n- Electron / Tauri 前端壳**停止日常维护与功能迭代**（不代表蜂窝后端停止维护）\n\n## 本地数据\n\n| 内容 | 位置 |\n| --- | --- |\n| 根目录 | `WUNDER_HOME` → 默认 `~/.wunder` |\n| 工作区 | `~/.wunder/workspace` |\n| 临时目录 | `WUNDER_DESKTOP_TEMP_ROOT` |\n| 桌面设置 | `<temp>/config/desktop.settings.json` |\n| 会话与工具日志 | 本地 SQLite |\n\n想迁到新机器：复制 `~/.wunder` 到新机器即可。启动时会扫描工作树（最多 4096 项），恢复上次没跑完的任务状态，并清理会话锁与残留任务。\n\n## 界面结构（主窗只有两页）\n\n主窗只有「对话」和「设置」两页，其余能力都以面板和对话框挂在上面。\n\n### 对话页\n\n- **左栏**：任务与线程树、**工作目录区**（本地文件树 + 用量条 + **云端工作区**）、底部设置入口\n- **右栏**：顶栏（工作区 / 线程名）+ 时间线 + 输入区\n- 未选中线程时显示欢迎页；文件预览、在线编辑等以浮层弹出，不改变两栏结构\n- 一个智能体可以并行多个**独立任务线程**，工作区可以是**多个**：本地 + 云端 + 通过设备互通访问的远程设备工作区\n\n### 设置页\n\n**12 个分类**：通用、账户、模型、工具、智能体、形象、定时、记忆、渠道、提示词包、归档、帮助。\n\n分类导航支持搜索过滤。**没有「设备互通」类目**。\n\n## 5 步上手\n\n### 1. 下载安装\n\n从 Releases 下载对应系统的安装包。\n\n### 2. 首次启动\n\n启动后先显示轻量启动页，再准备本地工作目录、配置与会话。窗口出现不代表会话已就绪；进入工作台后即可操作。首次启动或设备较慢时准备时间可能更长。\n\n### 3. 配置模型\n\n设置 → 模型 → 添加：\n\n- API Key\n- 接口地址（`https://example.com/v1` 这类中性端点）\n- 模型名称与参数（温度、上下文长度等）\n\n保存前用「测试连接」确认。想接入 TTS / 图像 / 视频模型也在这里；**TTS 当前只能配置，无播放实现**。\n\n### 4. 完善账号资料\n\n设置 → 账户：用户名、邮箱、头像；如需长期使用请设置登录密码。\n\n### 5. 发起第一次对话\n\n回到对话页，输入：\n\n```\n帮我列出当前工作目录的文件\n```\n\n看到模型思考 → 工具批次 → 最终回复落到聊天区，就说明跑通。\n\n## 蜂窝独有能力（其他界面没有）\n\n- **交互式终端**（Windows 用 winpty，Linux 用 PTY）\n- **截图采集**（Linux 走 X11，Windows 走 Win32 接口）\n- **托盘与系统通知**\n- **全局热键**\n- **语音输入**\n\n## 关于设备互通\n\n蜂窝里能用的互通面**只有两处**：\n\n1. 侧栏「工作目录区」的**云端工作区**：网络不可用时会明确显示「离线」并给出「连接」按钮\n2. **远端命令审批弹窗**：设备互通里的高危命令（L3）会弹窗确认，边框标红，同时展示命令级别、风险与来源，另有「不允许记忆」提示\n\n设置页里还留着一套设备互通的配置项，但没有接到任何界面上，**当前入口未开放**。\n\n## 一键重置工作状态\n\n会话、子智能体或工作区状态混乱时，用「设置 → 通用 → 一键重置工作状态」：\n\n- **会做**：停止运行中的会话、清空排队任务、清理会话锁\n- **保留**：技能、知识库、长期记忆、用户配置、工作区文件、会话历史\n\n它是**清理工作状态**，不是「恢复出厂设置」。\n\n## 两个交互约束\n\n- **会话队列默认开启**：运行中再发消息会排队，而不是被判「用户忙」。关掉它，运行中再发消息就会被直接打回，也不进排队条——保持默认即可。\n- **子智能体运行时的提示**：任务派生了子智能体时，聊天区会显示仍在工作的子运行状态；子智能体是主智能体临时创建的工作单元，任务结束即回收。\n\n## 常见问题\n\n**数据位置**\n工作区在 `~/.wunder/workspace`，会话历史在本地 SQLite，配置在 `<temp>/config/desktop.settings.json`。\n\n**迁移到别的电脑**\n能。复制 `~/.wunder` 到新机器即可。\n\n**本地模式联网**\n可以。「本地优先」只指数据留本地，不影响访问远程模型或网页。\n\n**多人共用**\n蜂窝专注本地单人场景；团队协作请部署舰体，成员用蜂巢。\n\n## 延伸阅读\n\n- [快速开始](/docs/zh-CN/start/quickstart/)\n- [蜂窝界面](/docs/zh-CN/surfaces/desktop-ui/)\n- [界面概览](/docs/zh-CN/surfaces/index/)\n- [首次运行排查](/docs/zh-CN/start/troubleshooting-first-run/)\n- [故障排查](/docs/zh-CN/help/troubleshooting/)\n","source_path":"使用说明书/zh-CN/start/desktop.md"}</script>
