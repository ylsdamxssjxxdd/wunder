  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/start/quickstart","language":"zh-CN","title":"快速开始","summary":"用最短路径把蛹跑起来：下载、启动、配模型、发第一条消息、验证结果。个人用户默认入口，无需部署服务。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"开始","group":"入门","group_path":["入门"],"url":"/docs/zh-CN/start/quickstart/","headings":[{"id":"section-1","level":1,"text":"快速开始"},{"id":"section-2","level":2,"text":"4 步跑通"},{"id":"section-3","level":3,"text":"1. 下载安装"},{"id":"section-4","level":3,"text":"2. 配置模型"},{"id":"section-5","level":3,"text":"3. 发第一条消息"},{"id":"section-6","level":3,"text":"4. 观察执行过程"},{"id":"section-7","level":2,"text":"蛹开箱能力"},{"id":"section-8","level":2,"text":"跑通的样子"},{"id":"section-9","level":2,"text":"出错回哪儿查"},{"id":"section-10","level":2,"text":"其他使用方式"},{"id":"section-11","level":2,"text":"下一步"}],"prev_slug":"zh-CN/index","next_slug":"zh-CN/start/desktop","markdown":"# 快速开始\n\n个人用户默认走**蛹（desktop）**：本地 AI 工作台，下载即用，不需要先搭服务器。\n\n## 4 步跑通\n\n### 1. 下载安装\n\n从 Releases 下载匹配系统的安装包。蛹面向 32 位 Win7 与 Ubuntu 18.04，也覆盖现代 Windows / Linux。安装或解压后启动即可。\n\n开发环境下也可以直接跑启动脚本（Windows 下是 `run.bat`，或直接执行 `wunder-frontend-slint`）。它同进程原生调用引擎——不占用本机端口，也不需要本机 HTTP/WebSocket 中转。\n\n### 2. 配置模型\n\n打开「设置 → 模型」，填入 API Key 与接口地址（形如 `https://example.com/v1`），保存前用「测试连接」验证一次；模型名与参数按提供方指引填。\n\n数据留在本机：默认本地 SQLite，配置目录 `~/.wunder`；模型请求走你配置的远程端点。\n\n### 3. 发第一条消息\n\n回到对话页，输入：\n\n```\n帮我列出当前工作目录的文件\n```\n\n回车发送即可。\n\n### 4. 观察执行过程\n\n一次执行按 **用户轮次 / 模型轮次** 展示：\n\n- 用户轮次 = 你每发送一条消息记 1\n- 模型轮次 = 引擎主循环的**一次模型调用**（可含一批工具调用），工具调用不单独计模型轮次\n\n看到时间线出现工具批次、每轮的「工作过程」条目与最终回复，就说明跑通了。\n\n## 蛹开箱能力\n\n- 本地优先：数据留在本机，可离线；网络只用于访问模型与网页\n- 桌面控制：桌面控制器 / 桌面监视器（需 vision 模型）\n- 交互式终端：Windows 下基于 winpty，Linux 下基于 PTY\n- 截图采集、语音输入、托盘、系统通知与全局热键\n- 一个智能体可以同时拥有**多个独立任务线程**，工作区也可以有多个（本地 + 云端 + 通过设备互通访问的远程设备工作区）\n- 直接编辑智能体：随时改系统提示词、审批模式与工具集合\n\n## 跑通的样子\n\n- 可以成功发起一次对话\n- 可以看到中间步骤和工具调用批次\n- 可以拿到最终结果并复制\n- 上滚查看历史时，后续输出不会把你拽回底部\n- 失败时知道该看哪一页\n\n## 出错回哪儿查\n\n| 现象 | 先看 |\n| --- | --- |\n| 启动页长时间不结束 | [首次运行排查](/docs/zh-CN/start/troubleshooting-first-run/) |\n| 模型请求 401/403 | 设置 → 模型 → 测试连接；[配置说明](/docs/zh-CN/reference/config/) |\n| 运行中发消息被判「用户忙」 | 会话队列是否被关闭 |\n| 界面卡、消息不刷新 | [故障排查](/docs/zh-CN/help/troubleshooting/) |\n\n## 其他使用方式\n\n蛹覆盖绝大多数场景，以下为三种可选形态：\n\n- **舰体（server）**：多人共用、权限管理、渠道接入、智能体应用发布与治理。见 [舰体部署](/docs/zh-CN/start/server/)。\n- **蜂巢（web）**：随舰体提供的云端 AI 工作台，浏览器访问；页面由独立的网页服务容器下发，默认 18001。见 [蜂巢界面](/docs/zh-CN/surfaces/frontend/)。\n- **舵机（cli）**：手工本地操作入口，终端与自动化。见 [舵机使用](/docs/zh-CN/start/cli/)。\n\n## 下一步\n\n- 下载安装细节 → [蛹入门](/docs/zh-CN/start/desktop/)\n- 界面地图 → [界面概览](/docs/zh-CN/surfaces/index/)\n- 核心概念 → [核心概览](/docs/zh-CN/concepts/)\n- 所有工具 → [工具总览](/docs/zh-CN/tools/)\n","source_path":"使用说明书/zh-CN/start/quickstart.md"}</script>
