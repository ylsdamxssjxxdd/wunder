  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/start/quickstart","language":"zh-CN","title":"快速开始","summary":"用最短路径下载蜂窝、配置模型、跑通第一个任务。","updated_at":"2026-10-09","read_when":["用户第一次使用 wunder","用户需要快速跑通一个可验证结果"],"source_docs":["README.md"],"tab":"开始","group":"入门","group_path":["入门"],"url":"/docs/zh-CN/start/quickstart/","headings":[{"id":"section-1","level":1,"text":"快速开始"},{"id":"section-2","level":2,"text":"4 步跑通"},{"id":"section-3","level":3,"text":"1. 下载安装"},{"id":"section-4","level":3,"text":"2. 配置模型"},{"id":"section-5","level":3,"text":"3. 发起第一次对话"},{"id":"section-6","level":3,"text":"4. 观察执行过程"},{"id":"section-7","level":2,"text":"蜂窝开箱能力"},{"id":"section-8","level":2,"text":"其他使用方式"},{"id":"section-9","level":2,"text":"验收清单"},{"id":"section-10","level":2,"text":"下一步"}],"prev_slug":"zh-CN/index","next_slug":"zh-CN/start/desktop","markdown":"# 快速开始\n\n目标只有一个：打开蜂窝，跑通第一个任务。个人用户默认走蜂窝（desktop）——本地 AI 工作台，下载即用，不需要先搭服务器。\n\n## 4 步跑通\n\n### 1. 下载安装\n\n去 Releases 下载匹配系统的安装包，安装或解压后启动。\n\n### 2. 配置模型\n\n打开「系统设置」→「模型配置」，填入 API Key 和接口地址，保存前点「测试连接」确认能用。\n\n### 3. 发起第一次对话\n\n回到聊天界面，输入 `帮我列出当前目录的文件`，回车发送。\n\n### 4. 观察执行过程\n\n模型思考 → 调用工具 → 展示结果 → 给出回复。\n\n看到完整的执行过程和最终结果，就说明跑通了。\n\n## 蜂窝开箱能力\n\n- 本地优先：默认本地运行，也可接远端\n- 桌面控制：可操作本地窗口、文件、浏览器\n- 持久工作区：文件不会被自动清理\n- 直接编辑智能体：可随时调整智能体配置和提示词\n\n## 其他使用方式\n\n蜂窝覆盖绝大多数场景。以下两种可选形态只在特定需求时使用：\n\n- **舰体（server）**：用户与智能体管理平台，需要多人共用、统一治理时部署，成员通过浏览器访问蜂巢（云端 AI 工作台）。见[舰体部署](/docs/zh-CN/start/server/)。\n- **舵机（cli）**：手工本地操作入口，终端与自动化场景使用。见[舵机使用](/docs/zh-CN/start/cli/)。\n\n## 验收清单\n\n- [ ] 可以成功发起一次对话\n- [ ] 可以看到中间步骤和工具调用\n- [ ] 可以拿到最终结果\n- [ ] 知道下一步该看什么文档\n\n## 下一步\n\n- 下载与安装细节 → [蜂窝入门](/docs/zh-CN/start/desktop/)\n- 认识工作台 → [界面概览](/docs/zh-CN/surfaces/index/)\n- 深入理解系统 → [核心概览](/docs/zh-CN/concepts/)\n- 接入现有系统 → [接入概览](/docs/zh-CN/integration/)\n- 看所有工具 → [工具总览](/docs/zh-CN/tools/)\n- 遇到问题 → [故障排查](/docs/zh-CN/help/troubleshooting/)\n","source_path":"使用说明书/zh-CN/start/quickstart.md"}</script>
