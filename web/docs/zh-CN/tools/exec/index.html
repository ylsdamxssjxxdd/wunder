  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/exec","language":"zh-CN","title":"执行命令","summary":"`execute_command` 的参数、阻塞与后台两种执行模式、命令会话的轮询与写入、输出守卫与预算，以及失败后的诊断。","updated_at":"2026-11-12","read_when":[],"source_docs":[],"tab":"工具","group":"工作区与代码","group_path":["工作区与代码"],"url":"/docs/zh-CN/tools/exec/","headings":[{"id":"section-1","level":1,"text":"执行命令"},{"id":"section-2","level":2,"text":"参数"},{"id":"section-3","level":2,"text":"阻塞与后台"},{"id":"section-4","level":2,"text":"命令会话"},{"id":"section-5","level":2,"text":"自动行为"},{"id":"section-6","level":2,"text":"错误与处理"},{"id":"section-7","level":2,"text":"Shell"}],"prev_slug":"zh-CN/tools/workspace-files","next_slug":"zh-CN/tools/skill-call","markdown":"# 执行命令\n\n`execute_command` 运行 shell 命令、编译、测试，调用现成的命令行工具，或执行一段临时程序（比如临时 Python 脚本）。只想小范围改文件，用 `文本编辑` 的补丁形态；只想读代码，用 [工作区文件](/docs/zh-CN/tools/workspace-files/)。\n\n## 参数\n\n给出要执行的命令内容即可，还可以指定工作目录。常用参数：\n\n- **超时** `timeout_s`：默认 120 秒，传 0 表示不限制。\n- **后台运行** `run_in_background`：默认关闭，也就是阻塞到命令结束。\n- **让出等待** `yield_time_ms`：只配合后台运行使用。\n- **预算** `budget`：可以限制时间、输出字节数和最大命令数。\n- **预演** `dry_run`：只校验计划，不真正执行。\n\n## 阻塞与后台\n\n默认阻塞执行：一次调用等到命令结束或达到超时，一次性返回完整输出；超时后进程被终止，并返回已收集到的部分输出。\n\n只有长时间运行的命令才设 `run_in_background`：短暂等待后命令若仍在跑就立刻返回，结果里带上下一步指引。后台命令随后用下面的命令会话接着跟踪，等待后台命令别用空转。\n\n输出只保留有界的预览。取消当前线程会终止该线程及其子线程的活动命令。\n\n## 命令会话\n\n后台长驻的命令会话由 `命令会话`（别名 `command_session`）管理，支持前后台切换：前台调用直接拿到当前状态与输出，切到后台就让命令继续挂着跑。\n\n一次调用只有两种意图，由 `input` 决定：\n\n- **`input` 为空**（或省略）：只取回该会话的状态与新增输出，默认 250 毫秒就返回，适合隔一会儿看一眼。\n- **`input` 非空**：先写进会话的 stdin，随后本次调用会在同一个等待窗口内等命令退出（相当于 `printf ... | 命令` 的语义）；想一有输出就返回则传 `wait_for=output`。以非交互方式启动的会话没有可写 stdin，会明确告知没有送进去，并提示把输入写进命令本身（`printf '...' | 命令`）后重跑。\n- **`input` 为 Ctrl-C**：按中断处理，等于终止这条命令，没有 stdin 的会话也能用。\n\n`wait_for` 默认 `output`（有新增输出就返回）；传 `wait_for=exit` 才会忽略中间输出、一直等到退出或等待窗口结束，窗口由 `yield_time_ms` 控制（最长 60000，此时默认就是 60000）。\n\n会话已退出不是错误：仍然返回最后一次输出和退出码，用 `status` 与 `exit_code` 判断完成，不要重跑同一条命令。\n\n## 自动行为\n\n- **输出守卫**：命令输出超过阈值会被裁剪，只在有界范围内保留预览，并在结果里提示输出已被截断。\n- **预算**：可以限制时间、输出字节数和最大命令数，防止一条命令吃掉过多资源。\n- **误传补丁自动转交**：如果传进来的内容不是命令，而是完整的 `*** Begin Patch ... *** End Patch`，系统会自动转去执行 `文本编辑` 的补丁形态，并在结果上标注这次是从 `execute_command` 拦截过来的。\n\n## 错误与处理\n\n- 非零退出、超时、工作目录不存在或不是目录、命令不被允许、超出命令数预算等都会失败。\n- 超时或非零退出时，结果里仍保留已收集到的输出，方便继续判断。\n- 管理员事件详情会额外给出最多 4 条诊断，每条含命令、序号、退出码和有界输出尾部；送给模型的失败信息会压成一句错误加下一步提示。失败摘要保留输出首尾各 3 行并报出总行数与省略行数，不只是留尾部；退出码 141 或 stderr 里出现 broken pipe 时，会说明这是下游 head/cut 关管道（SIGPIPE），不是命令本身失败。\n\n## Shell\n\n命令交给当前 shell 执行，工具描述末尾会写明是哪一个，模型据此决定语法：\n\n- **Windows 桌面版**优先用内置的便携版 `pwsh`（PowerShell 7）；探测失败才退到系统 `powershell.exe`（Win7 上是 2.0，Win10/11 是 5.1）；两者都用不了才退到 `cmd.exe`。即使没有先经过补充包 bootstrap，运行时也会从共享 home 和程序目录直接发现 `opt/powershell/pwsh.exe`，不会因为系统 shell 先被找到而改用系统版本；首次冷启动较慢时按补充包优先重试。\n- **Linux / macOS 桌面版**固定 bash，并自动加 `set -o pipefail`，管道中间一环失败不会被最后一条命令的成功掩盖。\n- **Android** 用 `/system/bin/sh`（mksh）。\n\n内置 pwsh 在补充包导入后立即可用，不需要重启应用。设置里也能显式指定：选 `cmd` 就只用 cmd，指定其他可执行文件会作为 PowerShell 主机候选。\n\n如果探测不到可用的 PowerShell、但机器上确实装着 `pwsh`，工具描述会直接说明「当前是 cmd.exe，需要 PowerShell 时可以显式调用 `pwsh`」，不会让模型误以为整机没有 PowerShell。\n","source_path":"使用说明书/zh-CN/tools/exec.md"}</script>
