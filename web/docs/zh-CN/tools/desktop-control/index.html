  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/desktop-control","language":"zh-CN","title":"桌面控制","summary":"桌面控制的启用条件、坐标与 17 个动作（含 wait 观察）、截图追加给模型的方式、失败判定与回滚边界。","updated_at":"2026-10-18","read_when":[],"source_docs":[],"tab":"工具","group":"桌面","group_path":["桌面"],"url":"/docs/zh-CN/tools/desktop-control/","headings":[{"id":"section-1","level":1,"text":"桌面控制"},{"id":"section-2","level":2,"text":"前置条件"},{"id":"section-3","level":2,"text":"参数"},{"id":"section-4","level":2,"text":"等待与观察"},{"id":"section-5","level":2,"text":"自动行为"},{"id":"section-6","level":2,"text":"错误与处理"},{"id":"section-7","level":2,"text":"限制"}],"prev_slug":"zh-CN/tools/multimodal-generation","next_slug":"zh-CN/tools/subagent-control","markdown":"# 桌面控制\n\n`桌面控制` 是给没有命令行或接口的图形界面目标准备的手段：能用命令、文件或浏览器工具解决时不要走它，它更慢、更易错，而且直接操作用户真实的屏幕。它同时负责**操作**与**观察**：注入鼠标/键盘动作后截图；只想看桌面当前状态、或确认上一步动作有没有生效时，用 `wait` 动作——先等待再截图，不注入任何输入。\n\n| 规范名 | 别名 |\n| --- | --- |\n| `桌面控制` | `desktop_control`、`desktop` |\n\n## 前置条件\n\n三条都满足才能用：\n\n1. 安装版本编译了桌面控制能力（默认不带）。\n2. 处于桌面模式，并显式打开桌面控制开关（默认关闭）。\n3. 当前模型支持视觉，否则桌面控制和读图工具都会被过滤掉。\n\n形态差异：蛹（桌面模式）默认把这个工具列入额外启用集；舰体、蜂巢、舵机形态下桌面控制不可用。\n\n## 参数\n\n一次调用要给出**位置**和**动作**：\n\n- 位置用归一化坐标：可以是 `[x1,y1,x2,y2]` 四元组，也可以是中心点的二元组。坐标基于默认 `1000×1000` 的归一网格，运行时取中心后线性映射到真实屏幕像素。\n- 动作有 17 个：`left_click`、`left_double_click`、`right_click`、`middle_click`，`left_hold` / `right_hold` / `middle_hold` 与其对应的 `left_release` / `right_release` / `middle_release`，`scroll_down` / `scroll_up`，`press_key`、`type_text`、`wait`、`move_mouse`、`drag_drop`。\n- 相关参数：按键用 `key`，输入文本用 `text`，等待用 `delay_ms`，拖动时长用 `duration_ms`（不给时按约 400 毫秒平滑拖动），滚动步数用 `scroll_steps`，拖动终点用 `to_bbox`，观察备注用 `note`。\n\n也接受宽松别名：`keyboard`→`press_key`、`send_text`→`type_text`、`sleep` / `observe` / `screenshot`→`wait`、`move`→`move_mouse`、`drag`→`drag_drop`，连字符和空格会自动归一。未知动作会报“未知动作”。\n\n动作描述会回显在动作结果中，缺省时用动作名本身。\n\n## 等待与观察\n\n`wait` 动作读取桌面窗口与屏幕状态。给出等待时长（`delay_ms`，0–30000 毫秒，超过会被夹到 30000），可以附一句观察备注（`note`），备注会原样回显。等待参数也接受 `wait_ms`、`wait` 等写法，等待结束后截图。这个等待是实际观察语义，不是提示动画。\n\n## 自动行为\n\n- **每次动作后都会截一张图。** 不返回动作前的屏幕状态，动作结果由紧随其后的视觉输入给出。\n- 成功返回后，编排器会用截图拼一条**用户角色的多模态消息**追加给模型：文字提示 + 动作前的截图（若有）+ 当前截图，模型看到的工具结果本身不含图像，画面是通过这条追加消息进来的。规划任务时按“一次动作 = 一次调用 + 一次看图”估算成本。单张截图进上下文上限 8 MiB，超出即失败。\n- 不再显示动作提示动画，也不会在动作前后增加动画等待；动作执行后立即捕获截图并返回观察回执。\n- 结果中的 `action_applied`、`screenshot_after_action` 和 `observation_ready` 表示动作已发出且当前截图可用于验证。应先检查截图，只有确认状态未变化时才重试相同动作。\n\n## 错误与处理\n\n- 没编译桌面控制能力：调用直接失败，并提示能力未启用。\n- 不是桌面模式、或没打开开关：返回“桌面控制已禁用”。\n- 参数缺失：位置、动作都是必填，缺哪个报哪个；位置格式不对会报非法坐标。\n- 截图失败：捕获超时默认 5000 毫秒（下限 100 毫秒），失败会向上报错。\n\n## 限制\n\n- **动作是真实输入注入，没有回滚。** `left_hold` 和 `left_release` 必须成对使用，否则鼠标状态可能残留；`drag_drop` 是按下、平滑移动、松开三步。\n- 坐标随分辨率变化，归一化坐标只保证同一次观察与动作之间一致；换屏或改分辨率后要重新观察。\n- 截图会另存一份到用户容器目录；持久化失败只记警告，不影响结果。\n- 截图目录按帧保留，只留最近几张（默认 3），避免临时文件无限堆积。\n- 判定遵循最小权限：需要用户显式开关，不静默常驻截屏，也不把系统能力暴露给远端。\n","source_path":"使用说明书/zh-CN/tools/desktop-control.md"}</script>
