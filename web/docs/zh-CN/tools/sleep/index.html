  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/sleep","language":"zh-CN","title":"会话让出","summary":"让智能体主动结束当前轮次、把控制权交还系统，等外部结果回来再继续。","updated_at":"2026-09-28","read_when":[],"source_docs":[],"tab":"工具","group":"UI and Automation","group_path":["UI and Automation"],"url":"/docs/zh-CN/tools/sleep/","headings":[{"id":"section-1","level":1,"text":"会话让出"},{"id":"section-2","level":2,"text":"什么时候用"},{"id":"section-3","level":2,"text":"怎么用"},{"id":"section-4","level":2,"text":"它和最终回复的区别"},{"id":"section-5","level":2,"text":"等待命令不要用它"}],"prev_slug":"zh-CN/tools/final-response","next_slug":"zh-CN/tools/thread-control","markdown":"# 会话让出\n\n会话让出表示「当前轮次先停在这里」，不是最终回复。用在一件事已经交给外部、需要等结果回来再接着做的时候。\n\n## 什么时候用\n\n- 需要明确告诉系统「这轮先停、等外部恢复」时用它。\n- 等待命令跑完不需要它。\n\n## 怎么用\n\n可以带一句说明，告诉系统这轮为什么先停：\n\n```json\n{\n  \"message\": \"已提交任务，等待外部结果\"\n}\n```\n\n## 它和最终回复的区别\n\n- 会话让出是把这一轮的控制权让出去，之后外部结果回来会再开新的一轮。\n- 最终回复是这一轮真的做完了、把结论交给你。\n\n## 等待命令不要用它\n\n独立的「休眠等待」工具已经移除。等命令跑完不需要它：命令执行默认会阻塞到有结果才返回；要等后台命令，用命令会话提供的等待窗口去取，别空转等待。\n","source_path":"使用说明书/zh-CN/tools/sleep.md"}</script>
