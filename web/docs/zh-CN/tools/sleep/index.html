  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/sleep","language":"zh-CN","title":"会话让出","summary":"`sessions_yield` 的语义与适用场景。","updated_at":"2026-09-28","read_when":["需要暂时让出当前轮次控制权、等待外部结果"],"source_docs":["src/services/tools/sessions_yield_tool.rs"],"tab":"工具","group":"UI and Automation","group_path":["UI and Automation"],"url":"/docs/zh-CN/tools/sleep/","headings":[{"id":"section-1","level":1,"text":"会话让出"},{"id":"section-2","level":2,"text":"最小参数"},{"id":"section-3","level":2,"text":"成功返回"},{"id":"section-4","level":2,"text":"使用场景"}],"prev_slug":"zh-CN/tools/final-response","next_slug":"zh-CN/tools/thread-control","markdown":"# 会话让出\n\n`sessions_yield` 表示：**当前轮次让出控制权，不是最终回复。**\n\n独立的 `sleep`（休眠等待）工具已移除：命令执行默认阻塞返回结果，等待后台命令请用 `command_session` 的 `yield_time_ms` 等待窗口，不要空转等待。\n\n## 最小参数\n\n```json\n{\n  \"message\": \"已提交任务，等待外部结果\"\n}\n```\n\n## 成功返回\n\n```json\n{\n  \"ok\": true,\n  \"action\": \"sessions_yield\",\n  \"state\": \"yielded\",\n  \"summary\": \"Yielded the current turn and is waiting.\",\n  \"data\": {\n    \"status\": \"yielded\",\n    \"message\": \"已提交任务，等待外部结果\"\n  },\n  \"meta\": {\n    \"turn_control\": {\n      \"kind\": \"yield\",\n      \"message\": \"已提交任务，等待外部结果\"\n    }\n  }\n}\n```\n\n## 使用场景\n\n- 需要明确告诉系统“这轮先停在这里、等待外部恢复”时使用。\n- 等待命令完成不需要它：`execute_command` 默认阻塞返回；后台命令用 `command_session` 轮询。\n","source_path":"使用说明书/zh-CN/tools/sleep.md"}</script>
