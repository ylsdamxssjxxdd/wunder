  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/workspace-files","language":"zh-CN","title":"工作区文件","summary":"列目录、搜内容、读片段、精确替换、整份写入五个动作的参数、匹配规则与失败判定。","updated_at":"2026-10-17","read_when":[],"source_docs":[],"tab":"工具","group":"工作区与代码","group_path":["工作区与代码"],"url":"/docs/zh-CN/tools/workspace-files/","headings":[{"id":"section-1","level":1,"text":"工作区文件"},{"id":"section-2","level":2,"text":"列出目录"},{"id":"section-3","level":2,"text":"搜索内容"},{"id":"section-4","level":2,"text":"读取文件"},{"id":"section-5","level":2,"text":"精确替换与文本编辑"},{"id":"section-6","level":2,"text":"整份写入"},{"id":"section-7","level":2,"text":"错误与处理"}],"prev_slug":"zh-CN/tools/panels","next_slug":"zh-CN/tools/exec","markdown":"# 工作区文件\n\n本地工作区里的五个常用动作对应五个工具：列目录 `list_files`、搜内容 `search_content`、读片段 `read_file`、精确替换 `edit`、整份写入 `write_file`。\n\n## 列出目录\n\n给一个路径就能列目录，可以限制往下看几层、一次返回多少条。目录项会带斜杠区分，条目多时分页；返回里会告诉你还有没有下一页，以及继续翻页要用的游标。\n\n## 搜索内容\n\n按关键词在目录里搜，返回命中的文件和位置。可以限定文件类型、是否大小写敏感或按正则匹配、命中前后各带几行上下文，也能限制最多命中多少条、最多扫多少个文件。结果被截断时会说明原因；只想先看看搜索计划、不实际跑，可以打开试运行。\n\n## 读取文件\n\n知道路径就读这一段：给起止行，一次读一个文件，也可以一次给多个文件和行段批量读。返回里把内容拼成可直接阅读的文本，并给每个文件的摘要；默认窗口放不下或预算被截断时，会提示需要继续读。\n\n## 精确替换与文本编辑\n\n`文本编辑`（英文别名 `edit`）统一处理字面替换、插入、新建和补丁：\n\n- 默认替换：传 `file_path`、非空 `old_string` 和 `new_string`；原文须唯一匹配，要全部替换须显式设 `replace_all=true`。`command=str_replace` 共用这套规则。\n- 原文须保持空格和缩进，不带读文件展示的行号。LF/CRLF 差异按目标文件统一换行风格归一化，其他空白不放宽匹配。\n- 删除须显式传 `new_string=\"\"`；遗漏或错误类型会报错。旧拼写 `path`、`old_str`、`new_str` 仍兼容；与主参数同时出现时，值必须一致。\n- 插入：`command=insert`，传 `file_path`、`insert_line`、`new_string`。在现有行后插入，行号从 1 开始，0 表示开头；末尾换行不多算一行。插入保留文件换行风格，输入自带末尾换行时不再额外添加空行。\n- 新建：`command=create`，传 `file_path`、`file_text`，目标已存在则失败。查看：`command=view`，传 `file_path`，文件可用 `view_range=[start,end]`，`end=-1` 表示末尾。\n- 多文件、多 hunk 修改使用 `input`，内容以 `*** Begin Patch` 开始、`*** End Patch` 结束，路径写在补丁内，无需另传 `file_path`；不要混用 `command` 或替换字段。\n- 所有写入方式均支持 `dry_run=true`：返回校验结果及有界差异预览，不写文件、不创建目录、不更新工作区版本。\n\n匹配为零时先读当前原文再修改参数；匹配多处时会给出命中数和最多 8 个行号，可增加上下文或明确全部替换。相同参数重试不会解决这些错误。内容没有变化时返回 `unchanged`，不重复写盘。\n\n需要正则或复杂条件逻辑时可用 [执行命令](/docs/zh-CN/tools/exec/) 写脚本；整份生成或覆盖使用 `write_file`。\n\n## 整份写入\n\n`write_file` 用来整份新建或覆盖一个文件。如果工作区里有对应的语言服务，写入时会顺带做一次诊断。它不适合小范围精确改代码（用补丁形态），也不用来跑脚本或构建（用 [执行命令](/docs/zh-CN/tools/exec/)）。\n\n## 错误与处理\n\n这几个工具失败时都会把原因放进结果里，重点看错误码、提示和附加数据，通常能直接看出是路径不存在、参数不对还是文件读不了。\n","source_path":"使用说明书/zh-CN/tools/workspace-files.md"}</script>
