  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/skill-call","language":"zh-CN","title":"技能调用","summary":"`skill_call` 的入参、返回正文的组装方式与 `{{SKILL_ROOT}}` 解析，以及四类即时失败。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"工具","group":"工作区与代码","group_path":["工作区与代码"],"url":"/docs/zh-CN/tools/skill-call/","headings":[{"id":"section-1","level":1,"text":"技能调用"},{"id":"section-2","level":2,"text":"返回结构"},{"id":"section-3","level":2,"text":"错误与处理"}],"prev_slug":"zh-CN/tools/exec","next_slug":"zh-CN/tools/web-fetch","markdown":"# 技能调用\n\n参数是技能名，`skill_call` 把该技能的正文加载进当前对话，让智能体按这套流程继续做事。\n\n```json\n{\n  \"name\": \"openai-docs\"\n}\n```\n\n## 返回结构\n\n- 把技能说明整理成适合模型阅读的样子，再放进上下文。\n- 明确给出技能的根目录；说明里用 `{{SKILL_ROOT}}` 占位的地方会被解析到这个根目录。\n- 顺带列出技能根目录下的第一层文件和文件夹，让智能体知道还有哪些附加资料可以按需再读。\n\n## 错误与处理\n\n技能名为空、技能不存在、技能名有歧义、技能文件读不出来，都会直接报错。这类错误是普通错误，不是需要等待的异步任务。\n","source_path":"使用说明书/zh-CN/tools/skill-call.md"}</script>
