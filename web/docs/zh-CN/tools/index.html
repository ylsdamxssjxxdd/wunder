  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/index","language":"zh-CN","title":"工具总览","summary":"wunder 的内置工具矩阵，按八个分类指向对应工具文档；选型入口、结果形态约定，以及不套统一外壳的几个例外。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"工具","group":"概览","group_path":["概览"],"url":"/docs/zh-CN/tools/","headings":[{"id":"section-1","level":1,"text":"工具总览"},{"id":"section-2","level":2,"text":"工具一览"},{"id":"section-3","level":2,"text":"按场景选工具"},{"id":"section-4","level":3,"text":"只有关键词，想找网页来源"},{"id":"section-5","level":3,"text":"只读网页正文"},{"id":"section-6","level":3,"text":"要点击、输入、等页面动态渲染"},{"id":"section-7","level":3,"text":"要看本地代码"},{"id":"section-8","level":3,"text":"要改代码"},{"id":"section-9","level":3,"text":"要做协作"},{"id":"section-10","level":2,"text":"按分类查文档"},{"id":"section-11","level":3,"text":"收尾与前端协同"},{"id":"section-12","level":3,"text":"工作区与代码"},{"id":"section-13","level":3,"text":"Web"},{"id":"section-14","level":3,"text":"多模态"},{"id":"section-15","level":3,"text":"桌面"},{"id":"section-16","level":3,"text":"线程与子智能体"},{"id":"section-17","level":3,"text":"系统与记忆"},{"id":"section-18","level":3,"text":"目标态"},{"id":"section-19","level":2,"text":"结果怎么读"},{"id":"section-20","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/concepts/core-multi-user-management","next_slug":"zh-CN/tools/panels","markdown":"# 工具总览\n\nwunder 的工具体系覆盖文件、命令、Web、桌面、协作、系统连接等场景。大多数内置工具的成功和失败结果都收敛到一套统一外壳，少数工具例外。\n\n## 工具一览\n\n模型看到的工具规范名大多为中文，另配英文别名，由 `resolve_tool_name` 归一（`crates/wunder-runtime/src/services/tools/catalog.rs`）。MCP 工具（`server@tool`）、技能名、知识库名与用户工具别名按配置动态注册，不在下表之列。\n\n| 工具（规范名） | 英文别名 | 简介 | 分类 |\n| :--- | :--- | :--- | :--- |\n| 计划面板 | `update_plan` | 向前端推送结构化的任务计划面板 | 收尾与前端协同 |\n| 问询面板 | `question_panel` | 弹出结构化选项，向用户提问并等待选择 | 收尾与前端协同 |\n| 会话让出 | `sessions_yield` | 主动让出当前回合控制权，稍后再被唤起 | 收尾与前端协同 |\n| 列出文件 | `list_files` | 列出目录内容 | 工作区与代码 |\n| glob | — | 按通配模式查找文件路径 | 工作区与代码 |\n| 搜索内容 | `search_content` | 在文件中按正则搜索匹配内容 | 工作区与代码 |\n| 读取文件 | `read_file` | 读取文件内容，支持分段读取 | 工作区与代码 |\n| 写入文件 | `write_file` | 写入或整体覆盖文件 | 工作区与代码 |\n| 文本编辑 | `edit` / `edit_file` | 精确替换 / 补丁 / 子命令三形态（`apply_patch` 已并入） | 工作区与代码 |\n| 执行命令 | `execute_command` | 执行 Shell / 系统命令 | 工作区与代码 |\n| 命令会话 | `command_session` | 管理后台长驻命令会话，支持前后台切换 | 工作区与代码 |\n| 技能调用 | `skill_call` | 读取技能正文并执行技能脚本 | 工作区与代码 |\n| 网页抓取 | `web_fetch` | 抓取并解析网页正文（需启用配置） | Web |\n| 浏览器 | `browser` | 聚合展示名；底层为 17 个 `browser_*` 原生工具（点击、输入、等待、截图等） | Web |\n| 读图工具 | `read_image` | 读取图片内容供模型理解（需 vision 能力） | 多模态 |\n| 图像生成 | `generate_image` | 按提示词生成图片 | 多模态 |\n| 视频生成 | `generate_video` | 按提示词生成视频 | 多模态 |\n| 语音生成 | `generate_speech` | 文本转语音 | 多模态 |\n| 声转文 | `transcribe_speech` | 语音转文字 | 多模态 |\n| 桌面监视器 | `desktop_monitor` | 读取桌面窗口与屏幕状态 | 桌面 |\n| 桌面控制器 | `desktop_controller` | 操作本机桌面（鼠标、键盘、窗口） | 桌面 |\n| 子智能体控制 | `subagent_control` | 在任务中临时派生子智能体，结果回传后回收 | 线程与子智能体 |\n| 会话线程控制 | `thread_control` | 管理任务线程 / 分支线程（桌面端不开放） | 线程与子智能体 |\n| 自我状态 | `self_status` | 查询智能体自身的运行状态 | 系统与记忆 |\n| 记忆管理 | `memory_manager` | 读写长期记忆 | 系统与记忆 |\n| 定时任务 | `schedule_task` | 创建与管理定时 / 周期任务 | 系统与记忆 |\n| get_goal / create_goal / update_goal | — | 目标态三件套，由运行时按会话自动注入，不对桌面端开放选择 | 目标态 |\n\n`网页搜索` 与 `ptc` 属代码保留、当前**临时下架**（对模型与用户不可见，见 `default_tool_profile.rs`），不是已移除。已彻底移除：渠道工具、用户世界工具、`a2a_*` 工具、`final_response`、`a2ui`、LSP 查询类工具。\n\n## 按场景选工具\n\n### 只有关键词，想找网页来源\n\n网页搜索当前临时下架；手上有明确的 URL 时，直接用 [网页抓取](/docs/zh-CN/tools/web-fetch/) 读正文。\n\n### 只读网页正文\n\n先用 [网页抓取](/docs/zh-CN/tools/web-fetch/)，不要一上来就用浏览器。\n\n### 要点击、输入、等页面动态渲染\n\n用 [浏览器](/docs/zh-CN/tools/browser/)。\n\n### 要看本地代码\n\n通常顺序是：先用 [工作区文件](/docs/zh-CN/tools/workspace-files/) 列目录或搜索，再读片段。\n\n### 要改代码\n\n- 小而精确、带上下文匹配的修改：用 `文本编辑` 的补丁形态\n- 一次精确文本替换：用 [工作区文件](/docs/zh-CN/tools/workspace-files/) 里的 `文本编辑`\n- 复杂替换逻辑：用 [执行命令](/docs/zh-CN/tools/exec/) 跑脚本\n- 整文件重写：用 [工作区文件](/docs/zh-CN/tools/workspace-files/) 里的 `write_file`\n- 要编译、测试、跑脚本：用 [执行命令](/docs/zh-CN/tools/exec/)\n\n### 要做协作\n\n- 当前会话里临时拉起子运行：用 [子智能体控制](/docs/zh-CN/tools/subagent-control/)\n- 管理任务线程 / 分支线程：用 [会话线程控制](/docs/zh-CN/tools/thread-control/)\n\n## 按分类查文档\n\n### 收尾与前端协同\n\n- 计划面板 / 问询面板 / 会话让出：[计划面板 / 问询面板 / 会话让出](/docs/zh-CN/tools/panels/)\n\n### 工作区与代码\n\n- 列出文件 / glob / 搜索内容 / 读取文件 / 写入文件 / 文本编辑：[工作区文件](/docs/zh-CN/tools/workspace-files/)\n- 执行命令 / 命令会话：[执行命令](/docs/zh-CN/tools/exec/)\n- 技能调用：[技能调用](/docs/zh-CN/tools/skill-call/)\n\n### Web\n\n- 网页抓取：[网页抓取](/docs/zh-CN/tools/web-fetch/)\n- 浏览器：[浏览器工具族](/docs/zh-CN/tools/browser/)\n\n### 多模态\n\n- 读图工具：[读图工具](/docs/zh-CN/tools/read-image/)\n- 图像生成 / 视频生成 / 语音生成 / 声转文：[多模态生成](/docs/zh-CN/tools/multimodal-generation/)\n\n### 桌面\n\n- 桌面监视器 / 桌面控制器：[桌面控制](/docs/zh-CN/tools/desktop-control/)\n\n### 线程与子智能体\n\n- 子智能体控制：[子智能体控制](/docs/zh-CN/tools/subagent-control/)\n- 会话线程控制：[会话线程控制](/docs/zh-CN/tools/thread-control/)\n\n### 系统与记忆\n\n- 自我状态：[自我状态](/docs/zh-CN/tools/self-status/)\n- 记忆管理：[记忆管理](/docs/zh-CN/tools/memory-manager/)\n- 定时任务：[定时任务](/docs/zh-CN/tools/schedule-task/)\n\n### 目标态\n\n- `get_goal` / `create_goal` / `update_goal`：由运行时按会话自动注入，不对桌面端开放选择。\n\n## 结果怎么读\n\n大多数内置工具成功时返回一套统一外壳：是否成功、动作名、状态、一句摘要，以及承载业务结果的数据区。业务结果优先在数据区里取。部分工具还会再补一句“下一步该怎么做”。\n\n常见的状态包括：已完成、仅预演、已接收、运行中、已让出、等待输入、部分完成、超时、无改动。超时不一定代表彻底失败。\n\n失败时也走统一外壳：一句错误、可读的原因说明和修复提示，以及能帮助定位的数据。\n\n几个不套统一外壳的例外：\n\n- **最终回复**（已移除）：只是终结信号，只回一条给用户的答案。\n- **定时任务**：返回压缩后的调度结果。\n- **浏览器工具组**：结果采用内容块结构（见 [浏览器](/docs/zh-CN/tools/browser/)）。\n- **网页搜索**（临时下架）：曾用于关键词搜公开网页，结果在数据区的 `results` 里；现在要正文直接用网页抓取。\n- **网页抓取**：成功时直接返回抓取结果对象。\n- **文本编辑**（旧名 `apply_patch`）：成功走统一外壳；补丁形态失败时，错误语义比普通文件工具更严格。\n\n## 延伸阅读\n\n- 文件和代码的读写：[工作区文件](/docs/zh-CN/tools/workspace-files/)\n- 子智能体的派生与回收：[子智能体控制](/docs/zh-CN/tools/subagent-control/)\n- 单个工具的返回：见对应工具页\n","source_path":"使用说明书/zh-CN/tools/index.md"}</script>
