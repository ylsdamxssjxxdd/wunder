  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/schedule-task","language":"zh-CN","title":"定时任务","summary":"让智能体按时间自动干活：创建、修改、查询、立即执行和启停定时任务。","updated_at":"2026-10-02","read_when":[],"source_docs":[],"tab":"工具","group":"系统与记忆","group_path":["系统与记忆"],"url":"/docs/zh-CN/tools/schedule-task/","headings":[{"id":"section-1","level":1,"text":"定时任务"},{"id":"section-2","level":2,"text":"什么时候用"},{"id":"section-3","level":2,"text":"怎么用"},{"id":"section-4","level":2,"text":"任务跑在哪个线程"},{"id":"section-5","level":2,"text":"循环任务会不会越堆越多"},{"id":"section-6","level":2,"text":"出问题时怎么判断"}],"prev_slug":"zh-CN/tools/memory-manager","next_slug":"zh-CN/tools/extensibility","markdown":"# 定时任务\n\n定时任务让某件事到点自动发生（定时巡检、周期提醒、跨渠道消息处理），支持创建、修改、查询、立即执行和启停。\n\n## 什么时候用\n\n- 某件事不该只做一次，而该按固定节奏反复做。\n- 某件事要在指定时刻自动跑一次。\n\n## 怎么用\n\n参数是动作和任务内容。平铺字段的写法：\n\n```json\n{\n  \"action\": \"add\",\n  \"job_id\": \"job_daily_report\",\n  \"name\": \"日报提醒\",\n  \"schedule_text\": \"every 5 minutes\",\n  \"message\": \"请生成日报\",\n  \"session\": \"main\",\n  \"enabled\": true\n}\n```\n\n需要精确控制时间时，改用嵌套的时间规则，可以写 cron 表达式并指定时区：\n\n```json\n{\n  \"action\": \"add\",\n  \"job_id\": \"job_cron_demo\",\n  \"schedule\": { \"kind\": \"cron\", \"cron\": \"*/5 * * * *\", \"tz\": \"Asia/Shanghai\" },\n  \"message\": \"执行巡检\",\n  \"session\": \"isolated\"\n}\n```\n\n支持的动作有：`add`（新建）、`update`（修改）、`remove`（删除）、`enable` / `disable`（启停）、`get`（查看单个）、`list`（列表）、`run`（立即执行一次）、`status`（调度器状态）。\n\n常用字段：\n\n- `action`：要做的动作。\n- `job_id`：任务标识，修改、删除、启停、立即执行、查询时都用它。\n- `name`：任务的展示名称。\n- `schedule_text`：时间规则，写自然语言或 cron 文本都行。\n- `schedule`：只在需要精确表达「某时刻 / 每隔多久 / cron」时用。\n- `message`：到点后发给智能体的消息。\n- `session`：任务在哪个线程里跑，只支持 `main` 或 `isolated`。\n- `enabled`：创建后是否立刻启用。\n\n## 任务跑在哪个线程\n\n`session` 决定这件事发生在哪：\n\n- `main`：在任务绑定的线程里执行。默认绑定你创建任务时所在的那个线程，之后切页面、开新线程或别的线程变活跃都不会改变绑定。忙碌时排进统一任务队列，也可以从绑定线程里把它停掉。\n- `isolated`：在绑定线程下新开一个干净的子线程来跑。跑完的结果作为一条独立的「已完成轮次」投回绑定线程，而不是当成新的用户指令再喂给模型；子线程和结果轮次各有自己的标识，出错也不会写进上一轮的助手气泡。\n\n如果绑定的线程被归档、删除，或者归属的智能体对不上，任务会明确失败，不会随便挑别的线程顶替。\n\n## 循环任务会不会越堆越多\n\n不会。它更像「保最新节奏」，而不是「把漏掉的次数都补跑回来」：\n\n- 同一个循环任务同一时刻最多只有一个执行在跑。\n- 就算写成每秒一次、但单次执行远超一秒，也不会并发堆出一堆相同任务。\n- 错过的间隔会被跳过或折叠，下一次执行时间按当前时间重新往后推。\n\n## 出问题时怎么判断\n\n- `run` 返回 `queued: true` 只是说异步执行已经受理，不代表已经做完。别在创建任务的那一轮里反复查询等它；先结束当前回复，让队列自己跑。\n- 查询任务时能看到它绑定的线程、是否正在运行、上次结果和上次错误；展示的是本地时区时间、执行规则和绑定线程，原始结果仍保留在线程日志里。\n- 时间规则同时给了 `schedule_text` 和 `schedule` 时，以 `schedule` 为准；最小间隔是 1 秒。参数必须是完整的 JSON，没闭合会直接报参数无效。\n- 服务端要先开启定时调度。关闭时，创建、更新、启用和手动运行会返回明确错误，但任务列表仍能读取并显示调度器状态；已经在运行的服务需要重载配置或重启才会采用改动。\n- 定时执行沿用所属用户和智能体的审批模式、模型、工具能力和工作区配置。独立线程会保留绑定线程显式的工具限制，并冻结自己一开始的工具基线，仍然受用户工具权限约束——需要审批的智能体不会因为定时触发就变成全自动。\n","source_path":"使用说明书/zh-CN/tools/schedule-task.md"}</script>
