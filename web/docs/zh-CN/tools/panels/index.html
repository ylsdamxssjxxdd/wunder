  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/panels","language":"zh-CN","title":"计划面板 / 问询面板","summary":"两个交互控制工具的别名、各自的入参上限与归一写法，以及操作时生效的替换 / 结束语义。","updated_at":"2026-11-13","read_when":[],"source_docs":[],"tab":"工具","group":"收尾与前端协同","group_path":["收尾与前端协同"],"url":"/docs/zh-CN/tools/panels/","headings":[{"id":"section-1","level":1,"text":"计划面板 / 问询面板"},{"id":"section-2","level":2,"text":"计划面板"},{"id":"section-3","level":2,"text":"问询面板"},{"id":"section-4","level":2,"text":"错误与处理"},{"id":"section-5","level":2,"text":"限制"}],"prev_slug":"zh-CN/tools/index","next_slug":"zh-CN/tools/workspace-files","markdown":"# 计划面板 / 问询面板\n\n两个工具同属“交互控制”类，都不产生业务副作用，只改变前端呈现或当前轮次的结束方式。\n\n| 规范名 | 别名 |\n| --- | --- |\n| `计划面板` | `update_plan` |\n| `问询面板` | `question_panel`、`ask_panel` |\n\n独立的“休眠等待”工具已删除；需要延时或周期执行请用 [定时任务](/docs/zh-CN/tools/schedule-task/)。\n\n## 计划面板\n\n任务要多步、而且用户要看进度时，用它建立并维护执行清单。一次就能做完的事不要建计划。\n\n只有一种规范写法：`{\"plan\":[{\"step\":\"甲\",\"status\":\"in_progress\"},{\"step\":\"乙\",\"status\":\"pending\"}]}`，每一步是对象，必带 `step` 与 `status`；可以再附一句 `explanation`。早期并列宣传的字符串数组 + `current` 形态已从 schema 与工具说明里撤下（仍能被读入），同时给了 `current` 和 `status` 时以 `status` 为准，不再报冲突——少一种写法，就少一次“两种形态混着用”的重试。\n\n调用时机是固定的三步：任务开工时建清单（正在做的那步标 `in_progress`）；每完成一步立刻带同一份完整清单再调一次，把做完的标 `completed`、下一项标 `in_progress`；全部做完后再调一次、**每一步都标 `completed`**：输入框上方的计划胶囊这时会打钩并停住，用户接着问下一个问题时它也不会再转。只在收尾时补一次等于没维护，用户中途看到的进度就是错的。\n\n计划是一组步骤，1 到 12 项，每项是“步骤 + 状态”；某一步没有文字会直接报错并指出是第几项，不会静默丢掉。状态有 `pending` / `in_progress` / `completed`，也接受 `in-progress`、`done`、`complete`、`进行中`、`已完成` 等写法归一。步骤文字可以用 `step`，也接受 `title` / `content` / `text`；列表本身的键名可以是 `plan`、`steps`、`todos`、`items`。可以附一句计划变更说明。\n\n调用是**全量替换**，不是增量补丁。**同一时刻只允许一个进行中**，标了两个会报错并列出是哪几项。\n\n计划为空、或全部步骤被丢弃时会报错。形状与语义是两套规则：形状容错——整份参数被写成字符串（文本/XML 协议下常见的 `input`、`raw` 包装）、或 `plan` 列表被写成字符串时会被自动解开；字符串里手写 JSON 时常见的漏字符（`[` 后面漏了 `{\"`，变成 `[step\": …`）也会在修复通道里补回，调用照常成功，不必重发；语义不容错——未知字段、未知状态、两个 `in_progress` 都会**直接报错并指出位置**（如 `plan[1].status`），列出的合法值就在报错里。静默忽略参数比失败危险得多：模型会以为写成功，把错误状态一路带下去。解不开的整份参数会回出唯一形态的示例和解析器定位，照着那一处改，不要照原样重试。\n\n参数错误统一走失败外壳：`ok:false`，`error` 是人读的一句话，`data` 里带 `field` / `received` / `allowed` / `example` 定位，`error_meta.code` 是 `TOOL_PLAN_UNKNOWN_FIELD`、`TOOL_PLAN_UNKNOWN_STATUS`、`TOOL_PLAN_CONFLICT`、`TOOL_PLAN_INVALID_JSON` 之一，`retryable` 为真——按报错改字段后立刻重试即可，不必换一种猜法。`TOOL_PLAN_INVALID_JSON` 会带上 JSON 解析器给出的行列定位（如 `expected `:` at line 1 column 15`）和收到的原文片段，直接照着那一处改括号或引号，不要改外层包装。\n\n回执是给模型看的状态卡，不是给用户的文案：它带 `completed` / `total` / `current_step` / `next_step`，还没做完时 `data.hint` 里会有一句“继续维护面板”（没有 in_progress 时会明确提示补上）。模型侧的通用投影会剥掉外层 `summary`，所以提醒放在 `data` 里才稳。计划本身通过前端事件推给用户，不会进入模型上下文，所以模型不能指望“下一轮还记得清单”，需要以回执里的进度为准。\n\n## 问询面板\n\n存在多条合理路线、需要用户拍板再动手时用它。开面板就是**把当前轮次交给用户**，不要在同一轮里继续假设答案。\n\n可以问 1 到 4 个问题，每个问题配 1 到 4 个选项；选项可以是“标签 + 描述 + 是否推荐”，也可以直接给字符串。每个问题可以设成多选，默认单选。兼容旧的单题扁平写法（顶层直接给问题、选项和是否多选）。选项标签里含“推荐”，或标了推荐标志的，会被识别为推荐项。\n\n只有一种规范写法：`{\"questions\":[{\"question\":\"要决定什么？\",\"options\":[\"甲\",\"乙\"]}]}`，`questions` 是唯一的顶层字段，只有一题也用单元素数组。形状容错与计划面板同一套：整份参数被写成字符串（`input` / `raw` / `arguments` 包装）、`questions` 本身被写成 JSON 字符串、或直接传一个数组，都会被自动解开，调用照常成功；`questions` 也接受 `question` / `items` 等别名，单题只给一个选项（字符串或对象）、`multiple` / `recommended` 写成字符串布尔值也都能读。真解不开时才报错，报错会指出是哪个字段、解析器定位在哪、收到的是什么，并附唯一形态的示例。工具描述与参数说明里直接带了示例，正常情况下第一次调用就该通过。\n\n超过 4 个问题只取前 4 个；**没有任何选项的问题会被整题丢弃**；全部丢弃后就报错。被丢弃的题不会静默消失：返回的 `dropped_questions` 和提示里会说清第几题、缺什么、实际带了哪些字段。选项也可以写成用 `|` 或「，」分隔的一整串。\n\n面板以“保持打开”的方式发出，本轮就此收尾，最终给用户的文案是“等待用户在问询面板里作答”，停止原因记为问询面板：**开面板 = 本轮结束，等用户下一条消息**。\n\n## 错误与处理\n\n两者都走统一失败外壳。最常见的失败是参数校验：计划面板的空计划、问询面板没有可用选项，以及参数结构不对导致的解析错误。\n\n## 限制\n\n- 面板不鉴权、不审批：它们只管呈现和轮次控制，和写文件、执行命令的审批档位无关。\n- 计划和问询的结果都很薄，目的是少占上下文；不要把详细内容塞进说明里让模型重复读回。\n- 前端断流时面板事件可能不渲染，但**轮次结束语义仍然生效**——问询之后，不要指望同一轮继续。\n- 上限：计划项最多 12、问题最多 4、每题选项最多 4，超出部分会被拒绝或裁剪。\n","source_path":"使用说明书/zh-CN/tools/panels.md"}</script>
