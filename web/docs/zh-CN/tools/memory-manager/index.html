  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/memory-manager","language":"zh-CN","title":"记忆管理","summary":"管理当前智能体在当前用户下的长期记忆碎片：列出、搜索、读取、新增、更新、删除，以及“短索引注入 + 按需取全文”的用法。","updated_at":"2026-04-12","read_when":[],"source_docs":[],"tab":"工具","group":"系统与记忆","group_path":["系统与记忆"],"url":"/docs/zh-CN/tools/memory-manager/","headings":[{"id":"section-1","level":1,"text":"记忆管理"},{"id":"section-2","level":2,"text":"使用原则"},{"id":"section-3","level":2,"text":"各个动作"},{"id":"section-4","level":2,"text":"边界"}],"prev_slug":"zh-CN/tools/self-status","next_slug":"zh-CN/tools/schedule-task","markdown":"# 记忆管理\n\n`memory_manager` 用来管理当前智能体在当前用户作用域下的长期记忆。\n\n支持的动作：`list`、`search`、`get`、`add`、`update`、`remove`、`clear`。\n\n## 使用原则\n\n- 系统提示里默认只注入一条短索引（记忆 id + 标题），**不会**把完整内容一起塞进去。\n- 需要细节时，先用 `list` / `search` 找到记忆 id，再用 `get` 取全文。\n- 记忆 id 尽量保持在 8 个字符以内，方便搜索和定位。\n- `add` / `update` 只用当前的核心字段：标题、内容、标签、关联记忆 id、记忆时间。\n\n## 各个动作\n\n- `list`：返回最近的记忆索引，默认 30 条。每条包含 id、标题、标签和更新时间。\n- `search`：按标题或内容匹配，默认 10 条。命中项会给出片段，以及是在标题还是内容里匹配到的。\n- `get`：按 id 读取完整内容，还会带上关联记忆 id 和记忆时间。\n- `add`：新增一条，把标题、内容、标签、记忆时间一起给。\n- `update`：按 id 更新。\n- `remove`：按 id 删除。\n- `clear`：清空。\n\n写入示例：\n\n```json\n{\n  \"action\": \"add\",\n  \"title\": \"用户姓名\",\n  \"content\": \"用户的名字是周华健。这是用户在对话开始时自我介绍提供的信息。\",\n  \"tag\": \"profile\",\n  \"memory_time\": \"2026-04-12T08:37:00+08:00\"\n}\n```\n\n## 边界\n\n- 旧的 `summary`、`tags`、`entities`、`category` 不再作为推荐输入。\n- `list` / `search` 是主检索动作，`get` 是唯一的完整详情读取动作。\n- 写入只影响后续新线程，不会回写已经冻结线程的系统提示。\n","source_path":"使用说明书/zh-CN/tools/memory-manager.md"}</script>
