  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/thread-control","language":"zh-CN","title":"会话线程控制","summary":"让智能体同时推进多件事：新建、切换、改名、归档和恢复任务线程。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"工具","group":"线程与子智能体","group_path":["线程与子智能体"],"url":"/docs/zh-CN/tools/thread-control/","headings":[{"id":"section-1","level":1,"text":"会话线程控制"},{"id":"section-2","level":2,"text":"什么时候用"},{"id":"section-3","level":2,"text":"怎么用"},{"id":"section-4","level":2,"text":"它自动处理了什么"},{"id":"section-5","level":2,"text":"出问题时怎么判断"},{"id":"section-6","level":2,"text":"形态差异"},{"id":"section-7","level":2,"text":"相关页面"}],"prev_slug":"zh-CN/tools/subagent-control","next_slug":"zh-CN/tools/self-status","markdown":"# 会话线程控制\n\n工具名 `会话线程控制`，别名 `thread_control`、`session_thread`。\n\n一个智能体可以同时挂多条独立的任务线程，调度、锁和实时状态都按线程隔开。它管的是任务线程本身；子智能体那种「临时派生、跑完回收」的工作单元不归它管，见 [子智能体控制](/docs/zh-CN/tools/subagent-control/)。\n\n## 什么时候用\n\n- 用户提的是另一件独立的事，应该新开一条线程来承载，而不是在当前线程里接着做。\n- 需要在线程之间切换、回到父线程，或给线程改名。\n- 需要归档、恢复某条线程，或查看它的祖先和子线程。\n\n## 怎么用\n\n一次调用指定一个动作：\n\n- `list`：按范围列出线程。\n- `info`：看单条线程的详情，连同它的父线程和直接子线程。\n- `create`：新建线程，默认继承父线程的智能体和工具覆盖。\n- `switch`：切到指定线程。\n- `back`：切回当前线程的父线程。\n- `update_title`：改标题。\n- `archive` / `restore`：归档 / 恢复。\n\n可用字段有 `session_id`（目标线程，默认当前线程）、`parent_session_id`（只在新建时用，默认当前线程）、`title`（新建或改名；新建不填时默认叫「新会话」）、`scope`、`status`、`limit`。\n\n`scope` 决定列出哪些：\n\n- `branch`（默认）：从根到当前的祖先链，加上当前线程和它的直接子线程，每条会标明是祖先、当前还是子线程。\n- `children`：目标线程的直接子线程。\n- `roots`：没有父线程的根线程。\n- `all`：按状态和智能体范围的全部线程。\n\n列表里的每条线程能看出来是哪条、什么状态、最近一条消息是什么时候。其中「运行状态」取自内存里的实时监视，和持久化的「活跃 / 归档」不是一个口径。\n\n## 它自动处理了什么\n\n- 新建的线程会继承父线程的智能体和工具覆盖。\n- 归档、恢复、切换之后会把改动写库，并刷新这条会话的修改时间。\n- 归档时如果同时要切走，会在同智能体下挑一条其它的活跃线程切过去。\n\n## 出问题时怎么判断\n\n- 没带用户标识、目标线程不存在、改名没给标题、当前线程没有父线程却要切回父线程，都会报明确错误。\n- 查看详情、切换、归档、恢复都会校验智能体归属；显式指定的智能体对不上目标线程时会被判权限拒绝。\n- 列表最多 200 条，展开子线程也受同一个上限约束。\n- 归档的「顺手切走」只在开启了切换、且同智能体下确实有其它活跃线程时发生，而且挑的是列表里的第一条别的线程，不保证正好是你想要的那条。\n- 改名会把非归档线程的状态强制拉回活跃。\n- 切线程不等于切工作：调度和锁按线程隔离，切过去的线程如果正在运行，它的状态在实时监视里能看到。\n- 它不删除线程，归档是可逆的，用恢复就能回来。\n\n## 形态差异\n\n蜂窝把这个工具列为系统级隐藏工具，既不在默认集里，也不在桌面可选集里；蜂巢、舰体、舵机则按管理员的勾选结果暴露。\n\n## 相关页面\n\n- 临时派生工作单元：[子智能体控制](/docs/zh-CN/tools/subagent-control/)\n- 线程与轮次模型：[核心概念 · 会话与轮次](/docs/zh-CN/concepts/sessions-and-rounds/)\n","source_path":"使用说明书/zh-CN/tools/thread-control.md"}</script>
