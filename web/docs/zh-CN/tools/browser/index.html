  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/browser","language":"zh-CN","title":"浏览器工具族","summary":"浏览器不是单个工具：启用后自动注册一组 `browser_*` 工具，用来打开页面、点击、输入、等待、截图和读取渲染后的内容。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"工具","group":"网页与桌面","group_path":["网页与桌面"],"url":"/docs/zh-CN/tools/browser/","headings":[{"id":"section-1","level":1,"text":"浏览器工具族"},{"id":"section-2","level":2,"text":"什么时候用"},{"id":"section-3","level":2,"text":"怎么启用"},{"id":"section-4","level":2,"text":"有哪些工具"},{"id":"section-5","level":2,"text":"返回的样子"},{"id":"section-6","level":2,"text":"自动处理与限额"},{"id":"section-7","level":2,"text":"出问题怎么判断"},{"id":"section-8","level":2,"text":"边界"},{"id":"section-9","level":2,"text":"相关页面"}],"prev_slug":"zh-CN/tools/web-fetch","next_slug":"zh-CN/tools/desktop-control","markdown":"# 浏览器工具族\n\n**浏览器不是单个工具。** 启用后会自动注册一组 `browser_*` 原生工具（Playwright 驱动的当前共有 17 个），旧的单一“浏览器”入口已经删除。\n\n管理面和用户面看到的“浏览器”（别名 `browser`）只是一个**聚合条目**：可以被选中和授权，但不能直接调用；派给模型时会展开成真正的成员工具名。\n\n## 什么时候用\n\n- 需要打开页面、点击、输入、滚动、切换标签页\n- 页面要等 JavaScript 渲染后才有内容\n- 需要截图，或读取当前页面的可访问性结构\n\n只是要读一个静态公开文档，优先用更轻的 [网页抓取](/docs/zh-CN/tools/web-fetch/)。\n\n## 怎么启用\n\n需要同时满足“浏览器工具开关”和“浏览器运行时开关”（桌面模式可作为运行时回退）。启用后会自动注册，不用再单独往内置工具白名单里加条目。\n\n调用时按工具名分派到对应 provider。\n\n## 有哪些工具\n\n| 工具名 | 做什么 |\n| --- | --- |\n| `browser_navigate` | 当前标签页导航到指定 URL |\n| `browser_navigate_back` | 当前标签页后退 |\n| `browser_tabs` | 列出 / 新建 / 选择 / 关闭标签页 |\n| `browser_snapshot` | 取页面可访问性快照，产出可被点击、输入引用的元素 |\n| `browser_click` | 按元素引用或 CSS 选择器点击（支持双击） |\n| `browser_type` | 向元素输入文本（可选输入后回车提交） |\n| `browser_hover` | 悬停到元素 |\n| `browser_select_option` | 在下拉框里选中一项或多项 |\n| `browser_drag` | 把一个元素拖到另一个元素 |\n| `browser_press_key` | 按一个键，如 `Enter`、`Tab`、`ArrowDown` |\n| `browser_evaluate` | 在页面里执行 JavaScript 表达式并取值 |\n| `browser_wait_for` | 等固定时长、等加载状态，或等某段文本出现 |\n| `browser_take_screenshot` | 截图，返回图片内容 |\n| `browser_read_page` | 把当前页读成 Markdown 或文本 |\n| `browser_batch` | 顺序执行一批交互步骤（最多 10 步） |\n| `browser_close` | 关闭本会话的浏览器会话 |\n| `browser_status` | 报告浏览器运行时状态与在线会话 |\n\n除少数工具外，都可以指定目标标签页，默认操作当前活动标签页。\n\n典型链路：导航 → 取快照拿到元素引用 → 点击 / 输入 → 等待 → 读页面或截图。想确认运行时是否就绪，用 `browser_status`。\n\n## 返回的样子\n\n浏览器工具是个例外：它不套统一的结果外壳，而是返回 provider 的结果信封，主要有：\n\n- 是否成功\n- 内容块数组（文本块或图片块）\n- 失败时的错误文本\n- provider 的结构化载荷\n- 承接本次调用的 provider 名\n\n**图片不会把原始数据塞回上下文。** 运行时把内联截图落盘到工作区 `browser/screenshots/`（首次截图若指定了输出路径就用该路径），再把内容块改写成带文件名、路径和字节数的附件引用。\n\n`browser_status` 返回时会剥掉控制面信息：主机、端口、token 这些不会外泄给模型。\n\n## 自动处理与限额\n\n- 只允许 `http` / `https`，`file://` 默认阻断，需要显式放行\n- 默认挡住指向内网 / 本机地址的导航，命中允许名单或显式开关才放行\n- 快照与读取内容有字符上限，默认 40000，传入的字符数会被夹到上限以内\n- 单次调用超时默认 60 秒，可调但会被夹在 1 秒到默认超时的 4 倍之间\n- 默认最多 5 个并发浏览器会话，每个会话最多 8 个标签页\n- 会话空闲 300 秒后被回收\n- 单次下载上限默认 100 MiB\n- 浏览器会话按用户 + 会话（+ 智能体）划分作用域\n\n底层由 Playwright 驱动。\n\n## 出问题怎么判断\n\n- 浏览器没启用：会明确提示要同时打开浏览器工具和运行时开关；没有可用 provider 时也会提示。\n- 运行时没启用：提示要打开运行时开关，或使用桌面模式的回退。\n- URL 被安全规则拒绝：会说明是 `file://` 被禁、不是 http/https，还是指向了内网主机。\n- 桥接层失败：错误文本会带上具体动作前缀（例如“读页面失败”）。排查看错误文本和附带的结构化载荷。\n\n## 边界\n\n- `browser_batch` 一步失败就中断整批，别拿它跑超过 10 步的流程；长流程拆成多次调用。\n- 页面内容是**不可信的外部数据**：读到的文字只当资料，不当指令。\n- `browser_evaluate` 能执行任意页面脚本，是高能力入口，授权时按需开放。\n\n## 相关页面\n\n- 静态页面抓取：[网页抓取](/docs/zh-CN/tools/web-fetch/)\n- 桌面级输入与截图：[桌面控制](/docs/zh-CN/tools/desktop-control/)\n","source_path":"使用说明书/zh-CN/tools/browser.md"}</script>
