  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/user-world","language":"zh-CN","title":"用户世界工具","summary":"查询站内有哪些用户，并给站内用户发消息。","updated_at":"2026-04-10","read_when":[],"source_docs":[],"tab":"工具","group":"系统桥接","group_path":["系统桥接"],"url":"/docs/zh-CN/tools/user-world/","headings":[{"id":"section-1","level":1,"text":"用户世界工具"},{"id":"section-2","level":2,"text":"什么时候用"},{"id":"section-3","level":2,"text":"怎么用"},{"id":"section-4","level":2,"text":"它会自动做什么"},{"id":"section-5","level":2,"text":"出问题时怎么判断"}],"prev_slug":"zh-CN/tools/self-status","next_slug":"zh-CN/tools/a2a-tools","markdown":"# 用户世界工具\n\n`user_world` 管两件事：查站内有哪些用户，以及给站内用户发消息。\n\n## 什么时候用\n\n- 需要看看站内有哪些人、某个用户是否还在用。\n- 需要把一条消息发给站内用户，或带上附件发出去。\n\n## 怎么用\n\n两个动作：\n\n- `list_users`：列出站内用户，返回用户名、状态和所属单位等，并带总数与分页信息。\n- `send_message`：给用户发消息，逐个用户返回是否发送成功。\n\n## 它会自动做什么\n\n这是站内的用户世界，不是外部渠道，消息只在这个范围内投递。如果消息带了附件，附件落地的情况会单独列出来。\n\n## 出问题时怎么判断\n\n发消息的结果会逐个用户给出状态；没成功的用户会在结果里标出来，并带上返回的提示。\n","source_path":"使用说明书/zh-CN/tools/user-world.md"}</script>
