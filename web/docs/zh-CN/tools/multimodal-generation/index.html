  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/multimodal-generation","language":"zh-CN","title":"多模态生成","summary":"语音生成 / 声转文 / 图像生成 / 视频生成四个工具的模型依赖、参数、产物落盘规则、返回字段与失败处理。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"工具","group":"多模态","group_path":["多模态"],"url":"/docs/zh-CN/tools/multimodal-generation/","headings":[{"id":"section-1","level":1,"text":"多模态生成"},{"id":"section-2","level":2,"text":"模型依赖"},{"id":"section-3","level":2,"text":"参数"},{"id":"section-4","level":3,"text":"语音生成"},{"id":"section-5","level":3,"text":"声转文"},{"id":"section-6","level":3,"text":"图像生成"},{"id":"section-7","level":3,"text":"视频生成"},{"id":"section-8","level":2,"text":"产物路径"},{"id":"section-9","level":2,"text":"返回结构"},{"id":"section-10","level":2,"text":"错误与处理"},{"id":"section-11","level":2,"text":"限制"}],"prev_slug":"zh-CN/tools/read-image","next_slug":"zh-CN/tools/desktop-control","markdown":"# 多模态生成\n\n| 规范名 | 别名 | 用途 |\n| --- | --- | --- |\n| `语音生成` | `generate_speech` | 把文本念成音频（旁白、播报、无障碍回读） |\n| `声转文` | `transcribe_speech` | 把工作区里的音频转成文字（会议录音、语音消息） |\n| `图像生成` | `generate_image`（旧名 `绘图生成` 保留为别名） | 文生图，或给输入图做编辑 / 重绘 |\n| `视频生成` | `generate_video` | 文本生成短视频 |\n\n## 模型依赖\n\n这四个**不是默认工具集成员**，能不能出现在能力面，取决于有没有配好对应类型的模型：\n\n| 工具 | 需要的模型类型 |\n| --- | --- |\n| `语音生成` | 语音合成（TTS） |\n| `声转文` | 语音识别（ASR） |\n| `图像生成` | 图像生成 |\n| `视频生成` | 视频生成 |\n\n可以指定具体的模型档案，也可以走对应类型的默认项；都解析不到就视为不可用。档案与类型的配置见[配置参考](/docs/zh-CN/capabilities/config/)。\n\n## 参数\n\n### 语音生成\n\n- 必填：待合成文本（去空白后不能为空）。\n- 可选：输出路径、指定模型、音色、风格指令、响应格式、语速。\n- 想做音色克隆，给一段参考音频（工作区路径，或直接的音频地址 / 路径），并同时给它的参考文本——两者必须一起给，否则报错；参考音频为空会直接报错。\n\n### 声转文\n\n- 必填：工作区内的音频路径（普通路径或公开路径，二选一），文件必须存在且是普通文件。\n- 可选：指定模型、语种提示、转写提示、输出格式、采样温度、上传文件名和内容类型。\n\n### 图像生成\n\n- 必填：提示词（去空白后不能为空）。\n- 可选：输出路径、指定模型、尺寸、输出格式、负向提示、采样参数。\n- 给了输入图就切到编辑模式；还可以给蒙版、参考图和若干按 provider 透传的高级参数。\n- **尺寸对齐**：某些 provider 要求宽和高都能被 16 整除，不满足会在调用前就失败，并给出建议尺寸。\n\n### 视频生成\n\n- 必填：提示词（去空白后不能为空）。\n- 可选：输出路径、指定模型、分辨率、时长、帧率 / 帧数、负向提示、采样参数、补帧开关。\n\n视频生成以同步模式发起。\n\n## 产物路径\n\n三个生成类工具的产物写进当前工作区：\n\n- 指定了输出路径 → 按该相对路径写；缺扩展名时按响应类型补。\n- 没指定 → 用 `generated_media/<类型>_<UTC 时间戳>.<扩展名>`，类型前缀是 `speech` / `image` / `video`。\n- 默认扩展名：语音 `wav`、图像 `png`、视频 `mp4`。\n- 写完后返回对外呈现路径和工作区相对路径。\n\n`声转文` 不落盘，只回文本。\n\n## 返回结构\n\n四个工具成功时都走统一外壳，结果里给出产物的路径、字节数、内容类型等：生成类带输出路径和工作区相对路径，声转文带转写文本和原始响应。\n\n## 错误与处理\n\n- **`图像生成` 不抛错**：模型未配置、尺寸不合规、provider 报错都会转成结构化失败结果，并带上 provider、模型名、模式、尺寸、输入图、失败摘要和“建议尺寸”等，方便直接改参数。\n- 其它三个走普通错误路径，常见有：文本 / 提示词为空、音频源文件不存在或是空文件、参考文本没配参考音频、高级参数不是 JSON 对象、视频模型未配置等。\n- 遇到超时、上游繁忙这类可重试失败，先改小范围或降步数再试；模型没配、尺寸不对、请求不合法这类不可重试，按提示改参数。\n\n## 限制\n\n- 别用它生成“临时装饰图”塞进答案：产物会落盘到工作区并占用存储。\n- 参数面上没有声明长度上限：文本和提示词受上游模型接口约束，超长由 provider 报错，平台不会帮你截断。\n- 产物是工作区相对路径；要读回来用 [读取文件](/docs/zh-CN/tools/workspace-files/) 或 [读图工具](/docs/zh-CN/tools/read-image/)，音视频类不要直接读进上下文。\n- 云端形态下，生成与落盘同样受沙箱和工作区归属约束，写的是本用户目录。\n- 生成类调用普遍慢且贵：一个任务只调一次，失败先按提示改参数，别循环重试同一个请求。\n","source_path":"使用说明书/zh-CN/tools/multimodal-generation.md"}</script>
