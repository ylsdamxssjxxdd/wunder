  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/ptc","language":"zh-CN","title":"ptc","summary":"ptc 是 Python 临时脚本执行工具，已从 wunder 中移除，本页仅作历史参考。","updated_at":"2026-09-21","read_when":[],"source_docs":[],"tab":"工具","group":"文件与代码","group_path":["文件与代码"],"url":"/docs/zh-CN/tools/ptc/","headings":[{"id":"section-1","level":1,"text":"ptc"},{"id":"section-2","level":2,"text":"它是怎么用的"},{"id":"section-3","level":2,"text":"当时适合做什么"},{"id":"section-4","level":2,"text":"当时不适合做什么"}],"prev_slug":"zh-CN/tools/exec","next_slug":"zh-CN/tools/apply-patch","markdown":"# ptc\n\n> **已移除**：ptc 已从 wunder 中移除，对智能体与用户都不可见，本页仅作历史参考。现在要执行命令请用 [执行命令](/docs/zh-CN/tools/exec/)。\n\nptc 是 programmatic tool call，原本用来把一段完整的 Python 脚本写成临时文件、在指定目录下跑，再把 `stdout`、`stderr` 和执行返回码交回来。\n\n它不是随便执行 shell 的替代品：纯命令行任务一直优先用 [执行命令](/docs/zh-CN/tools/exec/)。\n\n## 它是怎么用的\n\n参数是脚本文件名和脚本内容：\n\n```json\n{\n  \"filename\": \"helper.py\",\n  \"content\": \"print('hello')\"\n}\n```\n\n每次调用都会把脚本单独存到 `ptc_temp/<invocation_id>/` 下，避免多人共用工作区时同名脚本互相覆盖。返回里的 `path` 指向这份脚本，你指定的 `workdir` 仍是程序实际运行的目录。\n\n跑完会返回脚本路径、运行目录、返回码、`stdout` 和 `stderr`；即使失败，这几项通常也会保留，方便定位是哪一步出的问题。\n\n## 当时适合做什么\n\n- 临时的数据处理。\n- 小段的 Python 解析。\n- 需要几步 Python 逻辑，但不值得单独落一个项目文件的事。\n\n## 当时不适合做什么\n\n- 多条命令串起来的 shell 流程。\n- 需要长期维护的脚本工程。\n- 复杂的系统编译流程。\n\n这些交给 [执行命令](/docs/zh-CN/tools/exec/) 更合适。\n","source_path":"使用说明书/zh-CN/tools/ptc.md"}</script>
