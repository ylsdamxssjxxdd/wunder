  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/self-status","language":"zh-CN","title":"自我状态","summary":"`self_status` 的基础摘要、管理员诊断档位、模型侧精简结果与数据来源口径。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"工具","group":"系统与记忆","group_path":["系统与记忆"],"url":"/docs/zh-CN/tools/self-status/","headings":[{"id":"section-1","level":1,"text":"自我状态"},{"id":"section-2","level":2,"text":"参数"},{"id":"section-3","level":2,"text":"返回字段"},{"id":"section-4","level":2,"text":"错误与处理"}],"prev_slug":"zh-CN/tools/thread-control","next_slug":"zh-CN/tools/memory-manager","markdown":"# 自我状态\n\n规范名 `自我状态`，别名 `self_status`。只读，不执行任何业务动作，也不触发审批、不进沙箱执行；默认返回当前会话的阶段、状态、模型轮次和上下文占用，用来判断要不要压缩上下文或收尾。它默认不在工具集里，需要管理员在能力面板上显式勾选才会出现。\n\n## 参数\n\n模型调用只接受一个可选参数 `detail_level`：\n\n- 默认 `basic`，用于模型的下一步决策。\n- `full` 只允许管理员在明确诊断时使用，会附带有限的近期事件和系统资源指标。\n- 其他档位和事件、系统指标开关均会被拒绝。\n\n## 返回字段\n\n执行层会保留完整的授权诊断对象；模型上下文始终只保留下一步所需的紧凑摘要：\n\n- `stage`、`status`、`round` 和 `context_tokens`。\n- 运行态提供时会带 `context_ratio` 或 `last_error`。\n- 不回显会话标识、模型地址、完整运行时快照、事件原文或系统指标；这些仅保留在执行审计和管理员 full 诊断中。\n\n几处值得注意：\n\n- 数据来自内存里的运行态，不是数据库台账。要看全量历史请去线程轨迹，别指望这里的事件数覆盖整个生命周期。\n- full 档的近期事件固定限制为 20 条，避免诊断数据无界增长。\n- 「正在用的模型」来自事件流，可能和配置的默认模型对不上。\n- 上下文有几组数值口径不同、并列返回、互不换算，别把不同口径的数字混着比。\n\n## 错误与处理\n\n- 参数写错时，错误信息会原样返回，执行层记为失败。\n- 监视器不可用、没有编排器都不算错误，对应字段直接为空。\n- 它在蛹、蜂巢、舵机、舰体都能用。\n","source_path":"使用说明书/zh-CN/tools/self-status.md"}</script>
