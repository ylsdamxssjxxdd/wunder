  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/tools/self-status","language":"zh-CN","title":"自我状态","summary":"让智能体自查当前会话的模型、上下文占用、轮次进度和事件计数，用来判断要不要压缩上下文或收尾。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"工具","group":"系统与记忆","group_path":["系统与记忆"],"url":"/docs/zh-CN/tools/self-status/","headings":[{"id":"section-1","level":1,"text":"自我状态"},{"id":"section-2","level":2,"text":"什么时候用"},{"id":"section-3","level":2,"text":"怎么用"},{"id":"section-4","level":2,"text":"返回里有什么"},{"id":"section-5","level":2,"text":"出问题时怎么判断"},{"id":"section-6","level":2,"text":"相关页面"}],"prev_slug":"zh-CN/tools/thread-control","next_slug":"zh-CN/tools/memory-manager","markdown":"# 自我状态\n\n工具名是 `自我状态`，也叫 `self_status`。它是个只读的诊断工具，不执行任何业务动作，返回当前会话的模型、上下文占用、轮次进度和事件计数。\n\n它默认不在工具集里，需要管理员在能力面板上显式勾选才会出现。\n\n## 什么时候用\n\n- 想确认当前会话用的是哪个模型、上下文占用了多少、轮次进度如何。\n- 想判断是不是该压缩上下文、是不是该收尾。\n- 想拿到事件计数（模型请求、工具调用、审批），用来复盘这一轮做了什么。\n\n它只读，不会改变任何状态，别拿它来做业务动作。\n\n## 怎么用\n\n可以按需要选详细程度：\n\n- 默认 `standard`，够日常查看；`basic` 更精简，`full` 最全。\n- 除了这三档，`lite`、`summary`、`detail`、`detailed`、`verbose` 也能填，会归一到大致档位；填了不认识的值会落回 `standard`。\n- 想看最近的事件列表，把 `include_events` 打开（`full` 档默认就开）；`events_limit` 控制返回多少条，范围 1–200，默认 20。\n\n## 返回里有什么\n\n它会直接给一个状态对象，而不是通用成功骨架：\n\n- 会话标识：用户、会话、工作区、智能体，以及是否管理员。\n- 正在用的模型：从最近一次模型请求事件反推，没有事件时为空。\n- 配置的默认模型：没配默认时为空。\n- 上下文占用与峰值等几组数值。\n- 监视器状态、阶段与摘要。\n- 用户轮次与模型轮次相关的计数。\n- 事件总数、最近事件 id，以及按类型分的计数；开了事件列表还会带最近若干条。\n- 编排器的会话运行时快照，没有编排器时为空。\n\n几处值得注意：\n\n- 数据来自内存里的运行态，不是数据库台账。要看全量历史请去线程轨迹，别指望这里的事件数覆盖整个生命周期。\n- 事件条数上限只裁剪最近事件列表，事件总数仍是缓冲区里的全量计数。\n- 「正在用的模型」来自事件流，可能和配置的默认模型对不上。\n- 上下文有几组数值口径不同、并列返回、互不换算，别把不同口径的数字混着比。\n\n## 出问题时怎么判断\n\n- 参数写错时，错误信息会原样返回，执行层记为失败。\n- 监视器不可用、没有编排器都不算错误，对应字段直接为空。\n- 它在蛹、蜂巢、舵机、舰体都能用，只读、不触发审批、也不进沙箱执行。\n\n## 相关页面\n\n- 线程级会话管理：[会话线程控制](/docs/zh-CN/tools/thread-control/)\n- 工具总览与启用档位：[工具](/docs/zh-CN/tools/index/)\n","source_path":"使用说明书/zh-CN/tools/self-status.md"}</script>
