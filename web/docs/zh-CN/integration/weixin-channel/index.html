  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/integration/weixin-channel","language":"zh-CN","title":"微信 iLink 渠道","summary":"新微信渠道用 iLink 协议，跟旧的公众号、企业微信不是一套。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"接入","group":"扩展接入","group_path":["扩展接入"],"url":"/docs/zh-CN/integration/weixin-channel/","headings":[{"id":"section-1","level":1,"text":"微信 iLink 渠道"},{"id":"section-2","level":2,"text":"新旧渠道对照"},{"id":"section-3","level":2,"text":"最短链路：扫码接入"},{"id":"section-4","level":2,"text":"关键设置与常见坑"},{"id":"section-5","level":2,"text":"从旧渠道迁过来"},{"id":"section-6","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/integration/channel-webhook","next_slug":"zh-CN/integration/external-login","markdown":"# 微信 iLink 渠道\n\n`weixin` 是独立的渠道，不是旧微信渠道换个参数。选错会白忙一场。\n\n## 新旧渠道对照\n\n| 场景 | 选哪个 |\n| --- | --- |\n| 企业微信应用回调 | `wechat`（旧） |\n| 微信公众号回调 | `wechat_mp`（旧） |\n| iLink 协议的微信能力 | `weixin`（新） |\n\n新旧的主要区别：\n\n- 入站方式：`weixin` 用长轮询拉取更新，旧版用 Webhook 回调。\n- 回复要求：`weixin` 回复时必须带上本次会话的上下文标识，旧版不依赖。\n- 登录方式：`weixin` 扫码拿机器人令牌，旧版用传统的企业 / 公众号参数。\n- 媒体：`weixin` 走 CDN，加解密自己处理，旧版走平台原生接口。\n- 状态：新接入优先用 `weixin`，旧版处于维护 / 兼容存量。\n\n## 最短链路：扫码接入\n\n在渠道设置里选 `weixin` 后：\n\n1. 点“生成二维码”；\n2. 用微信扫码；\n3. 点“等待确认”；\n4. 系统自动回填机器人令牌、机器人 ID、用户 ID 和接口地址；\n5. 保存账号配置。\n\n两点注意：回填成功后**必须保存**，长轮询才会真正生效；二维码有有效期，过期要重新生成。\n\n## 关键设置与常见坑\n\n- 必填三项：接口地址、机器人令牌、机器人 ID；再打开长连接开关。\n- 还有几项可选增强：CDN 地址、机器人类型、允许的来话范围、轮询与接口超时、连续失败后的退避、路由标记。\n- 媒体链路排查顺序：是否开了媒体、CDN 地址是否可达、解密密钥是否正确、附件是否超出大小限制。\n- 回复报“缺少会话上下文标识”：说明这次回复没拿到上一条入站消息的会话标识。确认回复走的是同一会话，且入站消息里保留了它。\n- 长时间收不到消息：依次看账号是否处于活跃状态、长连接是否开启、令牌和机器人 ID 是否有效、舰桥运行态里会话是否已过期。\n- 会话频繁过期：一般是登录态失效，重新扫码拿新令牌并保存即可。\n\n## 从旧渠道迁过来\n\n1. 先并行运行：保留旧渠道，新流量优先走 `weixin`；\n2. 按账号分批切换；\n3. 盯住入站成功率、出站成功率、首包时延和失败排行；\n4. 稳定后再把旧渠道标为维护态。\n\n## 延伸阅读\n\n- [渠道 Webhook](/docs/zh-CN/integration/channel-webhook/)\n- [API 索引](/docs/zh-CN/reference/api-index/)\n- [管理员界面](/docs/zh-CN/surfaces/web-admin/)\n","source_path":"使用说明书/zh-CN/integration/weixin-channel.md"}</script>
