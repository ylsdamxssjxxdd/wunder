  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/integration/wunder-api","language":"zh-CN","title":"wunder API","summary":"把 wunder 当成一个执行能力来调用，一次请求出一次结果；要做完整聊天产品再转到会话域。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"接入","group":"核心接口","group_path":["核心接口"],"url":"/docs/zh-CN/integration/wunder-api/","headings":[{"id":"section-1","level":1,"text":"wunder API"},{"id":"section-2","level":2,"text":"/wunder 与聊天域的分工"},{"id":"section-3","level":2,"text":"最短链路：稳定绑定智能体"},{"id":"section-4","level":2,"text":"最小请求"},{"id":"section-5","level":2,"text":"附件别一股脑丢进来"},{"id":"section-6","level":2,"text":"关键设置与常见坑"},{"id":"section-7","level":2,"text":"相关接口"},{"id":"section-8","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/integration/index","next_slug":"zh-CN/integration/chat-ws","markdown":"# wunder API\n\n`POST /wunder` 适合“把 wunder 当执行能力调用”。要做会话列表、恢复、取消、实时工作台，直接去聊天域。\n\n## /wunder 与聊天域的分工\n\n- 一次请求触发一次执行、只关心结果 → 用 `/wunder`。\n- 要历史、恢复、取消、稳定绑定智能体、读取冻结提示词 → 用 [聊天会话](/docs/zh-CN/integration/chat-sessions/)。\n\n## 最短链路：稳定绑定智能体\n\n`GET /wunder/agents` → `POST /wunder/chat/sessions` → `POST /wunder/chat/sessions/{session_id}/messages`\n\n1. 先拿到目标智能体 ID；\n2. 创建会话并绑定这个智能体；\n3. 发送消息；\n4. 用 WebSocket 或续传接口消费流式事件。\n\n## 最小请求\n\n```json\n{\n  \"user_id\": \"demo_user\",\n  \"question\": \"帮我整理今天的工作计划\",\n  \"stream\": true\n}\n```\n\n常用补充：\n\n- `session_id`：复用会话\n- `agent_id`：指定智能体\n- `model_name`：临时换模型\n- `tool_names`：显式挂工具\n- `config_overrides`：局部覆盖配置\n- `attachments`：附件输入\n\n## 附件别一股脑丢进来\n\n官方前端对附件是分流的：\n\n- 图片：可以直接作为视觉上下文发。\n- 文档：先转成文本再提交。\n- 音频：先转写成文本附件。\n- 视频：先拆成图片序列和音轨，不会把原始视频发给模型。\n\n绕过这些预处理直接调 `/wunder`，拆解、转写、抽帧和体积控制就得你自己负责。\n\n## 关键设置与常见坑\n\n- `user_id` 表示调用者和隔离空间，不必是已注册用户。\n- `agent_id` 表示目标智能体。\n- `/wunder` 支持指定智能体，但不等于它有聊天域的完整能力；会话治理能力要自行补齐。\n- 别把 `user_id` 理解成“必须来自用户管理表”，那会造成没必要的接入限制。\n\n## 相关接口\n\n- `POST /wunder`\n- `POST /wunder/system_prompt`\n- `GET /wunder/tools`\n- `GET /wunder/agents`\n- `POST /wunder/chat/sessions`\n- `POST /wunder/chat/sessions/{session_id}/messages`\n\n## 延伸阅读\n\n- [聊天会话](/docs/zh-CN/integration/chat-sessions/)\n- [聊天 WebSocket](/docs/zh-CN/integration/chat-ws/)\n- [API 索引](/docs/zh-CN/reference/api-index/)\n","source_path":"使用说明书/zh-CN/integration/wunder-api.md"}</script>
