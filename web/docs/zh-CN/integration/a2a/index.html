  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/integration/a2a","language":"zh-CN","title":"A2A 接口","summary":"wunder 既能把能力按 A2A 协议暴露给别的智能体系统，也能把外部 A2A 服务挂成工具供模型调用。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"接入","group":"扩展接入","group_path":["扩展接入"],"url":"/docs/zh-CN/integration/a2a/","headings":[{"id":"section-1","level":1,"text":"A2A 接口"},{"id":"section-2","level":2,"text":"A2A 的适用条件"},{"id":"section-3","level":2,"text":"最短链路：让外部调 wunder"},{"id":"section-4","level":2,"text":"最短链路：让 wunder 调外部"},{"id":"section-5","level":2,"text":"关键设置与常见坑"},{"id":"section-6","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/integration/external-login","next_slug":"zh-CN/integration/mcp-endpoint","markdown":"# A2A 接口\n\n如果对方是“另一套智能体系统”，想按统一协议互相调用，用 A2A；只是你自己业务系统内部的调用，用 [wunder API](/docs/zh-CN/integration/wunder-api/) 更简单。\n\nA2A 在 wunder 里有两个方向：\n\n- 把 wunder 的能力暴露出去，让外部智能体平台调用；\n- 把外部的 A2A 服务接进来，作为模型可用的工具。\n\n## A2A 的适用条件\n\n适合：外部智能体平台把 wunder 当成远端协作体；跨系统协同，需要明确的协议边界。\n\n不适合：只在本系统内执行的普通文件操作、单机内建能力、没必要跨系统的同步调用。这些留在本机就好。\n\n## 最短链路：让外部调 wunder\n\n对外提供这几个入口：\n\n- `POST /a2a`：主调用入口\n- `GET /.well-known/agent-card.json`\n- `GET /a2a/agentCard`\n- `GET /a2a/extendedAgentCard`\n\n外部系统按 JSON-RPC 2.0 发请求，协议版本 1.0，支持流式返回。它先读 AgentCard 了解 wunder 是谁、入口在哪、有哪些技能、支持哪些工具类别、是否支持流式；配置了 API Key 时，AgentCard 里也会一并声明对应的安全方案。\n\n## 最短链路：让 wunder 调外部\n\n在配置里声明外部 A2A 服务，给它一个名字和一个服务地址，然后打开开关。启用后，这个服务会作为一个可调用的工具出现在模型面前，名字由服务名决定，形如 `a2a@服务名`。\n\n系统另有两个辅助工具，分别用来观察任务状态和等待结果收敛。\n\n## 关键设置与常见坑\n\n- 服务名会成为工具名的一部分，起名时先想清楚。\n- 内部类型的外部服务，通常需要固定一个用户标识。\n- 是否允许 wunder 调用自己，可以单独开关。\n- 调用有超时上限，远端比较慢时要提前评估。\n\n## 延伸阅读\n\n- [wunder API](/docs/zh-CN/integration/wunder-api/)\n- [MCP 入口](/docs/zh-CN/integration/mcp-endpoint/)\n","source_path":"使用说明书/zh-CN/integration/a2a.md"}</script>
