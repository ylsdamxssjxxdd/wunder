  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/chat-ws","language":"zh-CN","title":"聊天 WebSocket","summary":"`/wunder/chat/ws` 的握手流程、客户端消息类型、服务端返回与断线重连方式。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"能力","group":"接入与集成","group_path":["接入与集成"],"url":"/docs/zh-CN/capabilities/chat-ws/","headings":[{"id":"section-1","level":1,"text":"聊天 WebSocket"},{"id":"section-2","level":2,"text":"握手"},{"id":"section-3","level":2,"text":"消息类型"},{"id":"section-4","level":2,"text":"约定与限制"}],"prev_slug":"zh-CN/concepts/boundary-handling","next_slug":"zh-CN/capabilities/mcp-endpoint","markdown":"# 聊天 WebSocket\n\n`/wunder/chat/ws` 既是事件推送通道，也是控制通道：启动执行、断线续传、观察、取消、回传审批都在同一条连接上完成。聊天与桌面实时会话共用它。\n\n## 握手\n\n1. 创建会话，拿到会话 ID；\n2. 建立 WebSocket 连接；\n3. 发 `connect` 完成握手；\n4. 收到 `ready`；\n5. 发 `start` 启动执行；\n6. 持续消费 `event`，直到本轮终态。\n\n```json\n{\n  \"kind\": \"connect\",\n  \"request_id\": \"req_connect_01\",\n  \"payload\": { \"protocol_version\": \"1.0\", \"client_name\": \"my-chat-ui\" }\n}\n```\n\n```json\n{\n  \"kind\": \"start\",\n  \"request_id\": \"req_start_01\",\n  \"session_id\": \"sess_xxx\",\n  \"payload\": { \"content\": \"继续整理刚才那份周报\", \"stream\": true }\n}\n```\n\n## 消息类型\n\n| kind | 作用 |\n| --- | --- |\n| `connect` | 握手与协议协商 |\n| `start` | 启动一次执行 |\n| `resume` | 断线后补齐落下的事件 |\n| `watch` | 只观察某个会话 |\n| `cancel` | 取消当前执行 |\n| `approval` | 回传审批决定 |\n| `ping` | 保活 |\n\n服务端回 `ready`、`event`、`error`、`pong`。其中 `turn_terminal` 是单轮执行的终态信号，适合当前端收敛条件。\n\n## 约定与限制\n\n- `start` 必须显式带会话 ID；正文用 `content`，不是 HTTP 接口的 `question`。\n- `resume`（补事件）与 `watch`（看运行态）是两个不同动作，别互相代替。\n- 这条连接上的审批只处理经它下发的审批项。\n- 断线后重新连同一个地址，再按场景发 `resume` 或 `watch`；桌面版断线由前端自动重连，不需要用户干预。\n","source_path":"使用说明书/zh-CN/capabilities/chat-ws.md"}</script>
