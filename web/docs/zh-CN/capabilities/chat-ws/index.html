  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/chat-ws","language":"zh-CN","title":"聊天 WebSocket","summary":"`/wunder/chat/ws` 的握手流程、客户端消息类型、服务端返回与断线重连方式。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/capabilities/chat-ws/","headings":[{"id":"section-1","level":1,"text":"聊天 WebSocket"},{"id":"section-2","level":2,"text":"适用场景"},{"id":"section-3","level":2,"text":"握手流程"},{"id":"section-4","level":2,"text":"消息类型"},{"id":"section-5","level":2,"text":"设置与限制"},{"id":"section-6","level":2,"text":"断线与重连"}],"prev_slug":"zh-CN/capabilities/weixin-channel","next_slug":"zh-CN/capabilities/mcp-endpoint","markdown":"# 聊天 WebSocket\n\n`/wunder/chat/ws` 既是事件推送通道，也是会话的控制通道：启动执行、断线续传、观察、取消、回传审批都在同一条连接上完成。聊天与桌面实时会话都用它，没有 SSE 兜底。\n\n## 适用场景\n\n- 聊天工作台与桌面会话；\n- 在同一条连接里启动、续传、观察、取消一次执行；\n- 长连接保活与一致的实时状态。\n\n## 握手流程\n\n1. 创建会话，拿到会话 ID；\n2. 建立 WebSocket 连接；\n3. 发送 `connect` 握手；\n4. 收到 `ready`；\n5. 发送 `start` 启动执行；\n6. 持续消费 `event`，直到收到本轮终态 `turn_terminal`。\n\n握手示例：\n\n```json\n{\n  \"kind\": \"connect\",\n  \"request_id\": \"req_connect_01\",\n  \"payload\": {\n    \"protocol_version\": \"1.0\",\n    \"client_name\": \"my-chat-ui\"\n  }\n}\n```\n\n启动一次执行：\n\n```json\n{\n  \"kind\": \"start\",\n  \"request_id\": \"req_start_01\",\n  \"session_id\": \"sess_xxx\",\n  \"payload\": {\n    \"content\": \"继续帮我整理刚才那份周报\",\n    \"stream\": true\n  }\n}\n```\n\n## 消息类型\n\n客户端发往服务端：\n\n| kind | 作用 |\n| --- | --- |\n| `connect` | 握手与协议协商 |\n| `start` | 启动一次执行 |\n| `resume` | 断线后补齐落下的事件 |\n| `watch` | 只观察某个会话 |\n| `cancel` | 取消当前执行 |\n| `approval` | 回传审批决定 |\n| `ping` | 保活 |\n\n服务端主要回 `ready`、`event`、`error`、`pong`。\n\n## 设置与限制\n\n- 需要消费的事件类别：排队中、审批已处理、出错、本轮结束。`turn_terminal` 是单轮执行的终态信号，适合作为前端收敛条件。\n- `start` 必须显式带上会话 ID。\n- 正文用 `content`，不是 `/wunder` 的 `question`。\n- `resume`（补事件）与 `watch`（看运行态）是两个不同动作。\n- 这条连接上的审批只处理来自 WebSocket 的审批项。\n\n## 断线与重连\n\n不要退回 SSE。重新连上 `/wunder/chat/ws`，再按场景发送：\n\n- `resume`：带上最后处理到的事件位置，补齐断线期间的事件；\n- `watch`：重新观察当前会话的运行态。\n","source_path":"使用说明书/zh-CN/capabilities/chat-ws.md"}</script>
