  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/weixin-channel","language":"zh-CN","title":"微信 iLink 渠道","summary":"`weixin` 与其他微信类渠道的选型、扫码接入步骤、必填与可选配置，以及收不到消息时的排查顺序。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"能力","group":"接入与集成","group_path":["接入与集成"],"url":"/docs/zh-CN/capabilities/weixin-channel/","headings":[{"id":"section-1","level":1,"text":"微信 iLink 渠道"},{"id":"section-2","level":2,"text":"选型"},{"id":"section-3","level":2,"text":"扫码接入"},{"id":"section-4","level":2,"text":"配置项"},{"id":"section-5","level":2,"text":"排查"},{"id":"section-6","level":2,"text":"与其它渠道的关系"}],"prev_slug":"zh-CN/capabilities/mcp-endpoint","next_slug":"zh-CN/capabilities/interlink","markdown":"# 微信 iLink 渠道\n\n`weixin` 是独立渠道，参数与前两代微信渠道不通用，接入前先按场景选。\n\n## 选型\n\n| 场景 | 选哪个 |\n| --- | --- |\n| 企业微信应用回调 | `wechat` |\n| 微信公众号回调 | `wechat_mp` |\n| iLink 协议的微信能力 | `weixin` |\n\n主要区别：`weixin` 用长轮询拉取更新，回复时要带上本次会话的上下文标识，扫码拿机器人令牌，媒体走 CDN 且加解密自己处理；另两套走 Webhook 回调和平台原生接口。\n\n## 扫码接入\n\n1. 渠道设置里选 `weixin`，点「生成二维码」；\n2. 用微信扫码；\n3. 点「等待确认」；\n4. 系统回填机器人令牌、机器人 ID、用户 ID 和接口地址；\n5. **保存账号配置** —— 不保存长轮询不会真正生效。\n\n二维码有有效期，过期重新生成。\n\n## 配置项\n\n- **必填**：接口地址、机器人令牌、机器人 ID，并打开长连接开关。\n- **可选**：CDN 地址、机器人类型、允许的来话范围、轮询与接口超时、连续失败后的退避、路由标记。\n\n## 排查\n\n| 症状 | 先查什么 |\n| --- | --- |\n| 收不到消息 | 账号是否活跃、长连接是否打开、令牌与机器人 ID 是否有效、运行态里会话是否过期 |\n| 回复报「缺少会话上下文标识」 | 这次回复没拿到上一条入站消息的会话标识：确认回复走同一会话，入站消息里保留了它 |\n| 媒体收不到 | 是否开了媒体、CDN 地址是否可达、解密密钥是否正确、附件是否超限 |\n| 会话频繁过期 | 一般是登录态失效，重新扫码拿新令牌并保存 |\n\n## 与其它渠道的关系\n\n同一份引擎、同一套工具与权限，渠道只是入口；渠道绑定与日志在「设置 → 渠道设置」，管理端只在预设智能体模板里体现渠道配置。\n","source_path":"使用说明书/zh-CN/capabilities/weixin-channel.md"}</script>
