  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/stream-events","language":"zh-CN","title":"会话状态说明","summary":"等待、思考、执行工具、审批、失败、取消、卡住与连接状态的出现时机、含义和处理方式。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/capabilities/stream-events/","headings":[{"id":"section-1","level":1,"text":"会话状态说明"},{"id":"section-2","level":2,"text":"状态概览"},{"id":"section-3","level":2,"text":"基本状态"},{"id":"section-4","level":2,"text":"审批状态"},{"id":"section-5","level":2,"text":"异常状态"},{"id":"section-6","level":2,"text":"连接状态"},{"id":"section-7","level":2,"text":"状态指示器位置"},{"id":"section-8","level":2,"text":"排查"}],"prev_slug":"zh-CN/concepts/boundary-handling","next_slug":"zh-CN/capabilities/prompt-templates","markdown":"# 会话状态说明\n\n对话过程中，界面会显示思考中、正在调用工具、压缩上下文、出错重试等状态。\n\n## 状态概览\n\n一个对话从开始到结束经历的状态：\n\n```\n等待 → 思考/执行 → 完成\n          ↓\n       需要审批 → 等待用户的决定 → 继续\n          ↓\n       出错/取消 → 结束\n```\n\n## 基本状态\n\n| 状态 | 含义 | 出现时机 | 处理 |\n| --- | --- | --- | --- |\n| 等待中 | 请求已提交，正在排队等待处理 | 系统繁忙；多个请求同时进行 | 等待 |\n| 正在思考 | 智能体正在分析请求，准备回答或执行操作 | 模型理解问题与生成方案期间 | 等待，不要重复发送同一条消息 |\n| 正在执行工具 | 智能体正在用工具完成任务：读取文件、搜索网页、执行代码等 | 复杂任务需要多个工具配合 | 在进度区域查看执行进度 |\n| 已完成 | 智能体完成请求并给出最终回答 | 请求处理结束 | 继续提问、查看生成的内容或文件、开始新任务 |\n\n执行工具期间界面会出现「正在读取文件…」「正在搜索…」「正在执行…」这类提示。\n\n## 审批状态\n\n| 状态 | 含义 | 处理 |\n| --- | --- | --- |\n| 需要审批 | 智能体要执行需要确认的操作：修改重要文件、执行敏感命令；或已配置审批模式 | 界面给出审批请求与具体操作说明，点「批准」继续，点「拒绝」阻止 |\n| 审批已处理 | 已对审批请求做出决定 | 批准后智能体继续执行该操作；拒绝后放弃该操作，可能另想办法 |\n\n进入审批是因为该操作可能有风险或影响重要文件，属于安全保护机制。想减少审批，与管理员沟通调整审批模式。\n\n## 异常状态\n\n| 状态 | 含义 | 常见原因 | 处理 |\n| --- | --- | --- | --- |\n| 执行失败 | 执行中遇到问题，没能完成任务 | 文件不存在或无法访问；网络请求失败；工具执行出错；模型服务异常 | 看错误提示确认原因，按提示调整请求（如给出正确的文件路径），重试 |\n| 已取消 | 对话被用户或系统主动终止 | 点了「停止」；系统超时自动取消；其他主动终止 | 重新开始对话，或查看取消前的执行记录 |\n| 会话卡住 | 长时间停在一个状态，没有进展 | 网络连接中断；后端服务异常；任务处理超时 | 先等几分钟；确认卡住后点「停止」；用设置里的「重置工作状态」清理异常状态；仍不恢复则联系管理员 |\n\n## 连接状态\n\n| 状态 | 含义 | 症状与处理 |\n| --- | --- | --- |\n| 已连接 | 与后端服务的网络连接正常 | — |\n| 连接断开 | 与后端服务的网络连接中断 | 无法发送新消息、状态显示异常、提示「连接已断开」；检查网络，刷新页面或重启应用，等待自动重连 |\n\n## 状态指示器位置\n\n| 位置 | 显示内容 |\n| --- | --- |\n| 对话框上方 | 当前会话的整体状态 |\n| 消息气泡旁 | 该消息的处理状态 |\n| 进度区域 | 工具执行的详细进度 |\n| 对话下方或右侧 | 执行轨迹与工具调用记录：调用了哪些工具、读了哪些文件、执行了什么操作 |\n\n## 排查\n\n**响应变慢**：任务复杂需要多步执行、模型服务响应延迟、系统负载较高都会拉长响应时间。等待即可，不要重复发送同一条消息。\n\n**状态显示异常**：先等待看是否自动恢复；未恢复用「重置工作状态」；再不行刷新页面或重启应用。仍未解决按[故障排查](/docs/zh-CN/help/troubleshooting/)处理。\n","source_path":"使用说明书/zh-CN/capabilities/stream-events.md"}</script>
