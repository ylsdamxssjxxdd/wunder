  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/mcp-endpoint","language":"zh-CN","title":"MCP 入口","summary":"wunder 既能把自己作为 MCP 服务暴露出去，也能作为 MCP 客户端接入外部服务。","updated_at":"2026-10-14","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/capabilities/mcp-endpoint/","headings":[{"id":"section-1","level":1,"text":"MCP 入口"},{"id":"section-2","level":2,"text":"两个方向的分工"},{"id":"section-3","level":2,"text":"最短链路：把 wunder 暴露出去"},{"id":"section-4","level":2,"text":"最短链路：接入外部 MCP"},{"id":"section-5","level":2,"text":"关键设置与常见坑"},{"id":"section-6","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/capabilities/chat-ws","next_slug":"en/index","markdown":"# MCP 入口\n\nMCP 有两个方向，先分清：\n\n- wunder 自己对外暴露的 MCP 服务；\n- wunder 作为客户端去接别人的 MCP 服务。\n\n## 两个方向的分工\n\n- 想让外部系统用 MCP 的方式调用 wunder 的能力 → 用自托管这一边。\n- 想把外部能力接进来给模型用 → 用外部服务这一边。\n\n## 最短链路：把 wunder 暴露出去\n\n对外入口是一个地址，走 Streamable HTTP。\n\n接通顺序：\n\n1. 外部系统按 MCP 协议连上这个地址；\n2. wunder 自动完成协议版本协商，与旧服务互通时会按双方都支持的范围协商，不用手写初始化步骤；\n3. 调用具体工具。\n\n目前内置对外提供两个工具：`excute`（执行）和 `doc2md`（文档转 Markdown）。工具名就是 `excute`，照这个名字调用即可。\n\n## 最短链路：接入外部 MCP\n\n在配置里声明要接的 MCP 服务，给它名字、地址和传输方式，然后打开开关。启用后 wunder 就把它当成一个可调用的服务。外部服务同样用 Streamable HTTP；如果服务是 Python 写的，它按 Python 侧的协议版本协商，不一定具备最新的全部能力。\n\n文档里常提到的外部服务通常承载数据库查询、数据库导出、知识库查询这类工具。\n\n## 关键设置与常见坑\n\n- 接入顺序建议：先在配置里声明服务 → 在舰桥确认工具清单能拉到 → 再开放给模型使用。\n- 舰桥里有 MCP 的配置和调试入口，可以刷新工具清单、直接调远端工具验证。\n- MCP 工具不是旁路：它会和内置工具、A2A 工具、技能、知识库工具、自建工具一起，汇总进同一个工具视图。对模型来说，MCP 只是工具目录的一部分。\n\n## 延伸阅读\n\n- [工具体系](/docs/zh-CN/concepts/tools/)\n- [配置说明](/docs/zh-CN/capabilities/config/)\n","source_path":"使用说明书/zh-CN/capabilities/mcp-endpoint.md"}</script>
