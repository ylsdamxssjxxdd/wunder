  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/mcp-endpoint","language":"zh-CN","title":"MCP 入口","summary":"两个方向的入口：对外暴露的地址与两个内置工具，以及接入外部 MCP 服务的配置顺序。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"能力","group":"接入与集成","group_path":["接入与集成"],"url":"/docs/zh-CN/capabilities/mcp-endpoint/","headings":[{"id":"section-1","level":1,"text":"MCP 入口"},{"id":"section-2","level":2,"text":"对外暴露"},{"id":"section-3","level":2,"text":"接入外部服务"},{"id":"section-4","level":2,"text":"排错顺序"}],"prev_slug":"zh-CN/capabilities/chat-ws","next_slug":"zh-CN/capabilities/weixin-channel","markdown":"# MCP 入口\n\nwunder 既能把自己暴露成 MCP 服务，也能作为 MCP 客户端接入外部服务。两个方向的入口和配置互不相同；工具层面的注册、打包与路由规则在[MCP](/docs/zh-CN/tools/mcp/)。\n\n## 对外暴露\n\n对外入口是一个地址，走 Streamable HTTP。\n\n1. 外部系统按 MCP 协议连上地址；\n2. wunder 自动完成协议版本协商，与旧服务互通时按双方都支持的范围协商；\n3. 调用具体工具。\n\n内置两个工具：`excute`（执行一个智能体任务并返回最终回复，名字就是这个拼写）和 `doc2md`（解析文档返回 Markdown）。端点跑任务时会现算工具集并移除自己，避免端点驱动的智能体回调端点本身。\n\n## 接入外部服务\n\n1. 在配置里声明服务名、地址与传输方式（只支持 Streamable HTTP）；\n2. 打开开关，在管理端确认能拉到工具清单；\n3. 把工具放行给需要的智能体。\n\n外部服务通常承载数据库查询、导出、知识库检索这类能力。工具名会注册成 `服务器名@工具名`，也可能被标成打包模式折成一个工具，细节见[MCP](/docs/zh-CN/tools/mcp/)。\n\n## 排错顺序\n\n拉不到工具清单，先看地址与传输方式，再看服务是否开启、放行名单是否拦截；能拉到但模型调不到，看能力选择与模型可用性过滤是否把这批工具挡在外面。\n","source_path":"使用说明书/zh-CN/capabilities/mcp-endpoint.md"}</script>
