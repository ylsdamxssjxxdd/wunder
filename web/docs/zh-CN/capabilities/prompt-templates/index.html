  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/prompt-templates","language":"zh-CN","title":"提示词与个性化","summary":"定制智能体的角色定位和回答风格：选内置模板，或自己写一套。","updated_at":"2026-10-14","read_when":[],"source_docs":[],"tab":"能力","group":"配置与数据","group_path":["配置与数据"],"url":"/docs/zh-CN/capabilities/prompt-templates/","headings":[{"id":"section-1","level":1,"text":"提示词与个性化"},{"id":"section-2","level":2,"text":"提示词模板"},{"id":"section-3","level":2,"text":"内置模板包"},{"id":"section-4","level":3,"text":"中文模板包（default-zh）"},{"id":"section-5","level":3,"text":"英文模板包（default-en）"},{"id":"section-6","level":2,"text":"模板包的组成"},{"id":"section-7","level":2,"text":"切换模板包"},{"id":"section-8","level":3,"text":"在界面中切换"},{"id":"section-9","level":3,"text":"生效规则"},{"id":"section-10","level":2,"text":"创建自定义模板"},{"id":"section-11","level":3,"text":"创建方法"},{"id":"section-12","level":3,"text":"编辑建议"},{"id":"section-13","level":3,"text":"示例：编程助手模板"},{"id":"section-14","level":2,"text":"模板生效的层级"},{"id":"section-15","level":2,"text":"常见问题解答"},{"id":"section-16","level":3,"text":"切换模板后旧对话不变的原因"},{"id":"section-17","level":3,"text":"修改某个对话提示词的办法"},{"id":"section-18","level":3,"text":"不同智能体可使用不同模板"},{"id":"section-19","level":3,"text":"模板长度并非越长越好"},{"id":"section-20","level":3,"text":"中文模板可用英文回答"},{"id":"section-21","level":2,"text":"模板使用建议"},{"id":"section-22","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/capabilities/stream-events","next_slug":"zh-CN/capabilities/admin-panels","markdown":"# 提示词与个性化\n\n提示词模板决定智能体的角色定位和回答风格。可以使用内置模板，也可以自建模板包。\n\n## 提示词模板\n\n提示词模板规定：\n\n- 角色定位\n- 怎么思考和回答问题\n- 有哪些工作原则和限制\n- 怎么使用工具和技能\n\n换一套模板，智能体的风格和能力侧重就会变。\n\n## 内置模板包\n\nwunder 提供两套内置模板包。\n\n### 中文模板包（default-zh）\n\n- 用中文思考和回答\n- 适合中文对话场景\n- 默认中文助手风格\n\n### 英文模板包（default-en）\n\n- 用英文思考和回答\n- 适合英文对话场景\n- 默认英文助手风格\n\n按用户主要使用的语言选对应的模板包。\n\n## 模板包的组成\n\n每个模板包由多个分段拼成：\n\n| 分段 | 作用 |\n|------|------|\n| 角色 | 定义智能体是谁、扮演什么角色 |\n| 工程原则 | 定义工作方式和思考方法 |\n| 工具协议 | 定义如何使用工具 |\n| 技能协议 | 定义如何调用技能 |\n| 记忆 | 定义如何使用长期记忆 |\n| 附加说明 | 其他补充指令 |\n\n## 切换模板包\n\n### 在界面中切换\n\n1. 进入左栏底部「设置」→「智能体」\n2. 找到「提示词模板」选项\n3. 选择想要的模板包\n4. 保存设置\n\n### 生效规则\n\n- **新对话**：切换后创建的新对话使用新模板\n- **已有对话**：不改变，保持创建时的模板\n\n## 创建自定义模板\n\n想进一步定制风格，可以自己建模板包。\n\n### 创建方法\n\n1. 在模板设置页面点「新建模板包」\n2. 选一个基础模板复制（建议从内置模板起步）\n3. 编辑各个分段的内容\n4. 保存后即可使用\n\n### 编辑建议\n\n- **角色分段**：写明定位（如“编程助手”“数据分析专家”）\n- **工程原则**：设定回答风格（简洁/详细、正式/轻松）\n- **工具协议**：一般不用改\n- **附加说明**：放自己的特殊要求\n\n### 示例：编程助手模板\n\n角色分段可以这样写：\n\n```\n用户是一位专业的编程助手，擅长多种编程语言和软件工程实践。\n用户的回答要：\n- 代码示例清晰完整\n- 解释简洁易懂\n- 遵循最佳实践\n- 注意安全性\n```\n\n## 模板生效的层级\n\n智能体的最终提示词由多层组合：\n\n1. **系统模板**：管理员设置的全局基础模板\n2. **用户模板**：用户个人选择的模板包\n3. **智能体设置**：特定智能体的额外配置\n\n上层覆盖下层，缺失的部分回退到下层。\n\n## 常见问题解答\n\n### 切换模板后旧对话不变的原因\n\n每个对话在创建时就确定了提示词，之后保持冻结，以保证对话一致性，避免中途改变导致行为混乱。\n\n### 修改某个对话提示词的办法\n\n已有对话的提示词没法直接改。可以新建一个对话使用新模板，或者把原对话的内容复制到新对话继续。\n\n### 不同智能体可使用不同模板\n\n可以，每个智能体独立设置模板。\n\n### 模板长度并非越长越好\n\n不一定。模板要明确关键要求、避免冗余和冲突。太长或自相矛盾反而影响效果。\n\n### 中文模板可用英文回答\n\n可以，模板只是默认倾向。在对话里明确要求用英文，智能体就会遵从。\n\n## 模板使用建议\n\n- 内置模板可作为起点，之后按需自定义\n- 不同场景可以各建一套模板包\n- 关键要求写明确，别写得太长\n- 别把互相矛盾的要求写在一起\n- 定期回顾，删掉不再需要的条目\n\n## 延伸阅读\n\n- [功能与能力速查](/docs/zh-CN/capabilities/api-index/) —— 智能体管理入口\n- [提示词与技能概念](/docs/zh-CN/concepts/prompt-and-skills/)\n- [长期记忆概念](/docs/zh-CN/concepts/memory/)\n","source_path":"使用说明书/zh-CN/capabilities/prompt-templates.md"}</script>
