  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/prompt-templates","language":"zh-CN","title":"提示词与个性化","summary":"内置模板包 `default-zh` 与 `default-en`、模板包的分段组成、切换与生效规则，以及自定义模板的创建方式。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/capabilities/prompt-templates/","headings":[{"id":"section-1","level":1,"text":"提示词与个性化"},{"id":"section-2","level":2,"text":"提示词模板"},{"id":"section-3","level":2,"text":"内置模板包"},{"id":"section-4","level":2,"text":"模板包的组成"},{"id":"section-5","level":2,"text":"切换模板包"},{"id":"section-6","level":3,"text":"切换步骤"},{"id":"section-7","level":3,"text":"生效规则"},{"id":"section-8","level":2,"text":"创建自定义模板"},{"id":"section-9","level":3,"text":"创建步骤"},{"id":"section-10","level":3,"text":"各分段的写法"},{"id":"section-11","level":3,"text":"编程助手模板示例"},{"id":"section-12","level":2,"text":"模板生效的层级"},{"id":"section-13","level":2,"text":"编写要点"}],"prev_slug":"zh-CN/capabilities/stream-events","next_slug":"zh-CN/capabilities/config","markdown":"# 提示词与个性化\n\n提示词模板决定智能体的角色定位与回答风格。内置模板包有 `default-zh` 与 `default-en` 两套，也可以在界面里自建模板包。\n\n## 提示词模板\n\n一套模板规定四件事：\n\n- 角色定位\n- 思考和回答问题的方式\n- 工作原则与限制\n- 工具和技能的使用方式\n\n换一套模板，智能体的风格和能力侧重随之改变。\n\n## 内置模板包\n\n| 模板包 | 语言 | 适用场景 |\n| --- | --- | --- |\n| `default-zh` | 用中文思考和回答 | 中文对话场景，默认中文助手风格 |\n| `default-en` | 用英文思考和回答 | 英文对话场景，默认英文助手风格 |\n\n按用户主要使用的语言选择对应的模板包。模板只设定默认倾向：即使模板包是 `default-zh`，在对话里明确要求用英文回答，智能体也会遵从。\n\n## 模板包的组成\n\n每个模板包由多个分段拼成：\n\n| 分段 | 作用 |\n| --- | --- |\n| 角色 | 定义智能体是谁、扮演什么角色 |\n| 工程原则 | 定义工作方式和思考方法 |\n| 工具协议 | 定义如何使用工具 |\n| 技能协议 | 定义如何调用技能 |\n| 记忆 | 定义如何使用长期记忆 |\n| 附加说明 | 其他补充指令 |\n\n## 切换模板包\n\n### 切换步骤\n\n1. 进入左栏底部「设置」→「智能体」\n2. 找到「提示词模板」选项\n3. 选择模板包\n4. 保存设置\n\n### 生效规则\n\n- **新对话**：切换后创建的新对话使用新模板\n- **已有对话**：保持创建时的模板，不变\n\n每个对话在创建时确定提示词并冻结，避免中途改变导致行为前后不一致。已有对话的提示词无法直接修改：新建对话使用新模板，或把原对话的内容复制到新对话继续。\n\n## 创建自定义模板\n\n### 创建步骤\n\n1. 在模板设置页面点「新建模板包」\n2. 选一个基础模板复制，从内置模板起步\n3. 编辑各个分段的内容\n4. 保存后即可使用\n\n### 各分段的写法\n\n- **角色**：写明定位，如「编程助手」「数据分析专家」\n- **工程原则**：设定回答风格，简洁或详细、正式或轻松\n- **工具协议**：一般不用改\n- **附加说明**：放自己的特殊要求\n\n### 编程助手模板示例\n\n角色分段可以这样写：\n\n```\n用户是一位专业的编程助手，擅长多种编程语言和软件工程实践。\n用户的回答要：\n- 代码示例清晰完整\n- 解释简洁易懂\n- 遵循最佳实践\n- 注意安全性\n```\n\n## 模板生效的层级\n\n最终提示词由多层组合：\n\n1. **系统模板**：管理员设置的全局基础模板\n2. **用户模板**：用户个人选择的模板包\n3. **智能体设置**：特定智能体的额外配置\n\n上层覆盖下层，缺失的部分回退到下层。每个智能体独立设置模板。\n\n## 编写要点\n\n- 内置模板可作为起点，之后按需自定义\n- 不同场景各建一套模板包\n- 关键要求写明确，避免冗余；模板不是越长越好，太长或自相矛盾反而影响效果\n- 别把互相矛盾的要求写在一起\n- 定期回顾，删掉不再需要的条目\n","source_path":"使用说明书/zh-CN/capabilities/prompt-templates.md"}</script>
