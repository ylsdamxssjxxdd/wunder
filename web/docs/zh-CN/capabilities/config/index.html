  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/config","language":"zh-CN","title":"系统设置参考","summary":"六类设置项、配置层级与生效时机，以及两种部署形态的配置对照。","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"能力","group":"深入了解","group_path":["深入了解"],"url":"/docs/zh-CN/capabilities/config/","headings":[{"id":"section-1","level":1,"text":"系统设置参考"},{"id":"section-2","level":2,"text":"基础设置"},{"id":"section-3","level":3,"text":"服务地址与端口"},{"id":"section-4","level":3,"text":"运行模式"},{"id":"section-5","level":3,"text":"并发限制"},{"id":"section-6","level":2,"text":"安全设置"},{"id":"section-7","level":3,"text":"API 密钥"},{"id":"section-8","level":3,"text":"访问路径控制"},{"id":"section-9","level":3,"text":"外部认证密钥"},{"id":"section-10","level":2,"text":"存储设置"},{"id":"section-11","level":3,"text":"数据库类型"},{"id":"section-12","level":3,"text":"工作区位置"},{"id":"section-13","level":3,"text":"向量存储"},{"id":"section-14","level":2,"text":"工具设置"},{"id":"section-15","level":3,"text":"内置工具开关"},{"id":"section-16","level":3,"text":"浏览器工具"},{"id":"section-17","level":3,"text":"MCP 扩展工具"},{"id":"section-18","level":2,"text":"模型设置"},{"id":"section-19","level":3,"text":"可用模型列表"},{"id":"section-20","level":3,"text":"上下文限制"},{"id":"section-21","level":2,"text":"渠道设置"},{"id":"section-22","level":3,"text":"渠道账号绑定"},{"id":"section-23","level":3,"text":"Webhook 配置"},{"id":"section-24","level":2,"text":"部署形态"}],"prev_slug":"zh-CN/capabilities/prompt-templates","next_slug":"zh-CN/capabilities/workspace-routing","markdown":"# 系统设置参考\n\n设置按职责分为六类：\n\n- **基础设置**：服务地址、端口、运行模式\n- **安全设置**：访问控制、权限边界\n- **存储设置**：数据存储位置和方式\n- **工具设置**：可用工具范围\n- **模型设置**：AI 模型选择和参数\n- **渠道设置**：外部平台接入\n\n新设置立即对新会话生效；已有会话不会自动改变，保持创建时的设置。三层配置自下而上依次是**系统默认配置**（所有未指定值回退到这里）、**用户个人设置**（覆盖系统默认，只影响该用户）、**智能体设置**（最上层，只影响该智能体）。生效顺序为智能体设置 > 用户设置 > 系统默认。\n\n## 基础设置\n\n### 服务地址与端口\n\n本地使用保留默认值；团队部署换成团队可访问的地址。\n\n### 运行模式\n\n两种取值：**蛹本地模式**（所有数据存本地）与**舰体模式**（支持多用户和集中管理）。个人使用选蛹本地模式，需要多用户协作或集中管理时选舰体模式。\n\n### 并发限制\n\n同时活跃会话的数量上限。个人使用默认值足够，团队使用按用户数和硬件资源调整。\n\n## 安全设置\n\n### API 密钥\n\n舰桥和舰体接口的访问凭证。密钥要足够复杂——建议超过 16 位，包含字母、数字、特殊字符；不要使用容易被猜到的密钥；定期更换。\n\n### 访问路径控制\n\n限制智能体能访问的文件路径和执行的命令：\n\n- **允许的路径**：指定智能体可以操作的目录范围\n- **禁止的模式**：指定禁止访问的文件类型或路径\n\n不要无限制开放整个文件系统：明确指定允许访问的工作目录，禁止访问敏感系统目录。\n\n### 外部认证密钥\n\n把 wunder 嵌入其他系统、或从其他系统调用 wunder 的能力时，用它验证外部请求。\n\n## 存储设置\n\n### 数据库类型\n\n- **SQLite**：轻量级本地数据库，适合蛹本地模式（默认）\n- **PostgreSQL**：专业级数据库，适合舰体多用户模式\n\n### 工作区位置\n\n用户文件和智能体产物的存放位置。舰体模式下要确保工作区目录持久化（使用 NAS 或网络存储）；不要把工作区放在临时目录。\n\n### 向量存储\n\n知识库检索功能使用的存储后端，随主存储后端保存：舰体模式使用 PostgreSQL，蛹本地模式使用 SQLite。需要使用知识库检索能力时配置。\n\n## 工具设置\n\n### 内置工具开关\n\n控制哪些内置工具供智能体使用。敏感环境建议关闭命令执行类工具，按实际需求开放必要的工具。\n\n### 浏览器工具\n\n开启后智能体可以浏览网页、截图。本地使用直接启用；舰体部署可能需要 Docker 容器支持。\n\n### MCP 扩展工具\n\n通过 MCP 协议接入外部工具服务。需要专业数据库操作、特定 API 调用或接入第三方服务时使用。\n\n## 模型设置\n\n### 可用模型列表\n\n智能体可以选择的 AI 模型清单。\n\n- 添加模型时需要填写 API 密钥和接口地址\n- 不同模型有不同的计费方式和能力特点\n- 建议提供多个选项让用户按需选择\n\n### 上下文限制\n\n对话上下文长度的上限。设置为模型支持的最大值即可，超出时系统会自动压缩历史内容。\n\n## 渠道设置\n\n### 渠道账号绑定\n\n绑定飞书、企业微信等外部平台账号。需要在对应平台创建应用并获取凭证，按渠道类型填写相关配置。\n\n### Webhook 配置\n\n外部平台向 wunder 推送消息的接收地址。设置一个可公开访问的地址，并在外部平台配置 Webhook URL。\n\n## 部署形态\n\n| 项 | 个人本地使用（蛹 desktop） | 团队协作（舰体 server） |\n| --- | --- | --- |\n| 数据库 | SQLite（默认） | PostgreSQL |\n| 工作区 | 本地目录 | 网络存储（持久化） |\n| 安全 | 适度限制敏感路径 | 严格配置密钥和路径限制 |\n| 工具 | 按需开放 | 按角色分配权限 |\n","source_path":"使用说明书/zh-CN/capabilities/config.md"}</script>
