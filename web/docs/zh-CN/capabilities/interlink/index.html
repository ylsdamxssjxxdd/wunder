  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/interlink","language":"zh-CN","title":"多端互通","summary":"登录服务端后的设备状态、工作区影子投影、跨端控制的分级审批，以及断线与权限边界。","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"能力","group":"接入与集成","group_path":["接入与集成"],"url":"/docs/zh-CN/capabilities/interlink/","headings":[{"id":"section-1","level":1,"text":"多端互通"},{"id":"section-2","level":2,"text":"三种状态别混"},{"id":"section-3","level":2,"text":"设备状态"},{"id":"section-4","level":2,"text":"能力"},{"id":"section-5","level":2,"text":"入口"},{"id":"section-6","level":2,"text":"分级与审批"},{"id":"section-7","level":2,"text":"安全边界"},{"id":"section-8","level":2,"text":"断线与恢复"},{"id":"section-9","level":2,"text":"不做什么"}],"prev_slug":"zh-CN/capabilities/weixin-channel","next_slug":"en/forms/index","markdown":"# 多端互通\n\n桌面版与安卓版首先是可离线的本地工作台。登录服务端后，不用在本机开端口，就能访问云端智能体与线程；用户明确开启本地共享后，云端版可以经服务端中继，在授权范围内查看并操作该设备的工作区与线程。命令行提供同一能力的手工与脚本入口。\n\n## 三种状态别混\n\n| 状态 | 含义 |\n| --- | --- |\n| 登录有效 | 可以访问云端资源 |\n| 隧道在线 | 云端才能操作这台本地设备 |\n| 本次操作已授权 | 具体的写或执行是否被放行 |\n\n首次登录只拿到独立的设备会话，不会自动开放本地文件或线程；共享级别（关闭 / 摘要 / 完整）在账户设置里选，管理端还能再收紧。\n\n## 设备状态\n\n`online` 在线空闲、`busy` 在线执行中、`away` 在线但闲置、`reconnecting` 断线恢复中、`offline` 离线。服务端把登录会话、隧道连接与可用能力分别记录，三者可以不一致。\n\n## 能力\n\n| 能力 | 说明 |\n| --- | --- |\n| 工作区互见 | 本地工作区以影子投影出现在云端版，投影的是元数据摘要（线程目录、目录树摘要、定时任务、用量）；文件内容不镜像，按操作经隧道按需拉取 |\n| 云端控制本地 | 查询、会话控制、工作区写、工具执行分级开放，敏感操作走本地人在回路审批，全程审计 |\n| 本地控制云端 | 桌面版、安卓版、命令行把云端当对称节点：切换设备后浏览云端线程、发消息、读事件流 |\n| 多端设备 | 设备目录区分桌面、手机、命令行与 Web；手机登录后以手机节点在线，云端可按能力与审批控制它 |\n\n## 入口\n\n| 形态 | 入口 |\n| --- | --- |\n| 桌面版 | 账户设置（登录与共享级别）、云端智能体与线程列表、本地审批弹窗 |\n| 云端版 | 侧栏本地工作区与云端工作区同级展示：默认目录显示为「设备名-本地工作区」，具名目录显示为「设备名-工作区名」 |\n| 命令行 | `cloud` 子命令组：`devices` / `ws` / `threads` / `thread` / `send` / `watch` / `audit` / `approve`；`cloud status` 汇总隧道、待决审批、其他设备与用量 |\n\n## 分级与审批\n\n| 级别 | 覆盖的操作 | 审批 |\n| --- | --- | --- |\n| 只读 | 设备摘要、影子刷新、工作区列目录 / 搜索 / 读文件、线程列表与详情 | 免审批 |\n| 只读（二进制） | 读二进制文件 | 免审批 + 审计 |\n| 会话 | 建线程、发消息、取消、作答 | 操作本地设备需本地审批；操作自己的云端线程走账号鉴权 |\n| 工作区写 | 写、建目录、移动、复制、删除 | 强制审批，不可降级 |\n| 执行 | 白名单命令执行、派生子智能体 | 强制审批 + 管理员默认禁用，可开 |\n\n工作区写操作会先备份到 `工作区/.interlink_backup/<命令 id>/`（保留最近 50 代），结果给出前后校验值。执行类默认不在设备能力集内，审批也不记忆。\n\n## 安全边界\n\n- **零公网入口**：反向隧道，本地只出站长连接，不开监听端口。\n- **最小能力**：每类远程操作都要显式声明，默认只开只读。\n- **一键关停**：开关在用户手里，管理员可再收敛。\n\n## 断线与恢复\n\n桌面版按退避策略重连。服务端进程持续运行时，尚未发出的有界队列会在重连后继续送达；已经发出、正在执行或等待审批的命令在旧连接结束时明确失败，避免重复操作。\n\n服务端重启后，遗留命令分批结算为「服务端重启」，不会一直显示为等待执行；命令正文不持久化，不会从摘要重建参数或自动重做写入。查询可以重新发起，写操作要先核对实际结果再重新发起。\n\n## 不做什么\n\n- 本地与云端线程不合并：互通是远程操作，不是数据同步。\n- 不做工作区全量镜像与双向同步，只有元数据投影加按需拉取。\n- 不做图形化远控，控制粒度止于引擎与文件接口。\n- 不做 NAT 穿透打洞，所有流量经服务端中继；桌面版与命令行之间也不直接互通。\n\n远程读文件以 256 KiB 内联结果为界，更大的文件走有界分片；云端直执行没有设备数据通道，超过该大小的读写需要拆分。云端版不提供二进制上传、归档与批量文件操作。\n","source_path":"使用说明书/zh-CN/capabilities/interlink.md"}</script>
