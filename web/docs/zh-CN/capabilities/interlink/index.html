  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/capabilities/interlink","language":"zh-CN","title":"三端互通","summary":"本地工作台登录云端后的设备管理、工作区访问与线程控制。","updated_at":"2026-10-17","read_when":[],"source_docs":[],"tab":"能力","group":"三端互通","group_path":["三端互通"],"url":"/docs/zh-CN/capabilities/interlink/","headings":[{"id":"section-1","level":1,"text":"三端互通"},{"id":"section-2","level":2,"text":"登录与共享"},{"id":"section-3","level":2,"text":"前提"},{"id":"section-4","level":2,"text":"能力"},{"id":"section-5","level":2,"text":"入口"},{"id":"section-6","level":3,"text":"蛹"},{"id":"section-7","level":3,"text":"蜂巢（web）"},{"id":"section-8","level":3,"text":"舵机"},{"id":"section-9","level":2,"text":"安全边界"},{"id":"section-10","level":2,"text":"约束"},{"id":"section-11","level":3,"text":"边界"}],"prev_slug":"zh-CN/concepts/core-multi-user-management","next_slug":"zh-CN/concepts/architecture","markdown":"# 三端互通\n\n蛹首先是可离线使用的本地 AI 工作台。登录舰体后，可以在不开放本机端口的情况下访问云端智能体和线程；如用户明确开启本地共享，蜂巢可经舰体中继查看并操作该设备授权范围内的工作区与线程。舵机提供同一能力的手工、脚本化入口。\n\n## 登录与共享\n\n首次在蛹或舵机登录云端后，只获得独立的设备会话；不会自动向蜂巢开放本地文件或线程。用户可在账户设置中选择关闭、摘要共享或完整共享，舰桥还可继续收紧设备能力。\n\n“登录有效”“隧道在线”和“本次操作已获授权”是不同状态：登录用于访问云端；隧道在线才可操作本地设备；写入和执行是否可用还取决于设备能力、策略和审批。\n\n## 前提\n\n1. 蛹或舵机已登录舰体。\n2. 需要访问本地设备时，该设备已在线并由用户启用共享。\n3. 舰体是账号、设备、额度与策略的唯一权威。\n\n## 能力\n\n| 编号 | 能力 | 说明 |\n|------|------|------|\n| R1 | 设备状态 | 舰体区分登录会话、隧道连接和可用能力，并显示 `online` / `away` / `busy` / `reconnecting` / `offline` |\n| R2 | 工作区互见 | 本地工作区以**影子投影**出现在蜂巢，投影的是元数据摘要（线程目录、目录树摘要、定时任务、用量）；**文件内容不镜像**，按用户操作经互通隧道按需拉取 |\n| R3 | 云端控制本地 | 蜂巢可对在线本地节点发起分级操作（查询 / 会话控制 / 工作区写 / 工具执行），敏感操作经本地**人在回路审批**，全程审计 |\n| R4 | 本地控制云端 | 蛹/舵机把云端当作对称节点——浏览云端工作区、向云端线程发消息、读取线程事件流；舵机提供脚本化命令组 |\n\n统一状态模型：\n\n| 状态 | 语义 |\n|------|------|\n| `online` | 在线且空闲 |\n| `busy` | 在线且执行中 |\n| `away` | 在线但闲置 |\n| `reconnecting` | 断线恢复中 |\n| `offline` | 离线 |\n\n## 入口\n\n### 蛹\n\n| 入口 | 说明 |\n|------|------|\n| 账户设置 | 登录状态、是否允许本地共享及共享级别 |\n| 云端智能体与线程 | 智能体、最近线程、发送、停止、工具审批、实时状态、历史页和完整原文复制 |\n| 本地审批 | 处理蜂巢向本机发出的受控操作 |\n\n### 蜂巢（web）\n\n| 入口 | 说明 |\n|------|------|\n| 侧栏 | 本地工作区与云端工作区同级展示：默认目录显示为“设备名-本地工作区”，具名目录显示为“设备名-工作区名”；选中某项后在其下展开该工作区的本地线程 |\n| 「云端/设备」下拉切换器 | 已移除 |\n\n### 舵机\n\n| 入口 | 说明 |\n|------|------|\n| `cloud` 子命令组 | `devices` / `ws` / `threads` / `thread` / `send` / `watch` / `audit` / `approve` |\n| `cloud status` | 整合四段：互通隧道、待决审批、其他设备、云端工作区用量 |\n| `cloud watch` | 帧型为 `snapshot` / `delta` / `command` / `error` / `close` |\n\n## 安全边界\n\n| 边界 | 含义 |\n|------|------|\n| 零公网入口 | 反向隧道：本地只出站长连接，不开监听端口，控制流复用已建链路下发 |\n| 最小能力 | 每类远程操作是声明式能力，默认只开只读 |\n| 显式授权 | 写与执行类必须本地用户授权，管理员可在舰桥再收敛 |\n| 逐级审批 | L0–L3 风险分层，见下表 |\n| 完整审计 | 每次远程操作成链可查 |\n| 一键关停 | kill switch 由用户掌握 |\n\n风险分层：\n\n| 级别 | 覆盖的操作 | 审批 |\n|------|------|------|\n| L0 只读 | `node.summary` / `shadow.refresh` / `workspace.list\\|search\\|stat\\|read` / `threads.list\\|get` | 免审批 |\n| L0+ | `workspace.read:binary` | 免审批 + 审计 |\n| L1 会话 | `thread.create` / `thread.message` / `thread.cancel` / `thread.answer` | 操作本地设备默认需本地审批；操作自己的云端线程由账号鉴权 |\n| L2 工作区写 | `workspace.write\\|mkdir\\|move\\|copy\\|delete` | 强制审批，不可降 |\n| L3 执行 | `tool.exec`（白名单命令） / `agent.spawn` | 强制审批 + 管理员默认禁用，可开 |\n\n- **L3 默认关闭**：`tool.exec` / `agent.spawn` 默认不在设备能力集；审批永不记忆；执行结果只回摘要。\n- **L2 写先备份**：写操作先备份到 `工作区/.interlink_backup/<command_id>/`（保留最近 50 代），结果给出前后 SHA256。\n\n## 约束\n\n### 边界\n\n- 本地与云端线程不合并。互通是远程操作，不是数据同步。\n- 不做工作区文件全量镜像与双向同步，只有元数据投影 + 按需拉取。\n- 不做图形化远控，控制粒度止于引擎与文件 API。\n- 不做 NAT 穿透打洞，所有流量经舰体中继。\n- 蛹与舵机之间不直接互通，本地互访一律经舰体中转。\n\n远程文件读取以 256 KiB 内联结果为界，较大文件通过有界分片传输；云端直执行没有设备数据通道，超过该大小的读写需要拆分。蜂巢不提供二进制上传、归档和批量文件操作。\n","source_path":"使用说明书/zh-CN/capabilities/interlink.md"}</script>
