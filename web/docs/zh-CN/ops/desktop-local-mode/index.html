  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/ops/desktop-local-mode","language":"zh-CN","title":"蜂窝本地模式","summary":"蜂窝本地模式是一套本地优先、持久目录优先的运行形态。","updated_at":"2026-04-11","read_when":["用户主要使用 wunder-desktop","用户要判断本地模式和远端 server 模式分别适合什么"],"source_docs":["docs/API文档.md","src/api/desktop.rs","frontend/src/components/messenger/DesktopRuntimeSettingsPanel.vue"],"tab":"运维","group":"部署与治理","group_path":["部署与治理"],"url":"/docs/zh-CN/ops/desktop-local-mode/","headings":[{"id":"section-1","level":1,"text":"蜂窝本地模式"},{"id":"section-2","level":2,"text":"常见误解"},{"id":"section-3","level":2,"text":"本地模式最核心的特点"},{"id":"section-4","level":3,"text":"工作目录是持久的"},{"id":"section-5","level":3,"text":"工作目录是本地真实目录"},{"id":"section-6","level":3,"text":"优先使用附带运行时"},{"id":"section-7","level":2,"text":"本地模式作为第一入口的原因"},{"id":"section-8","level":2,"text":"本地模式下的文件能力特点"},{"id":"section-9","level":2,"text":"一键重置工作状态"},{"id":"section-10","level":2,"text":"重置后保留的内容"},{"id":"section-11","level":2,"text":"改用舰体（server）的时机"},{"id":"section-12","level":2,"text":"本地模式容易踩的坑"},{"id":"section-13","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/ops/data-and-storage","next_slug":"zh-CN/ops/auth-and-security","markdown":"# 蜂窝本地模式\n\n蜂窝本地模式是 wunder 当前最贴近真实个人使用的形态。\n\n## 常见误解\n\n不要把它理解成「小号 server」或「少了管理员后台的 server」。它是本地优先的完整运行形态：一台电脑上就能完成日常全部工作。\n\n## 本地模式最核心的特点\n\n### 工作目录是持久的\n\n本地模式下，工作目录不是临时 sandbox。\n\n- `WUNDER_WORK/` 按持久目录处理\n- 不走 24 小时自动清理\n\n### 工作目录是本地真实目录\n\n本地形态下，工作目录直接落在用户本机的持久目录上：\n\n- 目录内容持久保存，不走定期清理\n- 智能体直接读写这个目录，不需要在「沙箱目录」和真实目录之间来回映射\n- 与云端形态的区别只是位置：云端是服务端数据根下按用户划分的唯一目录，本地是本机上的持久目录\n- 两种形态都是「一个用户一个智能体实例 + 一个工作目录」，没有容器分层\n\n### 优先使用附带运行时\n\n蜂窝本地模式优先使用安装包附带的 Python 运行时，减少首次配置成本。\n\n## 本地模式作为第一入口的原因\n\n个人使用的完整主链路——用户侧界面、对话执行、工具调用、工作区文件、智能体设置、子智能体——在本地模式下都能覆盖，日常使用不需要再切换其他形态。\n\n## 本地模式下的文件能力特点\n\n当前一个关键约定是：\n\n- 本地模式下，内置文件工具可以访问本机绝对路径\n\n这比纯工作区限制更灵活，但也意味着用户要更清楚本地目录边界。\n\n## 一键重置工作状态\n\n本地模式现在提供 `一键重置工作状态`。\n\n它适合这些场景：\n\n- 会话卡在运行中\n- 子智能体运行状态明显不一致\n- 工作区里留下半截运行态文件\n- 用户想让智能体回到干净任务线程\n\n执行后会：\n\n- 中止当前用户仍在运行的会话\n- 清空排队任务\n- 为智能体重建任务线程\n- 清理对应工作态目录\n\n## 重置后保留的内容\n\n这次重置针对的是「工作态」，不碰「长期资产」。\n\n会保留的典型内容包括：\n\n- `global`\n- `skills`\n- `knowledge`\n- 用户长期配置\n\n所以它做的是「把运行现场清干净」，而不是「恢复出厂设置」。\n\n## 改用舰体（server）的时机\n\n如果用户只是个人使用，本地模式通常已经够用。\n\n当用户开始需要这些能力时，改用浏览器访问蜂巢（web，随舰体提供）：\n\n- 多用户治理\n- 管理员后台\n- 单位/组织控制\n- 统一渠道与服务接入\n\n## 本地模式容易踩的坑\n\n- 把本地模式当作无状态运行\n- 以为本地目录还要再分「个人容器 / 智能体容器」\n- 以为修改提示词会回写当前老线程\n- 以为重置工作状态会顺手删除长期技能或知识\n\n## 延伸阅读\n\n- [蜂窝入门](/docs/zh-CN/start/desktop/)\n- [用户侧前端](/docs/zh-CN/surfaces/frontend/)\n- [工作区与工作目录](/docs/zh-CN/concepts/workspaces/)\n","source_path":"使用说明书/zh-CN/ops/desktop-local-mode.md"}</script>
