  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/ops/benchmark-and-observability","language":"zh-CN","title":"监控与 WunderBench","summary":"观测能力各有分工：会话监控看线程、工具统计看热点、性能采样看链路、WunderBench 看模型能力质量。","updated_at":"2026-09-25","read_when":[],"source_docs":[],"tab":"运维","group":"部署与治理","group_path":["部署与治理"],"url":"/docs/zh-CN/ops/benchmark-and-observability/","headings":[{"id":"section-1","level":1,"text":"监控与 WunderBench"},{"id":"section-2","level":2,"text":"四类观测能力"},{"id":"section-3","level":2,"text":"会话监控"},{"id":"section-4","level":3,"text":"观察内容"},{"id":"section-5","level":3,"text":"适用场景"},{"id":"section-6","level":2,"text":"工具统计"},{"id":"section-7","level":3,"text":"观察内容"},{"id":"section-8","level":3,"text":"适用场景"},{"id":"section-9","level":2,"text":"性能与吞吐"},{"id":"section-10","level":3,"text":"性能采样"},{"id":"section-11","level":3,"text":"吞吐压测"},{"id":"section-12","level":3,"text":"两者区别"},{"id":"section-13","level":2,"text":"WunderBench 模型评测"},{"id":"section-14","level":3,"text":"观察内容"},{"id":"section-15","level":3,"text":"与压测的区别"},{"id":"section-16","level":3,"text":"适用场景"},{"id":"section-17","level":3,"text":"关键输出"},{"id":"section-18","level":3,"text":"导出评测记录"},{"id":"section-19","level":2,"text":"关键指标"},{"id":"section-20","level":3,"text":"健康指标"},{"id":"section-21","level":3,"text":"资源指标"},{"id":"section-22","level":3,"text":"业务指标"},{"id":"section-23","level":2,"text":"服务端日志"},{"id":"section-24","level":2,"text":"实践"},{"id":"section-25","level":3,"text":"日常巡检"},{"id":"section-26","level":3,"text":"周期评估"},{"id":"section-27","level":3,"text":"问题排查"},{"id":"section-28","level":2,"text":"常见误区"},{"id":"section-29","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/ops/auth-and-security","next_slug":"zh-CN/ops/wunderbench","markdown":"# 监控与 WunderBench\n\n## 四类观测能力\n\nWunder 的观测分为四类各有分工的能力：\n\n| 能力 | 看什么 | 回答什么问题 |\n|------|--------|-------------|\n| **会话监控** | 线程运行细节 | 线程在干什么？卡在哪？ |\n| **工具统计** | 工具使用情况 | 哪个工具最忙？有没有异常？ |\n| **性能采样** | 系统链路基线 | 系统扛得住吗？慢在哪？ |\n| **吞吐压测** | 模型长度组合性能 | 上文变长后速度如何变化？ |\n| **WunderBench** | 任务完成质量 | 模型在 Wunder 中表现如何？有没有退化？ |\n\n## 会话监控\n\n### 观察内容\n\n- 活跃线程列表\n- 每个线程的当前状态和阶段\n- Token 占用统计\n- 工具调用记录\n- 事件时间线\n\n### 适用场景\n\n- 排查线程卡住或异常\n- 查看某个会话的执行详情\n- 强制取消异常线程\n- 触发上下文压缩\n\n## 工具统计\n\n### 观察内容\n\n- 各工具的调用次数\n- 工具调用成功率\n- 哪些用户在使用哪些工具\n- 工具调用与线程状态的关系\n\n### 适用场景\n\n- 某个工具成了性能瓶颈\n- 工具调用异常频繁\n- 评估工具使用模式\n\n## 性能与吞吐\n\n### 性能采样\n\n测量单请求的延迟基线：\n- 模型响应速度\n- 工具执行速度\n- 端到端延迟\n\n### 吞吐压测\n\n每次直连模型 API 测试一个模型、并发列表、输入长度和输出长度组合，按列表顺序逐项测试；每一项会并行发起该并发数的请求，观察各并发档的首字延迟、生成速度和实际用量。\n\n输入和输出都保留常用档位，同时允许在安全范围内自由输入整数。默认并发列表为 `1,2,4,8`，输入为 `8.2k` Token，输出为 `128` Token。页面中 Token 数量从 1,000 起显示为 `k`，从 100,000 起显示为 `m`。仅支持的引擎能够接收定长控制参数，其余接口设置上限并验证是否达标。\n\n选择虚拟模型可验证测量流程。在“模型配置 → 模拟速度”选择快、中、慢，默认快：预填充分别为 2000 / 500 / 100 Token/s，思考与生成分别为 200 / 50 / 10 Token/s。吞吐模拟先思考再生成内容，思考默认占指定输出总数的 1/4，可通过模拟思考开关与预算调整，详情中单列。详情标记模拟数据与速度，历史曲线按档位分组。首字延迟包含预填充等待；快档 1m 输入约需 524 秒，需相应提高模型超时，也可在等待期间停止。\n\n测试不生成线程日志，历史仅保留最近 50 次摘要。详情与曲线会显示整体预填充/生成速度，以及“单预填充速度”和“单生成速度”；速度从 1,000 起使用 `k tok/s`，从 100,000 起使用 `m tok/s`。勾选历史数据可在并发数横轴上查看速度曲线；曲线纵轴以同一测试中并发 1 为 0% 基线，显示后续并发档的百分比变化，悬停可查看实测速度。结果不会用“达标/未达标”做额外标记。\n\n### 两者区别\n\n- **性能采样**：单请求级别的延迟\n- **吞吐压测**：不同上下文与输出长度下的模型 API 性能\n\n## WunderBench 模型评测\n\n### 观察内容\n\n- 任务完成质量评分\n- 工具调用成功率、稳定性、效率与上下文消耗\n- 不同模型的能力对比\n- 版本间的能力回归检测\n- `full` 全量题库评测，也可按任务组或任务 ID 手动筛选复查\n\n### 与压测的区别\n\n- **吞吐压测**：关注不同长度组合的响应与生成速度\n- **WunderBench**：关注\"是否能在真实智能体链路中完成任务、有没有退化\"\n\n### 适用场景\n\n- 新版本发布前评估\n- 对比不同模型的能力\n- 验证优化是否有效\n- 为默认模型、裁判模型、工具启用策略提供依据\n\n### 关键输出\n\n- `summary.scorecard.readiness`：可用性结论，包含 `production_ready`、`usable`、`risky`、`not_ready`\n- `overall_score`：任务平均得分\n- `reliability_score`：通过率口径\n- `tool_success_score`：工具结果成功率\n- `stability_score`：完成率与多轮波动\n- `weakest_suites` / `top_failures`：最需要复查的任务组和失败项\n\n### 导出评测记录\n\n- 在 WunderBench 页面点击“导出评测记录”，或调用 `GET /wunder/admin/wunderbench/runs/{run_id}/export`。\n- 导出的 JSON 包含运行信息、任务聚合、attempt 明细、题目规格、产物摘要、transcript，以及每个模型 attempt 对应的 monitor 持久化日志。\n- 新启动的 WunderBench 会使用管理员调试日志记录评测线程，导出文件可用于复盘模型请求、模型输出、工具调用、工具结果、工作区更新与 token/速度统计。\n- 详细使用、评分口径和题库扩展说明见 [WunderBench 模型评测](/docs/zh-CN/ops/wunderbench/)。\n\n## 关键指标\n\n### 健康指标\n\n| 指标 | 正常范围 | 告警阈值 |\n|------|----------|----------|\n| 活跃会话数 | < 最大限制的 80% | > 80% |\n| 队列深度 | < 50 | > 100 |\n| 错误率 | < 1% | > 5% |\n| 平均延迟 | < 10s | > 30s |\n\n### 资源指标\n\n| 指标 | 关注点 |\n|------|--------|\n| CPU 使用率 | 是否有异常峰值 |\n| 内存使用率 | 是否持续增长（可能有泄漏） |\n| 磁盘使用率 | 工作区和日志是否过大 |\n| 网络流量 | 是否有异常流量 |\n\n### 业务指标\n\n| 指标 | 关注点 |\n|------|--------|\n| 日活用户数 | 系统使用趋势 |\n| 每日 Token 消耗 | 资源使用趋势 |\n| 工具调用分布 | 用户使用模式 |\n| 渠道消息量 | 各渠道使用情况 |\n\n## 服务端日志\n\nServer 模式下，运行日志保存在 `config/data/logs/server/`：\n- 按天轮转的 JSONL 文件\n- 默认保留 14 天\n- 包含请求、工具调用、错误等记录\n- 出问题时优先查看最新日志\n\n## 实践\n\n### 日常巡检\n\n每天看一眼：\n- 系统健康状态\n- 错误率趋势\n- 队列积压情况\n- 磁盘空间\n\n### 周期评估\n\n每周或每月：\n- Token 消耗趋势\n- 工具使用统计\n- 性能基线变化\n- WunderBench 评测结果\n\n### 问题排查\n\n遇到问题时：\n1. 看会话监控找到异常线程\n2. 查看工具调用记录\n3. 检查性能指标\n4. 查看服务端日志\n\n## 常见误区\n\n- **WunderBench = 压测？** 不是。WunderBench 评估模型能力质量，压测评估承压能力。\n- **日志多 = 可观测性好？** 不是。要有结构、有分层、有指标。\n- **只看一层就够？** 不够。很多问题需要把监控、日志、统计一起看。\n\n## 延伸阅读\n\n- [可观测性](/docs/zh-CN/concepts/core-observability/) —— 观测的设计原则\n- [WunderBench 模型评测](/docs/zh-CN/ops/wunderbench/) —— 全量题库评测、导出和题库扩展\n- [会话状态说明](/docs/zh-CN/reference/stream-events/) —— 状态指标含义\n- [管理端面板指南](/docs/zh-CN/reference/admin-panels/) —— 监控入口\n\n模拟测试也会执行最大上下文与最大输出校验，超限记录为失败。默认上下文 128k，如需测到 1m，请将窗口设为足够容纳输入加输出。\n","source_path":"使用说明书/zh-CN/ops/benchmark-and-observability.md"}</script>
