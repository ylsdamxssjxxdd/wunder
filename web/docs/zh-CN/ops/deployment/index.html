  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/ops/deployment","language":"zh-CN","title":"部署与运行","summary":"三种运行形态的适用对象与准备内容；舰体部署的组件、配置、网络入口与启动检查。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"运维","group":"部署与治理","group_path":["部署与治理"],"url":"/docs/zh-CN/ops/deployment/","headings":[{"id":"section-1","level":2,"text":"运行形态"},{"id":"section-2","level":2,"text":"蜂窝部署"},{"id":"section-3","level":2,"text":"舰体部署"},{"id":"section-4","level":3,"text":"最低要求"},{"id":"section-5","level":3,"text":"推荐部署方式"},{"id":"section-6","level":3,"text":"需要准备的配置"},{"id":"section-7","level":3,"text":"网络规划"},{"id":"section-8","level":3,"text":"启动后检查"},{"id":"section-9","level":3,"text":"Docker 下的系统状态"},{"id":"section-10","level":3,"text":"Docker 下的浏览器"},{"id":"section-11","level":3,"text":"Docker 下的沙盒写权限"},{"id":"section-12","level":2,"text":"升级策略"},{"id":"section-13","level":2,"text":"常见部署问题"},{"id":"section-14","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/ops/index","next_slug":"zh-CN/ops/data-and-storage","markdown":"## 运行形态\n\n三种形态对应不同的适用对象与准备内容。\n\n| 形态 | 适合谁 | 需要什么 |\n|------|--------|----------|\n| **蜂窝（desktop）** | 个人使用 | 下载安装包，开箱即用 |\n| **舰体（server）** | 团队/组织 | 服务器 + 数据库 + 配置 |\n| **本地开发** | 开发调试 | 本地编译环境 |\n\n## 蜂窝部署\n\n安装步骤：\n\n1. 下载安装包\n2. 安装并启动\n3. 开始使用\n\n不需要额外配置。数据存在本地，使用 SQLite。\n\n详细步骤见 [蜂窝入门](/docs/zh-CN/start/desktop/)。\n\n## 舰体部署\n\n### 最低要求\n\n| 组件 | 说明 | 是否必需 |\n|------|------|--------|\n| 后端服务 | 对外提供接口与调度 | 是 |\n| PostgreSQL | 主数据库 | 是 |\n| 工作区存储 | 用户文件空间 | 是 |\n| 前端静态资源 | 蜂巢/舰桥页面 | 推荐 |\n| MCP 服务 | 外部工具能力 | 按需 |\n| 沙盒服务 | 隔离执行环境 | 按需 |\n| 向量数据库 | 知识库检索 | 按需 |\n\n### 推荐部署方式\n\n推荐用 Docker Compose：\n\n- 组件一次拉起，配置集中在同一份文件里\n- 升级时替换镜像即可\n\n### 需要准备的配置\n\n部署时要准备好服务监听地址与端口、访问用 API 密钥、数据库连接信息、配置文件位置，以及沙盒服务地址（启用沙盒时）。Docker 环境下，服务端编译时默认启用了 MCP、主机指标和网页抓取三项能力。\n\n### 网络规划\n\n对外网络入口：\n\n| 入口 | 用途 |\n|------|------|\n| 主服务地址 | 后端接口 |\n| WebSocket 通道 | 实时通信 |\n| 舰桥地址 | 管理后台 |\n| 文档站地址 | 使用说明书 |\n\n建议统一在同一域名下，通过路径区分。\n\n### 启动后检查\n\n启动完成后，按这个顺序检查：\n\n1. 确认后端服务正常运行\n2. 确认数据库连接正常\n3. 确认 WebSocket 可建立连接\n4. 确认舰桥可打开\n5. 确认用户端可访问\n6. 确认文档站可访问\n\n### Docker 下的系统状态\n\n管理员侧系统状态里的 CPU、内存、进程、负载和磁盘指标，来自服务端编译时启用的主机指标能力；用户侧的「网页抓取」工具来自网页抓取能力。当前默认发布的镜像已包含这两项。如果在配置里手动覆盖了编译选项，需要保留主机指标和网页抓取，否则系统资源指标会以 0 值降级显示，用户侧智能体工具列表也不会出现「网页抓取」。\n\n管理员侧配置的抓取服务会同步给「网页搜索」；不过「网页搜索」入口在当前版本已经移除，无论抓取服务如何配置，用户侧智能体工具列表都不会出现它。\n\n### Docker 下的浏览器\n\n如果需要在 Docker 中使用浏览器工具：\n\n- 确保镜像构建时安装了 Chromium\n- 分配足够的共享内存（2 GB）\n- 启用浏览器相关配置\n\n### Docker 下的沙盒写权限\n\n当前默认让沙盒容器保持可写根文件系统，方便文件工具访问容器内任意路径。沙盒的只读限制分两层：一层在 wunder 请求侧，一层由 Docker 的容器级只读开关控制。若文件工具写根路径（如 `/test_file.txt`）时提示「只读文件系统」，通常是在运行的容器仍在用旧的只读配置，重建沙盒容器即可。\n\n## 升级策略\n\n- 滚动更新：逐个替换实例，不中断服务\n- 数据库迁移：系统自动处理，不需要手动操作\n- 配置兼容：新版本会自动适配旧配置格式\n\n## 常见部署问题\n\n| 问题 | 原因 | 解决 |\n|------|------|------|\n| 启动失败 | PostgreSQL 未准备好 | 确保数据库先启动 |\n| WebSocket 连不上 | 端口或代理配置问题 | 检查端口和反向代理配置 |\n| 工作区丢失 | 没有持久化存储 | 使用数据卷挂载 |\n| 临时文件堆积 | 没有清理策略 | 配置定期清理任务 |\n| 舰桥系统状态资源指标为 0 | 编译选项被覆盖后缺少主机指标能力 | 恢复默认编译配置并重建服务与沙盒 |\n| 用户侧看不到网页抓取 | 编译选项被覆盖后缺少网页抓取能力 | 恢复默认编译配置并重建服务与沙盒 |\n| 用户侧看不到网页搜索 | 网页搜索入口已移除，与抓取服务配置无关 | 属于当前预期行为，无需处理 |\n| 浏览器工具不可用 | 镜像构建时没装 Chromium | 检查镜像构建配置 |\n| 文件工具根路径写入失败 | 沙盒容器仍是只读根文件系统 | 确认沙盒可写开关为默认开启，并重建沙盒容器 |\n\n## 延伸阅读\n\n- [Server 入门](/docs/zh-CN/start/server/)\n- [数据与存储](/docs/zh-CN/ops/data-and-storage/)\n- [系统设置参考](/docs/zh-CN/reference/config/)\n","source_path":"使用说明书/zh-CN/ops/deployment.md"}</script>
