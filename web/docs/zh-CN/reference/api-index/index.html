  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/reference/api-index","language":"zh-CN","title":"功能与能力速查","summary":"wunder 能做什么，每个能力在哪使用。按功能类别组织，方便快速定位。","updated_at":"2026-10-09","read_when":[],"source_docs":[],"tab":"参考","group":"系统参考","group_path":["系统参考"],"url":"/docs/zh-CN/reference/api-index/","headings":[{"id":"section-1","level":1,"text":"功能与能力速查"},{"id":"section-2","level":2,"text":"智能对话"},{"id":"section-3","level":2,"text":"工作目录"},{"id":"section-4","level":2,"text":"智能体设置"},{"id":"section-5","level":2,"text":"工具与技能"},{"id":"section-6","level":2,"text":"渠道接入"},{"id":"section-7","level":2,"text":"定时任务"},{"id":"section-8","level":2,"text":"系统设置"},{"id":"section-9","level":2,"text":"舰桥功能（管理员专用）"},{"id":"section-10","level":2,"text":"按需求快速定位"},{"id":"section-11","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/reference/index","next_slug":"zh-CN/reference/config","markdown":"# 功能与能力速查\n\n按使用场景列出 wunder 的主要能力，并标注每项能力对应的功能入口。\n\n## 智能对话\n\n位置：工作台（蜂窝或蜂巢）→ 左栏「新任务」按钮或工作区下的线程列表。\n\n- 提问并获得智能回答\n- 上传文件让智能体分析\n- 让智能体执行各种任务（写代码、处理文件、搜索信息等）\n- 查看对话历史和继续之前的会话\n\n**相关参考**\n\n- [会话状态说明](/docs/zh-CN/reference/stream-events/)\n- [提示词与个性化](/docs/zh-CN/reference/prompt-templates/)\n\n## 工作目录\n\n位置：工作台 → 左栏工作区下方的「工作目录」区。\n\n- 上传文档、图片、音频等文件供智能体使用\n- 下载智能体生成的文件\n- 浏览和管理属于自己的唯一云端目录\n- 查看智能体工作过程中产生的文件\n\n**相关参考**\n\n- [工作区路由与文件管理](/docs/zh-CN/reference/workspace-routing/)\n\n## 智能体设置\n\n位置：工作台 → 左栏底部「设置」→「智能体」。\n\n每个用户只有**一个**智能体实例，由管理侧预设 1:1 绑定生成。用户侧没有创建、删除、切换或排序智能体的入口。\n\n- 查看当前智能体实例与绑定的预设\n- 修改预设允许自定义的字段（如默认模型、审批模式、工具集合）\n- 设置智能体的回答风格（提示词模板）\n- 管理智能体的长期记忆\n\n**相关参考**\n\n- [提示词与个性化](/docs/zh-CN/reference/prompt-templates/)\n- [工具体系概念](/docs/zh-CN/concepts/tools/)\n\n## 工具与技能\n\n位置：工作台 → 左栏底部「设置」→「工具」。用户侧只做查看与开关，工具清单由管理侧维护。\n\n- 查看可用工具列表\n- 配置技能（预设的能力包）\n- 添加知识库（让智能体参考用户的专属资料）\n\n内置工具覆盖：\n\n- 文件操作：读取、写入、搜索文件\n- 网络操作：搜索、抓取网页内容\n- 代码操作：执行命令、编写代码\n- 系统操作：截图、获取系统状态\n- 更多能力通过 MCP 扩展\n\n**相关参考**\n\n- [工具体系概念](/docs/zh-CN/concepts/tools/)\n- [提示词与技能概念](/docs/zh-CN/concepts/prompt-and-skills/)\n\n## 渠道接入\n\n位置：舰桥 → \"渠道管理\"。\n\n- 绑定飞书/企业微信/微信/QQ 等账号\n- 让外部平台的用户也能使用智能体\n- 查看渠道运行状态和消息日志\n- 排查渠道相关问题\n\n当组织成员习惯在飞书、微信里沟通时，用渠道接入让他们不用换工具就能使用智能体。\n\n**相关参考**\n\n- [渠道管理指南](/docs/zh-CN/ops/channel-runtime/)\n- [舰桥面板指南](/docs/zh-CN/reference/admin-panels/)\n\n## 定时任务\n\n位置：工作台 → 左栏底部「设置」→「定时任务」。\n\n- 创建定时执行的任务\n- 查看任务执行历史\n- 管理、暂停、删除定时任务\n\n适合周期性工作，比如每天定时汇总报告、定时检查系统状态。\n\n## 系统设置\n\n位置：工作台 → 左栏底部「设置」。\n\n- 修改系统语言\n- 配置连接的服务地址\n- 管理个人账户信息\n- 查看使用统计和额度余额\n\n**相关参考**\n\n- [系统设置参考](/docs/zh-CN/reference/config/)\n\n## 舰桥功能（管理员专用）\n\n位置：浏览器访问舰桥地址。主要面板：\n\n- 系统设置：全局配置\n- 用户管理：用户账户、额度账户\n- 单位管理：组织架构\n- 模型配置：可选用的 AI 模型\n- 工具管理：可用工具列表\n- 渠道监控：外部渠道状态\n- 性能监控：系统运行状态\n\n**相关参考**\n\n- [舰桥面板指南](/docs/zh-CN/reference/admin-panels/)\n- [系统设置参考](/docs/zh-CN/reference/config/)\n\n## 按需求快速定位\n\n| 我想... | 去哪里 |\n|---------|--------|\n| 开始一个对话 | 左栏「新任务」→ 直接输入 |\n| 上传文件让智能体分析 | 左栏工作目录区点上传或拖拽文件，也可在输入区加附件 |\n| 查看智能体生成的文件 | 左栏工作目录区 |\n| 定制智能体的风格 | 左栏底部「设置」→ 智能体 → 提示词模板 |\n| 创建定时任务 | 左栏底部「设置」→ 定时任务 → 创建任务 |\n| 管理用户（管理员） | 舰桥 → 用户管理 |\n| 配置渠道（管理员） | 舰桥 → 渠道管理 |\n\n## 延伸阅读\n\n- [核心概念概览](/docs/zh-CN/concepts/)\n- [快速入门](/docs/zh-CN/start/quickstart/)\n- [故障排查](/docs/zh-CN/help/troubleshooting/)\n","source_path":"使用说明书/zh-CN/reference/api-index.md"}</script>
