  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/help/faq","language":"zh-CN","title":"FAQ","summary":"使用 wunder 时的常见结论与答复。","updated_at":"2026-04-10","read_when":[],"source_docs":[],"tab":"参考","group":"排障与术语","group_path":["排障与术语"],"url":"/docs/zh-CN/help/faq/","headings":[{"id":"section-1","level":1,"text":"FAQ"},{"id":"section-2","level":2,"text":"注册与登录"},{"id":"section-3","level":2,"text":"费用与用量"},{"id":"section-4","level":2,"text":"要求设置的生效范围"},{"id":"section-5","level":2,"text":"记忆的加载时机"},{"id":"section-6","level":2,"text":"新建线程按钮的禁用时机"},{"id":"section-7","level":2,"text":"子智能体"},{"id":"section-8","level":2,"text":"蜂窝与舰体的依赖关系"},{"id":"section-9","level":2,"text":"修改用户名与密码"},{"id":"section-10","level":2,"text":"密码找回"},{"id":"section-11","level":2,"text":"上传文件的清理"},{"id":"section-12","level":2,"text":"工具可见性"},{"id":"section-13","level":2,"text":"webfetch 与浏览器工具的区别"},{"id":"section-14","level":2,"text":"问题排查入口"}],"prev_slug":"zh-CN/help/troubleshooting","next_slug":"zh-CN/help/glossary","markdown":"# FAQ\n\n## 注册与登录\n\n不需要注册。用任意名称就可以直接开始对话，系统会自动创建对应身份。\n\n## 费用与用量\n\n不是费用。Token 数只是当前对话的上下文长度参考，实际费用取决于模型服务商的计费规则。\n\n## 要求设置的生效范围\n\n不会重新学习。对话开头设定的要求会被记住并锁定，后续消息都会遵守，不需要重复说明。\n\n## 记忆的加载时机\n\n不会每轮读取。长期记忆只在对话开始时加载一次，不会在每轮对话中反复读取。\n\n## 新建线程按钮的禁用时机\n\n创建线程或切换操作尚未完成时，按钮会短暂禁用。其他工作线程正在运行不会阻止新建；已有未使用空线程时会优先复用。\n\n## 子智能体\n\n子智能体是智能体在任务中临时创建的工作单元，用来把一件可以并行推进的事拆开做完，结果回传给主线程后即回收。它不是一个独立智能体，用户侧始终只有一个智能体实例。\n\n## 蜂窝与舰体的依赖关系\n\n不必须部署舰体。蜂窝可以本地独立运行。需要多人协作和统一管理时再部署舰体。\n\n## 修改用户名与密码\n\n去「我的概况 → 编辑资料」。改密码需要输入当前密码。\n\n## 密码找回\n\n在登录页点「重置密码」，只需要用户名、邮箱和新密码，不需要旧密码。\n\n## 上传文件的清理\n\n临时目录里的文件可能会被清理，重要文件请放在工作区持久目录中。\n\n## 工具可见性\n\n可能原因：工具未启用、MCP/A2A 服务未开启、当前智能体没有挂载该工具。\n\n## `web_fetch` 与浏览器工具的区别\n\n- web_fetch：抓取网页正文内容\n- 浏览器工具：像真人一样操作网页（点击、滚动、填表）\n\n## 问题排查入口\n\n排障见 [故障排查](/docs/zh-CN/help/troubleshooting/)。\n","source_path":"使用说明书/zh-CN/help/faq.md"}</script>
