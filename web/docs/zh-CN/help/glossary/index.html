  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/help/glossary","language":"zh-CN","title":"术语表","summary":"wunder 文档里的核心术语，用大白话解释，避免混淆。","updated_at":"2026-10-07","read_when":["用户第一次系统性阅读 wunder 文档","用户发现很多词看起来相近但不知道区别"],"source_docs":["docs/设计文档/01-系统总体设计.md","docs/API文档.md"],"tab":"帮助","group":"帮助","group_path":["帮助"],"url":"/docs/zh-CN/help/glossary/","headings":[{"id":"section-1","level":1,"text":"术语表"},{"id":"section-2","level":2,"text":"产品与形态名称"},{"id":"section-3","level":2,"text":"用户"},{"id":"section-4","level":2,"text":"智能体"},{"id":"section-5","level":2,"text":"预设智能体"},{"id":"section-6","level":2,"text":"线程"},{"id":"section-7","level":2,"text":"子智能体"},{"id":"section-8","level":2,"text":"工作区"},{"id":"section-9","level":2,"text":"工作目录"},{"id":"section-10","level":2,"text":"用户轮次"},{"id":"section-11","level":2,"text":"模型轮次"},{"id":"section-12","level":2,"text":"技能（Skill）"},{"id":"section-13","level":2,"text":"MCP"},{"id":"section-14","level":2,"text":"A2A"},{"id":"section-15","level":2,"text":"渠道（Channel）"},{"id":"section-16","level":2,"text":"Token"},{"id":"section-17","level":2,"text":"上下文压缩"},{"id":"section-18","level":2,"text":"长期记忆"},{"id":"section-19","level":2,"text":"延伸阅读"}],"prev_slug":"zh-CN/help/faq","next_slug":"en/index","markdown":"# 术语表\n\n## 产品与形态名称\n\n| 中文名 | 英文/技术标识 | 说明 |\n|------|------|------|\n| 心舰 wunder | `wunder` | 产品本身，智能体调度系统的总称。 |\n| 核心 | `wunder-core` | 代码底层：配置、鉴权、存储契约、执行策略等基础设施。 |\n| 引擎 | `wunder-runtime` | 代码执行层：orchestrator、线程运行时、工具、渠道与网关。蜂窝与舵机直接依赖引擎，不依赖舰体。 |\n| 舰体 | `wunder-server` | 服务端形态，面向团队与组织，负责多用户、权限与渠道接入。 |\n| 舰桥 | `web/` | 治理前端，系统管理员的后台，用于系统配置、用户与渠道治理。 |\n| 渠道舰桥节点 | `bridge node`（`bridge_center`） | 渠道桥接节点：承载渠道账号接入与消息路由的节点，由舰桥统一管理；注意与治理前端「舰桥」区分。 |\n| 蜂巢 | `frontend/` | 工作台前端，所有用户日常使用的主界面。 |\n| 蜂窝 | `wunder-desktop` | 桌面形态，本地优先的个人入口，可直接访问本机文件。 |\n| 舵机 | `wunder-cli` | 命令行形态，面向开发者与自动化脚本，终端驱动。 |\n\n文档中的「舰体/舰桥/蜂巢/蜂窝/舵机」都指代 wunder 的具体形态，「核心」「引擎」指代码分层（wunder-core / wunder-runtime），两类说法不要混用。文档标题与正文首次出现处会以「中文（英文标识）」标注对应关系，如舰体（server）、蜂窝（desktop）、舵机（cli）。\n\n## 用户\n\n用户的身份标识。可以是注册账号，也可以是临时用的虚拟名称，系统都能识别。\n\n## 智能体\n\n执行任务的 AI 角色。智能体拥有自己的模型、工具和提示词配置。每个用户**有且仅有一个**智能体实例，由管理侧预设 1:1 绑定生成；用户侧没有创建、删除、切换或排序智能体的入口，只有预设声明「允许自定义」的字段可以改。\n\n## 预设智能体\n\n管理侧维护的智能体模板。预设可以有多份，但每个用户只绑定其中一份，并由此生成该用户唯一的智能体实例；预设更新可以按「同步未自定义项 / 强制覆盖」推送到绑定用户。\n\n## 线程\n\n一次连续的对话。一个智能体可以有多个线程，每个线程独立维护上下文。\n\n## 子智能体\n\n主智能体在任务中临时创建的工作单元，任务完成后回收。它不是独立智能体，也不是用户拥有的第二个智能体。\n\n## 工作区\n\n用户的持久文件空间。云端形态下每个用户**有且仅有一个**工作区：服务端数据根下属于自己的唯一云端目录，工具以它为根。工作区不可新增、删除或更换，也不绑定本机文件夹。\n\n## 工作目录\n\n界面上的工作区入口：位于网页左栏工作区下方，包含文件树、工具栏（上传 / 新建 / 刷新 / 多选）、用量条和预览弹层，不是操作系统的文件浏览器。\n\n## 用户轮次\n\n用户每发一条消息，就是一轮用户轮次。\n\n## 模型轮次\n\n模型每执行一次动作（思考、调用工具、回复），就是一轮模型轮次。一轮用户轮次里可能包含多轮模型轮次。\n\n## 技能（Skill）\n\n给模型用的能力包。通常包含说明文档、脚本和资源文件，让智能体能完成特定类型的任务。\n\n## MCP\n\n模型上下文协议。一种标准接口，让 wunder 能接入外部工具服务。\n\n## A2A\n\n智能体之间的互操作协议。让不同系统的智能体能互相发现和协作。\n\n## 渠道（Channel）\n\n外部消息通道，比如飞书、企业微信、QQ、XMPP 等。通过渠道，智能体能收发外部消息。\n\n## Token\n\n模型处理文本的基本计量单位。Token 数反映当前对话的上下文长度，不等于实际费用。\n\n## 上下文压缩\n\n对话太长时，系统会自动压缩历史内容，让模型能继续工作而不丢失关键信息。\n\n## 长期记忆\n\n智能体跨对话记住的知识。可以手动添加，也可以让系统自动提炼。\n\n## 延伸阅读\n\n- [会话与轮次](/docs/zh-CN/concepts/sessions-and-rounds/)\n- [工作区与工作目录](/docs/zh-CN/concepts/workspaces/)\n- [流式事件参考](/docs/zh-CN/reference/stream-events/)\n","source_path":"使用说明书/zh-CN/help/glossary.md"}</script>
