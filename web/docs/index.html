  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/index","language":"zh-CN","title":"wunder 心舰","summary":"wunder 是智能体调度平台。蛹是电脑上的本地 AI 工作台，蜂巢是浏览器里的云端工作台，舵机是终端入口，舰体是多人共用的管理平台。","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"开始","group":"首页","group_path":["首页"],"url":"/docs/","headings":[{"id":"section-1","level":1,"text":"wunder 心舰"},{"id":"section-2","level":2,"text":"四个形态，按场景选一个"},{"id":"section-3","level":2,"text":"从蛹开始"},{"id":"section-4","level":2,"text":"能做什么"},{"id":"section-5","level":2,"text":"一个智能体，多个任务并行"},{"id":"section-6","level":2,"text":"界面速览"},{"id":"section-7","level":2,"text":"延伸阅读"},{"id":"section-8","level":2,"text":"快速导航"}],"prev_slug":null,"next_slug":"zh-CN/start/quickstart","markdown":"# wunder 心舰\n\n<p class=\"docs-eyebrow\">智能体调度平台<\/p>\n\nwunder 是一个智能体调度平台。你给它一个目标，它自己拆解任务、调用工具、把结果交回来。\n\n## 四个形态，按场景选一个\n\n同一套引擎，四种外壳：\n\n| 形态 | 一句话 | 谁用 |\n| --- | --- | --- |\n| **蛹** | 装在自己电脑上的 AI 工作台，下载即用 | 个人用户（默认入口） |\n| **蜂巢** | 浏览器里打开的云端工作台 | 部署舰体后的团队成员 |\n| **舵机** | 在终端里指挥智能体 | 命令行用户 / 自动化脚本 |\n| **舰体** | 多人共用的管理与治理平台 | 管理员 |\n\n见 [形态矩阵](/docs/zh-CN/start/forms/)。\n\n蛹和舵机不依赖舰体，可单独安装运行。**舰桥**是舰体自带的管理界面，随舰体一起启动，面向管理员。\n\n## 从蛹开始\n\n个人用户默认走蛹：下载安装，打开就是一个本地 AI 工作台。\n\n```text\n下载蛹 → 配置模型 → 描述目标 → 拿到结果\n```\n\n细节见 [快速开始](/docs/zh-CN/start/quickstart/) 与 [蛹入门](/docs/zh-CN/start/desktop/)。\n\n## 能做什么\n\n- **文件与代码**：读取、编辑、执行命令、重构项目\n- **办公自动化**：整理文档、生成报告、处理表格、做会议纪要\n- **并行子任务**：需要同时推进多条线时，主智能体会临时派生几个子智能体分头去做，结果回传后汇总\n- **定时任务**：定时巡检、周期提醒、跨渠道消息处理\n- **连接外部服务**：把常用流程固化成技能\n- **设备互通**：本地设备接入云端后，云端可在获得你审批的前提下向本地节点下发命令\n\n## 一个智能体，多个任务并行\n\n- 同一个智能体下可以**同时挂多个独立任务线程**，互不干扰。\n- 工作区也可以有多个：本地目录、云端工作区、通过设备互通访问的远程设备工作区，在界面上按名字区分。\n- 运行中再发消息不会被打回：**会话队列**默认开启，新的消息进入队列等待，而不是被判「用户忙」。\n\n## 界面速览\n\n- [蛹界面](/docs/zh-CN/surfaces/desktop-ui/)：主窗只有「对话」「设置」两页，其余能力以面板和对话框呈现\n- [蜂巢界面](/docs/zh-CN/surfaces/frontend/)：浏览器里的单页应用\n- [舰桥界面](/docs/zh-CN/surfaces/web-admin/)：管理员的治理与调试后台\n- [界面概览](/docs/zh-CN/surfaces/index/)：四形态能力对比\n\n## 延伸阅读\n\n蛹覆盖绝大多数场景，以下为可选形态：\n\n- **舰体（server）**：多人共用、权限管理、渠道接入、统一发布。见 [舰体部署](/docs/zh-CN/start/server/)。\n- **蜂巢（web）**：部署舰体后，成员用浏览器访问云端工作台。\n- **舵机（cli）**：终端与自动化场景。见 [舵机使用](/docs/zh-CN/start/cli/)。\n\n## 快速导航\n\n- **第一次使用** → [快速开始](/docs/zh-CN/start/quickstart/)\n- **下载安装** → [蛹入门](/docs/zh-CN/start/desktop/)\n- **界面地图** → [界面概览](/docs/zh-CN/surfaces/index/)\n- **深入理解系统** → [核心概览](/docs/zh-CN/concepts/)\n- **说明书总览** → [说明书总览](/docs/zh-CN/start/hubs/)\n- **文档生态导航** → [常用说明目录](/docs/zh-CN/start/docs-directory/)\n- **首次启动失败** → [首次运行排查](/docs/zh-CN/start/troubleshooting-first-run/)\n- **遇到问题** → [故障排查](/docs/zh-CN/help/troubleshooting/) 或 [FAQ](/docs/zh-CN/help/faq/)\n","source_path":"使用说明书/zh-CN/index.md"}</script>
