  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/forms/index","language":"zh-CN","title":"wunder","summary":"泛用型人工智能操作系统","updated_at":"2026-11-14","read_when":[],"source_docs":[],"tab":"形态","group":"概览","group_path":["概览"],"url":"/docs/","headings":[{"id":"section-1","level":1,"text":"wunder"},{"id":"section-2","level":2,"text":"从哪个形态进门"},{"id":"section-3","level":2,"text":"能做什么"},{"id":"section-4","level":2,"text":"五个形态"},{"id":"section-5","level":2,"text":"接着看"}],"prev_slug":null,"next_slug":"zh-CN/forms/desktop-ui","markdown":"# wunder\n\nwunder = 模型 + 拘束器 + 运行环境\n\n- **拘束器**：模型的外骨架，提供工具和连接外部世界的接口，驱动模型行动、治理权限与上下文管理。\n- **运行环境**：浏览器、命令、文件、Python、文档这些能力是预制的，装好即可用。\n\n> **使用前必读**\n>\n> - **权限较大**：wunder 在本地拥有文件读写、命令执行与网络访问权限，误操作可能删除文件、改坏系统配置，甚至破坏运行环境。重要数据请先备份，删除、覆盖与系统级改动请在执行前确认。\n> - **输出需甄别**：模型可能给出错误、过时或有害的信息，涉及事实、数据、法规与安全的内容请自行核实后再采用。\n\n它的核心功能是用户下达指令，智能体完成长程复杂任务。界面遵循极致精简：能快速解决问题，而不是凸显复杂的元素；默认只保留当前任务必需的信息与操作，复杂能力按需展开。\n\n## 从哪个形态进门\n\n个人用户的默认入口是桌面版：下载安装，打开就是一个本地 AI 工作台。\n\n```text\n下载桌面版 → 配置模型 → 描述目标 → 拿到结果\n```\n\n团队多人协作走云端版：部署一次服务端，成员用浏览器打开即可。手工与脚本化场景用命令行，移动场景装安卓版，治理与调试在管理端。\n\n## 能做什么\n\n- **文件与代码**：读取、编辑、执行命令、重构项目\n- **办公自动化**：整理文档、生成报告、处理表格、做会议纪要\n- **长程任务**：把目标挂在会话上，空闲后自动接着推进，见[目标态系统](/docs/zh-CN/concepts/goal-mode/)\n- **并行子任务**：需要同时推进多条线时派生子智能体，结果回传后汇总\n- **定时任务**：定时巡检、周期提醒、跨渠道消息处理\n- **连接外部服务**：把常用流程固化成技能，或接入 MCP 工具\n- **设备互通**：本地设备接入云端后，云端可在获得审批的前提下向本地节点下发命令\n\n## 五个形态\n\n同一套引擎（wunder-runtime）与一份核心（wunder-core），对外是五个形态，差异只在接入层：线程、工具、存储、实时事件与权限语义都是同一份代码。\n\n| 形态 | 定位 | 谁用 | 怎么进 |\n| --- | --- | --- | --- |\n| [桌面版](/docs/zh-CN/forms/desktop-ui/) | 本地 AI 工作台，装在自己电脑上 | 个人用户（默认入口） | 安装包 |\n| [云端版](/docs/zh-CN/forms/cloud-ui/) | 云端 AI 工作台 | 团队与多人协作 | 浏览器 |\n| [命令行](/docs/zh-CN/forms/cli-ui/) | 手工本地操作入口 | 命令行用户 / 自动化脚本 | 终端 |\n| [安卓版](/docs/zh-CN/forms/android-ui/) | 桌面版的手机形态 | 手机用户 | APK |\n| [管理端](/docs/zh-CN/forms/admin-ui/) | 治理与调试后台 | 管理员 | 浏览器 |\n\n桌面版、安卓版与命令行是本地形态，不依赖服务端，可单独安装运行；云端版随服务端提供；管理端是服务端自带的治理界面。每个形态分开四页：**界面**长什么样、**部署**要什么条件、**运行环境**里装了什么、怎么**使用**。\n\n## 接着看\n\n- 智能体能调什么：[工具总览](/docs/zh-CN/tools/)\n- 系统怎么搭起来的：[系统架构](/docs/zh-CN/concepts/architecture/)\n- 关键机制：[智能体循环](/docs/zh-CN/concepts/core-agent-loop/)\n","source_path":"使用说明书/zh-CN/forms/index.md"}</script>
