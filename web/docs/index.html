  <script id="docs-page-data" type="application/json">{"slug":"zh-CN/index","language":"zh-CN","title":"wunder 心舰","summary":"wunder 是智能体调度平台。下载蜂窝（desktop）本地 AI 工作台，描述目标，智能体拆解任务、调用工具、交付结果。","updated_at":"2026-10-09","read_when":["第一次了解 wunder","需要快速判断从哪里开始"],"source_docs":["README.md"],"tab":"开始","group":"首页","group_path":["首页"],"url":"/docs/","headings":[{"id":"section-1","level":1,"text":"wunder 心舰"},{"id":"section-2","level":2,"text":"蜂窝：你的本地 AI 工作台"},{"id":"section-3","level":2,"text":"能做什么"},{"id":"section-4","level":2,"text":"工作台结构"},{"id":"section-5","level":2,"text":"核心特性"},{"id":"section-6","level":2,"text":"需要更多？三个可选形态"},{"id":"section-7","level":2,"text":"快速导航"},{"id":"section-8","level":2,"text":"延伸阅读"}],"prev_slug":null,"next_slug":"zh-CN/start/quickstart","markdown":"# wunder 心舰\n\n<p class=\"docs-eyebrow\">智能体调度平台<\/p>\n\n## 蜂窝：你的本地 AI 工作台\n\n用户通过**蜂窝（desktop）**使用 wunder。蜂窝是本地 AI 工作台——本地桌面应用，覆盖对话、文件、智能体、工具与设置。安装后打开，描述目标，智能体拆解任务、调用工具、交付结果——不需要先部署任何服务。\n\n```text\n下载蜂窝 → 配置模型 → 描述目标 → 拿到结果\n```\n\n个人用户从 Releases 下载安装即可开始；[快速开始](/docs/zh-CN/start/quickstart/) 4 步跑通第一个任务。\n\n## 能做什么\n\n- **文件与代码**：读取文件、编辑代码、执行命令、重构项目\n- **办公自动化**：整理文档、生成报告、处理表格、做会议纪要\n- **任务拆分**：需要并行推进时，由智能体临时派生子智能体分头执行，结果回传后汇总\n- **持续任务**：定时巡检、周期提醒、跨渠道消息处理\n- **系统集成**：连接外部服务，把常用流程固化成技能\n\n## 工作台结构\n\n蜂窝采用左右两栏布局：左栏放新任务、搜索、工作区线程树、工作目录与设置，右栏是聊天。日常对话、文件读写、智能体设置、工具使用都在这里完成。每个用户只有一个智能体实例和一个固定的工作目录。详见 [认识蜂巢](/docs/zh-CN/surfaces/frontend/)。\n\n系统的组织结构自上而下：\n\n![心舰到线程的自上而下结构：心舰、用户、智能体、线程逐层落到具体对话。](/docs/assets/manual/08-hierarchy-structure.svg)\n\n用户发消息 → 智能体在线程里持续执行；需要拆分时由它临时派生子智能体。\n\n## 核心特性\n\n| 特性 | 说明 |\n|------|------|\n| **本地优先** | 蜂窝本地运行，开箱即用，可操作本地文件与桌面 |\n| **单智能体 + 子智能体** | 每个用户只有一个智能体实例；可并行的工作由临时子智能体分担 |\n| **丰富的工具生态** | 内置工具 + MCP 外部工具 + 技能包 + 知识库 |\n| **长会话** | 上下文压缩与长期记忆，长会话可以一直工作下去 |\n| **开放接口** | WebSocket 实时通信、RESTful API、A2A 互操作标准 |\n\n## 需要更多？三个可选形态\n\n蜂窝覆盖绝大多数场景。wunder 还提供三种可选形态，按需取用：\n\n- **舰体（server）**：用户与智能体管理平台，需要多人共用、统一治理时才部署。多用户、权限管理、渠道接入；部署后提供蜂巢（web，云端 AI 工作台，浏览器访问）与舰桥（管理界面）。见[舰体部署](/docs/zh-CN/start/server/)。\n- **蜂巢（web）**：云端 AI 工作台，随舰体提供，成员通过浏览器访问，界面见[蜂巢界面](/docs/zh-CN/surfaces/frontend/)。\n- **舵机（cli）**：手工本地操作入口，终端与自动化场景使用，脚本化驱动。见[舵机使用](/docs/zh-CN/start/cli/)。\n\n## 快速导航\n\n- **第一次使用** → [快速开始](/docs/zh-CN/start/quickstart/)\n- **下载安装** → [蜂窝入门](/docs/zh-CN/start/desktop/)\n- **深入理解系统** → [核心概览](/docs/zh-CN/concepts/)\n- **接入现有系统** → [接入概览](/docs/zh-CN/integration/)\n- **遇到问题** → [故障排查](/docs/zh-CN/help/troubleshooting/) 或 [FAQ](/docs/zh-CN/help/faq/)\n\n## 延伸阅读\n\n- [说明书总览](/docs/zh-CN/start/hubs/)\n- [API 索引](/docs/zh-CN/reference/api-index/)\n","source_path":"使用说明书/zh-CN/index.md"}</script>
