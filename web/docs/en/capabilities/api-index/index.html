  <script id="docs-page-data" type="application/json">{"slug":"en/capabilities/api-index","language":"en","title":"Feature and Capability Quick Reference","summary":"Where each of eight capability areas lives and what it does, plus a task-to-entry-point table.","updated_at":"2026-10-16","read_when":[],"source_docs":[],"tab":"Capabilities","group":"Overview","group_path":["Overview"],"url":"/docs/en/capabilities/api-index/","headings":[{"id":"section-1","level":2,"text":"Chat"},{"id":"section-2","level":2,"text":"Working directory"},{"id":"section-3","level":2,"text":"Agent settings"},{"id":"section-4","level":2,"text":"Tools and skills"},{"id":"section-5","level":2,"text":"Channel access"},{"id":"section-6","level":2,"text":"Scheduled tasks"},{"id":"section-7","level":2,"text":"System settings"},{"id":"section-8","level":2,"text":"Bridge features (administrators only)"}],"prev_slug":"en/capabilities/index","next_slug":"en/concepts/core-goal","markdown":"| I want to… | Where to go |\n|---------|--------|\n| Start a conversation | New task in the left sidebar → just type |\n| Upload a file for the agent to analyze | Use upload or drag files into the working directory area in the left sidebar, or add an attachment in the composer |\n| See the files the agent generates | The working directory area in the left sidebar |\n| Customize the agent's style | Settings at the bottom of the left sidebar → Agent → prompt template |\n| Create a scheduled task | Settings at the bottom of the left sidebar → Scheduled tasks → create task |\n| Manage users (administrator) | Bridge → User management |\n| Configure channels (administrator) | Bridge → Channel management |\n\n## Chat\n\nEntry point: the workbench (Pupa or Beehive) → the New task button in the left sidebar, or the thread list under the workspace.\n\n- Ask questions and get answers\n- Upload files for the agent to analyze\n- Have the agent carry out tasks such as writing code, processing files, or searching for information\n- Review chat history and pick up earlier conversations\n\nThe status values that appear during a chat are listed in [Session Status Guide](/docs/en/capabilities/stream-events/); answer style changes in [Prompts and Personalization](/docs/en/capabilities/prompt-templates/).\n\n## Working directory\n\nEntry point: the workbench → the Working directory area below the workspace in the left sidebar.\n\n- Upload documents, images, audio, and other files for the agent to use\n- Download files the agent generates\n- Browse and manage your single cloud directory\n- See the files produced while the agent works\n\nDirectory layout and path conventions are covered by [Workspace Routing and File Management](/docs/en/capabilities/workspace-routing/).\n\n## Agent settings\n\nEntry point: the workbench → Settings at the bottom of the left sidebar → Agent.\n\nEvery user has exactly one agent instance, generated from a one-to-one binding to an admin-side preset. There is no user-side entry point to create, delete, switch, or sort agents.\n\n- View the current agent instance and the preset it is bound to\n- Edit the fields the preset allows you to customize, such as the default model, approval mode, and tool set\n- Set the agent's answer style (prompt template)\n- Manage the agent's long-term memory\n\nPrompt templates are described in [Prompts and Personalization](/docs/en/capabilities/prompt-templates/), and the tool catalog in [Tool System](/docs/en/concepts/tools/).\n\n## Tools and skills\n\nEntry point: the workbench → Settings at the bottom of the left sidebar → Tools. The user side only views and toggles; the tool catalog is maintained by admins.\n\n- View the available tool list\n- Configure skills (preset capability packs)\n- Add knowledge bases so the agent can draw on your own material\n\nThe built-in tools cover:\n\n- File operations: read, write, and search files\n- Web operations: search and fetch page content\n- Code operations: run commands and write code\n- System operations: screenshots and system status\n- More capabilities are added through MCP\n\nTool capability boundaries are described in [Tool System](/docs/en/concepts/tools/), and how skills are packaged in [Prompts and Skills](/docs/en/concepts/prompt-and-skills/).\n\n## Channel access\n\nEntry point: the Bridge → Channel management.\n\n- Bind accounts on Feishu, WeCom, WeChat, QQ, and other platforms\n- Let users on those external platforms reach the agent\n- View channel status and message logs\n- Troubleshoot channel-related problems\n\nWhen members of an organization already work in Feishu or WeChat, binding a channel lets them talk to the agent inside their existing platform rather than switching tools.\n\nWhat each admin panel covers is listed in [Bridge Panel Guide](/docs/en/capabilities/admin-panels/).\n\n## Scheduled tasks\n\nEntry point: the workbench → Settings at the bottom of the left sidebar → Scheduled tasks.\n\n- Create tasks that run on a schedule\n- View execution history\n- Manage, pause, and delete scheduled tasks\n\nRecurring work such as a daily summary report or a periodic system check is configured here.\n\n## System settings\n\nEntry point: the workbench → Settings at the bottom of the left sidebar.\n\n- Change the interface language\n- Configure the service address to connect to\n- Manage your personal account information\n- View usage statistics and quota balance\n\nWhat each setting means and what to set it to is covered in [System Settings Reference](/docs/en/capabilities/config/).\n\n## Bridge features (administrators only)\n\nEntry point: open the Bridge address in a browser. The main panels are:\n\n- System settings: global configuration\n- User management: user accounts and quota accounts\n- Organization management: organizational structure\n- Model configuration: the AI models you can choose\n- Tool management: the available tool list\n- Channel monitoring: external channel status\n- Performance monitoring: how the system is running\n\nPanel-by-panel coverage lives in [Bridge Panel Guide](/docs/en/capabilities/admin-panels/), and setting meanings in [System Settings Reference](/docs/en/capabilities/config/).\n","source_path":"使用说明书/en/capabilities/api-index.md"}</script>
