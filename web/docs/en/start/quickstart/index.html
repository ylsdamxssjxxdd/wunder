  <script id="docs-page-data" type="application/json">{"slug":"en/start/quickstart","language":"en","title":"Quick Start","summary":"The shortest path to install the desktop app, configure a model, and complete your first task.","updated_at":"2026-10-09","read_when":["You're using wunder for the first time","You need to verify a working setup"],"source_docs":["README.md"],"tab":"Getting Started","group":"Onboarding","group_path":["Onboarding"],"url":"/docs/en/start/quickstart/","headings":[{"id":"section-1","level":1,"text":"Quick Start"},{"id":"section-2","level":2,"text":"4 steps to get running"},{"id":"section-3","level":3,"text":"1. Download and install"},{"id":"section-4","level":3,"text":"2. Configure the model"},{"id":"section-5","level":3,"text":"3. Start your first conversation"},{"id":"section-6","level":3,"text":"4. Watch it work"},{"id":"section-7","level":2,"text":"Out-of-the-box capabilities"},{"id":"section-8","level":2,"text":"Other ways to use wunder"},{"id":"section-9","level":2,"text":"Verification checklist"},{"id":"section-10","level":2,"text":"Next steps"}],"prev_slug":"en/index","next_slug":"en/start/desktop","markdown":"# Quick Start\n\nOne goal: open the Honeycomb and complete your first task. Individual users default to the desktop app — the local AI workbench. Download and go, no server required.\n\n## 4 steps to get running\n\n### 1. Download and install\n\nGet the installer for your system from Releases, install or extract, then launch.\n\n### 2. Configure the model\n\nOpen \"System Settings\" → \"Model Configuration\". Enter your API Key and endpoint URL, then click \"Test Connection\" before saving.\n\n### 3. Start your first conversation\n\nGo back to the chat interface, type `List the files in the current directory`, and press Enter.\n\n### 4. Watch it work\n\nModel thinks → calls tools → shows results → replies.\n\nIf you saw the full execution process and the final result, you're up and running.\n\n## Out-of-the-box capabilities\n\n- **Local-first**: runs locally by default, can also connect to a remote server\n- **Desktop control**: can operate local windows, files, browsers\n- **Persistent workspace**: files are not auto-cleaned\n- **Direct agent editing**: adjust agent configuration and prompts anytime\n\n## Other ways to use wunder\n\nThe Honeycomb covers most scenarios. The following optional forms are only needed for specific requirements:\n\n- **The Hull (server)**: the user and agent management platform, deployed when multiple people need to share one system; members access the Beehive (the cloud AI workbench) in a browser. See the [Hull deployment guide](/docs/en/start/server/).\n- **The Helm (cli)**: the manual local entry point for terminals and automation. See the [Helm guide](/docs/en/start/cli/).\n\n## Verification checklist\n\n- [ ] You can successfully start a conversation\n- [ ] You can see intermediate steps and tool calls\n- [ ] You can get the final result\n- [ ] You know what to read next\n\n## Next steps\n\n- Download & install details → [Honeycomb quick start](/docs/en/start/desktop/)\n- Meet Beehive → [Beehive Interface](/docs/en/surfaces/frontend/)\n- Understand the system → [Core Concepts](/docs/en/concepts/)\n- Integrate with existing systems → [Integration Overview](/docs/en/integration/)\n- See all tools → [Tools Overview](/docs/en/tools/)\n- Running into issues → [Troubleshooting](/docs/en/help/troubleshooting/)\n","source_path":"使用说明书/en/start/quickstart.md"}</script>
