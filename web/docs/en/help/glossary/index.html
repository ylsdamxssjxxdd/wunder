  <script id="docs-page-data" type="application/json">{"slug":"en/help/glossary","language":"en","title":"Glossary","summary":"Core terms in wunder documentation, explained in plain language.","updated_at":"2026-10-10","read_when":["You're reading wunder docs for the first time","You find terms that look similar but aren't sure of the difference"],"source_docs":["docs/设计文档/01-系统总体设计.md"],"tab":"Help","group":"Help","group_path":["Help"],"url":"/docs/en/help/glossary/","headings":[{"id":"section-1","level":1,"text":"Glossary"},{"id":"section-2","level":2,"text":"Product and Form Names"},{"id":"section-3","level":2,"text":"User"},{"id":"section-4","level":2,"text":"Agent"},{"id":"section-5","level":2,"text":"Preset Agent"},{"id":"section-6","level":2,"text":"Thread"},{"id":"section-7","level":2,"text":"Subagent"},{"id":"section-8","level":2,"text":"User Turn"},{"id":"section-9","level":2,"text":"Model Turn"},{"id":"section-10","level":2,"text":"Workspace"},{"id":"section-11","level":2,"text":"Working Directory"},{"id":"section-12","level":2,"text":"Skill"},{"id":"section-13","level":2,"text":"MCP"},{"id":"section-14","level":2,"text":"A2A"},{"id":"section-15","level":2,"text":"Channel"},{"id":"section-16","level":2,"text":"Token"},{"id":"section-17","level":2,"text":"Context Compression"},{"id":"section-18","level":2,"text":"Long-term Memory"},{"id":"section-19","level":2,"text":"Further Reading"}],"prev_slug":"en/help/faq","next_slug":null,"markdown":"# Glossary\n\n## Product and Form Names\n\n| Name | English / tech ID | Meaning |\n|------|------|------|\n| wunder | `wunder` | The product itself: an **agent orchestration platform** — hand a goal to the agent, it breaks it down, calls tools, and delivers results. |\n| Core | `wunder-core` | Code foundation: configuration, auth, storage contracts, execution policy. |\n| Engine | `wunder-runtime` | Code execution layer: orchestrator, thread runtime, tools, channels, gateway. The Honeycomb and the Helm depend on the Engine directly, not on the Hull. |\n| Hull | `wunder-server` | The **user and agent management platform**: the server form for teams and organizations, handling users, permissions, and channels, and providing the Beehive (web). |\n| Bridge | `web/` | The governance frontend — the admin's management UI for system configuration, users, and channels. |\n| Bridge node | `bridge node` (`bridge_center`) | A channel bridging node carrying channel account ingress and message routing, managed by the backend admin API (`/wunder/admin/bridge/*`); it currently has no standalone frontend page. Not to be confused with the governance frontend \"Bridge\". |\n| Beehive | `frontend/` | The **cloud AI workbench** (web): the web UI provided with the Hull, accessed in a browser. |\n| Honeycomb | `wunder-desktop` | The **local AI workbench** (desktop): the desktop form and the default entry for individual users, running locally with direct access to local files. |\n| Helm | `wunder-cli` | The **manual local entry point** (cli): the command-line form for hands-on work, developers, and automation, terminal-driven. |\n\n\"Hull / Bridge / Beehive / Honeycomb / Helm\" refer to concrete forms of wunder; \"Core\" and \"Engine\" refer to code layers (wunder-core / wunder-runtime). Do not mix the two groups.\n\n## User\n\nYour identity. Can be a registered account or a temporary virtual name — the system recognizes both.\n\n## Agent\n\nAn AI role that executes tasks. An agent has its own model, tools, and prompt configuration. Every user has **exactly one** agent instance, generated from a 1:1 admin-side preset binding; there is no user-side entry point to create, delete, switch, or sort agents, and only fields the preset declares customizable can be changed.\n\n## Preset Agent\n\nAn agent template maintained by the admin. There can be many presets, but each user binds exactly one of them, which generates that user's single agent instance. Preset updates can be pushed to bound users as \"sync uncustomized fields\" or \"force overwrite\".\n\n## Thread\n\nA continuous conversation. One agent can have multiple threads, each maintaining its own context independently.\n\n## Subagent\n\nA temporary work unit the main agent creates for a task and reclaims when the task is done. It is not a separate agent, and not a second agent owned by the user.\n\n## User Turn\n\nEvery message you send counts as one user turn.\n\n## Model Turn\n\nEvery action the model takes (thinking, calling a tool, replying) counts as one model turn. One user turn may contain multiple model turns.\n\n## Workspace\n\nYour persistent file space. Every user has **exactly one** workspace, used as the root for file tools: in the Honeycomb (desktop) it is a persistent local directory with direct access to local files; in Hull (server) deployments it is a single per-user directory under the server data root, accessed through the web UI. A workspace cannot be added, deleted, or replaced.\n\n## Working Directory\n\nThe workspace entry point in the UI: below the workspace tree in the left sidebar of the web app, with a file tree, a toolbar (upload / new / refresh / multi-select), a usage bar, and preview overlays. It is not an operating-system file browser.\n\n## Skill\n\nA capability package for the model. Typically includes documentation, scripts, and resource files that enable an agent to handle specific types of tasks.\n\n## MCP\n\nModel Context Protocol. A standard interface that lets wunder connect to external tool services.\n\n## A2A\n\nAgent-to-Agent protocol. Enables agents from different systems to discover and collaborate with each other.\n\n## Channel\n\nAn external messaging pathway, such as Feishu, WeCom, QQ, XMPP, etc. Through channels, agents can send and receive external messages.\n\n## Token\n\nThe basic unit of measurement for model text processing. Token count reflects the current conversation's context length, not actual cost.\n\n## Context Compression\n\nWhen a conversation gets too long, the system automatically compresses historical content so the model can continue working without losing key information.\n\n## Long-term Memory\n\nKnowledge that an agent remembers across conversations. Can be added manually or automatically extracted by the system.\n\n## Further Reading\n\n- [Sessions & Turns](/docs/en/concepts/sessions-and-rounds/)\n- [Workspaces and Working Directory](/docs/en/concepts/workspaces/)\n- [Stream Events Reference](/docs/en/reference/stream-events/)\n","source_path":"使用说明书/en/help/glossary.md"}</script>
