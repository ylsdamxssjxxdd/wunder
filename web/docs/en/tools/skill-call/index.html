  <script id="docs-page-data" type="application/json">{"slug":"en/tools/skill-call","language":"en","title":"Skill Call","summary":"Loading a skill's instructions and its directory into the current conversation so the agent can work through that skill's process.","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"Tools","group":"Workspace and Code","group_path":["Workspace and Code"],"url":"/docs/en/tools/skill-call/","headings":[{"id":"section-1","level":2,"text":"When to use it"},{"id":"section-2","level":2,"text":"How to use it"},{"id":"section-3","level":2,"text":"What it handles"},{"id":"section-4","level":2,"text":"When something goes wrong"}],"prev_slug":"en/tools/exec","next_slug":"en/tools/web-fetch","markdown":"A skill call loads a skill's instructions into the current conversation so the agent can carry on by following that skill's process.\n\n## When to use it\n\n- You want the agent to follow an existing skill instead of improvising.\n- The agent needs to read the skill's instructions first before it can know what to do next.\n\n## How to use it\n\nPass the skill name:\n\n```json\n{\n  \"name\": \"openai-docs\"\n}\n```\n\n## What it handles\n\n- It formats the skill instructions so they are easy for the model to read, then puts them into context.\n- It states the skill's root directory explicitly; a `{{SKILL_ROOT}}` placeholder in the instructions resolves to that root.\n- It also lists the top-level files and folders under the skill root, so the agent knows what supporting material it can read next.\n\n## When something goes wrong\n\nAn empty skill name, a skill that does not exist, an ambiguous name, or a skill file that cannot be read all fail immediately. These are ordinary errors, not asynchronous work that needs waiting.\n","source_path":"使用说明书/en/tools/skill-call.md"}</script>
