  <script id="docs-page-data" type="application/json">{"slug":"en/tools/a2a-tools","language":"en","title":"A2A Tools","summary":"A2A tools have been removed from wunder; kept only as a historical reference.","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"Tools","group":"System Bridges","group_path":["System Bridges"],"url":"/docs/en/tools/a2a-tools/","headings":[],"prev_slug":"en/tools/user-world","next_slug":"en/integration/index","markdown":"> **Removed**: These tools have been removed from wunder and are not visible to the agent or users; kept only as a historical reference.\n\nThey once called an external A2A service and tracked task status, and came in three parts:\n\n- `a2a@service-name`: submit a task, usually returning \"accepted\"\n- `a2a_observe`: look at a task's current snapshot\n- `a2a_wait`: wait for a while, until the task completes or times out\n\nA timeout did not mean the task had failed: back then, a timeout was followed by more waiting or another look at the unfinished tasks before any conclusion was drawn.\n","source_path":"使用说明书/en/tools/a2a-tools.md"}</script>
