  <script id="docs-page-data" type="application/json">{"slug":"en/tools/user-world","language":"en","title":"User World","summary":"Looking up which users exist inside the site, and sending messages to users inside the site.","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"Tools","group":"System Bridges","group_path":["System Bridges"],"url":"/docs/en/tools/user-world/","headings":[{"id":"section-1","level":2,"text":"When to use it"},{"id":"section-2","level":2,"text":"How to use it"},{"id":"section-3","level":2,"text":"What it handles"},{"id":"section-4","level":2,"text":"When something goes wrong"}],"prev_slug":"en/tools/self-status","next_slug":"en/tools/a2a-tools","markdown":"`user_world` handles two things: looking up which users exist inside the site, and sending messages to users inside the site.\n\n## When to use it\n\n- You want to see who is on the site, or whether a given user is still active.\n- You need to send a message to a user on the site, optionally with attachments.\n\n## How to use it\n\nTwo actions:\n\n- `list_users`: list the users on the site, returning their username, status, and unit, along with the total and pagination information.\n- `send_message`: send a message to users, returning per user whether the send succeeded.\n\n## What it handles\n\nThis is the in-site user world, not an external channel, and messages are delivered only within that scope. If a message carries attachments, the outcome of each attachment is listed separately.\n\n## When something goes wrong\n\nThe result of sending a message gives a status per user; the users that did not succeed are flagged in the result, and you can act on the returned hint.\n","source_path":"使用说明书/en/tools/user-world.md"}</script>
