  <script id="docs-page-data" type="application/json">{"slug":"en/tools/sleep","language":"en","title":"Sessions Yield","summary":"Letting the agent stop the current turn on purpose, hand control back to the system, and carry on once an external result arrives.","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"Tools","group":"UI and Automation","group_path":["UI and Automation"],"url":"/docs/en/tools/sleep/","headings":[{"id":"section-1","level":2,"text":"When to use it"},{"id":"section-2","level":2,"text":"How to use it"},{"id":"section-3","level":2,"text":"How it differs from a final reply"},{"id":"section-4","level":2,"text":"Do not use it to wait for commands"}],"prev_slug":"en/tools/final-response","next_slug":"en/tools/thread-control","markdown":"A sessions yield means the current turn stops here; it is not a final reply. It is used when something has already been handed off externally and work resumes once the result comes back.\n\n## When to use it\n\n- Use it when you need to tell the system explicitly to stop this turn and resume later, after an external result.\n- Waiting for a command to finish does not need it.\n\n## How to use it\n\nYou can include a short note explaining why this turn is stopping:\n\n```json\n{\n  \"message\": \"The task has been submitted; waiting for an external result\"\n}\n```\n\n## How it differs from a final reply\n\n- A sessions yield gives up control of this turn; when the external result comes back, a new turn starts.\n- A final reply means this turn has really finished and hands the conclusion to you.\n\n## Do not use it to wait for commands\n\nThe standalone sleep tool has been removed. Waiting for a command to finish does not need it: command execution blocks by default and returns only once there is a result, and to wait for a background command you use the wait window offered by the command session rather than idling.\n","source_path":"使用说明书/en/tools/sleep.md"}</script>
