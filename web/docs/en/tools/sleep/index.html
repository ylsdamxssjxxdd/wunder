  <script id="docs-page-data" type="application/json">{"slug":"en/tools/sleep","language":"en","title":"Sessions Yield","summary":"Semantics and use cases of `sessions_yield`.","updated_at":"2026-09-28","read_when":["You need to temporarily yield control of the current turn and wait for an external result"],"source_docs":["src/services/tools/sessions_yield_tool.rs"],"tab":"Tools","group":"UI and Automation","group_path":["UI and Automation"],"url":"/docs/en/tools/sleep/","headings":[{"id":"section-1","level":1,"text":"Sessions Yield"},{"id":"section-2","level":2,"text":"Minimum arguments"},{"id":"section-3","level":2,"text":"Success result"},{"id":"section-4","level":2,"text":"When to use"}],"prev_slug":"en/tools/final-response","next_slug":"en/tools/thread-control","markdown":"# Sessions Yield\n\n`sessions_yield` means: **the current turn yields control and does not produce a final reply.**\n\nThe standalone `sleep` tool has been removed: command execution blocks by default and returns the result; to wait for a background command, use the `command_session` poll window (`yield_time_ms`) instead of idle waiting.\n\n## Minimum arguments\n\n```json\n{\n  \"message\": \"The task was submitted and is waiting for an external result\"\n}\n```\n\n## Success result\n\n```json\n{\n  \"ok\": true,\n  \"action\": \"sessions_yield\",\n  \"state\": \"yielded\",\n  \"summary\": \"Yielded the current turn and is waiting.\",\n  \"data\": {\n    \"status\": \"yielded\",\n    \"message\": \"The task was submitted and is waiting for an external result\"\n  },\n  \"meta\": {\n    \"turn_control\": {\n      \"kind\": \"yield\",\n      \"message\": \"The task was submitted and is waiting for an external result\"\n    }\n  }\n}\n```\n\n## When to use\n\n- Use it to explicitly tell the system \"stop this turn here and wait for an external resume.\"\n- Not needed for waiting on commands: `execute_command` blocks by default; poll background commands with `command_session`.\n","source_path":"使
