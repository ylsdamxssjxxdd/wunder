  <script id="docs-page-data" type="application/json">{"slug":"en/concepts/core-observability","language":"en","title":"Observability","summary":"Logs, runtime metrics and alerts, monitoring and thread traces, and performance testing each cover their own area; failures are worked through in a fixed order from the error message onward.","updated_at":"2026-10-13","read_when":[],"source_docs":[],"tab":"Core","group":"10 Core Ideas","group_path":["10 Core Ideas"],"url":"/docs/en/concepts/core-observability/","headings":[{"id":"section-1","level":2,"text":"Logs"},{"id":"section-2","level":2,"text":"Runtime metrics and alerts"},{"id":"section-3","level":2,"text":"WebSocket and channel event logs"},{"id":"section-4","level":2,"text":"Monitoring and thread traces"},{"id":"section-5","level":2,"text":"Three performance entry points"},{"id":"section-6","level":2,"text":"How performance is scored"},{"id":"section-7","level":2,"text":"Troubleshooting order"},{"id":"section-8","level":2,"text":"Related pages"}],"prev_slug":"en/concepts/core-stability","next_slug":"en/tools/index","markdown":"The clues are concentrated in four places: **logs** record what happened, **runtime metrics and alerts** show how loaded the system is right now, **monitoring and thread traces** reconstruct what a particular thread went through, and **performance testing** tells you how much the system can take. The four are independent and each covers its own area.\n\n![Observability diagram: three-layer separation of fact layer, replay layer, and profile layer](/docs/assets/manual/core-observability.svg)\n\n## Logs\n\nLogs are written to two places at once: a colorized layer on the console and a file layer with one JSON object per line. Files roll daily, their names begin with `server.jsonl`, and by default they sit under `./config/data/logs/server`.\n\nThe default level is `info`, and it can be overridden with the `RUST_LOG` environment variable; noise from third-party libraries is quieted out of the box.\n\nRetention defaults to 0, meaning files are **never cleaned up automatically** — the system only deletes old files by day once you set an explicit positive number of days. Long-running deployments should either set retention explicitly or rotate the log directory themselves. In sandbox mode nothing is written to files, and only console output is produced. Helm and Bridge logs are stricter by default (starting at warn) and neither is written to files.\n\n## Runtime metrics and alerts\n\nThe admin side exposes a runtime metrics snapshot with fixed categories: blocking pools are split by database, file, CPU, and external call, each reporting call counts, queue waits, and timeouts; bounded queues report backlog and busy rejections; long-running background tasks report their running counts and any alerts; and the scheduling loop reports whether its heartbeat has stalled.\n\nAlerts carry a threshold and a severity. For a given blocking pool, timeout-class alerts (critical) are evaluated before latency-class ones (warning), so when you see a latency warning, first confirm there is no timeout still in queueing or execution.\n\n## WebSocket and channel event logs\n\nWebSocket connections produce structured logs covering several stages — established, ready, handshake, handshake failure, message, parse failure, and close. A connection that will not open, a failed handshake, or a message that fails to parse can each be told apart by which stage it reached.\n\nChannel runtime logs live in an in-memory ring buffer that keeps only the most recent 300 entries; identical content is deduplicated within 20 seconds, nothing is written to the database, and a process restart clears the buffer. They can be queried two ways: the user side reads a user's own channel logs (`/wunder/channels/runtime_logs`, adding `/probe` for an active probe), and the admin side reads all of them (`/wunder/admin/channels/runtime_logs`, which also supports `/probe`). Use a probe for active connectivity and a reconnect for long-connection failures. Anything that needs long-term auditing has to be shipped to an external log system.\n\n## Monitoring and thread traces\n\nAdmin-side monitoring is the entry point to governance views. Sessions are labeled by status — running, waiting, queued, done, errored, cancelling, and cancelled — and you can export a session's thread log, page through its turns, or pull a snapshot (for example, `/wunder/admin/monitor/{session_id}/thread-log/export|turns|snapshot|changes`).\n\nThe log pane on the right side of the Bridge debug panel is the **thread trace view**; following a single thread's execution record starts there.\n\n## Three performance entry points\n\n| Entry point | What it is for | Key limits |\n| --- | --- | --- |\n| Throughput | Stressing the model's streaming capacity, as concurrency × input/output tokens | Concurrency ≤ 1024; input presets 1024…1,048,576 and output presets 1024…8192, with hard caps of 16,777,216 input and 1,048,576 output; 50 runs of history retained |\n| Performance sampling | A health check in a real environment, sampling commands, IO, and so on | Uses one fixed admin sampling user; data lands in the workspace at `.wunder_perf`; a single command times out after 5 seconds |\n| Thread rendering stress test | Generating a large volume of turn data to test front-end rendering and projection | User turns ≤ 2000 and model turns ≤ 2000, total entries ≤ 6,000,000; concurrent tracking jobs ≤ 8; generation timeout capped at 1 hour |\n\nThroughput and performance sampling belong to the admin side (`/wunder/admin/throughput/*`, `/wunder/admin/performance/sample`). Throughput's live viewing channel bypasses admin authentication through a one-time ticket. The thread rendering stress test deliberately sits on the user side (`POST /wunder/chat/stress-threads`) so it can be called with ordinary user credentials for self-testing, but a single job's data ceiling is very high, so watch for pressure under heavy load. The three differ in target and in what they measure — network and model pressure, environment sampling, and front-end data volume — so they should not be treated as one and the same panel.\n\n## How performance is scored\n\nThe three forms — Honeycomb, Beehive, and Hull — are each scored **independently** on a weighted 0–100 scale, and scores cannot be added across forms. Comparisons are always made in the same environment, through the same entry point, before and after a change; the matching baselines live in the documentation's performance-baseline section. Numbers obtained on a different machine or through a different entry point are not comparable.\n\n## Troubleshooting order\n\n1. **Get the structured error.** When an interface fails, it returns one error object carrying an error code, a description, the HTTP status, an actionable hint for the user, and this request's trace id and timestamp; the trace id and error code are also written back in the response headers. Note the trace id first.\n2. **Check monitoring.** Look at a session's status and turns; when a thread seems stuck, first tell apart \"waiting for a person\" from \"queueing or waiting on a lock\".\n3. **Match it against the logs.** Search the log files by trace id; for live-connection problems, filter on the WebSocket connection stages; for a channel that is not getting through, check the runtime logs and the probe result.\n4. **Go into the trace.** In the thread trace view, check each turn's model calls, tool batches, and results to find the first point of divergence.\n\n## Related pages\n\n- [Monitoring and WunderBench](/docs/en/ops/benchmark-and-observability/) — deployment-side operations and acceptance scripts\n- [Channel Runtime](/docs/en/ops/channel-runtime/) — channel troubleshooting details\n- [Stream Events](/docs/en/reference/stream-events/) — WebSocket event fields\n- [Admin Panels](/docs/en/reference/admin-panels/) — entry points for the monitoring and debug panels\n","source_path":"使用说明书/en/concepts/core-observability.md"}</script>
