<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1680" viewBox="0 0 1600 1680" role="img" aria-label="舵机 终端 UI 输入与弹层规范">
  <title>05 输入与弹层 · 舵机 CLI UI Spec</title>
  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.tok{font-size:12px;fill:#3D3D3D}.term{fill:#131A24}.t-fg{fill:#D8DEE6}.t-dim{fill:#6E7A8A}.t-cy{fill:#4FC1D9}.t-gr{fill:#3FBF7F}.t-rd{fill:#E06C61}.t-mg{fill:#C678DD}.surf{fill:#182430}.selrow{fill:#1A2A36}.pick{fill:#284A6A}</style>
  <rect width="1600" height="1680" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 舵机 · CLI UI SPEC</text><text x="64" y="84" class="h1">05　输入与弹层</text><text x="64" y="114" class="sub">输入区、输入上方弹层、居中选择与整屏任务中心是四种不同容器；它们不共享位置，也不混用选中样式。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 05 / 05</text><text x="1536" y="84" text-anchor="end" class="mono ui12">COMPOSER · POPUP · PICKER</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>

  <g id="composer-popup">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">输入区与弹层带 · 一个可编辑，一个只做选择</text>
    <rect x="64" y="202" width="724" height="390" rx="12" class="card"/><text x="88" y="232" class="card-t">Composer · 提示符与草稿状态</text>
    <rect x="88" y="254" width="676" height="56" rx="5" class="surf"/><text x="102" y="280" class="mono ui13 t-cy" font-weight="bold">›</text><text x="124" y="280" class="mono ui13 t-fg">聚焦草稿：提示符 accent+BOLD</text><text x="102" y="302" class="mono ui12 t-dim">表面 Rgb(24,36,48)</text>
    <rect x="88" y="318" width="676" height="44" rx="5" class="surf"/><text x="102" y="347" class="mono ui13 t-dim" font-weight="bold">›</text><text x="124" y="347" class="mono ui13 t-dim">失焦：提示符 DIM+BOLD，权重不丢</text>
    <rect x="88" y="370" width="676" height="44" rx="5" class="surf"/><text x="102" y="399" class="mono ui13 t-dim" font-weight="bold">›</text><text x="124" y="399" class="mono ui13 t-dim">只读：显示当前不可编辑的原因</text>
    <rect x="88" y="422" width="676" height="56" rx="5" class="surf"/><text x="102" y="450" class="mono ui13 t-cy" font-weight="bold">›</text><text x="124" y="450" class="mono ui13 t-dim">[已粘贴 1,842 字符]</text><text x="102" y="472" class="mono ui12 t-dim">大粘贴折叠为占位，展开/复制仍恢复原文</text>
    <text x="88" y="510" class="note">Enter 发送；中文输入法组合串完成前不触发发送。</text><text x="88" y="536" class="note">草稿超高时内部滚动；Tab 展开与选中使用同一显示列投影。</text><text x="88" y="566" class="tiny">外层 5 行及通知占用规则见分页 02，本页不重复画成固定 3 行草稿。</text>

    <rect x="812" y="202" width="724" height="390" rx="12" class="card"/><text x="836" y="232" class="card-t">Anchored popup · 输入上方选择带</text>
    <rect x="836" y="254" width="676" height="192" rx="6" class="term"/>
    <text x="856" y="282" class="mono ui13 t-fg" font-weight="bold">/ 命令</text>
    <rect x="856" y="294" width="636" height="28" class="selrow"/><text x="866" y="314" class="mono ui13 t-cy" font-weight="bold">› /stop　停止当前任务</text>
    <text x="866" y="348" class="mono ui13 t-dim">　 /compact　压缩当前上下文</text><text x="866" y="380" class="mono ui13 t-dim">　 /help　查看命令说明</text><text x="866" y="412" class="mono ui13 t-dim">　 …最多 7 个可见条目</text>
    <text x="836" y="478" class="note">高度 = min(项数,7)+1；位于转写区之后、输入区之前。</text><text x="836" y="504" class="note">标题当前为默认前景+BOLD；选中行 Cyan+BOLD + Rgb(26,42,54)。</text><text x="836" y="530" class="note">未选中行 DIM；Enter 选中，Esc 关闭，活动行同步提示。</text><text x="836" y="562" class="tiny">恢复线程不是这里的弹层：它使用下方居中选择器。</text>
  </g>

  <g id="centered-modals">
    <rect x="64" y="626" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="643" text-anchor="middle" class="chip">02</text><text x="104" y="644" class="sect">居中面板 · 信息展示与阻断选择各自明确</text><text x="1536" y="643" text-anchor="end" class="sect-note">最大 72 列 · 选择列表最多 8 行 · 同时至多一个阻断选择</text>
    <rect x="64" y="650" width="1472" height="360" rx="12" class="card"/>
    <text x="88" y="680" class="card-t">快捷键 / 警告</text><text x="88" y="704" class="tiny">信息类面板</text><rect x="88" y="722" width="326" height="212" rx="6" class="surf"/><text x="104" y="750" class="mono ui13 t-fg" font-weight="bold">快捷键</text><text x="104" y="780" class="mono ui12 t-dim">Enter 发送　Ctrl+T 全展开</text><text x="104" y="808" class="mono ui12 t-dim">Ctrl+R 历史　← 任务中心</text><text x="104" y="836" class="mono ui12 t-dim">↑↓ 选择　Esc 关闭</text><text x="104" y="872" class="mono ui12 t-dim">Ctrl+C×2 退出会话</text><text x="104" y="906" class="mono ui12 t-dim">Esc / q 关闭</text>
    <text x="438" y="680" class="card-t">恢复线程</text><text x="438" y="704" class="tiny">居中选择 · 当前工作区</text><rect x="438" y="722" width="326" height="212" rx="6" class="surf"/><text x="454" y="750" class="mono ui13 t-fg" font-weight="bold">恢复线程</text><text x="454" y="774" class="mono ui12 t-dim">12 · 当前工作区</text><rect x="446" y="786" width="310" height="26" class="pick"/><text x="454" y="805" class="mono ui12 t-cy" font-weight="bold">› 1. 示例任务（当前）</text><text x="454" y="837" class="mono ui12 t-dim">　 2. 另一个线程</text><text x="454" y="869" class="mono ui12 t-dim">　 3. 更早的记录</text><text x="454" y="906" class="mono ui12 t-dim">enter 恢复 · esc 返回</text>
    <text x="788" y="680" class="card-t">审批</text><text x="788" y="704" class="tiny">阻断选择 · 需要明确许可</text><rect x="788" y="722" width="326" height="212" rx="6" class="surf"/><text x="804" y="750" class="mono ui13 t-fg" font-weight="bold">审批</text><text x="804" y="778" class="mono ui12 t-dim">工具：写入示例文件</text><rect x="796" y="794" width="310" height="26" class="pick"/><text x="804" y="813" class="mono ui12 t-cy" font-weight="bold">› 1) 允许本次（推荐）</text><text x="804" y="845" class="mono ui12 t-dim">　 2) 允许本会话</text><text x="804" y="877" class="mono ui12 t-dim">　 3) 拒绝</text><text x="804" y="906" class="mono ui12 t-dim">enter 确认 · Y/A/N · esc 拒绝</text>
    <text x="1138" y="680" class="card-t">问询路由</text><text x="1138" y="704" class="tiny">阻断选择 · 回答运行时问题</text><rect x="1138" y="722" width="374" height="212" rx="6" class="surf"/><text x="1154" y="750" class="mono ui13 t-cy" font-weight="bold">问题：接下来采用哪种方式？</text><rect x="1146" y="768" width="350" height="26" class="pick"/><text x="1154" y="787" class="mono ui12 t-cy" font-weight="bold">› 1) 继续汇总（推荐）</text><text x="1154" y="819" class="mono ui12 t-dim">　 2) 先补全资料</text><text x="1154" y="851" class="mono ui12 t-dim">　 3) 输出简版</text><text x="1154" y="906" class="mono ui12 t-dim">enter 发送 · esc 返回</text>
    <text x="88" y="964" class="note">居中选择：标题默认 BOLD、描述 DIM，选中整行 Rgb(40,74,106) + Cyan+BOLD；上下溢出用 ↑/↓ 指示。</text><text x="88" y="990" class="tiny">宽度 = 视口宽 − 4 且封顶 72；内容左右各留 2 列；描述列不足 24 列时整列隐藏。快捷键/警告按内容行数计算高度。</text>
  </g>

  <g id="command-center">
    <rect x="64" y="1044" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1061" text-anchor="middle" class="chip">03</text><text x="104" y="1062" class="sect">任务中心 · 整屏目录、筛选、分组与搜索</text>
    <rect x="64" y="1086" width="1472" height="292" rx="12" class="card"/>
    <rect x="88" y="1110" width="1424" height="244" rx="6" class="term"/>
    <text x="108" y="1138" class="mono ui13 t-cy" font-weight="bold">任务中心</text><text x="220" y="1138" class="mono ui13 t-dim">全部 12 · 待处理 2 · 运行中 1 · 就绪 7 · 已结束 2</text><text x="1240" y="1138" class="mono ui13 t-dim">分组：父子谱系</text>
    <text x="108" y="1166" class="mono ui13 t-dim">────────────────────────────────────────────────────────────</text>
    <rect x="104" y="1178" width="1392" height="26" class="pick"/><text x="116" y="1197" class="mono ui13 t-cy" font-weight="bold">› 运行中 · 整理示例任务 · 示例工作区 · 4 子任务</text>
    <text x="116" y="1230" class="mono ui13 t-dim">　 待处理 · 文档汇总任务 · 1 项等待授权</text><text x="116" y="1260" class="mono ui13 t-dim">　 就绪 · 示例任务 · 3 分钟前</text><text x="116" y="1290" class="mono ui13 t-rd" font-weight="bold">　 失败 · 示例任务 · 退出码 1</text><text x="116" y="1320" class="mono ui13 t-dim">　 ↑↓ 选择 · Enter 进入 · / 搜索 · Tab 筛选 · 左右换分组 · Esc 关闭</text>
  </g>

  <g id="motion-brand">
    <rect x="64" y="1412" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1429" text-anchor="middle" class="chip">04</text><text x="104" y="1430" class="sect">动效与品牌 · 动画只服务当前状态</text>
    <rect x="64" y="1454" width="724" height="164" rx="12" class="card"/><text x="88" y="1484" class="card-t">帧调度</text><text x="88" y="1512" class="note">运行点：1400ms cyan→白呼吸，48ms 一帧。</text><text x="88" y="1538" class="note">NO_COLOR：560ms Cyan+BOLD / DIM 交替。</text><text x="88" y="1564" class="note">待回应 90ms 唤醒；空闲 10s 保活；复制反馈按到期重绘。</text><text x="88" y="1594" class="tiny">没有常驻装饰动画；横幅像素画只绘制一次，不驱动动画循环。</text>
    <rect x="812" y="1454" width="724" height="164" rx="12" class="card"/><text x="836" y="1484" class="card-t">品牌与本地特例</text><text x="836" y="1518" class="mono ui14 t-cy" font-weight="bold">⚙ wunder 舵机</text><text x="836" y="1548" class="note">启动头部使用 Cyan+BOLD；theme::brand_text 的语义色为 Magenta。</text><text x="836" y="1574" class="note">欢迎画是 40×34 像素数据的半块静态渲染，NO_COLOR 时只保留 ▀/空格。</text><text x="836" y="1604" class="tiny">真实像素图见分页 00；不使用外部图片资产或虚构九宫格标志。</text>
  </g>
  <g id="footer"><line x1="64" y1="1640" x2="1536" y2="1640" stroke="#D8D5D0"/><text x="64" y="1660" class="tiny">事实来源：tui/ui/composer.rs · tui/ui/popup.rs · tui/ui/centered_picker.rs · tui/ui/modals.rs · tui/command_center.rs · tui/activity_indicator.rs · empty_state_animation.rs</text><text x="1536" y="1660" text-anchor="end" class="mono tiny">05 / 05 · 2026-10-25</text></g>
</svg>
