<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" role="img" aria-label="舵机 终端 UI 基础规范">
  <title>01 基础规范 · 舵机 CLI UI Spec</title>
  <style>
    svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}
    .mono{font-family:Consolas,'SFMono-Regular','Cascadia Mono',monospace}
    .h1{font-size:30px;font-weight:700;letter-spacing:-.4px}
    .sub{font-size:13px;fill:#7C7A75}
    .kicker{font-size:11px;font-weight:600;letter-spacing:1.4px;fill:#E07A12}
    .sect{font-size:16px;font-weight:700}
    .sect-en{font-size:10px;font-weight:600;letter-spacing:1.6px;fill:#A8A39B}
    .card-t{font-size:12px;font-weight:700}
    .tok{font-size:11px;fill:#3D3D3D}
    .note{font-size:11px;fill:#7C7A75}
    .tiny{font-size:10px;fill:#8A8F99}
    .line{stroke:#E8E6E3;stroke-width:1}
    .card{fill:#FFFFFF;stroke:#DED9D1;stroke-width:1}
    .accent{fill:#F58A24}
    .term{fill:#131A24}
    .t-fg{fill:#D8DEE6}
    .t-dim{fill:#6E7A8A}
    .t-cy{fill:#4FC1D9}
    .t-gr{fill:#3FBF7F}
    .t-rd{fill:#E06C61}
    .t-yl{fill:#D7A65F}
    .t-mg{fill:#C678DD}
  </style>

  <rect width="1600" height="1560" fill="#F4F1EC"/>

  <g id="header">
    <text x="80" y="52" class="kicker">WUNDER / 舵机 · CLI UI SPEC</text>
    <text x="80" y="93" class="h1">01　基础规范</text>
    <text x="80" y="120" class="sub">单一事实来源：crates/wunder-cli/tui/theme.rs。语义由「命名色 + 字重修饰」承载，面板底色是仅有的真彩色常量；终端主题变化时语义不变。</text>
    <text x="1520" y="52" text-anchor="end" class="mono" font-size="11" fill="#8A8F99">SHEET 01 / 05</text>
  </g>

  <!-- 语义色 -->
  <g id="semantic">
    <text x="80" y="176" class="sect">语义色</text>
    <text x="160" y="176" class="sect-en">SEMANTIC COLORS · NAMED + WEIGHT</text>
    <rect x="80" y="192" width="720" height="356" class="card"/>
    <g class="mono" font-size="13">
      <rect x="100" y="212" width="680" height="40" class="term" rx="4"/>
      <text x="116" y="238" class="t-cy" font-weight="bold">accent　强调 · Cyan + BOLD</text>
      <rect x="100" y="260" width="680" height="40" class="term" rx="4"/>
      <text x="116" y="286" class="t-gr">success　成功 · Green</text>
      <rect x="100" y="308" width="680" height="40" class="term" rx="4"/>
      <text x="116" y="334" class="t-rd" font-weight="bold">danger　危险 · Red + BOLD</text>
      <rect x="100" y="356" width="680" height="40" class="term" rx="4"/>
      <text x="116" y="382" class="t-yl" font-weight="bold">warning　警告 · Yellow + BOLD</text>
      <rect x="100" y="404" width="680" height="40" class="term" rx="4"/>
      <text x="116" y="430" class="t-mg">brand　品牌 · Magenta</text>
      <rect x="100" y="452" width="680" height="40" class="term" rx="4"/>
      <text x="116" y="478" class="t-cy" font-weight="bold" text-decoration="underline">link　链接 · Cyan + BOLD + UNDERLINED</text>
      <rect x="100" y="500" width="680" height="40" class="term" rx="4"/>
      <text x="116" y="526" class="t-dim">secondary　次级文本 · DIM（无色相，全局基线）</text>
    </g>
    <text x="80" y="572" class="note">命名色（Cyan/Green/Red/Yellow/Magenta）由终端主题映射，本稿取一组参考渲染值；代码里只写命名色与修饰，不写死色值。</text>
  </g>

  <!-- 面板真彩色 -->
  <g id="surfaces">
    <text x="840" y="176" class="sect">面板真彩色</text>
    <text x="960" y="176" class="sect-en">TRUECOLOR SURFACES · NOT THEMED</text>
    <rect x="840" y="192" width="680" height="356" class="card"/>
    <g font-size="11">
      <rect x="860" y="212" width="200" height="76" fill="#182430" rx="4"/>
      <text x="1072" y="232" class="tok">surface · Rgb(24,36,48)</text>
      <text x="1072" y="250" class="tiny">输入区表面 / 转写选区底</text>
      <text x="1072" y="268" class="tiny">composer_surface()</text>
      <rect x="860" y="300" width="200" height="76" fill="#1A2A36" rx="4"/>
      <text x="1072" y="320" class="tok">selected · Rgb(26,42,54)</text>
      <text x="1072" y="338" class="tiny">弹层与模态选中行（配 Cyan+BOLD）</text>
      <text x="1072" y="356" class="tiny">popup_selected / modal_selected</text>
      <rect x="860" y="388" width="200" height="76" fill="#12301F" rx="4"/>
      <rect x="860" y="398" width="180" height="14" fill="#9DE6BC" opacity="0.85"/>
      <text x="1072" y="408" class="tok">diff-added · Rgb(18,48,31)</text>
      <text x="1072" y="426" class="tiny">新增行底 · 前景 Rgb(157,230,188)</text>
      <rect x="860" y="472" width="200" height="60" fill="#3A1818" rx="4"/>
      <rect x="860" y="480" width="180" height="14" fill="#FFB6B6" opacity="0.85"/>
      <text x="1072" y="490" class="tok">diff-deleted · Rgb(58,24,24)</text>
      <text x="1072" y="508" class="tiny">删除行底 · 前景 Rgb(255,182,182)</text>
    </g>
    <text x="1072" y="532" class="tiny">hunk 行底 Rgb(22,30,50)，前景 Cyan；行号/前缀列 DIM。</text>
  </g>

  <!-- 字重修饰 -->
  <g id="modifiers">
    <text x="80" y="628" class="sect">字重修饰语义</text>
    <text x="220" y="628" class="sect-en">MODIFIERS CARRY MEANING</text>
    <rect x="80" y="644" width="720" height="228" class="card"/>
    <g font-size="12" fill="#3D3D3D">
      <text x="104" y="674" class="mono" font-weight="bold">BOLD</text><text x="220" y="674">强调文本、选中行、进行中的计划步骤</text>
      <text x="104" y="702" class="mono" fill="#8A8F99">DIM</text><text x="220" y="702">次级文本、思考与工具回放、占位、已完成步骤</text>
      <text x="104" y="730" class="mono">REVERSED</text><text x="220" y="730">鼠标选区——无色终端也必须看得见的复制范围</text>
      <text x="104" y="758" class="mono" text-decoration="underline">UNDERLINED</text><text x="220" y="758">仅链接；不用于一般强调</text>
      <text x="104" y="786" class="mono" text-decoration="line-through">CROSSED_OUT</text><text x="220" y="786">计划已完成步骤（配 DIM），勾选后文字划线</text>
      <text x="104" y="820" class="note">规则：一种修饰只承载一种语义；色相可以降级，修饰不可丢失。</text>
    </g>
  </g>

  <!-- NO_COLOR -->
  <g id="nocolor">
    <text x="840" y="628" class="sect">NO_COLOR 降级</text>
    <text x="980" y="628" class="sect-en">GRACEFUL DEGRADATION</text>
    <rect x="840" y="644" width="680" height="228" class="card"/>
    <g class="mono" font-size="12">
      <rect x="860" y="664" width="320" height="120" fill="#182430" rx="4"/>
      <text x="876" y="688" class="t-cy" font-weight="bold">✔ 完成 · Cyan</text>
      <text x="876" y="712" class="t-rd">✘ 失败 · Red</text>
      <text x="876" y="736" class="t-dim">› 次级 · DIM</text>
      <text x="876" y="760" class="t-fg" fill="#FFFFFF">▮选区▮ · 反色</text>
      <rect x="1196" y="664" width="304" height="120" fill="#3A3A3A" rx="4"/>
      <text x="1212" y="688" fill="#EEEEEE" font-weight="bold">✔ 完成</text>
      <text x="1212" y="712" fill="#EEEEEE">✘ 失败</text>
      <text x="1212" y="736" fill="#999999">› 次级</text>
      <text x="1212" y="760" fill="#EEEEEE">▮选区▮ · 反色</text>
    </g>
    <g font-size="11" fill="#3D3D3D">
      <text x="860" y="812">· 色相整体落回终端默认前景/背景（Reset），BOLD / DIM / REVERSED 等修饰原样保留。</text>
      <text x="860" y="832">· 选区保持 REVERSED，呼吸点退为 560 ms 亮/暗脉冲，宽度不变、布局不动。</text>
      <text x="860" y="852" class="note">· 判定一次读取 NO_COLOR 并缓存；降级只影响颜色，不改变任何文案与结构。</text>
    </g>
  </g>

  <!-- 文本与宽度 -->
  <g id="text">
    <text x="80" y="928" class="sect">文本与宽度</text>
    <text x="200" y="928" class="sect-en">TEXT · WIDTH · I18N</text>
    <rect x="80" y="944" width="720" height="220" class="card"/>
    <g font-size="12" fill="#3D3D3D">
      <text x="104" y="974">· 字体即用户终端的等宽字体；代码不指定字体，只按显示列宽排版。</text>
      <text x="104" y="998">· 全部按 Unicode 显示列宽测量；中文占 2 列，截断按列计算并补省略号。</text>
      <text x="104" y="1022">· 制表符在渲染前统一展开为 8 列制表位，保证换行测量与终端一致。</text>
      <text x="104" y="1046">· 全部界面文案中英双语（locale 判定），键位提示两侧一致。</text>
    </g>
    <g class="mono" font-size="12">
      <rect x="104" y="1064" width="672" height="80" class="term" rx="4"/>
      <text x="120" y="1090" class="t-fg">简介：把「docs/报告.md」按章节拆分为三个线程。</text>
      <text x="120" y="1112" class="t-cy" text-decoration="underline">https://example.local/docs</text>
      <text x="120" y="1134" class="t-dim">任务标题超过 28 个显示列时截断…</text>
    </g>
  </g>

  <!-- 布局基线 -->
  <g id="baseline">
    <text x="840" y="928" class="sect">布局基线</text>
    <text x="950" y="928" class="sect-en">LAYOUT BASELINE · ROWS</text>
    <rect x="840" y="944" width="680" height="220" class="card"/>
    <g font-size="12" fill="#3D3D3D">
      <text x="864" y="976" class="tok" font-weight="bold">常量</text><text x="1010" y="976" class="tok" font-weight="bold">值</text><text x="1100" y="976" class="tok" font-weight="bold">来源 / 说明</text>
      <line x1="864" y1="986" x2="1496" y2="986" class="line"/>
      <text x="864" y="1010" class="tok">输入区高度</text><text x="1010" y="1010" class="mono">5 行</text><text x="1100" y="1010" class="tiny">ui/layout.rs · 永不压缩</text>
      <text x="864" y="1036" class="tok">活动行高度</text><text x="1010" y="1036" class="mono">1 行</text><text x="1100" y="1036" class="tiny">空闲为空但保留行位</text>
      <text x="864" y="1062" class="tok">弹层高度</text><text x="1010" y="1062" class="mono">min(项数,7)+1</text><text x="1100" y="1062" class="tiny">含边框行</text>
      <text x="864" y="1088" class="tok">转写地板</text><text x="1010" y="1088" class="mono">8 行 / 6 行</text><text x="1100" y="1088" class="tiny">无弹层 / 有弹层</text>
      <text x="864" y="1114" class="tok">主布局固定开销</text><text x="1010" y="1114" class="mono">14 行</text><text x="1100" y="1114" class="tiny">低于该值横幅不站立</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <g id="notes">
    <text x="80" y="1216" class="sect">终端兼容阶梯</text>
    <text x="210" y="1216" class="sect-en">CAPABILITY LADDER</text>
    <rect x="80" y="1232" width="1440" height="128" class="card"/>
    <g font-size="12" fill="#3D3D3D">
      <text x="104" y="1262"><tspan font-weight="bold">真彩色终端</tspan>：面板底色与差异配色按 Rgb 原样渲染；运行点做 cyan→白呼吸（Rgb(92,188,255) → Rgb(232,248,255)）。</text>
      <text x="104" y="1290"><tspan font-weight="bold">16/256 色终端</tspan>：真彩色回退为最接近的命名色；差异底色可读性优先，仍区分新增/删除/行头三种底。</text>
      <text x="104" y="1318"><tspan font-weight="bold">NO_COLOR</tspan>：全部语义退为字重与反色；布局、文案、键位完全不变。差异前缀列 DIM 保留，方便逐行扫读。</text>
      <text x="104" y="1346" class="note">帧调度与颜色无关：运行 48 ms 一帧，审批/问询待回应 90 ms 唤醒，空闲 10 s 保活帧。</text>
    </g>
  </g>

  <g id="footer">
    <line x1="80" y1="1500" x2="1520" y2="1500" class="line"/>
    <text x="80" y="1522" class="tiny">事实来源：tui/theme.rs · activity_indicator.rs · line_utils.rs / text_tabs.rs · locale.rs。稿中色值为参考渲染，代码中只有命名色与 Rgb 常量。</text>
    <text x="1520" y="1522" text-anchor="end" class="tiny">SVG · 1600 PX WIDE · 2026-10-25</text>
  </g>
</svg>
