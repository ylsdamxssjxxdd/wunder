<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" role="img" aria-label="蛹 桌面端过程与工具规范">
  <title>05 过程与工具 · 蛹 Desktop UI Spec</title>
  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.ui11{font-size:11px}.muted{fill:#8A8F99}.secondary{fill:#3D3D3D}</style>
  <rect width="1600" height="1760" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 蛹 · DESKTOP UI SPEC</text><text x="64" y="84" class="h1">05　过程与工具</text><text x="64" y="114" class="sub">先理解过程条的折叠行为，再看工具状态与详情；工具组、子智能体和补丁卡不共用错误的外观隐喻。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 05 / 09</text><text x="1536" y="84" text-anchor="end" class="mono ui12">PROCESS · TOOL · DETAIL</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>

  <g id="process-view">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">过程条 · 折叠是视图状态，不是任务状态</text><text x="1536" y="177" text-anchor="end" class="sect-note">工具行 26px · 过程最大高 420px · 展开即时</text>
    <rect x="64" y="202" width="1472" height="360" rx="12" class="card"/>
    <text x="88" y="232" class="card-t">折叠后 · 保留摘要</text><text x="812" y="232" class="card-t">展开后 · 查看步骤与输出</text>
    <rect x="88" y="254" width="676" height="46" rx="6" fill="#FBFAF8"/><path d="m98 270 5 4-5 4" fill="none" stroke="#8A8F99" stroke-width="1.4"/><text x="118" y="278" class="ui13 secondary">工作过程 · 3 步</text><text x="230" y="278" class="ui12 muted">已完成</text><text x="740" y="278" text-anchor="end" class="tiny">点击整行展开</text>
    <text x="88" y="332" class="note">过程条只显示步数和聚合状态；不在折叠时重复全部工具详情。</text><text x="88" y="360" class="note">完成后可展开复核，运行时可跟随最新步骤。</text><text x="88" y="396" class="tiny">滚动到列表顶部自动加载更早一页；仅失败时显示一行重试条。</text><text x="88" y="430" class="tiny">展开/折叠不使用高度动画，避免长会话布局抖动。</text>
    <line x1="788" y1="222" x2="788" y2="538" stroke="#E8E6E3"/>
    <rect x="812" y="254" width="700" height="280" rx="6" fill="#FBFAF8"/>
    <path d="m824 270 5 4-5 4" fill="none" stroke="#8A8F99" stroke-width="1.4" transform="rotate(90 827 274)"/><text x="844" y="278" class="ui13 secondary">工作过程 · 3 步</text><text x="956" y="278" class="ui12 muted">已完成</text>
    <line x1="834" y1="292" x2="834" y2="510" stroke="#E2DFDA"/>
    <circle cx="834" cy="316" r="6" fill="#FBFAF8" stroke="#9BA0A8"/><path d="m831 316 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="854" y="322" class="ui13 muted">已思考</text><text x="918" y="322" class="ui12" fill="#9BA0A8">已确定处理步骤。</text>
    <circle cx="834" cy="350" r="6" fill="#FBFAF8" stroke="#9BA0A8"/><path d="m831 350 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="854" y="356" class="ui13 muted">读取文件</text><rect x="928" y="342" width="88" height="18" rx="6" fill="#F6F5F3"/><text x="935" y="355" class="ui12 muted">sample.txt</text><text x="1030" y="356" class="ui12" fill="#9BA0A8">读取示例内容</text><text x="1488" y="356" text-anchor="end" class="mono ui11 muted">1.8k token　19ms</text>
    <circle cx="834" cy="384" r="6" fill="#FBFAF8" stroke="#9BA0A8"/><path d="m831 384 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="854" y="390" class="ui13 muted">运行命令</text><text x="928" y="390" class="ui12" fill="#9BA0A8">check sample.txt</text><text x="1488" y="390" text-anchor="end" class="mono ui11 muted">1.2s</text>
    <rect x="854" y="410" width="634" height="92" rx="8" fill="#FBFAF8" stroke="#E8E6E3"/><text x="866" y="432" class="ui11 muted" font-weight="700">输出</text><rect x="866" y="444" width="610" height="44" rx="6" fill="#F6F5F3"/><text x="878" y="462" class="mono ui11 secondary">$ check sample.txt</text><text x="878" y="482" class="mono ui11 secondary">2 checks passed</text><text x="1488" y="522" text-anchor="end" class="tiny">详情从 44px 缩进开始</text>
  </g>

  <g id="tool-states">
    <rect x="64" y="596" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="613" text-anchor="middle" class="chip">02</text><text x="104" y="614" class="sect">工具行 · 三种执行状态 + 独立展开态</text><text x="1536" y="613" text-anchor="end" class="sect-note">ProcessStatusIcon 固定 12px；失败只染状态节点</text>
    <rect x="64" y="638" width="350" height="222" rx="12" class="card"/><text x="86" y="668" class="chip">RUNNING</text><text x="86" y="694" class="card-t">运行中</text><circle cx="98" cy="728" r="6" fill="none" stroke="#8A8F99" stroke-width="1.3" stroke-dasharray="29 8"/><text x="118" y="734" class="ui13 muted">运行命令</text><text x="86" y="770" class="note">280° 弧，统一时间轴旋转</text><text x="86" y="798" class="note">详情跟随尾部；33ms 合并刷新</text><text x="86" y="830" class="tiny">状态图标仍为 muted，不整行染橙</text>
    <rect x="438" y="638" width="350" height="222" rx="12" class="card"/><text x="460" y="668" class="chip">COMPLETED</text><text x="460" y="694" class="card-t">已完成</text><circle cx="472" cy="728" r="6" fill="none" stroke="#9BA0A8"/><path d="m469 728 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="492" y="734" class="ui13 muted">运行命令</text><text x="460" y="770" class="note">细灰环 + 1px 对勾</text><text x="460" y="798" class="note">结果摘要与耗时保留在同一行</text><text x="460" y="830" class="tiny">工具图标与名称仍用 muted</text>
    <rect x="812" y="638" width="350" height="222" rx="12" class="card"/><text x="834" y="668" class="chip">FAILED</text><text x="834" y="694" class="card-t">失败</text><circle cx="846" cy="728" r="6" fill="none" stroke="#D04A43"/><path d="m843 725 6 6m0-6-6 6" stroke="#D04A43"/><text x="866" y="734" class="ui13 muted">读取文件</text><text x="834" y="770" class="note">细红环 + 交叉；错误详情在展开区</text><text x="834" y="798" class="note">错误不只靠颜色，图形与文案同时在场</text><text x="834" y="830" class="tiny">不把整个工具行涂成红色</text>
    <rect x="1186" y="638" width="350" height="222" rx="12" class="card"/><text x="1208" y="668" class="chip">VIEW</text><text x="1208" y="694" class="card-t">展开 / 折叠</text><rect x="1208" y="710" width="306" height="34" rx="6" fill="#F6F5F3"/><path d="m1218 724 5 4-5 4" fill="none" stroke="#8A8F99"/><text x="1238" y="732" class="ui13 secondary">查看工具输出</text><text x="1208" y="770" class="note">行悬停 hover；目标芯片 selected</text><text x="1208" y="798" class="note">展开是 open，不改变执行状态</text><text x="1208" y="830" class="tiny">补丁与文本详情在标准行下方</text>
  </g>

  <g id="detail-cards">
    <rect x="64" y="894" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="911" text-anchor="middle" class="chip">03</text><text x="104" y="912" class="sect">详情 · 文本输出与文件差异各有明确格式</text>
    <rect x="64" y="936" width="724" height="386" rx="12" class="card"/><text x="88" y="966" class="card-t">工作流详情</text><text x="764" y="966" text-anchor="end" class="tiny">最大高 240 · 内部滚动</text>
    <rect x="88" y="988" width="676" height="250" rx="8" fill="#FBFAF8" stroke="#E8E6E3"/>
    <text x="102" y="1016" class="ui12" font-weight="600">执行摘要</text><text x="750" y="1016" text-anchor="end" class="ui11 muted">2 steps</text><rect x="102" y="1028" width="648" height="4" rx="2" fill="#F1EFEC"/><rect x="102" y="1028" width="452" height="4" rx="2" fill="#F58A24"/><text x="102" y="1052" class="ui11 muted">读取 42 行</text><text x="750" y="1052" text-anchor="end" class="mono tiny">70%</text>
    <text x="102" y="1084" class="ui12" font-weight="600">分析</text><text x="750" y="1084" text-anchor="end" class="ui11 muted">3 items</text><rect x="102" y="1096" width="648" height="4" rx="2" fill="#3E9C7E"/><text x="102" y="1120" class="ui11 muted">合并重复段落</text>
    <text x="102" y="1152" class="ui12" font-weight="600">写入</text><text x="750" y="1152" text-anchor="end" class="ui11 muted">1 file</text><rect x="102" y="1164" width="648" height="4" rx="2" fill="#F1EFEC"/><rect x="102" y="1164" width="324" height="4" rx="2" fill="#C98A2B"/><text x="102" y="1188" class="ui11 muted">summary.txt · 18 行</text><text x="102" y="1220" class="tiny">标题 12/600 · 元信息 11 · 比例条 4px</text>
    <text x="88" y="1270" class="note">有结构数据时按 sections 渲染；无结构数据保留文本降级。</text><text x="88" y="1296" class="tiny">复制始终使用完整详情，而不是屏幕裁剪后的片段。</text>

    <rect x="812" y="936" width="724" height="386" rx="12" class="card"/><text x="836" y="966" class="card-t">补丁差异卡</text><text x="1512" y="966" text-anchor="end" class="tiny">行号列 56 · 有界 200 行 / 卡</text>
    <rect x="836" y="988" width="676" height="274" rx="12" fill="#FFF" stroke="#E8E6E3"/>
    <text x="850" y="1014" class="ui14" font-weight="700">src/summary.rs</text><text x="988" y="1014" class="ui11 muted">修改</text><text x="1450" y="1014" text-anchor="end" class="ui12" fill="#1A8A5C" font-weight="600">+12</text><text x="1498" y="1014" text-anchor="end" class="ui12" fill="#D04A43" font-weight="600">−3</text>
    <rect x="848" y="1026" width="652" height="24" rx="6" fill="#F5F4F2"/><text x="858" y="1043" class="ui13 secondary" font-weight="600">变更片段</text>
    <rect x="848" y="1058" width="652" height="24" fill="#F5F4F2"/><text x="858" y="1075" class="mono ui11 muted">@@</text><text x="918" y="1075" class="mono ui11 muted">fn summarize(items) {</text>
    <rect x="848" y="1082" width="652" height="24" fill="#EAF7F0"/><text x="894" y="1099" text-anchor="end" class="mono ui11 muted">41</text><line x1="904" y1="1082" x2="904" y2="1106" stroke="#E8E6E3"/><text x="912" y="1099" class="mono ui12" fill="#1A8A5C">+</text><text x="938" y="1099" class="mono ui12" fill="#14532D">let merged = merge(items);</text>
    <rect x="848" y="1106" width="652" height="24" fill="#EAF7F0"/><text x="894" y="1123" text-anchor="end" class="mono ui11 muted">42</text><line x1="904" y1="1106" x2="904" y2="1130" stroke="#E8E6E3"/><text x="912" y="1123" class="mono ui12" fill="#1A8A5C">+</text><text x="938" y="1123" class="mono ui12" fill="#14532D">let digest = summarize(merged);</text>
    <rect x="848" y="1130" width="652" height="24" fill="#FDECEC"/><text x="894" y="1147" text-anchor="end" class="mono ui11 muted">43</text><line x1="904" y1="1130" x2="904" y2="1154" stroke="#E8E6E3"/><text x="912" y="1147" class="mono ui12" fill="#D04A43">−</text><text x="938" y="1147" class="mono ui12" fill="#7F1D1D">let digest = items;</text>
    <rect x="848" y="1154" width="652" height="24" fill="#FFF"/><text x="894" y="1171" text-anchor="end" class="mono ui11 muted">44</text><line x1="904" y1="1154" x2="904" y2="1178" stroke="#E8E6E3"/><text x="938" y="1171" class="mono ui12 secondary">return digest;</text>
    <text x="850" y="1214" class="tiny">行高随文本；正文 12.5px Consolas；单行省略。</text><text x="850" y="1240" class="tiny">新增 / 删除同时用底色、+/− 与文字色表达。</text>
    <text x="836" y="1296" class="note">卡片不嵌套滚动；由时间线外层滚动承载，避免详情越界。</text>
  </g>

  <g id="group-subagent">
    <rect x="64" y="1356" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1373" text-anchor="middle" class="chip">04</text><text x="104" y="1374" class="sect">聚合与子智能体 · 外观跟随职责</text>
    <rect x="64" y="1398" width="724" height="302" rx="12" class="card"/><text x="88" y="1428" class="card-t">工具组 · 只负责聚合</text><text x="764" y="1428" text-anchor="end" class="tiny">组头 30 / 展开 32</text>
    <rect x="88" y="1450" width="676" height="32" rx="6" fill="#F6F5F3"/><path d="m98 1463 5 4-5 4" fill="none" stroke="#8A8F99"/><text x="118" y="1472" class="ui13 secondary">执行工具 3 次</text><text x="740" y="1472" text-anchor="end" class="ui12 muted">已处理</text>
    <line x1="108" y1="1490" x2="108" y2="1610" stroke="#E2DFDA"/>
    <circle cx="108" cy="1510" r="6" fill="#FFF" stroke="#9BA0A8"/><path d="m105 1510 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="128" y="1516" class="ui13 muted">搜索文件</text><text x="740" y="1516" text-anchor="end" class="mono ui11 muted">1.2k · 0.8s</text>
    <circle cx="108" cy="1544" r="6" fill="#FFF" stroke="#9BA0A8"/><path d="m105 1544 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="128" y="1550" class="ui13 muted">读取文件</text><text x="740" y="1550" text-anchor="end" class="mono ui11 muted">2.4k · 1.2s</text>
    <circle cx="108" cy="1578" r="6" fill="#FFF" stroke="#9BA0A8"/><path d="m105 1578 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="128" y="1584" class="ui13 muted">写入文件</text><text x="740" y="1584" text-anchor="end" class="mono ui11 muted">3.1k · 1.6s</text>
    <text x="88" y="1630" class="note">组内仍是标准 26px 工具行，共享一条 connector。</text><text x="88" y="1658" class="note">计数来自实际子行；工具组本身没有运行状态。</text><text x="88" y="1684" class="tiny">折叠摘要显示最近结果，没有结果就省略。</text>

    <rect x="812" y="1398" width="724" height="302" rx="12" class="card"/><text x="836" y="1428" class="card-t">子智能体 · 独立工作单元</text><text x="1512" y="1428" text-anchor="end" class="tiny">不是普通工具行</text>
    <rect x="836" y="1450" width="676" height="62" rx="8" fill="#FBFAF8" stroke="#E8E6E3"/><circle cx="856" cy="1472" r="7" fill="none" stroke="#F58A24" stroke-dasharray="30 10"/><text x="876" y="1476" class="ui13" font-weight="600">资料整理</text><text x="954" y="1476" class="ui12" fill="#F58A24">运行中</text><circle cx="1478" cy="1481" r="11" fill="#FDECEC"/><rect x="1474" y="1477" width="8" height="8" rx="1" fill="#D04A43"/><text x="850" y="1500" class="ui12 muted">正在汇总材料并核对结论…</text>
    <rect x="836" y="1526" width="676" height="62" rx="8" fill="#FBFAF8" stroke="#E8E6E3"/><circle cx="856" cy="1548" r="7" fill="none" stroke="#1A8A5C"/><path d="m852 1548 3 3 6-6" fill="none" stroke="#1A8A5C"/><text x="876" y="1552" class="ui13" font-weight="600">资料整理</text><text x="954" y="1552" class="ui12" fill="#1A8A5C">已完成</text><text x="850" y="1576" class="ui12 muted">摘要：已合并重复段落，输出 3 条结论。</text>
    <text x="836" y="1622" class="note">卡片只呈现标题、状态、摘要与可用操作。</text><text x="836" y="1648" class="note">运行时显示 22px 圆形中断按钮；点击卡查看子线程。</text><text x="836" y="1674" class="tiny">详情加载不阻塞主时间线；完成后不再显示中断。</text>
  </g>
  <g id="footer"><line x1="64" y1="1730" x2="1536" y2="1730" stroke="#D8D5D0"/><text x="64" y="1750" class="tiny">事实来源：tool_process.slint · status_icon.slint · workflow_detail.slint · patch_diff_card.slint · timeline.slint</text><text x="1536" y="1750" text-anchor="end" class="mono tiny">05 / 09 · 2026-10-31</text></g>
</svg>
