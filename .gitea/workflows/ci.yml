name: Linux CI

on:
  workflow_dispatch:

jobs:
  linux-cli:
    runs-on: wunder-ci
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.92
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.92.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Linux CLI
        run: cargo build -p wunder-cli --release --locked

      - name: Smoke test
        run: ./target/release/wunder-cli --version
