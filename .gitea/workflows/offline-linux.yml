name: Offline Linux Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Gitea 的表达式引擎没有 runner 上下文，架构门禁一律放进脚本：
# 任务容器自己按 uname -m 判断能不能干这活，不能就打印跳过原因并成功退出。
jobs:
  linux:
    # wunder-offline 任务镜像里有 /opt/offline-ci/checkout.py；检出后一律改用仓库内脚本。
    # 桌面、CLI、.portable 与 .run 都在同一个任务的工作区里产出，补充包直接取套件预置包。
    runs-on: wunder-offline
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout from local Gitea
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_TOKEN: ${{ github.token }}
        run: python3 /opt/offline-ci/checkout.py
      - name: Build offline Linux desktop, CLI and installer
        env:
          ARCH: ${{ matrix.arch }}
          CI_REPOSITORY: ${{ github.repository }}
        run: bash packaging/gitea/ci/build.sh
      - name: Publish build outputs to local Releases
        env:
          ARCH: ${{ matrix.arch }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT: ${{ github.sha }}
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if find release-assets -maxdepth 1 -type f | grep -q .; then
            python3 packaging/gitea/ci/publish.py release-assets
          else
            echo 'nothing to publish from this worker'
          fi

  win7:
    # Win7 32 位由 x86_64 宿主的 kylin-x86 MinGW 交叉构建；ARM64 worker 上脚本自行跳过。
    runs-on: wunder-offline
    timeout-minutes: 1440
    steps:
      - name: Checkout from local Gitea
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_TOKEN: ${{ github.token }}
        run: python3 /opt/offline-ci/checkout.py
      - name: Build offline Win7 x86 desktop and CLI
        env:
          ARCH: win7-x86
          CI_REPOSITORY: ${{ github.repository }}
        run: bash packaging/gitea/ci/build.sh
      - name: Publish build outputs to local Releases
        env:
          ARCH: win7-x86
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT: ${{ github.sha }}
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if find release-assets -maxdepth 1 -type f | grep -q .; then
            python3 packaging/gitea/ci/publish.py release-assets
          else
            echo 'nothing to publish from this worker'
          fi
