<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
  <rect width="860" height="330" fill="#fbfbfd"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2430">思考行结算缺陷：最短反例轨迹</text>
  <text x="24" y="58" font-size="12.5" fill="#6b7280">Rounds={1,2} Tools={1,2}，TLC 穷举，13 个可达状态即复现</text>

  <!-- S1 -->
  <rect x="24" y="86" width="180" height="96" rx="8" fill="#ffffff" stroke="#c9cfd8"/>
  <text x="38" y="110" font-size="12" font-weight="600" fill="#374151">S1 初始</text>
  <text x="38" y="134" font-size="11.5" fill="#4b5563">rows = &lt;&gt;</text>
  <text x="38" y="154" font-size="11.5" fill="#4b5563">slot = 0（无思考槽）</text>
  <text x="38" y="172" font-size="11.5" fill="#4b5563">clock = 1</text>

  <!-- S2 -->
  <rect x="248" y="86" width="200" height="96" rx="8" fill="#ffffff" stroke="#c9cfd8"/>
  <text x="262" y="110" font-size="12" font-weight="600" fill="#374151">S2 思考帧</text>
  <text x="262" y="134" font-size="11.5" fill="#4b5563">rows = [ r1 · 运行中 ]</text>
  <text x="262" y="154" font-size="11.5" fill="#4b5563">slot = 1</text>
  <text x="262" y="172" font-size="11.5" fill="#92400e">文字正在流式增长</text>

  <!-- S3 -->
  <rect x="492" y="86" width="200" height="96" rx="8" fill="#ffffff" stroke="#c9cfd8"/>
  <text x="506" y="110" font-size="12" font-weight="600" fill="#374151">S3 工具结果先到</text>
  <text x="506" y="134" font-size="11.5" fill="#4b5563">rows = [ r1 · 运行中 ,</text>
  <text x="506" y="152" font-size="11.5" fill="#4b5563">          t1 · 已完成 ]</text>
  <text x="506" y="172" font-size="11.5" fill="#b91c1c">slot 仍指向 r1，未结算</text>

  <!-- violation -->
  <rect x="736" y="86" width="100" height="96" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="750" y="112" font-size="12" font-weight="600" fill="#b91c1c">违反</text>
  <text x="750" y="134" font-size="11" fill="#b91c1c">NoStale</text>
  <text x="750" y="150" font-size="11" fill="#b91c1c">Running</text>
  <text x="750" y="170" font-size="11" fill="#b91c1c">旧思考转圈</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="204" y1="134" x2="242" y2="134" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="448" y1="134" x2="486" y2="134" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="692" y1="134" x2="730" y2="134" stroke="#ef4444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="206" y="126" font-size="10.5" fill="#374151">Reason(r1)</text>
  <text x="446" y="126" font-size="10.5" fill="#374151">ToolResult(t1)</text>

  <!-- early exit -->
  <rect x="248" y="216" width="444" height="86" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-dasharray="5 4"/>
  <text x="264" y="240" font-size="12" font-weight="600" fill="#9a3412">若随后到达 ToolCall(t1)</text>
  <text x="264" y="262" font-size="11.5" fill="#7c2d12">upsert_tool 在 id 已存在处提前 return，close_thinking 永远不会执行</text>
  <text x="264" y="282" font-size="11.5" fill="#7c2d12">→ 该思考行一直转圈，直到本轮结束；这正是截图里的形态</text>
  <line x1="592" y1="182" x2="592" y2="210" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
