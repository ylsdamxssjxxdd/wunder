<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1880" viewBox="0 0 1600 1880" role="img" aria-label="蛹 桌面端真实交互状态与动效规范">
  <title>09 交互状态与动效 · 蛹 Desktop UI Spec</title>
  <defs><symbol id="a-copy" viewBox="0 0 448 512"><path fill="currentColor" transform="translate(0 448) scale(1 -1)" d="M208 448H332Q352 448 366 434L434 366Q448 352 448 332V112Q447 92 434 78Q420 65 400 64H208Q188 65 174 78Q161 92 160 112V400Q161 420 174 434Q188 447 208 448ZM48 320H128V256H64V0H256V32H320V-16Q319-36 306-50Q292-63 272-64H48Q28-63 14-50Q1-36 0-16V272Q1 292 14 306Q28 319 48 320Z"/></symbol></defs>
  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.ui11{font-size:11px}.muted{fill:#8A8F99}.secondary{fill:#3D3D3D}</style>
  <rect width="1600" height="1880" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 蛹 · DESKTOP UI SPEC</text><text x="64" y="84" class="h1">09　交互状态与动效</text><text x="64" y="114" class="sub">矩阵记录真实控件行为，不用虚构的按下色、统一加载态或焦点环填满表格；特殊组件在自己的分页展开。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 09 / 09</text><text x="1536" y="84" text-anchor="end" class="mono ui12">STATES · MOTION · A11Y</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>

  <g id="action-matrix">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">Action 按钮 · 原生属性直接决定外观</text><text x="1536" y="177" text-anchor="end" class="sect-note">30px 高 · 图标按钮 30 宽 / 文字按钮默认 92 宽 · r8</text>
    <rect x="64" y="202" width="1472" height="448" rx="12" class="card"/>
    <text x="260" y="234" class="tiny">默认</text><text x="512" y="234" class="tiny">悬停</text><text x="764" y="234" class="tiny">键盘聚焦</text><text x="1016" y="234" class="tiny">选中</text><text x="1268" y="234" class="tiny">停用</text><line x1="88" y1="250" x2="1512" y2="250" stroke="#E8E6E3"/>
    <text x="88" y="292" class="card-t">主要按钮</text><text x="88" y="314" class="tiny">primary=true</text>
    <rect x="260" y="272" width="92" height="30" rx="8" fill="#F58A24"/><text x="306" y="292" text-anchor="middle" class="ui12" fill="#FFF">确认</text><rect x="512" y="272" width="92" height="30" rx="8" fill="#E07A12"/><text x="558" y="292" text-anchor="middle" class="ui12" fill="#FFF">确认</text><rect x="764" y="272" width="92" height="30" rx="8" fill="#F58A24" stroke="#F58A24"/><text x="810" y="292" text-anchor="middle" class="ui12" fill="#FFF">确认</text><rect x="1016" y="272" width="92" height="30" rx="8" fill="#F58A24"/><text x="1062" y="292" text-anchor="middle" class="ui12" fill="#FFF">确认</text><rect x="1268" y="272" width="92" height="30" rx="8" fill="#FCDDBD"/><text x="1314" y="292" text-anchor="middle" class="ui12" fill="#FFF">确认</text>
    <text x="88" y="362" class="card-t">危险按钮</text><text x="88" y="384" class="tiny">danger=true</text>
    <rect x="260" y="342" width="92" height="30" rx="8" fill="#D04A43"/><text x="306" y="362" text-anchor="middle" class="ui12" fill="#FFF">删除</text><rect x="512" y="342" width="92" height="30" rx="8" fill="#D04A43"/><text x="558" y="362" text-anchor="middle" class="ui12" fill="#FFF">删除</text><rect x="764" y="342" width="92" height="30" rx="8" fill="#D04A43" stroke="#F58A24"/><text x="810" y="362" text-anchor="middle" class="ui12" fill="#FFF">删除</text><rect x="1016" y="342" width="92" height="30" rx="8" fill="#D04A43"/><text x="1062" y="362" text-anchor="middle" class="ui12" fill="#FFF">删除</text><rect x="1268" y="342" width="92" height="30" rx="8" fill="#ECB7B4"/><text x="1314" y="362" text-anchor="middle" class="ui12" fill="#FFF">删除</text>
    <text x="88" y="432" class="card-t">图标按钮</text><text x="88" y="454" class="tiny">show-label=false</text>
    <rect x="260" y="412" width="30" height="30" rx="8" fill="transparent"/><use href="#a-copy" x="267" y="419" width="16" height="16" color="#8A8F99"/><rect x="512" y="412" width="30" height="30" rx="8" fill="#FDF0DE"/><use href="#a-copy" x="519" y="419" width="16" height="16" color="#8A8F99"/><rect x="764" y="412" width="30" height="30" rx="8" fill="transparent" stroke="#F58A24"/><use href="#a-copy" x="771" y="419" width="16" height="16" color="#8A8F99"/><rect x="1016" y="412" width="30" height="30" rx="8" fill="#FDF0DE"/><use href="#a-copy" x="1023" y="419" width="16" height="16" color="#8A8F99"/><rect x="1268" y="412" width="30" height="30" rx="8" fill="transparent"/><use href="#a-copy" x="1275" y="419" width="16" height="16" color="#8A8F99"/><text x="1320" y="432" class="tiny">无点击 / 无 Tooltip 触发</text>
    <text x="88" y="502" class="card-t">普通文字按钮</text><text x="88" y="524" class="tiny">show-label=true</text>
    <rect x="260" y="482" width="92" height="30" rx="8" fill="transparent"/><text x="306" y="502" text-anchor="middle" class="ui12">浏览</text><rect x="512" y="482" width="92" height="30" rx="8" fill="#FDF0DE"/><text x="558" y="502" text-anchor="middle" class="ui12">浏览</text><rect x="764" y="482" width="92" height="30" rx="8" fill="transparent" stroke="#F58A24"/><text x="810" y="502" text-anchor="middle" class="ui12">浏览</text><rect x="1016" y="482" width="92" height="30" rx="8" fill="#FDF0DE"/><text x="1062" y="502" text-anchor="middle" class="ui12">浏览</text><rect x="1268" y="482" width="92" height="30" rx="8" fill="transparent"/><text x="1314" y="502" text-anchor="middle" class="ui12">浏览</text><text x="1320" y="502" class="tiny">当前不额外灰化</text>
    <line x1="88" y1="540" x2="1512" y2="540" stroke="#E8E6E3"/>
    <text x="88" y="568" class="note">真实规则：primary/danger 的背景分支优先于 selected；普通 selected 与 hover 都是 accent-soft。</text><text x="88" y="594" class="note">focus 始终是 1px accent；在 accent 实心按钮上对比很弱，本页不改成虚构的 2px 深色环。</text><text x="88" y="620" class="tiny">primary/danger 停用只将底色透明化 60%，文字仍为白色；普通停用不自动降透明度，由 enabled 阻止交互。</text><text x="1512" y="620" text-anchor="end" class="tiny">没有通用 pressed 色或 loading 分支；模型保存等局部加载见分页 07</text>
  </g>

  <g id="form-matrix">
    <rect x="64" y="684" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="701" text-anchor="middle" class="chip">02</text><text x="104" y="702" class="sect">表单与选择控件 · 输入、勾选、开关不是一套状态色</text>
    <rect x="64" y="726" width="724" height="332" rx="12" class="card"/><text x="88" y="756" class="card-t">FormField / ComboBox</text>
    <text x="88" y="788" class="tiny">默认</text><rect x="176" y="770" width="270" height="36" rx="8" fill="#FFF" stroke="#D8D5D0"/><text x="186" y="793" class="ui12 muted">可编辑内容</text><text x="478" y="793" class="note">白底 + border-strong</text>
    <text x="88" y="836" class="tiny">聚焦</text><rect x="176" y="818" width="270" height="36" rx="8" fill="#FFF" stroke="#F58A24"/><text x="186" y="841" class="ui12">正在输入</text><text x="478" y="841" class="note">1px accent</text>
    <text x="88" y="884" class="tiny">错误</text><rect x="176" y="866" width="270" height="36" rx="8" fill="#FFF" stroke="#D04A43"/><text x="186" y="889" class="ui12">需要修正</text><text x="478" y="889" class="note" fill="#D04A43">danger 优先于焦点色</text>
    <text x="88" y="932" class="tiny">只读</text><rect x="176" y="914" width="270" height="36" rx="8" fill="#F6F5F3" stroke="#E8E6E3"/><text x="186" y="937" class="ui12 muted">只读内容</text><text x="478" y="937" class="note">灰底 + muted 文本</text>
    <text x="88" y="980" class="tiny">下拉停用</text><rect x="176" y="962" width="270" height="36" rx="8" fill="#F6F5F3" stroke="#E8E6E3"/><text x="186" y="985" class="ui12 muted">当前配置</text><text x="426" y="985" class="ui12 muted">⌄</text><text x="478" y="985" class="note">不能展开，当前值仍可读</text>
    <text x="88" y="1028" class="tiny">选择器展开后：hover 用 Theme.hover，当前项用 accent-soft + accent-deep 文本。</text>

    <rect x="812" y="726" width="724" height="332" rx="12" class="card"/><text x="836" y="756" class="card-t">ThemeCheck 与系统 Switch</text>
    <rect x="836" y="778" width="16" height="16" rx="4" fill="#F58A24"/><path d="m839 786 4 4 7-8" fill="none" stroke="#FFF" stroke-width="1.4"/><text x="862" y="792" class="ui12">选中</text><rect x="948" y="778" width="16" height="16" rx="4" fill="#FFF" stroke="#D8D5D0"/><text x="974" y="792" class="ui12">未选</text><rect x="1060" y="778" width="16" height="16" rx="4" fill="#F6F5F3" stroke="#E8E6E3"/><text x="1086" y="792" class="ui12 muted">停用</text>
    <text x="836" y="824" class="note">勾选框 16px；选中 accent，hover 时 accent-deep；白勾 9px。</text><text x="836" y="850" class="tiny">未选 hover 使用 hover 底 + accent-secondary 边；停用使用只读灰底。</text><text x="836" y="876" class="tiny">当前没有独立的 2px 焦点环，本页不虚构。</text>
    <line x1="836" y1="898" x2="1512" y2="898" stroke="#E8E6E3"/>
    <rect x="836" y="920" width="46" height="26" rx="13" fill="#005FB8"/><circle cx="869" cy="933" r="10" fill="#FFF"/><text x="896" y="938" class="ui12">系统开启</text><rect x="1020" y="920" width="46" height="26" rx="13" fill="#FFF" stroke="#626261"/><circle cx="1033" cy="933" r="10" fill="#626261"/><text x="1080" y="938" class="ui12">系统关闭</text><rect x="1230" y="920" width="46" height="26" rx="13" fill="#C4C3C2"/><circle cx="1263" cy="933" r="10" fill="#FFF"/><text x="1290" y="938" class="ui12 muted">系统停用</text>
    <text x="836" y="976" class="note">Switch 使用 Slint 标准控件：开启蓝 #005FB8，关闭深灰。</text><text x="836" y="1002" class="note">它不跟随 Theme.accent；不要改画成橙色开关冒充实机。</text><text x="836" y="1028" class="tiny">渲染基线：std-widgets Switch + 当前软件渲染器。</text>
  </g>

  <g id="motion-keyboard">
    <rect x="64" y="1092" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1109" text-anchor="middle" class="chip">03</text><text x="104" y="1110" class="sect">动效与键盘 · 只动画必要反馈</text>
    <rect x="64" y="1134" width="724" height="270" rx="12" class="card"/><text x="88" y="1164" class="card-t">时间预算</text>
    <text x="88" y="1194" class="mono ui12">16–33ms</text><text x="220" y="1194" class="note">流式跟随、文本/工具增量合并</text><text x="88" y="1222" class="mono ui12">90ms</text><text x="220" y="1222" class="note">勾选淡入 / 待回应唤醒</text><text x="88" y="1250" class="mono ui12">110–150ms</text><text x="220" y="1250" class="note">队列落点、边缘柄与图标着色</text><text x="88" y="1278" class="mono ui12">1.2s</text><text x="220" y="1278" class="note">侧栏六点旋转与状态呼吸</text><text x="88" y="1306" class="mono ui12">1.48s</text><text x="220" y="1306" class="note">模型与 Dock 六点旋转</text><text x="88" y="1334" class="mono ui12">550ms / 1.6s</text><text x="300" y="1334" class="note">录音脉冲 / 复制反馈</text><text x="88" y="1372" class="tiny">折叠与长列表布局即时更新；不为高、宽和列表重排加动画。</text>

    <rect x="812" y="1134" width="724" height="270" rx="12" class="card"/><text x="836" y="1164" class="card-t">键盘与焦点</text>
    <rect x="836" y="1180" width="90" height="24" rx="5" fill="#F6F5F3" stroke="#D8D5D0"/><text x="881" y="1196" text-anchor="middle" class="mono ui11">Tab</text><text x="940" y="1196" class="note">按界面顺序移动焦点</text>
    <rect x="836" y="1212" width="120" height="24" rx="5" fill="#F6F5F3" stroke="#D8D5D0"/><text x="896" y="1228" text-anchor="middle" class="mono ui11">Enter / Space</text><text x="970" y="1228" class="note">激活按钮、选项或勾选</text>
    <rect x="836" y="1244" width="90" height="24" rx="5" fill="#F6F5F3" stroke="#D8D5D0"/><text x="881" y="1260" text-anchor="middle" class="mono ui11">Esc</text><text x="940" y="1260" class="note">关闭弹层 / 取消编辑</text>
    <rect x="836" y="1276" width="120" height="24" rx="5" fill="#F6F5F3" stroke="#D8D5D0"/><text x="896" y="1292" text-anchor="middle" class="mono ui11">Shift+Enter</text><text x="970" y="1292" class="note">编辑器换行</text>
    <rect x="836" y="1308" width="120" height="24" rx="5" fill="#F6F5F3" stroke="#D8D5D0"/><text x="896" y="1324" text-anchor="middle" class="mono ui11">↑ / ↓</text><text x="970" y="1324" class="note">按条件召回已发送草稿</text>
    <text x="836" y="1360" class="tiny">弹窗打开后焦点进入，关闭后回到触发元素；Tab 在模态内循环。</text><text x="836" y="1384" class="tiny">发送键遵循线程偏好：Enter / Ctrl+Enter / 仅按钮。</text>
  </g>

  <g id="responsive-a11y">
    <rect x="64" y="1438" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1455" text-anchor="middle" class="chip">04</text><text x="104" y="1456" class="sect">响应式与无障碍 · 先保住任务，再缩减装饰</text>
    <rect x="64" y="1480" width="1472" height="214" rx="12" class="card"/>
    <text x="88" y="1510" class="card-t">窗口断点</text><text x="88" y="1540" class="mono ui12">1024</text><text x="150" y="1540" class="note">最小窗口　</text><text x="270" y="1540" class="mono ui12">1100</text><text x="332" y="1540" class="note">dock 断点　</text><text x="454" y="1540" class="mono ui12">1180×740</text><text x="560" y="1540" class="note">preferred　</text><text x="690" y="1540" class="mono ui12">170–420</text><text x="782" y="1540" class="note">侧栏拖宽</text><text x="1512" y="1540" text-anchor="end" class="note">阅读列达到 1000 后留白，不继续拉长正文</text>
    <line x1="88" y1="1562" x2="1512" y2="1562" stroke="#E8E6E3"/>
    <text x="88" y="1590" class="card-t">必须保留</text><text x="200" y="1590" class="note">图标按钮 accessible-label；状态同时有图形与文案；原文复制完整；错误可感知。</text><text x="88" y="1618" class="note">输入、滚动、选择与复制不被流式输出阻塞；屏幕阅读器不逐字播报增量。</text><text x="88" y="1646" class="note">点击热区至少 24×24；装饰图标不进入焦点；隐藏内容不获得焦点。</text><text x="88" y="1674" class="tiny">性能红线：有界事件缓冲、历史虚拟化、只更新活动尾块、合并增量不丢字。</text><text x="1512" y="1674" text-anchor="end" class="tiny">装饰动画可降级，任务状态始终可达</text>
  </g>

  <g id="implementation-notes"><rect x="64" y="1728" width="1472" height="100" rx="12" class="card"/><text x="88" y="1758" class="card-t">实机差异记录 · 不是新的视觉提案</text><text x="88" y="1786" class="note">实心按钮 1px accent 焦点对比弱；普通停用按钮不统一灰化；ThemeCheck 没有独立焦点描边；Switch 使用系统蓝色。</text><text x="88" y="1812" class="tiny">后续若调整产品行为，应先改实现并重新渲染本页，不在设计稿里提前“修正”实机。</text><text x="1512" y="1812" text-anchor="end" class="tiny">组件级特殊状态见各自分页</text></g>
  <g id="footer"><line x1="64" y1="1850" x2="1536" y2="1850" stroke="#D8D5D0"/><text x="64" y="1870" class="tiny">事实来源：components.slint · settings_page.slint · composer.slint · status_icon.slint · 当前 Slint 软件渲染帧</text><text x="1536" y="1870" text-anchor="end" class="mono tiny">09 / 09 · 2026-10-25</text></g>
</svg>
