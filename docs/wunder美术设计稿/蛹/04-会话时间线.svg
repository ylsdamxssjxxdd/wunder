<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1840" viewBox="0 0 1600 1840" role="img" aria-label="蛹 桌面端会话时间线规范">
  <title>04 会话时间线 · 蛹 Desktop UI Spec</title>
  <defs>
    <symbol id="t-copy" viewBox="0 0 448 512"><path fill="currentColor" transform="translate(0 448) scale(1 -1)" d="M208 448H332Q352 448 366 434L434 366Q448 352 448 332V112Q447 92 434 78Q420 65 400 64H208Q188 65 174 78Q161 92 160 112V400Q161 420 174 434Q188 447 208 448ZM48 320H128V256H64V0H256V32H320V-16Q319-36 306-50Q292-63 272-64H48Q28-63 14-50Q1-36 0-16V272Q1 292 14 306Q28 319 48 320Z"/></symbol>
    <symbol id="t-eye" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M0 12C3 6 7 3 12 3s9 3 12 9c-3 6-7 9-12 9S3 18 0 12m6 0a6 6 0 1 0 12 0 6 6 0 0 0-12 0m3 0a3 3 0 1 0 6 0 3 3 0 0 0-6 0"/></symbol>
    <symbol id="t-file" viewBox="0 0 384 512"><path fill="currentColor" transform="translate(0 448) scale(1 -1)" d="M64 448Q37 447 19 429Q1 411 0 384V0Q1-27 19-45Q37-63 64-64H320Q347-63 365-45Q383-27 384 0V288H256Q242 288 233 297Q224 306 224 320V448H64ZM256 448V320H384L256 448ZM112 192H272Q287 191 288 176Q287 161 272 160H112Q97 161 96 176Q97 191 112 192ZM112 128H272Q287 127 288 112Q287 97 272 96H112Q97 97 96 112Q97 127 112 128ZM112 64H272Q287 63 288 48Q287 33 272 32H112Q97 33 96 48Q97 63 112 64Z"/></symbol>
    <pattern id="heat" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="4" height="4" rx="1" fill="#E9E8E5"/><rect x="6" width="4" height="4" rx="1" fill="#FDF0DE"/><rect y="6" width="4" height="4" rx="1" fill="#FAD9B4"/><rect x="6" y="6" width="4" height="4" rx="1" fill="#E9E8E5"/></pattern>
  </defs>
  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.ui11{font-size:11px}.ui10{font-size:10px}.muted{fill:#8A8F99}.secondary{fill:#3D3D3D}</style>
  <rect width="1600" height="1840" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 蛹 · DESKTOP UI SPEC</text><text x="64" y="84" class="h1">04　会话时间线</text><text x="64" y="114" class="sub">一个回合按“用户输入 → 工作过程 → 助手正文 → 回合页脚”阅读；过程详情展开只改变对应区域。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 04 / 09</text><text x="1536" y="84" text-anchor="end" class="mono ui12">TRANSCRIPT · TURN · FEEDBACK</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>

  <g id="complete-turn">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">真实回合 · 1000px 阅读列</text><text x="1536" y="177" text-anchor="end" class="sect-note">无助手气泡 / 无头像 / 无整条回合分隔线</text>
    <rect x="300" y="202" width="1000" height="664" rx="8" fill="#FBFAF8" stroke="#D8D5D0"/>
    <text x="324" y="236" class="ui14">你好！我是你的智能体助手，有什么可以帮你？</text><rect x="1248" y="216" width="22" height="22" rx="6" fill="transparent"/><use href="#t-eye" x="1253" y="221" width="12" height="12" color="#8A8F99"/>
    <rect x="1090" y="258" width="186" height="44" rx="12" fill="#F3F2F0"/><text x="1102" y="286" class="ui14">请核对这份记录。</text>
    <path d="m328 326 5 4-5 4" fill="none" stroke="#8A8F99" stroke-width="1.4"/><text x="348" y="334" class="ui13 secondary">工作过程 · 3 步</text><text x="460" y="334" class="ui12 muted">已完成</text>
    <line x1="334" y1="350" x2="334" y2="482" stroke="#E2DFDA"/>
    <circle cx="334" cy="362" r="6" fill="#FBFAF8" stroke="#9BA0A8"/><path d="m331 362 2 2 4-4" fill="none" stroke="#8A8F99"/><use href="#t-file" x="350" y="355" width="13" height="13" color="#8A8F99"/><text x="372" y="368" class="ui13 muted">读取文件</text><rect x="440" y="354" width="88" height="18" rx="6" fill="#F6F5F3"/><text x="447" y="367" class="ui12 muted">sample.txt</text><text x="542" y="368" class="ui12" fill="#9BA0A8">读取示例记录</text><text x="1248" y="368" text-anchor="end" class="mono ui11 muted">1.8k token　19ms</text>
    <circle cx="334" cy="396" r="6" fill="#FBFAF8" stroke="#9BA0A8"/><path d="m331 396 2 2 4-4" fill="none" stroke="#8A8F99"/><text x="372" y="402" class="ui13 muted">运行命令</text><text x="442" y="402" class="ui12" fill="#9BA0A8">check sample.txt</text><text x="1248" y="402" text-anchor="end" class="mono ui11 muted">2.4k token　1.2s</text>
    <rect x="344" y="420" width="932" height="82" rx="8" fill="#FBFAF8" stroke="#E8E6E3"/><text x="356" y="441" class="ui11 muted" font-weight="700">输出</text><use href="#t-copy" x="1248" y="429" width="14" height="14" color="#8A8F99"/><rect x="356" y="452" width="908" height="38" rx="6" fill="#F6F5F3"/><text x="368" y="476" class="mono ui12 secondary">$ check sample.txt　　　　　　　　　2 checks passed</text>
    <circle cx="334" cy="526" r="6" fill="#FBFAF8" stroke="#D04A43"/><path d="m331 523 6 6m0-6-6 6" stroke="#D04A43" stroke-width="1"/><use href="#t-file" x="350" y="519" width="13" height="13" color="#8A8F99"/><text x="372" y="532" class="ui13 muted">读取文件</text><text x="442" y="532" class="ui12" fill="#9BA0A8">missing.txt　示例文件不可用</text><text x="1248" y="532" text-anchor="end" class="mono ui11 muted">12ms</text>
    <text x="324" y="578" class="ui14">示例记录已通过两项检查；另一个请求的文件不可用。</text>
    <text x="324" y="620" class="ui14">结果已按主题整理，可以继续补充输出格式。</text>
    <g class="ui11" fill="#3D3D3D"><text x="324" y="666"># 第 1 个用户轮次　◷ 3.2s　◉ 42.8 token/s　▤ 12.3k　ϟ 2.4k　⌘ 3　● 4</text></g><use href="#t-copy" x="1258" y="654" width="12" height="12" color="#8A8F99"/>
    <rect x="324" y="700" width="952" height="104" rx="8" fill="#FDF0DE"/><text x="338" y="724" class="ui11 muted">text</text><use href="#t-copy" x="1244" y="712" width="14" height="14" color="#8A8F99"/><text x="338" y="754" class="mono" font-size="13" fill="#3D3D3D">检查完成：2 项通过，1 项需要补充。</text><text x="338" y="782" class="ui13 muted">代码与引用保留原文复制；复杂内容可降级为可读文本。</text>
    <text x="324" y="840" class="tiny">24px 阅读列内边距；工具行 26px；过程详情从 44px 缩进开始。</text>
  </g>

  <g id="turn-anatomy">
    <rect x="64" y="900" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="917" text-anchor="middle" class="chip">02</text><text x="104" y="918" class="sect">回合结构 · 四段各自回答一个问题</text>
    <rect x="64" y="942" width="350" height="174" rx="12" class="card"/><text x="86" y="972" class="chip">A / INPUT</text><text x="86" y="998" class="card-t">用户说了什么</text><text x="86" y="1026" class="note">右对齐灰底气泡，宽随内容</text><text x="86" y="1052" class="note">最大 70%；x12 / y8 内边距</text><text x="86" y="1084" class="tiny">无头像、时间与独立复制钮</text>
    <rect x="438" y="942" width="350" height="174" rx="12" class="card"/><text x="460" y="972" class="chip">B / PROCESS</text><text x="460" y="998" class="card-t">系统做了什么</text><text x="460" y="1026" class="note">过程条、工具行、输出与差异</text><text x="460" y="1052" class="note">折叠保留摘要，展开看详情</text><text x="460" y="1084" class="tiny">长过程独立滚动，上限 420px</text>
    <rect x="812" y="942" width="350" height="174" rx="12" class="card"/><text x="834" y="972" class="chip">C / ANSWER</text><text x="834" y="998" class="card-t">最终答案是什么</text><text x="834" y="1026" class="note">左对齐正文，不使用助手气泡</text><text x="834" y="1052" class="note">14px / 1.5；Markdown 分块</text><text x="834" y="1084" class="tiny">流式只更新活动尾块</text>
    <rect x="1186" y="942" width="350" height="174" rx="12" class="card"/><text x="1208" y="972" class="chip">D / META</text><text x="1208" y="998" class="card-t">这轮结果与成本</text><text x="1208" y="1026" class="note">轮次、耗时、速度、上下文</text><text x="1208" y="1052" class="note">工具、额度、状态与复制</text><text x="1208" y="1084" class="tiny">11px 指标 / 12px 图标</text>
  </g>

  <g id="timeline-states">
    <rect x="64" y="1150" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1167" text-anchor="middle" class="chip">03</text><text x="104" y="1168" class="sect">状态表现 · 胶囊、空态与错误各有固定位置</text>
    <rect x="64" y="1192" width="1472" height="300" rx="12" class="card"/>
    <text x="88" y="1222" class="card-t">回合状态胶囊 · 22px 高</text><text x="1512" y="1222" text-anchor="end" class="tiny">live 时仅显示第一个状态指标</text>
    <rect x="88" y="1242" width="112" height="22" rx="11" fill="#EFF6FF" stroke="#DBEAFE"/><circle cx="99" cy="1253" r="3" fill="#2563EB"/><text x="109" y="1258" class="ui10" fill="#2563EB" font-weight="600">正在运行</text>
    <rect x="214" y="1242" width="112" height="22" rx="11" fill="#EFF6FF" stroke="#DBEAFE"/><circle cx="225" cy="1253" r="3" fill="#2563EB"/><text x="235" y="1258" class="ui10" fill="#2563EB" font-weight="600">正在输出</text>
    <rect x="340" y="1242" width="112" height="22" rx="11" fill="#EFF6FF" stroke="#DBEAFE"/><circle cx="351" cy="1253" r="3" fill="#2563EB"/><text x="361" y="1258" class="ui10" fill="#2563EB" font-weight="600">调用工具</text>
    <rect x="466" y="1242" width="112" height="22" rx="11" fill="#FFF7ED" stroke="#FFEDD5"/><circle cx="477" cy="1253" r="3" fill="#D97706"/><text x="487" y="1258" class="ui10" fill="#D97706" font-weight="600">等待确认</text>
    <rect x="592" y="1242" width="112" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="603" cy="1253" r="3" fill="#64748B"/><text x="613" y="1258" class="ui10" fill="#64748B" font-weight="600">已停止</text>
    <rect x="718" y="1242" width="112" height="22" rx="11" fill="#FEF2F2" stroke="#FEE2E2"/><circle cx="729" cy="1253" r="3" fill="#DC2626"/><text x="739" y="1258" class="ui10" fill="#DC2626" font-weight="600">任务失败</text>
    <text x="88" y="1292" class="note">运行/请求/输出/工具/子智能体使用蓝色；等待与压缩使用琥珀；排队/停止使用灰蓝；失败使用红色。</text>
    <line x1="88" y1="1314" x2="1512" y2="1314" stroke="#E8E6E3"/>
    <text x="88" y="1344" class="card-t">新线程与加载反馈</text>
    <rect x="88" y="1364" width="318" height="48" rx="8" fill="url(#heat)" stroke="#E8E6E3"/><rect x="164" y="1376" width="4" height="4" rx="1" fill="#F58A24"/><rect x="272" y="1388" width="4" height="4" rx="1" fill="#F58A24"/>
    <text x="88" y="1440" class="note">空时间线：活动卡 → 欢迎语；53 列 × 7 行。</text>
    <text x="560" y="1382" class="ui13">加载中：显示加载文案，隐藏活动卡。</text><text x="560" y="1410" class="ui13">错误：沿当前页状态区呈现，并提供可恢复操作。</text><text x="560" y="1438" class="ui13">历史分页：只加载需要的回合，已完成块保持稳定。</text>
    <text x="1120" y="1382" class="note">流式输出不逐字播报</text><text x="1120" y="1410" class="note">原始消息与复制内容完整保留</text><text x="1120" y="1438" class="note">降级展示不丢文本</text>
  </g>

  <g id="markdown-scroll">
    <rect x="64" y="1526" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1543" text-anchor="middle" class="chip">04</text><text x="104" y="1544" class="sect">Markdown 与滚动 · 展示可降级，行为不降级</text>
    <rect x="64" y="1568" width="724" height="212" rx="12" class="card"/><text x="88" y="1598" class="card-t">内容块</text><text x="88" y="1626" class="note">标题 22 / 19 / 17；正文 14；代码 Consolas 13。</text><text x="88" y="1652" class="note">代码与引用使用 accent-soft 局部底，保留复制原文。</text><text x="88" y="1678" class="note">表格单元格最小 150，内容区最大高 340。</text><text x="88" y="1704" class="note">图片、公式、复杂 HTML 可降级为文本、链接或占位。</text><text x="88" y="1736" class="tiny">长消息分块；历史限载与虚拟化；不重新解析整条长消息。</text>
    <rect x="812" y="1568" width="724" height="212" rx="12" class="card"/><text x="836" y="1598" class="card-t">滚动与跟随</text><text x="836" y="1626" class="note">用户位于底部时才自动跟随；过程列表阈值 −32px。</text><text x="836" y="1652" class="note">主动上滚 24px 解除跟随，回到底部后恢复。</text><text x="836" y="1678" class="note">回顶 / 回底为 30px 圆钮，半透明白底，悬停不透明。</text><text x="836" y="1704" class="note">滚动条可隐藏，但滚轮、触控板和键盘仍可用。</text><text x="836" y="1736" class="tiny">输入、选择、复制和滚动不得被流式任务阻塞。</text>
  </g>
  <g id="footer"><line x1="64" y1="1810" x2="1536" y2="1810" stroke="#D8D5D0"/><text x="64" y="1830" class="tiny">事实来源：timeline.slint · markdown.slint · tool_process.slint · activity_card.slint</text><text x="1536" y="1830" text-anchor="end" class="mono tiny">04 / 09 · 2026-10-31</text></g>
</svg>
