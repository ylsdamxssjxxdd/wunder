  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.sim{font-family:SimSun,serif}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.ui11{font-size:11px}.ui10{font-size:10px}.muted{fill:#8A8F99}.secondary{fill:#3D3D3D}</style>
  <rect width="1600" height="1900" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 蛹 · DESKTOP UI SPEC</text><text x="64" y="84" class="h1">07　输入区</text><text x="64" y="114" class="sub">编辑卡与动作行是两层结构；发送/停止只看右下角动作位，附件、分支和队列按实际内容增加高度。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 07 / 09</text><text x="1536" y="84" text-anchor="end" class="mono ui12">COMPOSER · ACTION LOGIC</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>

  <g id="composer-anatomy">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">结构 · 1000px 输入带，内容宽 972px</text><text x="1536" y="177" text-anchor="end" class="sect-note">8 + 100 + 6 + 30 + 10 = 154px</text>
    <rect x="64" y="202" width="1472" height="310" rx="12" class="card"/>
    <rect x="300" y="226" width="1000" height="154" fill="transparent"/>
    <rect x="314" y="234" width="972" height="100" rx="16" fill="#FFF" stroke="#F58A24"/>
    <text x="328" y="264" class="sim" font-size="14">请汇总这份记录，并给出结论。</text>
    <rect x="1190" y="242" width="82" height="22" rx="11" fill="#FBFAF8" stroke="#E8E6E3"/><circle cx="1200" cy="253" r="3" fill="#D04A43"/><text x="1208" y="258" class="ui10" fill="#D04A43">00:03</text>
    <rect x="314" y="343" width="24" height="24" rx="8" fill="#FFF" stroke="#D8D5D0"/><use href="#c-plus" x="318" y="347" width="16" height="16" color="#3D3D3D"/>
    <use href="#c-folder" x="358" y="349" width="12" height="12" color="#F58A24"/><text x="380" y="360" class="ui12 secondary">默认工作区</text>
    <use href="#c-brain" x="1138" y="341" width="16" height="16" color="#8A8F99"/><text x="1160" y="360" class="ui13" font-weight="600">标准模型</text><path d="m1240 351 4 4 4-4" fill="none" stroke="#8A8F99"/>
    <rect x="1258" y="341" width="28" height="28" rx="8" fill="#F58A24"/><use href="#c-arrow" x="1264" y="347" width="16" height="16" color="#FFF"/>
    <line x1="300" y1="402" x2="1300" y2="402" stroke="#E8E6E3" stroke-dasharray="4 4"/>
    <text x="300" y="430" class="tiny">外层 1000</text><text x="1300" y="430" text-anchor="end" class="tiny">左右各 14，发送与卡片右缘齐平</text>
    <text x="88" y="462" class="card-t">编辑卡</text><text x="88" y="488" class="note">100px · r16 · 14px SimSun</text>
    <text x="420" y="462" class="card-t">动作行</text><text x="420" y="488" class="note">30px；加号 24、发送 28</text>
    <text x="800" y="462" class="card-t">录音 / 转写</text><text x="800" y="488" class="note">22px 胶囊固定在编辑卡右上</text>
    <text x="1190" y="462" class="card-t">聚焦</text><text x="1190" y="488" class="note">1px accent，无外发光</text>
  </g>

  <g id="send-states">
    <rect x="64" y="546" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="563" text-anchor="middle" class="chip">02</text><text x="104" y="564" class="sect">动作状态 · 用组合场景判断发送还是停止</text><text x="1536" y="563" text-anchor="end" class="sect-note">send-enabled = 有内容且 !busy；stop-action = generating 且没有可发送内容</text>
    <rect x="64" y="588" width="474" height="164" rx="12" class="card"/><text x="86" y="616" class="chip">IDLE / EMPTY</text><text x="86" y="642" class="card-t">空闲 · 空草稿</text><rect x="86" y="660" width="428" height="42" rx="10" fill="#FFF" stroke="#E8E6E3"/><text x="100" y="687" class="sim" font-size="14" fill="#8A8F99">输入消息，开始新的对话…</text><rect x="472" y="667" width="28" height="28" rx="8" fill="#D8D5D0"/><use href="#c-arrow" x="478" y="673" width="16" height="16" color="#FFF"/><text x="86" y="730" class="note">发送停用：没有草稿、附件或问询答案。</text>
    <rect x="563" y="588" width="474" height="164" rx="12" class="card"/><text x="585" y="616" class="chip">IDLE / PAYLOAD</text><text x="585" y="642" class="card-t">空闲 · 有可发送内容</text><rect x="585" y="660" width="428" height="42" rx="10" fill="#FFF" stroke="#F58A24"/><text x="599" y="687" class="sim" font-size="14">继续补充一点</text><rect x="971" y="667" width="28" height="28" rx="8" fill="#F58A24"/><use href="#c-arrow" x="977" y="673" width="16" height="16" color="#FFF"/><text x="585" y="730" class="note">发送可用；hover 才切为 accent-deep。</text>
    <rect x="1062" y="588" width="474" height="164" rx="12" class="card"/><text x="1084" y="616" class="chip">GENERATING / EMPTY</text><text x="1084" y="642" class="card-t">生成中 · 空草稿</text><rect x="1084" y="660" width="428" height="42" rx="10" fill="#FFF" stroke="#E8E6E3"/><text x="1098" y="687" class="sim" font-size="14" fill="#8A8F99">可输入下一条并排队…</text><rect x="1470" y="667" width="28" height="28" rx="8" fill="#F58A24"/><use href="#c-stop" x="1478" y="675" width="12" height="12" color="#FFF"/><text x="1084" y="730" class="note">显示停止；12px 图像盒内含约 10.5px 方块。</text>
    <rect x="64" y="776" width="474" height="164" rx="12" class="card"/><text x="86" y="804" class="chip">GENERATING / PAYLOAD</text><text x="86" y="830" class="card-t">生成中 · 仍有草稿</text><rect x="86" y="848" width="428" height="42" rx="10" fill="#FFF" stroke="#F58A24"/><text x="100" y="875" class="sim" font-size="14">这条进入等待队列</text><rect x="472" y="855" width="28" height="28" rx="8" fill="#F58A24"/><use href="#c-arrow" x="478" y="861" width="16" height="16" color="#FFF"/><text x="86" y="918" class="note">仍显示发送，让下一轮进入队列，不覆盖为停止。</text>
    <rect x="563" y="776" width="474" height="164" rx="12" class="card"/><text x="585" y="804" class="chip">STOPPING</text><text x="585" y="830" class="card-t">正在停止</text><rect x="585" y="848" width="428" height="42" rx="10" fill="#FFF" stroke="#E8E6E3"/><text x="599" y="875" class="sim" font-size="14" fill="#8A8F99">正在停止当前回复…</text><rect x="971" y="855" width="28" height="28" rx="8" fill="#D8D5D0"/><use href="#c-stop" x="979" y="863" width="12" height="12" color="#FFF"/><text x="585" y="918" class="note">stopping=true：停止按钮变灰并禁止重复触发。</text>
    <rect x="1062" y="776" width="474" height="164" rx="12" class="card"/><text x="1084" y="804" class="chip">BUSY / LOADING</text><text x="1084" y="830" class="card-t">命令或线程加载中</text><rect x="1084" y="848" width="428" height="42" rx="10" fill="#FFF" stroke="#E8E6E3"/><text x="1098" y="875" class="sim" font-size="14">草稿仍保留，但暂时不能发送</text><rect x="1470" y="855" width="28" height="28" rx="8" fill="#D8D5D0"/><use href="#c-arrow" x="1476" y="861" width="16" height="16" color="#FFF"/><text x="1084" y="918" class="note">busy 只阻止发送；编辑器仍可读并保留草稿。</text>
  </g>

  <g id="attachments-queue">
    <rect x="64" y="974" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="991" text-anchor="middle" class="chip">03</text><text x="104" y="992" class="sect">附件与队列 · 位于编辑卡上方，按可见内容增高</text>
    <rect x="64" y="1016" width="724" height="340" rx="12" class="card"/><text x="88" y="1046" class="card-t">附件、分支与语音状态</text><text x="764" y="1046" text-anchor="end" class="tiny">附件 +36 · 分支 +22</text>
    <rect x="88" y="1068" width="220" height="28" rx="8" fill="#FDF0DE" stroke="#E8E6E3"/><text x="96" y="1087" class="ui11">outline.txt</text><use href="#c-x" x="282" y="1075" width="14" height="14" color="#8A8F99"/><rect x="322" y="1068" width="220" height="28" rx="8" fill="#FDF0DE" stroke="#E8E6E3"/><text x="330" y="1087" class="ui11">data.csv</text><use href="#c-x" x="516" y="1075" width="14" height="14" color="#8A8F99"/>
    <rect x="88" y="1108" width="676" height="70" rx="16" fill="#FFF" stroke="#E8E6E3"/><text x="102" y="1138" class="sim" font-size="14" fill="#8A8F99">附带文件后仍可继续输入…</text><rect x="570" y="1116" width="180" height="22" rx="11" fill="#FBFAF8" stroke="#E8E6E3"/><circle cx="582" cy="1127" r="3" fill="#D04A43"/><text x="591" y="1132" class="ui10" fill="#D04A43">正在录音 · 00:03</text>
    <text x="88" y="1204" class="note">附件 chip 固定 220×28；移除按钮 24×24。</text><text x="88" y="1230" class="note">录音与转写共用右上胶囊；转写时圆点和文字改 muted。</text><text x="88" y="1256" class="note">分支行 16px，仅 branch-name 非空时出现。</text><text x="88" y="1288" class="tiny">语音菜单独显示计时；转写期间禁止再次开始录音。</text><text x="88" y="1320" class="tiny">附件和问询答案都可独立满足“有可发送内容”。</text>

    <rect x="812" y="1016" width="724" height="340" rx="12" class="card"/><text x="836" y="1046" class="card-t">等待发送队列</text><text x="1512" y="1046" text-anchor="end" class="tiny">可见行由 Rust 有界投影</text>
    <rect x="836" y="1068" width="676" height="198" rx="12" fill="#FFF" stroke="#D8D5D0"/>
    <text x="860" y="1090" class="ui10 muted" font-weight="700">等待发送　3+</text><text x="1498" y="1090" text-anchor="end" class="ui10" fill="#D8D5D0">拖动把手调整顺序</text>
    <rect x="846" y="1100" width="656" height="28" rx="8" fill="#F8FAFC"/><text x="858" y="1119" class="ui12">⠿　先补充结论。</text><rect x="1348" y="1102" width="76" height="24" rx="6" fill="#FFF" stroke="#D8D5D0"/><text x="1386" y="1118" text-anchor="middle" class="ui11">插话</text><text x="1488" y="1119" text-anchor="end" class="ui13 muted">✎　▧</text>
    <rect x="846" y="1132" width="656" height="2" rx="1" fill="#F58A24"/>
    <rect x="846" y="1138" width="656" height="28" rx="8" fill="#FDF0DE"/><text x="858" y="1157" class="ui12">⠿　再附一份摘要。</text><rect x="1348" y="1140" width="76" height="24" rx="6" fill="#FFF" stroke="#E8E6E3"/><text x="1386" y="1156" text-anchor="middle" class="ui11 muted">已插话</text><text x="1488" y="1157" text-anchor="end" class="ui13 muted">✎　▧</text>
    <rect x="846" y="1170" width="656" height="28" rx="8" fill="transparent"/><text x="858" y="1189" class="ui12">⠿　最后检查遗漏。</text><rect x="1348" y="1172" width="76" height="24" rx="6" fill="#FFF" stroke="#D8D5D0"/><text x="1386" y="1188" text-anchor="middle" class="ui11">插话</text><text x="1488" y="1189" text-anchor="end" class="ui13 muted">✎　▧</text>
    <text x="860" y="1222" class="ui10 muted">还有 2 条未显示</text>
    <text x="836" y="1294" class="note">行 28px；拖拽中 accent-soft；落点为 2px accent。</text><text x="836" y="1320" class="note">插话、编辑、删除属于队列项；发送后立即从投影移除。</text><text x="836" y="1344" class="tiny">队列高度含 20px 表头、2px 间距与可选 16px 溢出提示。</text>
  </g>

  <g id="menus-model">
    <rect x="64" y="1390" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1407" text-anchor="middle" class="chip">04</text><text x="104" y="1408" class="sect">菜单与模型 · 每个弹层只属于一个触发器</text><text x="1536" y="1407" text-anchor="end" class="sect-note">加号菜单 220 · 级联 268 · 模型弹层 300×340</text>
    <rect x="64" y="1432" width="474" height="404" rx="12" class="card"/><text x="86" y="1462" class="card-t">加号菜单 · 6 项</text>
    <rect x="86" y="1484" width="220" height="234" rx="12" fill="#FFF" stroke="#E8E6E3"/><text x="102" y="1513" class="ui13">⌘　命令　　　　　　　　　　›</text><rect x="94" y="1524" width="204" height="34" rx="8" fill="#F6F5F3"/><text x="110" y="1547" class="ui13">✦　预设问题　　　　　　　　›</text><text x="102" y="1581" class="ui13">♢　审批模式　　　　　全权限　›</text><text x="102" y="1615" class="ui13">♩　语音输入</text><text x="102" y="1649" class="ui13">▣　截图　　　　　　　　　　›</text><text x="102" y="1683" class="ui13">▤　打开舵机</text>
    <text x="86" y="1748" class="note">菜单打开时加号变为 xmark。</text><text x="86" y="1774" class="note">命令、预设、审批和截图可级联。</text><text x="86" y="1806" class="tiny">仅输入“/”且菜单关闭时，直接显示命令浮层。</text>

    <rect x="563" y="1432" width="474" height="404" rx="12" class="card"/><text x="585" y="1462" class="card-t">级联与弹层边界</text>
    <rect x="585" y="1484" width="268" height="174" rx="10" fill="#FFF" stroke="#E8E6E3"/><text x="601" y="1512" class="ui12" font-weight="600">审批模式</text><rect x="593" y="1522" width="252" height="30" rx="7" fill="#FDF0DE"/><text x="605" y="1542" class="ui12" fill="#E07A12">全权限　✓</text><text x="601" y="1578" class="ui12">允许编辑</text><text x="601" y="1612" class="ui12">仅建议</text><text x="601" y="1644" class="tiny">当前模式在菜单行右侧保留摘要</text>
    <text x="585" y="1690" class="note">级联从所属行右侧展开，宽 268。</text><text x="585" y="1716" class="note">同一时刻只保留一个加号子菜单。</text><text x="585" y="1742" class="note">模型与加号菜单互斥，外部点击关闭。</text><text x="585" y="1774" class="tiny">弹层向上展开，避免被输入带底边裁切。</text><text x="585" y="1806" class="tiny">z=30；不需要全窗遮罩。</text>

    <rect x="1062" y="1432" width="474" height="404" rx="12" class="card"/><text x="1084" y="1462" class="card-t">模型选择 · 300×340</text>
    <rect x="1084" y="1484" width="300" height="340" rx="12" fill="#FFF" stroke="#E8E6E3"/>
    <text x="1096" y="1508" class="ui11 muted" font-weight="600">上下文占用</text><text x="1372" y="1508" text-anchor="end" class="ui11 secondary">12.3k / 32k · 38%</text><line x1="1092" y1="1520" x2="1376" y2="1520" stroke="#E8E6E3"/>
    <rect x="1092" y="1530" width="284" height="40" rx="8" fill="#F6F5F3"/><text x="1100" y="1548" class="ui13" fill="#F58A24">✓</text><text x="1124" y="1548" class="ui13" fill="#F58A24" font-weight="600">标准模型</text><text x="1124" y="1564" class="ui10 muted">local · llm</text><rect x="1324" y="1542" width="40" height="16" rx="8" fill="#FDF0DE"/><text x="1344" y="1554" text-anchor="middle" class="ui10" fill="#F58A24">默认</text>
    <text x="1100" y="1594" class="ui13" font-weight="600">云端模型</text><text x="1100" y="1612" class="ui10 muted">cloud · 需要登录</text>
    <text x="1100" y="1640" class="ui13" font-weight="600">快速模型</text><text x="1100" y="1658" class="ui10 muted">local · llm</text>
