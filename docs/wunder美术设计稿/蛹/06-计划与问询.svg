<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1880" viewBox="0 0 1600 1880" role="img" aria-label="蛹 桌面端计划目标与问询规范">
  <title>06 计划与问询 · 蛹 Desktop UI Spec</title>
  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.ui11{font-size:11px}.muted{fill:#8A8F99}.secondary{fill:#3D3D3D}</style>
  <rect width="1600" height="1880" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 蛹 · DESKTOP UI SPEC</text><text x="64" y="84" class="h1">06　计划与问询</text><text x="64" y="114" class="sub">计划、目标和问询都位于输入带，不是时间线里的装饰卡；运行时拥有状态，前端只呈现并回传操作。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 06 / 09</text><text x="1536" y="84" text-anchor="end" class="mono ui12">PLAN · GOAL · INQUIRY</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>

  <g id="placement">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">位置关系 · 共用阅读列，按职责垂直堆叠</text><text x="1536" y="177" text-anchor="end" class="sect-note">StatusDock → GoalBanner → InquiryPanel → Composer</text>
    <rect x="64" y="202" width="1472" height="202" rx="12" class="card"/>
    <rect x="88" y="226" width="1424" height="34" rx="8" fill="#FBFAF8"/><text x="102" y="248" class="ui12 muted">时间线 · 保留阅读与滚动</text>
    <rect x="1236" y="268" width="260" height="26" rx="13" fill="#FFF" stroke="#D8D5D0"/><circle cx="1254" cy="281" r="5" fill="none" stroke="#F58A24" stroke-dasharray="22 9"/><text x="1268" y="286" class="ui12 secondary">计划　汇总要点　2 / 4　⌃</text><text x="88" y="286" class="note">计划胶囊右对齐；展开卡向上覆盖时间线，z=30，无遮罩。</text>
    <rect x="88" y="306" width="680" height="42" rx="12" fill="#FDF1F6" stroke="#EFC6D7"/><text x="104" y="333" class="ui13" font-weight="700" fill="#9D2B5C">目标</text><text x="144" y="333" class="ui12" fill="#B8557F">第 2 轮</text><text x="202" y="333" class="ui13" fill="#7A2949">目标横幅仅在目标可见时出现</text>
    <rect x="792" y="306" width="704" height="42" rx="12" fill="#FFF" stroke="#E8E6E3"/><text x="808" y="333" class="ui13" font-weight="600">问询面板 · 等待用户选择</text>
    <rect x="88" y="360" width="1408" height="28" rx="8" fill="#FFF" stroke="#E8E6E3"/><text x="102" y="379" class="ui12 muted">输入区 · 答案与草稿共用发送入口</text>
  </g>

  <g id="plan">
    <rect x="64" y="438" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="455" text-anchor="middle" class="chip">02</text><text x="104" y="456" class="sect">计划 · 胶囊承载进度，展开卡只呈现说明与步骤</text>
    <rect x="64" y="480" width="724" height="388" rx="12" class="card"/><text x="88" y="510" class="card-t">展开实态</text><text x="764" y="510" text-anchor="end" class="tiny">宽 min(560, 容器) · 最大高 360</text>
    <rect x="190" y="528" width="232" height="26" rx="13" fill="#FFF" stroke="#D8D5D0"/><circle cx="206" cy="541" r="5" fill="none" stroke="#F58A24" stroke-dasharray="22 9"/><text x="220" y="546" class="ui12 secondary">计划　汇总要点　2 / 4　⌄</text>
    <rect x="88" y="566" width="560" height="270" rx="14" fill="#FFF" stroke="#E8E6E3"/>
    <rect x="610" y="574" width="22" height="22" rx="6" fill="transparent"/><path d="m616 580 10 10m0-10-10 10" stroke="#6B7280" stroke-width="1.6"/>
    <text x="106" y="594" class="ui12" fill="#6B7280">先梳理资料结构，再逐段汇总；完成后统一校验。</text><text x="106" y="616" class="ui12" fill="#6B7280">说明最多两行，右上方不叠加标题或计数。</text>
    <circle cx="116" cy="646" r="9" fill="none" stroke="#1A8A5C" stroke-width="1.6"/><path d="m111 646 4 4 7-8" fill="none" stroke="#1A8A5C" stroke-width="1.6"/><text x="136" y="652" class="ui14" fill="#3F3F46">收集资料</text>
    <circle cx="116" cy="676" r="9" fill="none" stroke="#C98A2B" stroke-width="1.6"/><path d="M113 672v8m6-8v8" stroke="#C98A2B" stroke-width="1.7"/><text x="136" y="682" class="ui14" font-weight="600">汇总要点</text>
    <rect x="104" y="692" width="528" height="30" rx="8" fill="#0F172A0A"/><circle cx="116" cy="707" r="9" fill="none" stroke="#B6BCC6" stroke-width="1.6"/><text x="136" y="713" class="ui14" fill="#3F3F46">校验遗漏</text><text x="620" y="713" text-anchor="end" class="tiny">悬停</text>
    <circle cx="116" cy="737" r="9" fill="none" stroke="#B6BCC6" stroke-width="1.6"/><text x="136" y="743" class="ui14" fill="#3F3F46">输出结果</text>
    <text x="88" y="856" class="tiny">关闭只折叠卡片；计划仍保留在线程与缓存中，直到后续投影更新。</text>

    <rect x="812" y="480" width="724" height="388" rx="12" class="card"/><text x="836" y="510" class="card-t">步骤状态与规格</text><text x="1512" y="510" text-anchor="end" class="tiny">status 驱动，不靠颜色猜测</text>
    <circle cx="848" cy="548" r="9" fill="none" stroke="#1A8A5C" stroke-width="1.6"/><path d="m843 548 4 4 7-8" fill="none" stroke="#1A8A5C" stroke-width="1.6"/><text x="872" y="554" class="ui13">completed · 已完成</text><text x="1250" y="554" class="note">success 环 + 10px 对勾</text>
    <circle cx="848" cy="588" r="9" fill="none" stroke="#C98A2B" stroke-width="1.6"/><path d="M845 584v8m6-8v8" stroke="#C98A2B" stroke-width="1.7"/><text x="872" y="594" class="ui13">in_progress · 进行中</text><text x="1250" y="594" class="note">warning 环 + 8px 双条</text>
    <circle cx="848" cy="628" r="9" fill="none" stroke="#B6BCC6" stroke-width="1.6"/><text x="872" y="634" class="ui13">pending · 待开始</text><text x="1250" y="634" class="note">灰环，无内部图标</text>
    <rect x="836" y="652" width="676" height="30" rx="8" fill="#0F172A0A"/><text x="852" y="672" class="ui13">步骤行悬停</text><text x="1250" y="672" class="note">#0F172A0A · 30px 行高不变</text>
    <line x1="836" y1="706" x2="1512" y2="706" stroke="#E8E6E3"/>
    <text x="836" y="734" class="note">胶囊：26px 高，右对齐；运行中才显示六点转圈。</text><text x="836" y="760" class="note">展开卡：14px 圆角，说明最多两行，步骤超出内滚。</text><text x="836" y="786" class="note">关闭按钮 22×22；悬停灰底，图标转 danger。</text><text x="836" y="818" class="tiny">步骤圆 18 / 描边 1.6；步骤文字 14；计划工具最多 12 步。</text><text x="836" y="844" class="tiny">只有计划工具发布步骤后，StatusDock 才出现。</text>
  </g>

  <g id="goal">
    <rect x="64" y="902" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="919" text-anchor="middle" class="chip">03</text><text x="104" y="920" class="sect">目标 · 42px 横幅与行内编辑</text><text x="1536" y="919" text-anchor="end" class="sect-note">按钮真实顺序：编辑 → 暂停/恢复 → 清除</text>
    <rect x="64" y="944" width="1472" height="282" rx="12" class="card"/>
    <text x="88" y="974" class="tiny">运行</text><rect x="170" y="954" width="1342" height="42" rx="12" fill="#FDF1F6" stroke="#EFC6D7"/><text x="186" y="981" class="ui13" font-weight="700" fill="#9D2B5C">◎ 目标</text><text x="248" y="981" class="ui12" fill="#B8557F">· 第 2 轮</text><text x="322" y="981" class="ui13" fill="#7A2949">整理本轮资料，输出一份可复核的结论。</text><text x="1490" y="981" text-anchor="end" class="ui12" fill="#7D858F">✎　Ⅱ　▧</text>
    <text x="88" y="1024" class="tiny">暂停</text><rect x="170" y="1004" width="1342" height="42" rx="12" fill="#FDF1F6" stroke="#EFC6D7"/><text x="186" y="1031" class="ui13" font-weight="700" fill="#9D2B5C">◎ 目标</text><text x="248" y="1031" class="ui12" fill="#C98A2B" font-weight="700">· 已暂停</text><text x="336" y="1031" class="ui13" fill="#7A2949">当前目标暂停，恢复后继续下一轮。</text><text x="1490" y="1031" text-anchor="end" class="ui12" fill="#7D858F">✎　↻　▧</text>
    <text x="88" y="1074" class="tiny">阻塞</text><rect x="170" y="1054" width="1342" height="42" rx="12" fill="#FDF1F6" stroke="#EFC6D7"/><text x="186" y="1081" class="ui13" font-weight="700" fill="#9D2B5C">◎ 目标</text><text x="248" y="1081" class="ui12" fill="#D04A43" font-weight="700">· 阻塞</text><text x="320" y="1081" class="ui13" fill="#7A2949">等待外部条件，恢复动作仍可使用。</text><text x="1490" y="1081" text-anchor="end" class="ui12" fill="#7D858F">✎　↻　▧</text>
    <text x="88" y="1124" class="tiny">编辑</text><rect x="170" y="1104" width="1342" height="42" rx="12" fill="#FDF1F6" stroke="#EFC6D7"/><text x="186" y="1131" class="ui13" fill="#D04A43">◎</text><rect x="214" y="1112" width="1120" height="26" rx="4" fill="#FFF" stroke="#D04A43"/><text x="224" y="1131" class="ui13">整理本轮资料，输出一份可复核的结论。</text><text x="1490" y="1131" text-anchor="end" class="ui11" fill="#D04A43" opacity=".6">Enter 保存</text>
    <text x="88" y="1174" class="note">底 #FDF1F6 / 边 #EFC6D7；正文 #7A2949；轮次 #B8557F；暂停 warning，阻塞 danger。</text><text x="88" y="1200" class="tiny">三个 GoalTool 均 26×26；编辑直接换成 TextInput，空内容取消编辑，不删除目标；elapsed 字段当前不渲染。</text>
  </g>

  <g id="inquiry">
    <rect x="64" y="1260" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1277" text-anchor="middle" class="chip">04</text><text x="104" y="1278" class="sect">问询 · 选项、其他与无偏好共用一张面板</text><text x="1536" y="1277" text-anchor="end" class="sect-note">无独立提交 / 跳过按钮；由 Composer 发送答案</text>
    <rect x="64" y="1302" width="1000" height="416" rx="14" fill="#FFF" stroke="#D8D5D0"/>
    <text x="88" y="1336" font-size="15" font-weight="700">这轮希望优先处理哪一部分？</text><rect x="908" y="1316" width="24" height="24" rx="6" fill="#F6F5F3"/><text x="920" y="1333" text-anchor="middle" class="ui12 muted">‹</text><text x="958" y="1333" text-anchor="middle" class="ui12 secondary">1 / 3</text><rect x="984" y="1316" width="24" height="24" rx="6" fill="#F6F5F3"/><text x="996" y="1333" text-anchor="middle" class="ui12 muted">›</text><rect x="1020" y="1316" width="24" height="24" rx="6" fill="#F6F5F3"/><text x="1032" y="1333" text-anchor="middle" class="ui12 muted">□</text>
    <rect x="88" y="1356" width="952" height="34" rx="8" fill="#F8FAFC"/><rect x="100" y="1364" width="18" height="18" rx="9" fill="#F58A24"/><path d="m104 1373 4 4 7-8" fill="none" stroke="#FFF" stroke-width="1.5"/><text x="130" y="1378" class="ui14" fill="#E07A12" font-weight="600">先汇总现有资料</text><rect x="280" y="1364" width="52" height="18" rx="9" fill="#0F172A12"/><text x="306" y="1377" text-anchor="middle" class="ui11" fill="#6B7280">推荐</text><text x="346" y="1378" class="ui13" fill="#6B7280">基于已收集的材料给出结论，不继续检索。</text>
    <rect x="88" y="1394" width="952" height="34" rx="8" fill="#0F172A0A"/><rect x="100" y="1402" width="18" height="18" rx="9" fill="#FFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="130" y="1416" class="ui14" font-weight="600">先补全缺失资料</text><text x="280" y="1416" class="ui13" fill="#6B7280">标记缺口并继续检索，耗时更长。</text><text x="1022" y="1416" text-anchor="end" class="tiny">悬停</text>
    <rect x="88" y="1432" width="952" height="34" rx="8" fill="transparent"/><rect x="100" y="1440" width="18" height="18" rx="9" fill="#FFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="130" y="1454" class="ui14" font-weight="600">先输出一版简版</text><text x="280" y="1454" class="ui13" fill="#6B7280">先给结论，再按反馈补充细节。</text>
    <rect x="88" y="1474" width="952" height="34" rx="8" fill="transparent"/><rect x="100" y="1482" width="18" height="18" rx="9" fill="#FFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="130" y="1496" class="ui13" fill="#9CA3AF">输入其他答案</text><line x1="130" y1="1502" x2="760" y2="1502" stroke="#D1D5DB"/><rect x="888" y="1478" width="128" height="26" rx="9" fill="#FDF0DE"/><text x="900" y="1496" class="ui13" fill="#E07A12" font-weight="600">无偏好</text><line x1="976" y1="1482" x2="976" y2="1500" stroke="#E8E6E3"/><text x="996" y="1496" class="ui12 muted">⌄</text>
    <line x1="88" y1="1520" x2="1040" y2="1520" stroke="#E8E6E3"/><text x="88" y="1548" class="ui12 muted">选好答案后按输入区发送键提交</text><text x="88" y="1576" class="note">当前页有答案时，空草稿也能发送；纯选项即可组成消息。</text><text x="88" y="1610" class="tiny">外高 = 10 + 卡高 + 12；卡宽随阅读列，内边距 18 / 14 / 14 / 12。</text><text x="88" y="1640" class="tiny">展开后标题变为“全部问题”，每题显示进度；单页选项间不画分隔线。</text><text x="88" y="1670" class="tiny">页码按钮 24×24；边界禁用仅变灰，不展示不存在的通用禁用选项。</text>

    <rect x="1088" y="1302" width="448" height="416" rx="12" class="card"/><text x="1112" y="1332" class="card-t">选项状态</text><text x="1112" y="1364" class="tiny">默认 / 悬停</text><rect x="1230" y="1344" width="282" height="34" rx="8" fill="#0F172A0A"/><rect x="1242" y="1352" width="18" height="18" rx="9" fill="#FFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="1272" y="1366" class="ui13">未选选项</text>
    <text x="1112" y="1410" class="tiny">单选已选</text><rect x="1230" y="1390" width="282" height="34" rx="8" fill="transparent"/><rect x="1242" y="1398" width="18" height="18" rx="9" fill="#F58A24"/><path d="m1246 1407 4 4 7-8" fill="none" stroke="#FFF" stroke-width="1.4"/><text x="1272" y="1412" class="ui13" fill="#E07A12" font-weight="600">圆形标记</text>
    <text x="1112" y="1456" class="tiny">多选已选</text><rect x="1230" y="1436" width="282" height="34" rx="8" fill="transparent"/><rect x="1242" y="1444" width="18" height="18" rx="5" fill="#F58A24"/><path d="m1246 1453 4 4 7-8" fill="none" stroke="#FFF" stroke-width="1.4"/><text x="1272" y="1458" class="ui13" fill="#E07A12" font-weight="600">圆角方形 r5</text>
    <line x1="1112" y1="1492" x2="1512" y2="1492" stroke="#E8E6E3"/>
    <text x="1112" y="1520" class="card-t">行为约束</text><text x="1112" y="1548" class="note">推荐徽与选中态独立。</text><text x="1112" y="1574" class="note">“其他”为下划线输入，不是弹窗。</text><text x="1112" y="1600" class="note">无偏好菜单 132 宽，含“使用推荐”。</text><text x="1112" y="1626" class="note">选项行 34，标记 18，标签最大 220。</text><text x="1112" y="1658" class="tiny">选中 accent + 白勾；文本 accent-deep。</text><text x="1112" y="1684" class="tiny">所有选择由 Rust 重新投影，前端不持有第二份答案。</text>
  </g>

  <g id="state-boundary"><rect x="64" y="1752" width="1472" height="76" rx="12" class="card"/><text x="88" y="1782" class="card-t">状态边界</text><text x="190" y="1782" class="note">展开/折叠是本地视图状态；计划步骤、目标阶段、问询答案是运行时状态。</text><text x="88" y="1808" class="tiny">问询面板不遮挡输入区；计划卡可以向上覆盖时间线，但不需要全窗遮罩。</text><text x="1512" y="1808" text-anchor="end" class="tiny">不要在静态规范中虚构“禁用全部选项”或额外提交按钮</text></g>
  <g id="footer"><line x1="64" y1="1850" x2="1536" y2="1850" stroke="#D8D5D0"/><text x="64" y="1870" class="tiny">事实来源：composer.slint 的 StatusDock / GoalBanner / InquiryPanel · main.slint 输入带堆叠</text><text x="1536" y="1870" text-anchor="end" class="mono tiny">06 / 09 · 2026-10-25</text></g>
</svg>
