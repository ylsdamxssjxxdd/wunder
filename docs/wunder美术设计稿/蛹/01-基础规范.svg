<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" role="img" aria-label="蛹 桌面端基础设计规范">
  <title>01 基础规范 · 蛹 Desktop UI Spec</title>
  <style>
    svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.tok{font-size:11px;fill:#3D3D3D}.hex{font-size:10px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.ui11{font-size:11px}
  </style>
  <rect width="1600" height="1760" fill="#F5F3EF"/>
  <g id="header">
    <text x="64" y="42" class="kicker">WUNDER / 蛹 · DESKTOP UI SPEC</text><text x="64" y="84" class="h1">01　基础规范</text>
    <text x="64" y="114" class="sub">设计稿自身的网格与产品 token 分开管理；产品颜色、字号和尺寸以 Theme 为唯一事实来源。</text>
    <text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 01 / 09</text><text x="1536" y="84" text-anchor="end" class="mono ui12">TOKENS · TYPE · METRICS</text>
    <line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/>
  </g>

  <g id="color-system">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">色彩系统</text><text x="1536" y="177" text-anchor="end" class="sect-note">中性色不随强调色切换；语义色只表达状态</text>
    <rect x="64" y="204" width="900" height="500" rx="12" class="card"/>
    <text x="88" y="234" class="card-t">中性色 · 文字、表面与行状态</text><text x="940" y="234" text-anchor="end" class="tiny">Theme.text → activity-off</text>
    <line x1="88" y1="250" x2="940" y2="250" stroke="#E8E6E3"/>
    <g>
      <rect x="88" y="272" width="190" height="46" rx="6" fill="#1F2329"/><text x="88" y="338" class="mono tok">text</text><text x="88" y="356" class="mono hex">#1F2329</text>
      <rect x="296" y="272" width="190" height="46" rx="6" fill="#3D3D3D"/><text x="296" y="338" class="mono tok">text-secondary</text><text x="296" y="356" class="mono hex">#3D3D3D</text>
      <rect x="504" y="272" width="190" height="46" rx="6" fill="#8A8F99"/><text x="504" y="338" class="mono tok">muted</text><text x="504" y="356" class="mono hex">#8A8F99</text>
      <rect x="712" y="272" width="190" height="46" rx="6" fill="#FBFAF8" stroke="#E8E6E3"/><text x="712" y="338" class="mono tok">panel</text><text x="712" y="356" class="mono hex">#FBFAF8</text>
      <rect x="88" y="378" width="190" height="46" rx="6" fill="#FFF" stroke="#E8E6E3"/><text x="88" y="444" class="mono tok">surface</text><text x="88" y="462" class="mono hex">#FFFFFF</text>
      <rect x="296" y="378" width="190" height="46" rx="6" fill="#E8E6E3"/><text x="296" y="444" class="mono tok">border</text><text x="296" y="462" class="mono hex">#E8E6E3</text>
      <rect x="504" y="378" width="190" height="46" rx="6" fill="#D8D5D0"/><text x="504" y="444" class="mono tok">border-strong</text><text x="504" y="462" class="mono hex">#D8D5D0</text>
      <rect x="712" y="378" width="190" height="46" rx="6" fill="#F6F5F3"/><text x="712" y="444" class="mono tok">hover / sidebar</text><text x="712" y="462" class="mono hex">#F6F5F3</text>
      <rect x="88" y="484" width="190" height="46" rx="6" fill="#F1EFEC"/><text x="88" y="550" class="mono tok">selected</text><text x="88" y="568" class="mono hex">#F1EFEC</text>
      <rect x="296" y="484" width="190" height="46" rx="6" fill="#F3F2F0"/><text x="296" y="550" class="mono tok">timeline-bubble</text><text x="296" y="568" class="mono hex">#F3F2F0</text>
      <rect x="504" y="484" width="190" height="46" rx="6" fill="#E2DFDA"/><text x="504" y="550" class="mono tok">timeline-line</text><text x="504" y="568" class="mono hex">#E2DFDA</text>
      <rect x="712" y="484" width="190" height="46" rx="6" fill="#9BA0A8"/><text x="712" y="550" class="mono tok">timeline-entry-soft</text><text x="712" y="568" class="mono hex">#9BA0A8</text>
    </g>
    <rect x="88" y="604" width="14" height="14" rx="3" fill="#E9E8E5"/><text x="112" y="616" class="mono tiny">activity-off #E9E8E5</text>
    <rect x="328" y="604" width="14" height="14" rx="3" fill="#F5F4F2"/><text x="352" y="616" class="mono tiny">diff-header #F5F4F2</text>
    <rect x="590" y="604" width="14" height="14" rx="3" fill="#F6F5F3" stroke="#D8D5D0"/><text x="614" y="616" class="mono tiny">input-readonly-bg = hover</text>
    <rect x="88" y="630" width="14" height="14" rx="3" fill="#B9B2A7"/><text x="112" y="642" class="mono tiny">window-frame #B9B2A7 · 窗口四边各 1px</text>
    <text x="88" y="668" class="note">输入：默认可写白底 + border-strong；只读/停用才降为 hover 灰底。</text>
    <text x="88" y="692" class="tiny">bubble = #FFFFFF；middle = sidebar；chat = panel；overlay = #00000040。</text>

    <rect x="988" y="204" width="548" height="500" rx="12" class="card"/>
    <text x="1012" y="234" class="card-t">强调色族 · 默认橙汁</text><text x="1512" y="234" text-anchor="end" class="tiny">palette = terracotta</text>
    <line x1="1012" y1="250" x2="1512" y2="250" stroke="#E8E6E3"/>
    <rect x="1012" y="272" width="240" height="86" rx="8" fill="#F58A24"/><text x="1030" y="324" font-size="16" font-weight="700" fill="#FFF">accent</text><text x="1012" y="380" class="mono tok">#F58A24</text>
    <rect x="1272" y="272" width="240" height="86" rx="8" fill="#E07A12"/><text x="1290" y="324" font-size="16" font-weight="700" fill="#FFF">accent-deep</text><text x="1272" y="380" class="mono tok">#E07A12</text>
    <rect x="1012" y="404" width="240" height="58" rx="8" fill="#FFC98A"/><text x="1030" y="439" class="ui12">accent-secondary</text><text x="1012" y="484" class="mono tok">#FFC98A</text>
    <rect x="1272" y="404" width="240" height="58" rx="8" fill="#FDF0DE" stroke="#EFDFC4"/><text x="1290" y="439" class="ui12">accent-soft / mine</text><text x="1272" y="484" class="mono tok">#FDF0DE</text>
    <text x="1012" y="526" class="card-t">可切换色族</text><text x="1012" y="548" class="tiny">设置页展示前四项，后两项为保留项</text>
    <g><rect x="1012" y="566" width="72" height="34" rx="6" fill="#F58A24"/><rect x="1096" y="566" width="72" height="34" rx="6" fill="#16AD8D"/><rect x="1180" y="566" width="72" height="34" rx="6" fill="#2F7A5C"/><rect x="1264" y="566" width="72" height="34" rx="6" fill="#C08A2A"/><rect x="1348" y="566" width="72" height="34" rx="6" fill="#8F9AAD"/><rect x="1432" y="566" width="80" height="34" rx="6" fill="#38BDF8"/></g>
    <text x="1012" y="622" class="mono tiny">terracotta</text><text x="1096" y="622" class="mono tiny">hula-green</text><text x="1180" y="622" class="mono tiny">forest</text><text x="1264" y="622" class="mono tiny">honey</text><text x="1348" y="622" class="mono tiny">minimal</text><text x="1432" y="622" class="mono tiny">tech-blue</text>
    <text x="1012" y="640" class="mono hex">#F58A24</text><text x="1096" y="640" class="mono hex">#107D66</text><text x="1180" y="640" class="mono hex">#2F7A5C</text><text x="1264" y="640" class="mono hex">#8E661F</text><text x="1348" y="640" class="mono hex">#637087</text><text x="1432" y="640" class="mono hex">#0B77A7</text><text x="1512" y="640" text-anchor="end" class="mono tiny">ink</text>
    <text x="1012" y="660" class="note">主按钮 accent，悬停 accent-deep；accent 底上的文字用白。</text>
    <text x="1012" y="682" class="tiny">浅底强调文字/图标用 accent-ink（AA 前景档，与蜂巢 base.css 同步）；焦点 1px 无外发光。</text>
  </g>

  <g id="semantic-colors">
    <rect x="64" y="738" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="755" text-anchor="middle" class="chip">02</text><text x="104" y="756" class="sect">语义色 · 状态必须同时有文字或图形</text>
    <rect x="64" y="780" width="1472" height="196" rx="12" class="card"/>
    <g><rect x="88" y="804" width="160" height="34" rx="6" fill="#1A8A5C"/><rect x="264" y="804" width="160" height="34" rx="6" fill="#EAF7F0"/><rect x="440" y="804" width="160" height="34" rx="6" fill="#C98A2B"/><rect x="616" y="804" width="160" height="34" rx="6" fill="#FBEAE5"/><rect x="792" y="804" width="160" height="34" rx="6" fill="#D04A43"/><rect x="968" y="804" width="160" height="34" rx="6" fill="#FDECEC"/><rect x="1144" y="804" width="160" height="34" rx="6" fill="#3B82F6"/><rect x="1320" y="804" width="160" height="34" rx="6" fill="#3E9C7E"/></g>
    <g class="mono tok"><text x="88" y="858">success</text><text x="264" y="858">success-bg</text><text x="440" y="858">warning</text><text x="616" y="858">warning-bg</text><text x="792" y="858">danger</text><text x="968" y="858">danger-bg</text><text x="1144" y="858">info</text><text x="1320" y="858">thought</text></g>
    <g class="mono hex"><text x="88" y="876">#1A8A5C</text><text x="264" y="876">#EAF7F0</text><text x="440" y="876">#C98A2B</text><text x="616" y="876">#FBEAE5</text><text x="792" y="876">#D04A43</text><text x="968" y="876">#FDECEC</text><text x="1144" y="876">#3B82F6</text><text x="1320" y="876">#3E9C7E</text></g>
    <line x1="88" y1="898" x2="1512" y2="898" stroke="#E8E6E3"/>
    <text x="88" y="926" class="note">差异：add #EAF7F0 / #14532D　·　delete #FDECEC / #7F1D1D</text>
    <text x="1512" y="926" text-anchor="end" class="note">状态胶囊另用时间线局部色，见分页 04；不要反推为全局 token。</text>
    <text x="88" y="954" class="tiny">warning-bg 当前偏粉；颜色只承载语义，不替代“运行中 / 失败 / 等待确认”等文本。</text>
  </g>

  <g id="type-and-metrics">
    <rect x="64" y="1010" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1027" text-anchor="middle" class="chip">03</text><text x="104" y="1028" class="sect">字体、间距与圆角</text><text x="1536" y="1027" text-anchor="end" class="sect-note">产品字阶乘 font-scale；稿面说明文字不跟随缩放</text>
    <rect x="64" y="1052" width="724" height="386" rx="12" class="card"/>
    <text x="88" y="1082" class="card-t">产品字阶</text><text x="764" y="1082" text-anchor="end" class="mono tiny">font-scale = 1.0</text><line x1="88" y1="1098" x2="764" y2="1098" stroke="#E8E6E3"/>
    <text x="88" y="1134" font-size="24" font-weight="600">页面展示</text><text x="340" y="1134" class="mono tok">font-display</text><text x="560" y="1134" class="mono hex">24px</text>
    <text x="88" y="1172" font-size="18" font-weight="700">卡片标题</text><text x="340" y="1172" class="mono tok">font-headline</text><text x="560" y="1172" class="mono hex">18px</text>
    <text x="88" y="1210" font-size="16" font-weight="600">弹窗标题</text><text x="340" y="1210" class="mono tok">font-xl</text><text x="560" y="1210" class="mono hex">16px</text>
    <text x="88" y="1248" class="ui14">会话正文与输入</text><text x="340" y="1248" class="mono tok">font-lg</text><text x="560" y="1248" class="mono hex">14px</text>
    <text x="88" y="1286" class="ui13">控件、列表与过程</text><text x="340" y="1286" class="mono tok">font-md</text><text x="560" y="1286" class="mono hex">13px</text>
    <text x="88" y="1324" class="ui12">辅助说明与菜单</text><text x="340" y="1324" class="mono tok">font-sm</text><text x="560" y="1324" class="mono hex">12px</text>
    <text x="88" y="1362" class="ui11">指标与次级标签</text><text x="340" y="1362" class="mono tok">font-xs / 2xs</text><text x="560" y="1362" class="mono hex">11 / 10px</text>
    <text x="88" y="1406" class="tiny">系统栈：Microsoft YaHei UI → YaHei → PingFang SC → Noto Sans SC；等宽 Consolas。</text>

    <rect x="812" y="1052" width="724" height="386" rx="12" class="card"/>
    <text x="836" y="1082" class="card-t">间距尺度</text><text x="836" y="1114" class="mono tok">4 / 8 / 12 / 16 / 20 / 24 px</text>
    <g fill="#F58A24"><rect x="836" y="1132" width="4" height="20" rx="2"/><rect x="856" y="1132" width="8" height="20" rx="2"/><rect x="880" y="1132" width="12" height="20" rx="2"/><rect x="908" y="1132" width="16" height="20" rx="2"/><rect x="940" y="1132" width="20" height="20" rx="2"/><rect x="976" y="1132" width="24" height="20" rx="2"/></g>
    <text x="1040" y="1147" class="note">组件内部优先 4 的倍数；稿面卡片统一 24 内边距。</text>
    <line x1="836" y1="1174" x2="1512" y2="1174" stroke="#E8E6E3"/>
    <text x="836" y="1204" class="card-t">圆角</text>
    <rect x="836" y="1222" width="70" height="38" rx="6" fill="#F6F5F3" stroke="#D8D5D0"/><rect x="926" y="1222" width="70" height="38" rx="8" fill="#F6F5F3" stroke="#D8D5D0"/><rect x="1016" y="1222" width="70" height="38" rx="10" fill="#F6F5F3" stroke="#D8D5D0"/><rect x="1106" y="1222" width="70" height="38" rx="12" fill="#F6F5F3" stroke="#D8D5D0"/><rect x="1196" y="1222" width="70" height="38" rx="14" fill="#F6F5F3" stroke="#D8D5D0"/>
    <text x="836" y="1280" class="mono tok">6 tag</text><text x="926" y="1280" class="mono tok">8 sm</text><text x="1016" y="1280" class="mono tok">10 md</text><text x="1106" y="1280" class="mono tok">12 lg</text><text x="1196" y="1280" class="mono tok">14 xl</text>
    <rect x="836" y="1310" width="160" height="44" rx="16" fill="#FFF" stroke="#E8E6E3"/><text x="916" y="1338" text-anchor="middle" class="ui12">输入卡 r16（局部）</text>
    <rect x="1020" y="1310" width="120" height="28" rx="14" fill="#FDF0DE"/><text x="1080" y="1329" text-anchor="middle" class="ui11">胶囊 = 半高</text>
    <text x="836" y="1386" class="note">圆角表达容器层级，不为每个元素额外加卡片和阴影。</text>
    <text x="836" y="1412" class="tiny">正文行高 1.5；单行控件垂直居中；长文本尾省略并保留完整 accessible-label。</text>
  </g>

  <g id="layout-baseline">
    <rect x="64" y="1472" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1489" text-anchor="middle" class="chip">04</text><text x="104" y="1490" class="sect">窗口布局基线</text>
    <rect x="64" y="1514" width="1472" height="194" rx="12" class="card"/>
    <rect x="88" y="1538" width="660" height="138" fill="#FBFAF8" stroke="#B9B2A7"/>
    <rect x="88" y="1538" width="660" height="28" fill="#F6F5F3"/><text x="100" y="1557" class="ui11">28px 标题栏</text>
    <rect x="88" y="1566" width="150" height="110" fill="#F6F5F3"/><text x="100" y="1592" class="ui11">侧栏 240px</text><text x="100" y="1612" class="tiny">170–420 可拖</text>
    <rect x="270" y="1578" width="440" height="58" rx="8" fill="#FFF" stroke="#E8E6E3"/><text x="282" y="1602" class="ui11 muted">居中的阅读列与输入带</text><text x="282" y="1622" class="mono tiny">min(可用宽度, 1000px)</text>
    <line x1="238" y1="1566" x2="238" y2="1676" stroke="#F58A24" stroke-dasharray="3 3"/>
    <text x="784" y="1552" class="card-t">尺寸契约</text>
    <text x="784" y="1582" class="note">preferred 1180×740　·　min 1024×700</text>
    <text x="784" y="1610" class="note">阅读列内边距 24；时间线与输入带共用列宽。</text>
    <text x="784" y="1638" class="note">输入带 8 + 100 + 6 + 30 + 10 = 154px。</text>
    <text x="784" y="1666" class="tiny">附件 +36；分支 +22；队列按可见行数增加，均有界。</text>
  </g>
  <g id="footer"><line x1="64" y1="1730" x2="1536" y2="1730" stroke="#D8D5D0"/><text x="64" y="1750" class="tiny">唯一变量来源：frontend-slint/ui/design_tokens.slint；稿面底色 #F5F3EF 仅用于文档，不是产品 token。</text><text x="1536" y="1750" text-anchor="end" class="mono tiny">01 / 09 · 2026-10-31</text></g>
</svg>
