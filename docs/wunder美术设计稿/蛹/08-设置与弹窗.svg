<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1880" viewBox="0 0 1600 1880" role="img" aria-label="蛹 桌面端设置控件与弹窗规范">
  <title>08 设置与弹窗 · 蛹 Desktop UI Spec</title>
  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.ui11{font-size:11px}.muted{fill:#8A8F99}.secondary{fill:#3D3D3D}</style>
  <rect width="1600" height="1880" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 蛹 · DESKTOP UI SPEC</text><text x="64" y="84" class="h1">08　设置与弹窗</text><text x="64" y="114" class="sub">设置是标题栏下方的内部覆盖窗口；常规页、导航、控件与反馈都以当前 Slint 实现为准。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 08 / 09</text><text x="1536" y="84" text-anchor="end" class="mono ui12">SETTINGS · CONTROLS · DIALOGS</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>

  <g id="settings-real">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">真实设置窗口 · 1080×720</text><text x="1536" y="177" text-anchor="end" class="sect-note">头部 44 · 导航 260 · 常规设置即时保存</text>
    <rect x="64" y="202" width="1080" height="720" rx="14" fill="#FBFAF8" stroke="#D8D5D0"/>
    <rect x="64" y="202" width="1080" height="44" rx="14" fill="#FBFAF8"/><rect x="64" y="232" width="1080" height="14" fill="#FBFAF8"/>
    <circle cx="89" cy="224" r="8" fill="none" stroke="#8A8F99" stroke-width="1.6"/><circle cx="89" cy="224" r="3" fill="#8A8F99"/><text x="112" y="229" class="ui14" font-weight="600">设置</text><path d="m1108 217 14 14m0-14-14 14" stroke="#8A8F99" stroke-width="1.8"/><line x1="64" y1="246" x2="1144" y2="246" stroke="#E8E6E3"/>
    <rect x="64" y="246" width="260" height="676" fill="#F6F5F3"/><line x1="324" y1="246" x2="324" y2="922" stroke="#E8E6E3"/>
    <rect x="76" y="254" width="236" height="30" rx="8" fill="#FFF" stroke="#D8D5D0"/><circle cx="92" cy="269" r="5" fill="none" stroke="#8A8F99"/><path d="m96 273 4 4" stroke="#8A8F99"/><text x="108" y="274" class="ui12 muted">搜索设置项</text>
    <rect x="74" y="294" width="240" height="48" rx="12" fill="#F58A24"/><circle cx="102" cy="318" r="18" fill="#FFF" opacity=".24"/><text x="102" y="323" text-anchor="middle" class="ui13" fill="#FFF">⚙</text><text x="130" y="323" class="ui13" fill="#FFF" font-weight="600">常规</text>
    <g><circle cx="102" cy="370" r="18" fill="#F1EFEC"/><text x="130" y="375" class="ui13" font-weight="600">账号</text><circle cx="102" cy="422" r="18" fill="#F1EFEC"/><text x="130" y="427" class="ui13" font-weight="600">模型设置</text><circle cx="102" cy="474" r="18" fill="#F1EFEC"/><text x="130" y="479" class="ui13" font-weight="600">工具管理</text><circle cx="102" cy="526" r="18" fill="#F1EFEC"/><text x="130" y="531" class="ui13" font-weight="600">智能体设置</text><circle cx="102" cy="578" r="18" fill="#F1EFEC"/><text x="130" y="583" class="ui13" font-weight="600">桌宠</text><circle cx="102" cy="630" r="18" fill="#F1EFEC"/><text x="130" y="635" class="ui13" font-weight="600">定时任务</text><circle cx="102" cy="682" r="18" fill="#F1EFEC"/><text x="130" y="687" class="ui13" font-weight="600">记忆碎片</text><circle cx="102" cy="734" r="18" fill="#F1EFEC"/><text x="130" y="739" class="ui13" font-weight="600">渠道设置</text><circle cx="102" cy="786" r="18" fill="#F1EFEC"/><text x="130" y="791" class="ui13" font-weight="600">提示词包</text></g>
    <text x="348" y="280" class="ui11 muted">内容区随分类滚动；导航本身也可滚动</text>
    <rect x="348" y="298" width="772" height="408" rx="12" fill="#FFF" stroke="#E8E6E3"/>
    <text x="368" y="326" font-size="18" font-weight="700">常规</text><text x="368" y="348" class="ui11 muted">发送、外观与语言；变更后即时保存。</text><line x1="368" y1="366" x2="1100" y2="366" stroke="#E8E6E3"/>
    <text x="368" y="392" class="ui13" font-weight="600">发送键</text><text x="368" y="412" class="ui11 muted">选择对话的发送方式</text><rect x="940" y="378" width="160" height="38" rx="8" fill="#FFF" stroke="#D8D5D0"/><text x="952" y="402" class="ui13">Enter 发送</text><text x="1080" y="402" class="ui12 muted">⌄</text><line x1="368" y1="430" x2="1100" y2="430" stroke="#E8E6E3"/>
    <text x="368" y="456" class="ui13" font-weight="600">界面语言</text><text x="368" y="476" class="ui11 muted">切换后保存运行时配置</text><rect x="968" y="442" width="132" height="38" rx="8" fill="#FFF" stroke="#D8D5D0"/><text x="980" y="466" class="ui13">zh-CN</text><text x="1080" y="466" class="ui12 muted">⌄</text><line x1="368" y1="494" x2="1100" y2="494" stroke="#E8E6E3"/>
    <text x="368" y="520" class="ui13" font-weight="600">强调色</text><text x="368" y="540" class="ui11 muted">中性色保持不变，只切换强调色族</text>
    <g><rect x="368" y="554" width="166" height="110" rx="10" fill="#FFF" stroke="#2F7A5C"/><rect x="378" y="564" width="146" height="68" rx="8" fill="#E9F2EE" stroke="#E8E6E3"/><rect x="390" y="576" width="66" height="7" rx="3" fill="#2F7A5C"/><circle cx="500" cy="573" r="8" fill="#FFF" stroke="#2F7A5C" stroke-width="4"/><text x="451" y="650" text-anchor="middle" class="ui12" font-weight="600">森林绿</text><rect x="546" y="554" width="166" height="110" rx="10" fill="#FFF" stroke="#E8E6E3"/><rect x="556" y="564" width="146" height="68" rx="8" fill="#E7F7F2" stroke="#E8E6E3"/><rect x="568" y="576" width="66" height="7" rx="3" fill="#16AD8D"/><circle cx="678" cy="573" r="8" fill="#FFF" stroke="#D8D5D0"/><text x="629" y="650" text-anchor="middle" class="ui12" font-weight="600">薄荷绿</text><rect x="724" y="554" width="166" height="110" rx="10" fill="#FFF" stroke="#E8E6E3"/><rect x="734" y="564" width="146" height="68" rx="8" fill="#F8F0DD" stroke="#E8E6E3"/><rect x="746" y="576" width="66" height="7" rx="3" fill="#C08A2A"/><circle cx="856" cy="573" r="8" fill="#FFF" stroke="#D8D5D0"/><text x="807" y="650" text-anchor="middle" class="ui12" font-weight="600">蜂蜜黄</text><rect x="902" y="554" width="198" height="110" rx="10" fill="#FFF" stroke="#E8E6E3"/><rect x="912" y="564" width="178" height="68" rx="8" fill="#FDF0DE" stroke="#E8E6E3"/><rect x="924" y="576" width="80" height="7" rx="3" fill="#F58A24"/><circle cx="1066" cy="573" r="8" fill="#FFF" stroke="#D8D5D0"/><text x="1001" y="650" text-anchor="middle" class="ui12" font-weight="600">羊皮纸橙</text></g>
    <text x="368" y="692" class="ui13" font-weight="600">会话字号</text><rect x="868" y="674" width="106" height="34" rx="17" fill="#FBFAF8" stroke="#E8E6E3"/><text x="884" y="696" class="ui13">−</text><text x="921" y="696" text-anchor="middle" class="ui13" font-weight="600">14</text><text x="958" y="696" class="ui13">+</text><rect x="988" y="690" width="112" height="4" rx="2" fill="#E8E6E3"/><rect x="988" y="690" width="28" height="4" rx="2" fill="#F58A24"/><circle cx="1016" cy="692" r="8" fill="#FFF" stroke="#F58A24" stroke-width="2"/>
    <rect x="348" y="722" width="772" height="148" rx="12" fill="#FFF" stroke="#E8E6E3"/><text x="368" y="750" font-size="18" font-weight="700">本地运行时</text><text x="368" y="772" class="ui11 muted">执行路径就地保存；不设全局保存按钮</text><line x1="368" y1="788" x2="1100" y2="788" stroke="#E8E6E3"/><text x="368" y="816" class="ui11 muted">Python 路径</text><rect x="368" y="828" width="606" height="36" rx="8" fill="#FFF" stroke="#D8D5D0"/><text x="378" y="851" class="ui12 muted">选择运行时路径</text><rect x="988" y="828" width="96" height="34" rx="8" fill="#FFF" stroke="#E8E6E3"/><text x="1036" y="851" text-anchor="middle" class="ui11">浏览</text>

    <rect x="1180" y="202" width="356" height="720" rx="12" class="card"/><text x="1204" y="232" class="card-t">设置信息架构</text><text x="1204" y="264" class="note">导航按用户任务分类，不按技术模块堆砌。</text>
    <text x="1204" y="300" class="chip">A / GENERAL</text><text x="1204" y="326" class="card-t">常规与账号</text><text x="1204" y="352" class="note">发送、语言、外观、运行时</text><text x="1204" y="376" class="note">登录、同步与连接反馈</text>
    <line x1="1204" y1="398" x2="1512" y2="398" stroke="#E8E6E3"/>
    <text x="1204" y="426" class="chip">B / CAPABILITY</text><text x="1204" y="452" class="card-t">模型、工具与智能体</text><text x="1204" y="478" class="note">模型目录与编辑、工具目录</text><text x="1204" y="502" class="note">智能体、桌宠、提示词包</text>
    <line x1="1204" y1="524" x2="1512" y2="524" stroke="#E8E6E3"/>
    <text x="1204" y="552" class="chip">C / ACTIVITY</text><text x="1204" y="578" class="card-t">任务、记忆与渠道</text><text x="1204" y="604" class="note">定时任务、长期记忆</text><text x="1204" y="628" class="note">渠道账号与归档线程</text>
    <line x1="1204" y1="650" x2="1512" y2="650" stroke="#E8E6E3"/>
    <text x="1204" y="680" class="card-t">窗口与保存规则</text><text x="1204" y="708" class="note">外壳 min(1080, w−72)</text><text x="1204" y="732" class="note">高度 min(720, h−56)，r14</text><text x="1204" y="756" class="note">导航项 48 高 + 4 间距，单行条目</text><text x="1204" y="780" class="note">搜索无结果时显示专用空态</text><text x="1204" y="804" class="note">点击遮罩 / 关闭按钮退出</text><text x="1204" y="836" class="tiny">标题栏始终在遮罩之上；内容区 padding 24。</text><text x="1204" y="862" class="tiny">没有“界面密度、开机启动、全局保存”这些虚构控件。</text><text x="1204" y="894" class="tiny">模型页：新建草稿显式保存；配置名回车/失焦改名。</text>
  </g>

  <g id="control-states">
    <rect x="64" y="956" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="973" text-anchor="middle" class="chip">02</text><text x="104" y="974" class="sect">控件状态 · 设置行、主题卡与表单各自清晰</text>
    <rect x="64" y="998" width="1472" height="326" rx="12" class="card"/>
    <text x="88" y="1028" class="card-t">设置行与选择卡</text><text x="88" y="1060" class="ui13" font-weight="600">发送键</text><text x="88" y="1080" class="ui11 muted">标签 13/600，说明 11 muted</text><rect x="430" y="1042" width="160" height="38" rx="8" fill="#FFF" stroke="#F58A24"/><text x="442" y="1066" class="ui13">Ctrl+Enter</text><text x="570" y="1066" class="ui12 muted">⌄</text><text x="622" y="1066" class="tiny">聚焦 = 1px accent</text>
    <rect x="88" y="1102" width="148" height="110" rx="10" fill="#FFF" stroke="#F58A24"/><rect x="98" y="1112" width="128" height="68" rx="8" fill="#FDF0DE" stroke="#E8E6E3"/><rect x="110" y="1124" width="58" height="7" rx="3" fill="#F58A24"/><circle cx="202" cy="1121" r="8" fill="#FFF" stroke="#F58A24" stroke-width="4"/><text x="162" y="1198" text-anchor="middle" class="ui12" font-weight="600">选中主题</text>
    <rect x="250" y="1102" width="148" height="110" rx="10" fill="#FFF" stroke="#E8E6E3"/><rect x="260" y="1112" width="128" height="68" rx="8" fill="#E7F7F2" stroke="#E8E6E3"/><rect x="272" y="1124" width="58" height="7" rx="3" fill="#16AD8D"/><circle cx="364" cy="1121" r="8" fill="#FFF" stroke="#D8D5D0"/><text x="324" y="1198" text-anchor="middle" class="ui12" font-weight="600">未选主题</text>
    <text x="430" y="1124" class="note">主题卡固定 110 高，迷你预览 68 高。</text><text x="430" y="1150" class="note">选中使用自己的 accent 描边与 4px 选择环。</text><text x="430" y="1176" class="note">四张卡等分整行，间距 12；不是色块按钮。</text><text x="88" y="1250" class="tiny">设置行上下 padding 12；非末行底部 1px border。</text><text x="88" y="1282" class="tiny">字号步进器 106×34，滑块 132×34；拖到过程实时预览，释放后保存。</text>
    <line x1="788" y1="1018" x2="788" y2="1300" stroke="#E8E6E3"/>
    <text x="812" y="1028" class="card-t">表单字段 · 36px 输入框</text>
    <text x="812" y="1060" class="tiny">默认</text><rect x="900" y="1042" width="280" height="36" rx="8" fill="#FFF" stroke="#D8D5D0"/><text x="910" y="1065" class="ui12 muted">请输入配置值</text><text x="1210" y="1060" class="note">白底 + border-strong</text>
    <text x="812" y="1108" class="tiny">聚焦</text><rect x="900" y="1090" width="280" height="36" rx="8" fill="#FFF" stroke="#F58A24"/><text x="910" y="1113" class="ui12">正在编辑</text><text x="1210" y="1108" class="note">accent 1px</text>
    <text x="812" y="1156" class="tiny">错误</text><rect x="900" y="1138" width="280" height="36" rx="8" fill="#FFF" stroke="#D04A43"/><text x="910" y="1161" class="ui12">格式不正确</text><text x="1210" y="1156" class="note" fill="#D04A43">danger + 行内错误</text>
    <text x="812" y="1204" class="tiny">只读 / 停用</text><rect x="900" y="1186" width="280" height="36" rx="8" fill="#F6F5F3" stroke="#E8E6E3"/><text x="910" y="1209" class="ui12 muted">当前不可编辑</text><text x="1210" y="1204" class="note">hover 灰底 + muted</text>
    <rect x="900" y="1240" width="16" height="16" rx="4" fill="#F58A24"/><path d="m903 1248 4 4 7-8" fill="none" stroke="#FFF" stroke-width="1.4"/><text x="926" y="1254" class="ui12">勾选 16px</text><rect x="1060" y="1240" width="46" height="26" rx="13" fill="#005FB8"/><circle cx="1093" cy="1253" r="10" fill="#FFF"/><text x="1118" y="1254" class="ui12">开关使用系统 Switch</text>
    <text x="812" y="1296" class="tiny">密钥使用 password 输入；错误文案位于字段下方，不用 Toast 替代行内校验。</text>
  </g>

  <g id="dialogs">
    <rect x="64" y="1358" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1375" text-anchor="middle" class="chip">03</text><text x="104" y="1376" class="sect">弹窗与 Toast · 尺寸、层级和关闭边界不同</text>
    <rect x="64" y="1400" width="1472" height="326" rx="12" class="card"/>
    <text x="88" y="1430" class="card-t">ConfirmDialog</text><text x="88" y="1454" class="tiny">400×160 · 0.8× 展示</text><rect x="88" y="1470" width="320" height="128" rx="11" fill="#FFF" stroke="#D8D5D0"/><text x="104" y="1496" class="ui13" font-weight="700">删除当前配置？</text><text x="104" y="1522" class="ui12 muted">此操作需要确认。</text><rect x="192" y="1550" width="72" height="30" rx="8" fill="#F58A24"/><text x="228" y="1570" text-anchor="middle" class="ui11" fill="#FFF">取消</text><rect x="280" y="1550" width="96" height="30" rx="8" fill="#D04A43"/><text x="328" y="1570" text-anchor="middle" class="ui11" fill="#FFF">删除</text><text x="88" y="1624" class="note">危险时取消为 accent，确认为 danger。</text><text x="88" y="1650" class="note">busy 禁用按钮且不允许遮罩关闭。</text><text x="88" y="1682" class="tiny">无虚构加载图标；以按钮停用表达 busy。</text>
    <line x1="438" y1="1420" x2="438" y2="1702" stroke="#E8E6E3"/>
    <text x="462" y="1430" class="card-t">ModalDialog</text><text x="462" y="1454" class="tiny">420×220 · 0.8× 展示</text><rect x="462" y="1470" width="336" height="176" rx="11" fill="#FFF" stroke="#D8D5D0"/><text x="480" y="1498" class="ui13" font-weight="600">编辑内容</text><rect x="480" y="1516" width="300" height="36" rx="8" fill="#FFF" stroke="#D8D5D0"/><text x="490" y="1539" class="ui12 muted">输入内容</text><rect x="672" y="1594" width="92" height="30" rx="8" fill="#F58A24"/><text x="718" y="1614" text-anchor="middle" class="ui11" fill="#FFF">完成</text><text x="462" y="1674" class="note">通用容器，内容由内边距 20、间距 12 排布。</text><text x="462" y="1700" class="tiny">dismissable 决定遮罩点击是否关闭。</text>
    <line x1="812" y1="1420" x2="812" y2="1702" stroke="#E8E6E3"/>
    <text x="836" y="1430" class="card-t">InfoDialog</text><text x="836" y="1454" class="tiny">宽 min(520, 窗宽−72) · 0.65× 展示</text><rect x="836" y="1470" width="338" height="195" rx="11" fill="#FFF" stroke="#D8D5D0"/><rect x="852" y="1486" width="14" height="14" rx="7" fill="#FDF0DE"/><circle cx="859" cy="1493" r="4" fill="none" stroke="#F58A24" stroke-width="1.2"/><text x="874" y="1498" class="ui13" font-weight="600">详细信息</text><path d="m1152 1486 12 12m0-12-12 12" stroke="#8A8F99"/><rect x="852" y="1510" width="306" height="98" rx="7" fill="#FBFAF8" stroke="#E8E6E3"/><text x="864" y="1534" class="ui12 muted">正文按内容自适应增高；超过 360px 封顶。</text><text x="864" y="1556" class="ui12 muted">浅色面板承载，超限才出现滚动条。</text><rect x="1148" y="1516" width="4" height="86" rx="2" fill="#E8E6E3"/><rect x="1049" y="1630" width="109" height="22" rx="6" fill="#F58A24"/><text x="1103" y="1645" text-anchor="middle" class="ui11" fill="#FFF">✓ 关闭</text><text x="836" y="1690" class="note">卡高 = 正文高 + 150；宽度收窄到 520。</text><text x="836" y="1710" class="tiny">头部 22px 图标徽标（accent-soft 底 + accent-ink 字形）。</text>
    <line x1="1186" y1="1420" x2="1186" y2="1702" stroke="#E8E6E3"/>
    <text x="1210" y="1430" class="card-t">ToastHost</text><text x="1210" y="1454" class="tiny">480×48 host · 40px 可见条</text><rect x="1210" y="1480" width="300" height="40" rx="12" fill="#FFF" stroke="#E8E6E3"/><circle cx="1232" cy="1500" r="7" fill="#F58A24"/><text x="1248" y="1505" class="ui12">配置已更新</text><rect x="1210" y="1540" width="300" height="40" rx="12" fill="#FFF7F5" stroke="#E8B7AD"/><path d="m1224 1552 14 14m0-14-14 14" stroke="#D04A43" stroke-width="1.6"/><text x="1248" y="1565" class="ui12">保存失败，请重试</text><text x="1210" y="1612" class="note">普通与成功共用信息图标和 accent。</text><text x="1210" y="1638" class="note">danger 才使用红色浅底与错误图标。</text><text x="1210" y="1670" class="tiny">Rust 控制显隐；点击穿透，不遮挡主操作。</text>
  </g>

  <g id="feedback-boundary"><rect x="64" y="1760" width="1472" height="68" rx="12" class="card"/><text x="88" y="1788" class="card-t">反馈边界</text><text x="200" y="1788" class="note">字段错误留在字段旁；操作确认用模态；长信息用 Info；轻量结果用 Toast；页面加载/空态/无权限用 PageState。</text><text x="88" y="1814" class="tiny">设置覆盖层从标题栏下方开始；其他模态与设置的层级由 main.slint 统一管理，不在卡片中自行叠加遮罩。</text></g>
