<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-label="舵机 终端 UI 整体总览与五段布局">
  <title>00 整体总览 · 舵机 CLI UI Spec</title>
  <style>svg{font-family:'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#1F2329}.mono{font-family:Consolas,monospace}.h1{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#6F747B}.kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#D87616}.sect{font-size:18px;font-weight:700}.sect-note{font-size:12px;fill:#8A8F99}.card{fill:#FFF;stroke:#DED9D1}.card-t{font-size:14px;font-weight:700}.note{font-size:12px;fill:#6F747B}.tiny{font-size:11px;fill:#8A8F99}.chip{font-size:11px;font-weight:700;fill:#D87616}.ui14{font-size:14px}.ui13{font-size:13px}.ui12{font-size:12px}.term{fill:#131A24}.t-fg{fill:#D8DEE6}.t-dim{fill:#6E7A8A}.t-cy{fill:#4FC1D9}</style>
  <rect width="1600" height="1440" fill="#F5F3EF"/>
  <g id="header"><text x="64" y="42" class="kicker">WUNDER / 舵机 · CLI UI SPEC</text><text x="64" y="84" class="h1">00　整体总览</text><text x="64" y="114" class="sub">终端单元格就是画布；先看新线程实帧，再看五段垂直栈与行数预算，不把桌面窗口的卡片思维搬进终端。</text><text x="1536" y="44" text-anchor="end" class="mono tiny">SHEET 00 / 05</text><text x="1536" y="84" text-anchor="end" class="mono ui12">RATATUI · 100 × 30 EXAMPLE</text><line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D5D0"/></g>
  <g id="fresh-frame">
    <rect x="64" y="160" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="177" text-anchor="middle" class="chip">01</text><text x="104" y="178" class="sect">真实启动帧 · 新线程站立态</text><text x="1536" y="177" text-anchor="end" class="sect-note">启动信息在转写区，欢迎画在横幅带，两者不混为同一区域</text>
    <rect x="64" y="202" width="1080" height="640" rx="12" class="card"/>
    <rect x="80" y="218" width="1048" height="608" rx="6" class="term"/>
    <g class="mono" font-size="13"><text x="96" y="244" class="t-cy" font-weight="bold">⚙ wunder 舵机 (v0.2.0)</text><text x="96" y="270" class="t-dim">　 工作目录 示例目录</text><text x="96" y="296" class="t-dim">　 /help 查看命令 · @ 提及文件 · ! 直接执行</text><text x="96" y="330" class="t-dim">wunder-cli tui mode. type /help for commands.</text></g>
    <line x1="80" y1="356" x2="1128" y2="356" stroke="#2A3646" stroke-dasharray="3 4"/>
    <image href="data:image/png;base64," x="380" y="366" width="400" height="340"/>
    <rect x="80" y="726" width="1048" height="100" fill="#182430"/>
    <text x="96" y="758" class="mono" font-size="13" fill="#4FC1D9" font-weight="bold">›</text><text x="116" y="758" class="mono" font-size="13" fill="#6E7A8A">直接提问，或使用 / 命令、@ 文件、# 技能、$ 应用；拖入图片或文件即可附加</text>
    <text x="96" y="812" class="mono" font-size="13" fill="#6E7A8A">示例目录　← 任务中心</text><text x="1112" y="812" text-anchor="end" class="mono" font-size="13" fill="#6E7A8A">? 快捷键</text>
    <rect x="1180" y="202" width="356" height="640" rx="12" class="card"/>
    <text x="1204" y="234" class="card-t">五段功能栈 · 从上到下</text>
    <text x="1204" y="274" class="chip">01 / TRANSCRIPT</text><text x="1204" y="300" class="card-t">转写区</text><text x="1204" y="326" class="note">启动信息、会话与过程回放</text><text x="1204" y="350" class="tiny">无弹层 Min(8) / 有弹层 Min(6)</text>
    <line x1="1204" y1="370" x2="1512" y2="370" stroke="#E8E6E3"/>
    <text x="1204" y="398" class="chip">02 / POPUP</text><text x="1204" y="424" class="card-t">弹层带 · 可选</text><text x="1204" y="450" class="note">选择器与恢复列表，紧邻输入上方</text><text x="1204" y="474" class="tiny">min(项数, 7) + 1；本帧未开启</text>
    <line x1="1204" y1="494" x2="1512" y2="494" stroke="#E8E6E3"/>
    <text x="1204" y="522" class="chip">03 / BANNER</text><text x="1204" y="548" class="card-t">欢迎横幅带</text><text x="1204" y="574" class="note">真实 40×34 像素数据的半块渲染</text><text x="1204" y="598" class="tiny">输入或会话推进即让位；空间不足先压缩</text>
    <line x1="1204" y1="618" x2="1512" y2="618" stroke="#E8E6E3"/>
    <text x="1204" y="646" class="chip">04 + 05 / STATUS + INPUT</text><text x="1204" y="672" class="card-t">活动行 1 行 + 输入区 5 行</text><text x="1204" y="698" class="note">运行/审批提示与唯一可编辑区</text><text x="1204" y="722" class="tiny">空闲活动行保留位置；输入区包含底栏</text><text x="1204" y="752" class="tiny">主布局固定开销 14 行（含转写地板）</text><text x="1204" y="786" class="tiny">像素画内嵌自 welcome_logo_art.rs，非九宫格占位图</text><text x="1204" y="816" class="tiny">帧样例使用参考终端前景色，实际命名色随主题映射</text>
  </g>
  <g id="layout-contract">
    <rect x="64" y="876" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="893" text-anchor="middle" class="chip">02</text><text x="104" y="894" class="sect">布局契约 · 每段有独立行数规则</text>
    <rect x="64" y="918" width="1472" height="238" rx="12" class="card"/>
    <rect x="88" y="942" width="272" height="66" rx="8" fill="#F6F5F3"/><text x="104" y="968" class="card-t">转写区</text><text x="104" y="994" class="note">Min(8) / 弹层时 Min(6)</text>
    <rect x="378" y="942" width="272" height="66" rx="8" fill="#F6F5F3"/><text x="394" y="968" class="card-t">弹层带</text><text x="394" y="994" class="note">min(n,7)+1，0 时不占位</text>
    <rect x="668" y="942" width="272" height="66" rx="8" fill="#F6F5F3"/><text x="684" y="968" class="card-t">欢迎横幅</text><text x="684" y="994" class="note">请求高度钳制到剩余空间</text>
    <rect x="958" y="942" width="272" height="66" rx="8" fill="#F6F5F3"/><text x="974" y="968" class="card-t">活动行</text><text x="974" y="994" class="note">固定 1 行，空闲也保留</text>
    <rect x="1248" y="942" width="264" height="66" rx="8" fill="#FDF0DE"/><text x="1264" y="968" class="card-t">输入区</text><text x="1264" y="994" class="note">固定 5 行，通知占用内部草稿行</text>
    <text x="88" y="1042" class="card-t">余量公式</text><text x="190" y="1042" class="mono note">banner = min(请求高度, 屏高 − (弹层 + 活动1 + 输入5 + 转写地板8))</text>
    <text x="88" y="1072" class="note">空间不足先让横幅压缩或消失；小屏不再虚构“草稿始终 3 行”，通知与间隙会占用输入区内部行数。</text><text x="88" y="1104" class="tiny">欢迎像素画只有在适配宽度 ≥20 且高度 ≥6 时站立；首次绘制后不再预留横幅。</text><text x="88" y="1132" class="tiny">布局、配色和状态是三层：行数来自 layout.rs，颜色来自 theme.rs，文案来自运行时投影。</text>
  </g>
  <g id="entry-modes">
    <rect x="64" y="1190" width="28" height="24" rx="6" fill="#FDF0DE"/><text x="78" y="1207" text-anchor="middle" class="chip">03</text><text x="104" y="1208" class="sect">调用形态 · 同一引擎，不同入口</text>
    <rect x="64" y="1232" width="280" height="116" rx="12" class="card"/><text x="84" y="1262" class="card-t">无参数</text><text x="84" y="1290" class="mono note">wunder-cli</text><text x="84" y="1320" class="tiny">当前目录打开 TUI</text>
    <rect x="362" y="1232" width="280" height="116" rx="12" class="card"/><text x="382" y="1262" class="card-t">初始提示词</text><text x="382" y="1290" class="mono note">wunder-cli "整理记录"</text><text x="382" y="1320" class="tiny">位置参数带入首轮输入</text>
    <rect x="660" y="1232" width="280" height="116" rx="12" class="card"/><text x="680" y="1262" class="card-t">会话与环境</text><text x="680" y="1290" class="mono note">--session / --cd / --model</text><text x="680" y="1320" class="tiny">明确指定线程、目录与模型</text>
    <rect x="958" y="1232" width="280" height="116" rx="12" class="card"/><text x="978" y="1262" class="card-t">权限策略</text><text x="978" y="1290" class="mono note">--sandbox / --approval-mode</text><text x="978" y="1320" class="tiny">后端执行约束，不是视觉状态</text>
    <rect x="1256" y="1232" width="280" height="116" rx="12" class="card"/><text x="1276" y="1262" class="card-t">非 TTY</text><text x="1276" y="1290" class="mono note">管道 / 脚本运行</text><text x="1276" y="1320" class="tiny">不启动交互终端界面</text>
  </g>
  <g id="footer"><line x1="64" y1="1380" x2="1536" y2="1380" stroke="#D8D5D0"/><text x="64" y="1410" class="tiny">事实来源：tui/ui/layout.rs · tui/ui/composer.rs · tui/app.rs · empty_state_animation.rs · welcome_logo_art.rs</text><text x="1536" y="1410" text-anchor="end" class="mono tiny">00 / 05 · 2026-10-25</text></g>
</svg>
