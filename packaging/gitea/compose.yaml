name: offline-gitea

services:
  gitea:
    image: docker.gitea.com/gitea:28.2.0
    platform: linux/arm64
    pull_policy: never
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: ${GITEA_PUBLIC_URL:-http://localhost:3000/}
      GITEA__server__LOCAL_ROOT_URL: http://gitea:3000/
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_HOST:-localhost}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: self
      GITEA__actions__ENDLESS_TASK_TIMEOUT: 24h
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.packages,repo.actions
      GITEA__federation__ENABLED: "false"
      GITEA__log__LEVEL: Info
    ports:
      - "${GITEA_BIND_ADDRESS:-0.0.0.0}:${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_BIND_ADDRESS:-0.0.0.0}:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - ./data/gitea:/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - ci
      - ingress
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  bootstrap:
    image: docker.gitea.com/gitea:28.2.0
    platform: linux/arm64
    pull_policy: never
    restart: on-failure
    entrypoint: ["/bin/sh", "/bundle/bootstrap.sh"]
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-admin}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-admin@example.invalid}
    volumes:
      - ./data/gitea:/data
      - ./data/bootstrap:/bootstrap
      - ./bootstrap.sh:/bundle/bootstrap.sh:ro
    depends_on:
      gitea:
        condition: service_healthy
    networks:
      - ci

  runner:
    image: docker.gitea.com/runner:5.2.3
    platform: linux/arm64
    pull_policy: never
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000/
      GITEA_RUNNER_NAME: offline-linux-arm64
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /bootstrap/runner-token
      GITEA_RUNNER_LABELS: linux-offline-arm64:docker://wunder-offline-builder:20261027-arm64-mounted
      CONFIG_FILE: /etc/runner/config.yaml
    volumes:
      - ./data/runner:/data
      - ./data/bootstrap:/bootstrap:ro
      - ./runner.yaml:/etc/runner/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - build-cache:/ci-cache
      - offline-sdk:/opt/offline-sdk:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      - ci
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

networks:
  ingress:
    name: offline-gitea-ingress
  ci:
    name: offline-gitea-ci
    internal: true

volumes:
  offline-sdk:
    name: offline-gitea-sdk
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WUNDER_SDK_PATH:?Run bash load-images.sh to prepare the SDK mount}
  build-cache:
    name: offline-gitea-build-cache
