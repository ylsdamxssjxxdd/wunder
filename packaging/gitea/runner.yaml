# Runner 配置模板：@TOKEN@ 由 packaging/gitea/prepare-bundle.py 按目标架构渲染，
# 套件里拿到的是已渲染的真实值（capacity 渲染为整数，其余为字符串）。
# 标签与卷名必须和 compose.yaml/.env 同源，否则任务容器挂不上 SDK 或工作流排不到 runner。
log:
  level: info
runner:
  file: /data/.runner
  capacity: "@RUNNER_CAPACITY@"
  timeout: 24h
  envs:
    CI_SERVER_URL: http://gitea:3000
    WUNDER_OFFLINE_ROOT: /opt/offline-sdk
    WUNDER_BUILD_JOBS: "@WUNDER_BUILD_JOBS@"
    CARGO_BUILD_JOBS: "@WUNDER_BUILD_JOBS@"
    WUNDER_SQUASHFS_PROCESSORS: "@WUNDER_SQUASHFS_PROCESSORS@"
  labels:
    - "@BUILDER_LABEL@"
    - "@RCHO_LABEL@"
    - "@INSTALLER_LABEL@"
cache:
  enabled: false
container:
  network: "@STACK_PREFIX@-ci"
  privileged: false
  # clone3：老 Docker（18.09/19.03）默认 seccomp 直接 EPERM，arm64 剖面里的静态
  # qemu-x86_64-static 自带 glibc 2.35，启动建线程就会 abort；upgrade-docker.sh 升到
  # ≥20.10.10 后可去掉该选项恢复默认沙箱（见 README「只有老 Docker」一节）。
  options: "@CONTAINER_SECCOMP_OPT@--volume @STACK_PREFIX@-build-cache:/ci-cache --volume @STACK_PREFIX@-sdk:/opt/offline-sdk:ro --volume @STACK_PREFIX@-android:/opt/android:ro"
  valid_volumes:
    - "@STACK_PREFIX@-build-cache"
    - "@STACK_PREFIX@-sdk"
    - "@STACK_PREFIX@-android"
  docker_host: "-"
  force_pull: false
  force_rebuild: false
health_check:
  enabled: true
  min_free_disk_space_mb: 10240
