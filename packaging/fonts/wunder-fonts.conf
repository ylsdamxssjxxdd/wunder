<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 桌面/命令行补充包：在系统字体配置之上加入 opt/fonts/common 与 opt/fonts/video。
       字体名映射直接内联，因为 fontconfig 的 <include prefix="relative"> 对同级目录不可靠。 -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">common</dir>
  <dir prefix="relative">video</dir>

  <alias binding="same"><family>仿宋_GB2312</family><prefer><family>FangSong</family></prefer></alias>
  <alias binding="same"><family>FangSong_GB2312</family><prefer><family>FangSong</family></prefer></alias>
  <alias binding="same"><family>华文仿宋</family><prefer><family>FangSong</family></prefer></alias>
  <alias binding="same"><family>STFangsong</family><prefer><family>FangSong</family></prefer></alias>

  <alias binding="same"><family>楷体_GB2312</family><prefer><family>KaiTi</family></prefer></alias>
  <alias binding="same"><family>KaiTi_GB2312</family><prefer><family>KaiTi</family></prefer></alias>
  <alias binding="same"><family>华文楷体</family><prefer><family>KaiTi</family></prefer></alias>
  <alias binding="same"><family>STKaiti</family><prefer><family>KaiTi</family></prefer></alias>

  <alias binding="same"><family>华文黑体</family><prefer><family>SimHei</family></prefer></alias>
  <alias binding="same"><family>STHeiti</family><prefer><family>SimHei</family></prefer></alias>

  <alias binding="same"><family>华文中宋</family><prefer><family>SimSun</family></prefer></alias>
  <alias binding="same"><family>STZhongsong</family><prefer><family>SimSun</family></prefer></alias>

  <alias binding="same"><family>方正小标宋</family><prefer><family>FZXiaoBiaoSong-B05S</family></prefer></alias>
  <alias binding="same"><family>方正小标宋_GBK</family><prefer><family>FZXiaoBiaoSong-B05S</family></prefer></alias>
  <alias binding="same"><family>小标宋</family><prefer><family>FZXiaoBiaoSong-B05S</family></prefer></alias>

  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
