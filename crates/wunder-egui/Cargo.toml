[package]
name = "wunder-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "wunder egui front end shared by native Pupa and the WASM web shell"

[lib]
name = "wunder_egui"
path = "src/lib.rs"

[[bin]]
name = "wunder-egui"
path = "src/bin/wunder-egui.rs"

[[bin]]
name = "wunder-egui-web"
path = "src/bin/wunder-egui-web.rs"

[features]
default = ["native"]
native = []
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
fixtures = ["dep:image"]

[dependencies]
egui = { version = "0.32.3", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Already in the workspace: the Slint shell and the runtime parse Markdown with
# the same crate, so the egui shell adds no new third-party dependency.
pulldown-cmark = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
wunder-desktop = { path = "../wunder-desktop", default-features = false, features = ["sqlite-storage"] }
# The native worker inlines attachments as the data URLs the façade persists.
# Same workspace crate version the desktop crate already encodes with.
base64 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "25.0.2", default-features = false, features = ["webgpu", "webgl"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "Element", "HtmlCanvasElement", "Window", "Location", "Storage"] }

[dev-dependencies]
serde_json = { workspace = true }
