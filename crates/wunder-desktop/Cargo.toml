[package]
name = "wunder-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "wunder_desktop"
path = "lib.rs"

[features]
default = ["sqlite-storage", "web-fetch"]
desktop-control = ["wunder-runtime/desktop-control"]
doc2md = ["wunder-runtime/doc2md"]
host-metrics = ["wunder-runtime/host-metrics"]
mcp = ["wunder-runtime/mcp"]
postgres-storage = ["wunder-runtime/postgres-storage"]
sqlite-storage = ["wunder-runtime/sqlite-storage"]
web-fetch = ["wunder-runtime/web-fetch"]
xmpp = ["wunder-runtime/xmpp"]

[[bin]]
name = "wunder-desktop-bridge"
path = "bridge_main.rs"
bench = false

[[example]]
name = "chat_open_probe"
required-features = ["sqlite-storage"]

[[example]]
name = "experience_probe"
required-features = ["sqlite-storage"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
wunder-runtime = { path = "../wunder-runtime", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
