<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wunder Desktop</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f1f1f1; color: #344255; font-family: "Segoe UI", sans-serif; }
    main { text-align: center; }
    h1 { font-size: 18px; }
    p { color: #7a8594; font-size: 13px; }
    button { min-height: 36px; padding: 0 16px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
    .spinner { width: 30px; height: 30px; margin: 12px auto; border: 3px solid #e2e8f0; border-top-color: #ff9448; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main role="status">
    <h1>Wunder Desktop</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status">Starting local workspace...</p>
    <button id="retry" hidden>Retry</button>
  </main>
  <script>
    const retry = document.getElementById('retry');
    let pending = false;
    async function start() {
      if (pending) return;
      pending = true;
      retry.hidden = true;
      document.getElementById('status').textContent = 'Starting local workspace...';
      try {
        // Actual paint timing may lag animation frame callbacks.
        await new Promise(resolve => {
          if (typeof PerformanceObserver !== 'undefined' &&
              PerformanceObserver.supportedEntryTypes?.includes('paint')) {
            const observer = new PerformanceObserver(entries => {
              if (entries.getEntries().some(entry => entry.name === 'first-contentful-paint')) {
                observer.disconnect();
                resolve();
              }
            });
            observer.observe({ type: 'paint', buffered: true });
            return;
          }
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
        const deadline = performance.now() + 10;
        await new Promise(resolve => {
          function check() {
            const remaining = deadline - performance.now();
            if (remaining > 0) setTimeout(check, Math.ceil(remaining));
            else resolve();
          }
          setTimeout(check, 10);
        });
        const url = await window.__TAURI_INTERNALS__.invoke('desktop_startup_ready');
        window.location.replace(url);
      } catch (_) {
        document.getElementById('status').textContent = 'Unable to start local services. Please retry.';
        retry.hidden = false;
      } finally {
        pending = false;
      }
    }
    retry.addEventListener('click', start);
    void start();
  </script>
</body>
</html>
