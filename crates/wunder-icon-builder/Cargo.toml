[package]
name = "wunder-icon-builder"
# Version fields are spelled out rather than inherited: 安卓版 builds in its own
# workspace and path-depends on this crate, so it must resolve without the root
# workspace manifest.
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "Build-time generator for the workspace file-icon textures shared by 桌面版 and 安卓版"

[dependencies]
# Rasterizes the web-aligned file-icon SVG set while the host runs the build
# script; resvg is already in the dependency graph through the Slint compiler.
resvg = { version = "=0.48.1", default-features = false }
png = "0.18"
serde_json = "1"

# Standalone build helper: 桌面版 and 安卓版 path-depend on it from their own
# workspaces, so it must not be claimed by (or pull its rasterizer into) the
# root workspace lockfile.
[workspace]
