name: Desktop Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wunder-desktop-release
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      packaging_changed: ${{ steps.scope.outputs.packaging_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: echo "build_date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "packaging_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "packaging_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "$after" |
            grep -E '^(packaging/|\.github/workflows/desktop-supplements\.yml$)' >/dev/null; then
            echo "packaging_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows-win7-x86:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-14-x86_64-pc-windows-gnu
          components: rust-src
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          location: ${{ runner.temp }}\wunder-win7-msys2
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
      - name: Ensure Win7 Rust source component
        shell: pwsh
        run: |
          rustup toolchain install nightly-2026-03-14-x86_64-pc-windows-gnu --profile minimal --component rust-src
          rustup component add rust-src --toolchain nightly-2026-03-14-x86_64-pc-windows-gnu
          $components = rustup component list --installed --toolchain nightly-2026-03-14-x86_64-pc-windows-gnu
          if (-not ($components -match '^rust-src')) { throw 'rust-src was not installed for the Win7 build toolchain' }
      - name: Build and validate native Win7 executable
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $targetMingw = Join-Path $msysRoot 'mingw32\bin'
          $hostMingw = Join-Path $msysRoot 'mingw64\bin'
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & .\builders\build-win7-slint.ps1 `
            -Toolchain 'nightly-2026-03-14-x86_64-pc-windows-gnu' `
            -MingwBin $targetMingw `
            -HostMingwBin $hostMingw `
            -OutputDirectory $out `
            -Jobs 8
          if ($LASTEXITCODE -ne 0) { throw "Win7 build failed: $LASTEXITCODE" }
      - name: Build Win7 CLI
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          & .\builders\build-win7-cli.ps1 `
            -Toolchain 'nightly-2026-03-14-x86_64-pc-windows-gnu' `
            -MingwBin (Join-Path $msysRoot 'mingw32\bin') `
            -HostMingwBin (Join-Path $msysRoot 'mingw64\bin') `
            -OutputDirectory $out `
            -Jobs 8
          if ($LASTEXITCODE -ne 0) { throw "Win7 CLI build failed: $LASTEXITCODE" }
      - name: Free Win7 build caches
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
      - name: Wait for the matching supplement rebuild
        if: needs.prepare.outputs.packaging_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A packaging push starts Desktop Supplements concurrently. Waiting
          # here prevents an installer from bundling the previous asset.
          missing=0
          for attempt in $(seq 1 420); do
            state="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow desktop-supplements.yml --commit "${GITHUB_SHA}" --limit 1 \
              --json status,conclusion \
              --jq '.[0] // {} | "\(.status // "") \(.conclusion // "")"' 2>/dev/null || true)"
            status="${state%% *}"
            conclusion="${state#* }"
            if [ -z "$status" ]; then
              missing=$((missing + 1))
              if [ "$missing" -ge 40 ]; then
                echo "no supplement workflow run appears for this commit; using the current supplement release" >&2
                exit 0
              fi
              sleep 15
              continue
            fi
            missing=0
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                # 只在失败分支多查一次链接，正常路径保持单次 API 调用。
                run_url="$(gh run list --repo "${GITHUB_REPOSITORY}" \
                  --workflow desktop-supplements.yml --commit "${GITHUB_SHA}" --limit 1 \
                  --json url --jq '.[0].url // ""' 2>/dev/null || true)"
                echo "supplement workflow concluded ${conclusion:-unknown}; refusing to package a stale supplement${run_url:+ (see $run_url)}" >&2
                exit 1
              fi
              echo "supplement workflow completed successfully"
              exit 0
            fi
            sleep 30
          done
          echo "timed out waiting for the supplement workflow" >&2
          exit 1
      - name: Download Windows supplement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'supplement'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download supplement --repo $env:GITHUB_REPOSITORY `
            --pattern 'wunder-supplement-win7-ia32-common.zip' --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw 'failed to download the supplement release asset' }
          Get-ChildItem -LiteralPath $dir | Format-Table Name, Length
      - name: Verify Windows supplement matches the Playwright and ripgrep pins
        shell: pwsh
        run: |
          $supplement = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'supplement') -Filter 'wunder-supplement-win7-ia32-common.zip' | Select-Object -First 1
          if (-not $supplement) { throw 'Windows supplement is missing' }
          $pinLine = Get-Content -LiteralPath 'packaging/python/requirements-win7-common.txt' |
            Where-Object { $_ -match '^\s*playwright==' } | Select-Object -First 1
          if (-not $pinLine) { throw 'playwright pin is missing from requirements-win7-common.txt' }
          $pin = ($pinLine -split '==', 2)[1].Trim()
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($supplement.FullName)
          try {
            $entryPath = "opt/python/Lib/site-packages/playwright-$pin.dist-info/METADATA"
            $entry = $zip.GetEntry($entryPath)
            if (-not $entry) { $entry = $zip.GetEntry(($entryPath -replace '/', '\')) }
            if (-not $entry) {
              throw "supplement does not contain Playwright $pin; rebuild the Desktop Supplements release"
            }
            $metaEntry = $zip.GetEntry('wunder-win7-supplement.json')
            if (-not $metaEntry) { throw 'supplement metadata is missing' }
            $reader = New-Object IO.StreamReader($metaEntry.Open(), [Text.Encoding]::UTF8)
            try { $meta = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($meta.python.playwrightDriverNode.machine -ne 'i386') {
              throw "supplement Playwright driver is not i386: $($meta.python.playwrightDriverNode.machine)"
            }
            $rgPin = (Get-Content -LiteralPath 'packaging/windows/scripts/win7-supplement-manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json).rg.version
            if ($meta.rg.version -ne $rgPin) {
              throw "supplement ripgrep is $($meta.rg.version), expected $rgPin; rebuild the Desktop Supplements release"
            }
            # 发布前最后一道架构检查：release 上的包可能来自旧构建缓存，而打包脚本
            # 的门禁只保护「本次构建」。任何 32 位包里混入 x64/arm64 的 exe/dll/pyd
            # 都只能在目标机上才炸（capstone.dll 就是这么混进来的）。
            # 注意 ZipArchiveEntry 的流不支持 Seek，所以只顺序读头部 8 KB 再解析。
            $foreign = New-Object System.Collections.Generic.List[string]
            $peCount = 0
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -notmatch '\.(exe|dll|pyd|node)$') { continue }
              $stream = $entry.Open()
              try {
                $head = New-Object byte[] 8192
                $read = 0
                while ($read -lt $head.Length) {
                  $chunk = $stream.Read($head, $read, $head.Length - $read)
                  if ($chunk -le 0) { break }
                  $read += $chunk
                }
              } finally {
                $stream.Dispose()
              }
              if ($read -lt 64 -or $head[0] -ne 0x4d -or $head[1] -ne 0x5a) { continue }
              $peOffset = [BitConverter]::ToInt32($head, 0x3c)
              if ($peOffset -le 0 -or ($peOffset + 6) -gt $read) { continue }
              if ($head[$peOffset] -ne 0x50 -or $head[$peOffset + 1] -ne 0x45) { continue }
              $peCount++
              $machine = [BitConverter]::ToUInt16($head, $peOffset + 4)
              if ($machine -ne 0x014c) {
                $foreign.Add(('0x{0:x4} {1}' -f $machine, $entry.FullName))
              }
            }
            if ($foreign.Count -gt 0) {
              throw "supplement has $($foreign.Count) non-i386 PE file(s): $($foreign -join '; '); rebuild the Desktop Supplements release"
            }
            foreach ($retired in @('opt/node/', 'opt/remotion/')) {
              $stale = $zip.Entries | Where-Object { $_.FullName.StartsWith($retired) } | Select-Object -First 1
              if ($stale) { throw "supplement still contains retired component $retired ($($stale.FullName))" }
            }
          } finally {
            $zip.Dispose()
          }
          Write-Host "supplement Playwright $pin with i386 driver and ripgrep $rgPin verified; $peCount PE files all i386, no retired node/remotion tree"
      - name: Build Windows installer
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $desktop = Get-ChildItem -LiteralPath $out -Filter 'wunder-frontend-slint-*-win7-x86.exe' | Select-Object -First 1
          $cli = Get-ChildItem -LiteralPath $out -Filter 'wunder-cli-*-win7-x86.exe' | Select-Object -First 1
          $supplement = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'supplement') -Filter 'wunder-supplement-win7-ia32-common.zip' | Select-Object -First 1
          if (-not $desktop -or -not $cli -or -not $supplement) {
            throw 'desktop, CLI, or supplement input is missing'
          }
          & .\builders\pack.ps1 `
            -Arch win7-x86 `
            -Desktop $desktop.FullName `
            -Cli $cli.FullName `
            -Supplement $supplement.FullName `
            -OutputDir $out `
            -Compression lzma2/fast
          if ($LASTEXITCODE -ne 0) { throw "Windows installer pack failed: $LASTEXITCODE" }
          $installer = Get-ChildItem -LiteralPath $out -Filter 'wunder-*-win7-x86-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          Write-Host "installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win7-x86
          path: release-assets/wunder-frontend-slint-*-win7-x86.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: installer-win7-x86
          path: release-assets/wunder-*-win7-x86-setup.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch uses the release naming (amd64/arm64) shared with the offline
          # builders, matching the AppImage file names the packager emits.
          - arch: amd64
            platform: linux/amd64
            image: wunder-desktop-ubuntu1804-x86_64
            appimage_runtime: x86_64
          - arch: arm64
            platform: linux/arm64
            image: wunder-desktop-ubuntu1804-arm64
            appimage_runtime: aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Ubuntu 18.04 desktop AppImage
        shell: bash
        run: |
          set -euo pipefail
          # ARM64 is cross-compiled and packaged on amd64; QEMU is not used
          # for the expensive Rust or SquashFS phases.
          build_platform=linux/amd64
          if [ "${{ matrix.arch }}" = arm64 ]; then
            build_script=builders/build-linux-arm64-cross-appimage.sh
          else
            build_script=builders/build-linux-appimage-native.sh
          fi
          docker build --platform "$build_platform" \
            --build-arg RUST_TOOLCHAIN="${RUST_TOOLCHAIN}" \
            --build-arg APPIMAGE_RUNTIME_URL="https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-${{ matrix.appimage_runtime }}" \
            -f packaging/docker/Dockerfile.ubuntu18-desktop \
            -t "${{ matrix.image }}" .
          mkdir -p release-assets
          docker run --rm --platform "$build_platform" \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e ARCH="${{ matrix.arch }}" \
            -e WUNDER_OUTPUT_DIR=/app/release-assets \
            -e WUNDER_APPIMAGE_RUNTIME=/usr/local/lib/wunder/appimage-runtime \
            "${{ matrix.image }}" \
            bash "$build_script"
          test -n "$(find release-assets -maxdepth 1 -name "wunder-slint-*-linux-${{ matrix.arch }}.AppImage" -print -quit)"
      - name: Verify AppImage payload
        shell: bash
        run: |
          set -euo pipefail
          asset_name="$(find release-assets -maxdepth 1 -name "wunder-slint-*-linux-${{ matrix.arch }}.AppImage" -printf '%f' -quit)"
          test -n "$asset_name"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            "${{ matrix.image }}" \
            bash frontend-slint/scripts/check-linux-arm64-appimage.sh "/app/release-assets/$asset_name"
      - name: Build Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e ARCH="${{ matrix.arch }}" \
            -e WUNDER_CLI_OUTPUT_DIR=/app/release-assets \
            "${{ matrix.image }}" \
            bash builders/build-linux-cli-native.sh
          test -n "$(find release-assets -maxdepth 1 -name "wunder-cli-*-linux-${{ matrix.arch }}" -print -quit)"
      - name: Free Linux build caches
        shell: bash
        run: |
          set -euo pipefail
          # Cargo target directories and the build image are large; the release
          # artifacts are already in release-assets.
          sudo rm -rf target
          docker image rm "${{ matrix.image }}" || true
      - name: Wait for the matching supplement rebuild
        if: needs.prepare.outputs.packaging_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A packaging push starts Desktop Supplements concurrently. Waiting
          # here prevents an installer from bundling the previous asset.
          missing=0
          for attempt in $(seq 1 420); do
            state="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow desktop-supplements.yml --commit "${GITHUB_SHA}" --limit 1 \
              --json status,conclusion \
              --jq '.[0] // {} | "\(.status // "") \(.conclusion // "")"' 2>/dev/null || true)"
            status="${state%% *}"
            conclusion="${state#* }"
            if [ -z "$status" ]; then
              missing=$((missing + 1))
              if [ "$missing" -ge 40 ]; then
                echo "no supplement workflow run appears for this commit; using the current supplement release" >&2
                exit 0
              fi
              sleep 15
              continue
            fi
            missing=0
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                # 只在失败分支多查一次链接，正常路径保持单次 API 调用。
                run_url="$(gh run list --repo "${GITHUB_REPOSITORY}" \
                  --workflow desktop-supplements.yml --commit "${GITHUB_SHA}" --limit 1 \
                  --json url --jq '.[0].url // ""' 2>/dev/null || true)"
                echo "supplement workflow concluded ${conclusion:-unknown}; refusing to package a stale supplement${run_url:+ (see $run_url)}" >&2
                exit 1
              fi
              echo "supplement workflow completed successfully"
              exit 0
            fi
            sleep 30
          done
          echo "timed out waiting for the supplement workflow" >&2
          exit 1
      - name: Download Linux supplement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p supplement
          gh release download supplement --repo "${GITHUB_REPOSITORY}" \
            --pattern "wunder-supplement-linux-${{ matrix.arch }}.tar.gz" \
            --dir supplement --clobber
          ls -la supplement
      - name: Assemble Linux installer
        shell: bash
        run: |
          set -euo pipefail
          desktop="$(find release-assets -maxdepth 1 -name "wunder-slint-*-linux-${{ matrix.arch }}.AppImage" -print -quit)"
          cli="$(find release-assets -maxdepth 1 -name "wunder-cli-*-linux-${{ matrix.arch }}" -print -quit)"
          supplement="$(find supplement -maxdepth 1 -name "wunder-supplement-linux-${{ matrix.arch }}.tar.gz" -print -quit)"
          test -n "$desktop"
          test -n "$cli"
          test -n "$supplement"
          bash builders/pack.sh -a "linux-${{ matrix.arch }}" \
            --desktop "$desktop" \
            --cli "$cli" \
            --supplement "$supplement" \
            --output-dir release-assets
          test -n "$(find release-assets -maxdepth 1 -name "wunder-*-linux-${{ matrix.arch }}.run" -print -quit)"
          ls -lh release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: release-assets/wunder-slint-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.arch }}
          path: release-assets/wunder-*-linux-${{ matrix.arch }}.run
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - prepare
      - build-windows-win7-x86
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-assets
          merge-multiple: true
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installer-assets
          merge-multiple: true
      - name: Verify three desktop programs and three installers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t desktops < <(find desktop-assets -type f -maxdepth 2 | sort)
          mapfile -t installers < <(find installer-assets -type f -maxdepth 2 | sort)
          test "${#desktops[@]}" -eq 3
          test "${#installers[@]}" -eq 3
          printf 'desktop programs:\n'
          printf '%s\n' "${desktops[@]}"
          printf 'installers:\n'
          printf '%s\n' "${installers[@]}"
      - name: Reset nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view nightly --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete nightly --repo "${GITHUB_REPOSITORY}" -y
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly -m "Desktop build ${GITHUB_SHA}" "${GITHUB_SHA}"
          git push origin refs/tags/nightly --force
      - name: Publish three desktop programs and three installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create nightly \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Wunder Desktop & Installers（Win7 x86 / Ubuntu 18.04 x86_64 / Ubuntu 18.04 ARM64）" \
            --notes "发布三个桌面程序与三个安装包：Windows 7 32 位、Ubuntu 18.04 x86_64、Ubuntu 18.04 ARM64。安装包默认安装蛹和舵机到用户目录的 .wunder，补充组件可选。" \
            --prerelease --latest=false --target "${GITHUB_SHA}"
          find desktop-assets installer-assets -type f -maxdepth 2 -print0 | while IFS= read -r -d '' asset; do
            gh release upload nightly "$asset" --repo "${GITHUB_REPOSITORY}" --clobber
          done
