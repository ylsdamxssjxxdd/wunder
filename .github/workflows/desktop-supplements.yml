name: Desktop Supplements

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '忽略缓存，强制重建三种补充包'
        type: boolean
        default: false
  push:
    paths:
      - 'packaging/**'
      - '.github/workflows/desktop-supplements.yml'

# 补充包基本不变：构建输入（打包脚本/清单/requirements/Dockerfile）决定缓存键，
# 输入未变时三个包直接命中缓存，仅把缓存产物重新上传到固定 release。
permissions:
  contents: write

concurrency:
  group: wunder-desktop-supplements
  cancel-in-progress: true

env:
  RELEASE_TAG: supplement

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      win7_key: ${{ steps.keys.outputs.win7_key }}
      linux_amd64_key: ${{ steps.keys.outputs.linux_amd64_key }}
      linux_arm64_key: ${{ steps.keys.outputs.linux_arm64_key }}
    steps:
      - uses: actions/checkout@v4
      - id: keys
        shell: bash
        run: |
          win7_hash="${{ hashFiles('packaging/windows/scripts/build_win7_desktop_supplement.ps1', 'packaging/windows/scripts/win7-supplement-manifest.json', 'packaging/python/requirements-win7-common.txt', 'config/matplotlibrc', 'fonts/*') }}"
          linux_hash="${{ hashFiles('packaging/linux/scripts/build_linux_supplement.sh', 'packaging/linux/scripts/linux-supplement-manifest.json', 'packaging/linux/scripts/r2-static-archives.json', 'packaging/python/requirements-linux-common.txt', 'packaging/docker/Dockerfile.ubuntu18-supplement', 'packaging/docker/Dockerfile.rust-builder-kylin-x86', 'config/matplotlibrc', 'fonts/*') }}"
          # 浏览器 pin（版本+SHA256 字面量）参与 win7 缓存键：来源变更即触发重建
          browser_pin='chromium-109.0.5414.120-r1070088-hibbiki-mini_installer.sync.exe-sha256-C1AABD6EEF38D759BBD92CA9516353D88C463A1E8389A875B4D12D53DB467F98'
          echo "win7_key=wunder-supplement-win7-ia32-v4-${win7_hash}-${browser_pin}" >> "$GITHUB_OUTPUT"
          echo "linux_amd64_key=wunder-supplement-linux-amd64-v3-${linux_hash}" >> "$GITHUB_OUTPUT"
          echo "linux_arm64_key=wunder-supplement-linux-arm64-v3-${linux_hash}" >> "$GITHUB_OUTPUT"

  build-win7-ia32:
    needs: [prepare]
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached supplement
        id: cache
        uses: actions/cache@v4
        with:
          path: supplement-dist
          key: ${{ needs.prepare.outputs.win7_key }}
      - name: Check cached pack
        id: pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path supplement-dist | Out-Null
          $zip = Get-ChildItem -Path supplement-dist -Filter 'wunder-supplement-win7-*.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          $cached = ($null -ne $zip) -and ('true' -eq '${{ steps.cache.outputs.cache-hit }}')
          if ($zip) { Write-Host "cached pack: $($zip.Name)" } else { Write-Host 'no cached pack' }
          "cached=$cached" >> $env:GITHUB_OUTPUT
      - name: Fetch Chromium 109 win32
        if: steps.pack.outputs.cached != 'true' || github.event.inputs.force_rebuild == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hibbiki/chromium-win32 v109.0.5414.120-r1070088（Chromium 5414 分支最后快照，末代支持 Win7 的 32 位构建）
          $url = 'https://github.com/Hibbiki/chromium-win32/releases/download/v109.0.5414.120-r1070088/mini_installer.sync.exe'
          $expectedHash = 'C1AABD6EEF38D759BBD92CA9516353D88C463A1E8389A875B4D12D53DB467F98'
          New-Item -ItemType Directory -Force -Path browser-src | Out-Null
          $installer = Join-Path (Get-Location) 'browser-src\mini_installer.sync.exe'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
              $downloaded = $true
              break
            } catch {
              Write-Warning "browser download attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $downloaded) { throw "failed to download $url" }
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "browser SHA256 mismatch: got $actualHash, expected $expectedHash" }
          # mini_installer 内嵌两层 7z（外层需 -t7z 强制按 7z 解析，内层为 BCJ2 压缩，7-Zip 原生支持）
          $7z = 'C:\Program Files\7-Zip\7z.exe'
          & $7z x -t7z $installer '-obrowser-src\installer' -y
          if ($LASTEXITCODE -ne 0) { throw "7z outer extract failed ($LASTEXITCODE)" }
          & $7z x (Join-Path (Get-Location) 'browser-src\installer\chrome.7z') '-obrowser-src\unpacked' -y
          if ($LASTEXITCODE -ne 0) { throw "7z inner extract failed ($LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath 'browser-src\unpacked\Chrome-bin\chrome.exe')) { throw 'chrome.exe missing after extraction' }
      - name: Build Win7 ia32 supplement
        if: steps.pack.outputs.cached != 'true' || github.event.inputs.force_rebuild == 'true'
        shell: pwsh
        run: |
          Remove-Item -Path supplement-dist\* -Force -ErrorAction SilentlyContinue
          & .\packaging\windows\scripts\build_win7_desktop_supplement.ps1 `
            -Arch ia32 `
            -PythonProfile common `
            -BuildRoot (Join-Path (Get-Location) 'supplement-build') `
            -BrowserArchivePath (Join-Path (Get-Location) 'browser-src\unpacked\Chrome-bin') `
            -PythonPackageIndexUrl https://pypi.org/simple
          # The build script reports failure by throwing, and the next step
          # asserts the pack exists; $LASTEXITCODE is never populated here
          # because the script runs python through Start-Process.
          Copy-Item -Path (Join-Path (Get-Location) 'supplement-build\dist\*.zip') -Destination supplement-dist -Force
      - name: Verify pack exists
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path supplement-dist -Filter 'wunder-supplement-win7-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no supplement zip produced or restored' }
          Write-Host "pack: $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"
      - name: Verify 32-bit Node payload
        shell: pwsh
        run: |
          # The ia32 pack must be 32-bit end to end: a 32-bit Windows host cannot
          # start x64 node.exe, so node has to be i386.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Get-ChildItem -Path supplement-dist -Filter 'wunder-supplement-win7-*.zip' | Select-Object -First 1).FullName
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            foreach ($entryName in @('opt/node/node.exe', 'opt/node/npm.cmd', 'opt/node/npx.cmd')) {
              if (-not $zip.GetEntry($entryName)) { throw "supplement entry missing: $entryName" }
            }
            $metaEntry = $zip.GetEntry('wunder-win7-supplement.json')
            if (-not $metaEntry) { throw 'supplement metadata is missing' }
            $reader = New-Object IO.StreamReader($metaEntry.Open(), [Text.Encoding]::UTF8)
            try { $meta = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($meta.node.architecture -ne 'ia32') { throw "Node architecture is not ia32: $($meta.node.architecture)" }
          } finally { $zip.Dispose() }
          Write-Host 'Windows supplement 32-bit Node payload verified'
      - uses: actions/upload-artifact@v4
        with:
          name: supplement-win7-ia32
          path: supplement-dist/wunder-supplement-win7-*.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            key_field: linux_amd64_key
          - arch: arm64
            platform: linux/arm64
            key_field: linux_arm64_key
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (arm64 builds run emulated inside the arm64 image)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Restore cached supplement
        id: cache
        uses: actions/cache@v4
        with:
          path: supplement-dist
          key: ${{ needs.prepare.outputs[matrix.key_field] }}
      - name: Check cached pack
        id: pack
        shell: bash
        run: |
          mkdir -p supplement-dist
          if compgen -G 'supplement-dist/wunder-supplement-linux-*.tar.gz' >/dev/null; then
            ls -la supplement-dist
          fi
          cached=false
          if [ '${{ steps.cache.outputs.cache-hit }}' = 'true' ] && compgen -G 'supplement-dist/wunder-supplement-linux-*.tar.gz' >/dev/null; then
            cached=true
          fi
          echo "cached=$cached" >> "$GITHUB_OUTPUT"
      - name: Download r2 static binary (amd64 only)
        if: matrix.arch == 'amd64' && (steps.pack.outputs.cached != 'true' || github.event.inputs.force_rebuild == 'true')
        shell: bash
        run: |
          set -euo pipefail
          pin=packaging/linux/scripts/r2-static-archives.json
          file="$(jq -r '.amd64.fileName' "$pin")"
          sha="$(jq -r '.amd64.sha256' "$pin")"
          mkdir -p r2-static
          curl -fsSL --retry 3 -o "r2-static/$file" \
            "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/$file"
          echo "$sha  r2-static/$file" | sha256sum -c -
          echo "WUNDER_R2_ARCHIVE=/app/r2-static/$file" >> "$GITHUB_ENV"
      - name: Build Ubuntu 18.04 supplement
        if: steps.pack.outputs.cached != 'true' || github.event.inputs.force_rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform "${{ matrix.platform }}" \
            -f packaging/docker/Dockerfile.ubuntu18-supplement \
            -t "wunder-supplement-ubuntu1804-${{ matrix.arch }}" .
          rm -rf supplement-dist supplement-build
          mkdir -p supplement-dist supplement-build
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e ARCH="${{ matrix.arch }}" \
            -e WUNDER_OUTPUT_DIR=/app/supplement-dist \
            -e WUNDER_SUPPLEMENT_BUILD_ROOT=/app/supplement-build \
            -e WUNDER_SUPPLEMENT_PYPI_INDEX=https://pypi.org/simple \
            -e WUNDER_SUPPLEMENT_R2_ARCHIVE="${WUNDER_R2_ARCHIVE:-}" \
            "wunder-supplement-ubuntu1804-${{ matrix.arch }}" \
            bash packaging/linux/scripts/build_linux_supplement.sh
      - name: Verify pack exists
        shell: bash
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          # 打包机是 x86_64，arm64 包里的二进制不能在本机执行，架构只能按 ELF 头校验。
          case "$arch" in
            amd64) elf_expect='x86-64';  host_expect='x86_64';  browser_rel='chrome-linux64/chrome' ;;
            arm64) elf_expect='aarch64'; host_expect='aarch64'; browser_rel='chrome-linux/chrome' ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          check_elf() {
            test -f "$1" || { echo "supplement entry missing: $1" >&2; exit 1; }
            desc="$(file -bL "$1")"
            echo "$desc" | grep -qi "$elf_expect" || {
              echo "wrong ELF architecture for $1 (expected $elf_expect): $desc" >&2
              exit 1
            }
          }
          pack="$(find supplement-dist -maxdepth 1 -name "wunder-supplement-linux-$arch.tar.gz" -print -quit)"
          test -n "$pack" || { echo "expected wunder-supplement-linux-$arch.tar.gz" >&2; exit 1; }
          work="verify-$arch"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xzf "$pack" -C "$work"
          test -x "$work/opt/node/bin/node"
          test -x "$work/opt/browser/$browser_rel"
          check_elf "$work/opt/node/bin/node"
          check_elf "$work/opt/git/bin/git"
          check_elf "$work/opt/rg/bin/rg"
          check_elf "$work/opt/ffmpeg/bin/ffmpeg"
          check_elf "$work/opt/browser/$browser_rel"
          python3 - "$work/wunder-linux-supplement.json" "$arch" <<'PY'
          import json, sys
          meta = json.load(open(sys.argv[1], encoding='utf-8'))
          arch = sys.argv[2]
          assert meta['arch'] == arch, meta['arch']
          assert meta['node']['version'] == '16.20.2', meta['node']['version']
          assert meta['node']['architecture'] == arch, meta['node']['architecture']
          assert meta['browser']['bundled'] is True
          print('Linux supplement metadata verified:', arch, 'browser', meta['browser']['version'])
          PY
          # 只有宿主架构与补充包一致时才做真实执行冒烟；x64 打包机只跑 amd64 包。
          if [ "$(uname -m)" = "$host_expect" ]; then
            node_version="$("$work/opt/node/bin/node" --version)"
            test "$node_version" = 'v16.20.2' || { echo "node smoke failed: $node_version" >&2; exit 1; }
            "$work/opt/rg/bin/rg" --version | head -n 1
            "$work/opt/ffmpeg/bin/ffmpeg" -version | head -n 1
            # Chrome 的 libc 依赖面来自目标机（Ubuntu 18.04），在打包机上跑通与否
            # 不能代表目标机，因此版本只做比对、不作为失败条件。
            browser_pin="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["browser"]["version"])' "$work/wunder-linux-supplement.json")"
            browser_version="$("$work/opt/browser/$browser_rel" --version 2>/dev/null || true)"
            echo "browser: ${browser_version:-<not runnable on this host>} (pin $browser_pin)"
            if [ -n "$browser_version" ]; then
              echo "$browser_version" | grep -qF "$browser_pin" || {
                echo "browser version $browser_version does not match pin $browser_pin" >&2
                exit 1
              }
            fi
          fi
          ls -la "$pack"
      - uses: actions/upload-artifact@v4
        with:
          name: supplement-linux-${{ matrix.arch }}
          path: supplement-dist/wunder-supplement-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-supplements:
    needs:
      - prepare
      - build-win7-ia32
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download supplement artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supplement-*
          path: release-assets
          merge-multiple: true
      - name: Verify exactly three supplement packs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -type f -maxdepth 2 | sort)
          test "${#files[@]}" -eq 3 || { printf 'unexpected asset set:\n'; printf '%s\n' "${files[@]}"; exit 1; }
          for expected in \
            'wunder-supplement-win7-ia32-common.zip' \
            'wunder-supplement-linux-amd64.tar.gz' \
            'wunder-supplement-linux-arm64.tar.gz'; do
            test -f "release-assets/$expected" || { echo "missing $expected"; exit 1; }
          done
          printf '%s\n' "${files[@]}"
      - name: Publish supplement release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Wunder 补充包（Win7 32 位 / Linux x86_64 / Linux ARM64）" \
              --notes "本地补充包。在蛹设置中导入，或手动解压到 WUNDER_HOME（默认用户主目录 .wunder），蛹与舵机共用 Python、Git、rg、ffmpeg、Node 运行环境。" \
            --latest=false --target "${GITHUB_SHA}"
          fi
          find release-assets -type f -maxdepth 2 -print0 | while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --repo "${GITHUB_REPOSITORY}" --clobber
          done
          gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'
